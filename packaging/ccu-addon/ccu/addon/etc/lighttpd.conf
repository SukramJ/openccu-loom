# openccu-lite web-server drop-in (ignored on CCU3/OpenCCU: occulited
# reads this file from the add-on's directory, validates it against its
# allowlist and installs a root-owned copy — see occulited's
# documentation on addon frontends).
#
# Serves the Config UI through the box's own web server: /addons/loom/*
# is proxied to the daemon on the loopback with the prefix stripped, so
# TLS and the operator's certificate terminate at the box and the add-on
# port 8119 can stay closed in the firewall. The SPA derives its base
# path from the URL, and the upgrade header keeps the WebSocket event
# stream working through the proxy.
$HTTP["url"] =~ "^/addons/loom/?$" {
  url.redirect = ( "^/addons/loom/?$" => "/addons/loom/app/" )
}
$HTTP["url"] =~ "^/addons/loom/" {
  proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8119 ) ) )
  proxy.header = ( "upgrade" => "enable", "map-urlpath" => ( "/addons/loom/" => "/" ) )
  proxy.forwarded = ( "for" => 1, "proto" => 1, "host" => 1 )
}
