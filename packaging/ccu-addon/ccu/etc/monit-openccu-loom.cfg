# OpenCCU-Loom daemon monitoring for the CCU / RaspberryMatic add-on.
#
# Active mode (the monit default) so monit actually restarts the daemon
# when it exits — required for the SPA "Restart" action, which works by
# SIGTERM-ing the process and relying on the supervisor to bring it back
# (see rc.d/openccu-loom: OPENCCU_LOOM_SUPERVISOR=1). With passive mode
# the daemon would stay offline after a restart.
check process openccu-loom with pidfile /var/run/openccu-loom.pid
    group addon
    start program = "/etc/config/rc.d/openccu-loom start"
    stop program  = "/etc/config/rc.d/openccu-loom stop"
    restart program = "/etc/config/rc.d/openccu-loom restart"
    if does not exist then restart
    if failed port 8119 for 5 cycles then restart
    if 3 restarts within 5 cycles then
        exec "/bin/triggerAlarm.tcl 'OpenCCU-Loom startet wiederholt neu' 'WatchDog: OpenCCU-Loom' true"
