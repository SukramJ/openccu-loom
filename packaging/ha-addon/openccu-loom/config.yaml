# version MUST equal the release tag and is bumped in the release commit.
name: OpenCCU-Loom
version: "0.53.0"
slug: openccu-loom
description: >-
  Standalone bridge that connects Homematic CCUs to MQTT, a REST + WebSocket
  API, and a built-in Config UI — with optional Matter support.
url: https://github.com/SukramJ/openccu-loom
# Restricted to amd64 for dev to save resources. Re-add aarch64 + armv7
# (build.yaml already lists their base images) to restore the multi-arch add-on.
arch:
  - amd64

# The add-on image follows the HA convention of one tag per arch.
# The base image is pulled from the pre-built multi-arch release image.
image: "ghcr.io/sukramj/openccu-loom-ha-{arch}"

host_network: true

# The HA base image ships its own s6-overlay init as the entrypoint; tell the
# Supervisor not to inject its own init on top (required for s6-overlay images).
init: false

ingress: true
# Static: the Ingress panel proxies to this port, so it must equal the daemon's
# REST port (options.rest_port). Keep both at 8119 to keep the panel working.
ingress_port: 8119
# Ingress is restricted to Home Assistant administrators. The HA Ingress
# auth-passthrough (north.rest.auth.ha_ingress, ADR 0044) trusts that, so
# panel_admin MUST stay true — the add-on cannot verify it at runtime.
panel_admin: true
panel_icon: mdi:home-assistant
panel_title: "OpenCCU-Loom"

# No `ports:` block: with host_network: true the daemon binds directly on the
# host, so a port mapping does nothing. The ports are instead operator-selectable
# via the options below (passed to the daemon as env overrides in run.sh).

map:
  - addon_config:rw

options:
  log_level: info
  # Ports the daemon binds on the host (host_network: true). All configurable.
  # rest_port MUST equal ingress_port (8119) for the Ingress panel; change it
  # only for direct-access setups. The callback ports are where the CCU / CUxD
  # push events to the daemon — change them to avoid host port collisions.
  rest_port: 8119
  xmlrpc_callback_port: 8120
  binrpc_callback_port: 8129

schema:
  log_level: "list(debug|info|warn|error)?"
  rest_port: int(1,65535)
  xmlrpc_callback_port: int(1,65535)
  binrpc_callback_port: int(1,65535)
