# Only the mkdocs machinery itself is excluded. Everything else under
# docs/ is a published page — if a document should not be published,
# it belongs under `notes/`, not in an exclude list here.
exclude_docs: |
  hooks/

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: SukramJ
      repo: openccu-loom
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Hides the language switcher on pages that have no real .de.md
# translation yet, so the site reads as English-only until German
# pages are added. See docs/hooks/i18n_alternate_filter.py.
hooks:
  - docs/hooks/i18n_alternate_filter.py

plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  # Multilingual scaffolding: English is the only built content for now.
  # German pages are added later as `<name>.de.md` siblings; until then
  # fallback_to_default serves the English source under /de/ and the hook
  # above keeps the switcher hidden on untranslated pages.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: de
          name: Deutsch
          build: true
  - minify:
      minify_html: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SukramJ/openccu-loom
  generator: false

extra_css:
