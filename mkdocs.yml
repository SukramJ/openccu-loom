site_name: OpenCCU-Loom
site_description: Standalone Go daemon bridging Homematic CCUs to MQTT, REST/WebSocket, a Config UI, and Matter
site_url: https://sukramj.github.io/openccu-loom/
repo_url: https://github.com/SukramJ/openccu-loom
repo_name: SukramJ/openccu-loom
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 SukramJ

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# Published surface, organised by audience: End-user (User Guide),
# Administrator (Administration), Integrator (Integrations), and
# Developer.
#
# Everything under docs/ is published. Engineering working documents —
# audits, concepts, parity fixtures, plans, contributor procedures —
# live outside this tree under `notes/` and never reach the site; see
# `notes/README.md` for which tree a new document belongs in. Keeping
# the split at the directory level rather than in an exclude list is
# deliberate: an exclude list silently rots as files are added.
nav:
  - Home: index.md
  - User Guide:
      - Getting Started: getting-started.md
      - Concepts: user/concepts.md
      - Using the Web UI: user/web-ui.md
      - Matter in Apple, Google & Alexa Home: user/matter.md
      - Alarm and Security & Safety: alarm-user-guide.md
  - Administration:
      - Installation & First Steps: user-guide.md
      - Configuration Reference: admin/configuration.md
      - Authentication & Users: admin/auth.md
      - Keycloak (OIDC): admin/keycloak-oidc.md
      - Multi-CCU Operations: user/multi-ccu.md
      - Security: SECURITY.md
      - Backup & Restore: admin/backup.md
