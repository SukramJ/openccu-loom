name: integration

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.26.4"

jobs:
  integration:
    name: godevccu integration
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'needs-integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # `make coverage` runs the full suite with -tags=integration and
      # writes coverage.out. This both exercises the godevccu integration
      # tests (functional failures fail the step) and produces the
      # integration-inclusive profile the per-package tier gate is
      # calibrated against.
      - name: integration tests + coverage profile
        run: make coverage

      - name: coverage threshold (per package)
        run: make coverage-check-per-package

      - name: datasource diff (pydevccu vs godevccu wire data)
        run: make datasource-diff

      - name: openccu-loom model snapshot (against godevccu)
        run: make snapshot-go

      # The aiohomematic snapshot is intentionally NOT run in CI:
      # it requires the aiohomematic + pydevccu + openccu_data
      # Python stack which is not provisioned on the runner. The
      # datasource diff above already proves the wire-data layer
      # matches; the aiohomematic snapshot is for local
      # cross-stack regression checks (see
      # docs/parity/model_snapshot_schema.md + CLAUDE.md
      # "Cross-stack model-snapshot verification").
