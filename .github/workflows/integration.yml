name: integration

on:
  push:
    branches: [main]
  # Every pull request, not only labelled ones. Running post-merge only is
  # how this suite came to hold an assertion that had been wrong for six
  # weeks: it was red on main for 27 consecutive pushes and blocked nothing,
  # because by the time it ran the change was already in.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.27.1"

jobs:
  integration:
    name: godevccu integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # `make coverage` runs the full suite with -tags=integration and
      # writes coverage.out. This both exercises the godevccu integration
      # tests (functional failures fail the step) and produces the
      # integration-inclusive profile the per-package tier gate is
      # calibrated against.
      - name: integration tests + coverage profile
        run: make coverage

      - name: coverage threshold (per package)
        run: make coverage-check-per-package

      - name: openccu-loom model snapshot (against godevccu)
        run: make snapshot-go

      # The aiohomematic snapshot is intentionally NOT run in this job: it
      # requires the full aiohomematic + openccu_data Python stack. Both stacks
      # run against the same godevccu module, so there is no second wire-data
      # source to compare; the cross-stack MODEL parity (openccu-loom vs aiohomematic) runs in two
      # dedicated workflows — a SCOPED subset on every PR (model-parity.yml)
      # and the FULL fleet nightly (cross-stack-parity.yml). See
      # notes/parity/model_snapshot_schema.md + CLAUDE.md
      # "Cross-stack model-snapshot verification".
