name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.26.5"
  NODE_VERSION: "24"

jobs:
  e2e:
    name: black-box e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup Node (for Vite SPA build)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/ui/package-lock.json

      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: install SPA dependencies
        working-directory: assets/ui
        run: npm ci

      - name: build SPA bundle (embedded into the daemon binary)
        working-directory: assets/ui
        run: npm run build

      - name: build daemon + hmcli binaries
        run: make build-all

      - name: e2e test suite
        # `make e2e` would re-trigger build-all; we already built
        # both binaries above, so call go test directly to avoid
        # the redundant compile.
        #
        # 300 s, not 180 s: the suite measured 163 s on a developer
        # machine, which left 9 % headroom — enough for a slower runner to
        # turn an ordinary run into a timeout that reads like a hang. The
        # budget exists to catch a genuinely stuck daemon, not to cap
        # legitimate growth; each test carries its own deadline.
        run: go test -tags=e2e -timeout=300s ./tests/e2e/...

      - name: dump daemon stdout on failure
        if: failure()
        run: |
          echo "::group::E2E binary versions"
          ./bin/openccu-loom version || true
          ./bin/hmcli version || true
          echo "::endgroup::"
