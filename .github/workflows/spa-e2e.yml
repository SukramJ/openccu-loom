name: SPA E2E (Playwright)
# The workflow-level path filter moved onto the jobs.
#
# A filter on the trigger means the whole workflow never starts for a pull
# request that leaves the SPA alone, so its check never appears — and a
# required status check that never appears blocks the pull request forever,
# because branch protection cannot tell "not applicable" from "not yet".
# Running the workflow always and deciding per job keeps the `e2e` check
# present on every pull request, which is what makes it requirable.
on:
  # Push only on main. Without the branch restriction every push to a pull
  # request's branch ran this workflow a second time alongside the
  # pull_request run — same jobs, same result, twice the runner minutes.
  push:
    branches: [main]
    paths:
      - 'assets/ui/**'
      - '.github/workflows/spa-e2e.yml'
  pull_request:

jobs:
  # Whether this pull request touches anything the Playwright suite covers.
  # Uses the merge-base diff rather than a marketplace action so the rule is
  # readable here and needs no third-party trust for a decision that gates a
  # required check.
  changes:
    name: spa changes
    runs-on: ubuntu-latest
    outputs:
      spa: ${{ steps.detect.outputs.spa }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            # Not a pull request (push to a branch): the trigger's own path
            # filter already decided, so there is something to run.
            echo "spa=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base"...HEAD \
              | grep -qE '^(assets/ui/|\.github/workflows/spa-e2e\.yml$)'; then
            echo "spa=true" >> "$GITHUB_OUTPUT"
          else
            echo "spa=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    name: spa e2e run
    needs: changes
    if: needs.changes.outputs.spa == 'true'
    runs-on: ubuntu-latest
    container:
      # Pin to the installed @playwright/test version so the browser build and
      # the committed Linux screenshot baselines render identically in CI.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        working-directory: assets/ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: assets/ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: assets/ui/playwright-report/

  # The requirable check. It reports success when the suite passed and when
  # the pull request had no reason to run it, and fails when the suite
  # failed — the same shape as ci.yml's aggregate gate, and for the same
  # reason: a skipped required check counts as satisfied under branch
  # protection, so the gate has to state the verdict itself rather than
  # letting a skip speak for it.
  e2e:
    name: e2e
    needs: [changes, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verdict
        shell: bash
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::could not determine whether the SPA changed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.spa }}" != "true" ]; then
            echo "SPA untouched — Playwright suite not applicable to this pull request"
            exit 0
          fi
          if [ "${{ needs.run.result }}" != "success" ]; then
            echo "::error::SPA e2e suite failed (result=${{ needs.run.result }})"
            exit 1
          fi
          echo "SPA e2e suite passed"
