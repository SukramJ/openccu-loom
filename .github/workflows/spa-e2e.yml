name: SPA E2E (Playwright)
on:
  push:
    paths:
      - 'assets/ui/**'
      - '.github/workflows/spa-e2e.yml'
  pull_request:
    paths:
      - 'assets/ui/**'
      - '.github/workflows/spa-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    container:
      # Pin to the installed @playwright/test version so the browser build and
      # the committed Linux screenshot baselines render identically in CI.
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    defaults:
      run:
        working-directory: assets/ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: assets/ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: assets/ui/playwright-report/
