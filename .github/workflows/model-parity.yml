# Scoped cross-stack model-parity gate for pull requests.
#
# The full cross-stack pipeline (cross-stack-parity.yml) dumps ~80k DPs and
# runs nightly — too slow to block a PR. This workflow runs the SAME three
# steps (both model snapshots + drift gate) but scopes the
# two model snapshots to a small representative device subset via
# OPENCCU_LOOM_SNAPSHOT_DEVICES, so a model regression in those devices fails
# the PR in minutes instead of surfacing hours later in the nightly run.
#
# The reference stack is pinned to the same versions as the nightly gate so
# the two agree; bump both together on an embedded-data refresh. See
# docs/adr/0038-cross-stack-ci-gate.md and CLAUDE.md
# "Cross-stack model-snapshot verification".
name: model-parity

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.27.2"
  PYTHON_VERSION: "3.14"
  # Representative smoke subset. Spans climate / switch+meter / cover / sensor
  # across the HmIP-RF, BidCos-RF and HmIP-Wired transports, and deliberately
  # includes the product-group interface_id edge case (HmIPW-DRBL4) plus the
  # by-design visibility variants (HmIP-SWSD smoke-detector, HM-LC-Bl1-FM
  # local-button events) so those model paths are actually exercised. Both
  # snapshot sides honour this env var, so the Go and Python snapshots load
  # the identical fleet and the diff stays an apples-to-apples intersection.
  OPENCCU_LOOM_SNAPSHOT_DEVICES: "HmIP-BWTH,HM-CC-RT-DN,HmIP-BSM,HmIP-BROLL,HM-LC-Bl1-FM,HmIP-SWSD,HmIPW-DRBL4,HmIP-SWDO"

jobs:
  model-parity:
    name: scoped cross-stack model parity (openccu-loom vs aiohomematic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: provision Python reference stack (aiohomematic + openccu-data)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/refstack"
          "$RUNNER_TEMP/refstack/bin/python" -m pip install --upgrade pip wheel
          # Both reference packages are pinned to the versions the
          # embedded Go extracts were generated from. Mirrors the pins in
          # cross-stack-parity.yml; keep the two workflows in lockstep so a
          # PR and the nightly run compare against the same reference.
          "$RUNNER_TEMP/refstack/bin/python" -m pip install -r script/requirements/reference-stack.txt
          # Make the venv python the `python3` the Makefile targets invoke,
          # and expose it for aiohomematic_snapshot.py's venv re-exec guard.
          echo "$RUNNER_TEMP/refstack/bin" >> "$GITHUB_PATH"

      - name: "step 1/3 — openccu-loom model snapshot (scoped subset)"
        run: make snapshot-go

      # The Python side builds the godevccu binary from the module pinned in
      # go.mod (script/godevccu_server.py), so both snapshots run against the
      # same simulator release.
      - name: "step 2/3 — aiohomematic model snapshot (scoped subset)"
        env:
          AIOHOMEMATIC_VENV_PYTHON: ${{ runner.temp }}/refstack/bin/python
        run: make snapshot-py

      - name: "step 3/3 — scoped cross-stack drift gate (exit 0 = intersection parity within baseline)"
        run: make snapshot-diff
