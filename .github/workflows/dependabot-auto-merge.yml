name: Dependabot auto-merge

# yamllint disable-line rule:truthy
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
      - name: Enable auto-merge for non-major updates
        # go-ha-catalog is excluded deliberately. It is generated from Home
        # Assistant and released unattended, and it stays in v0.x because Go
        # cannot express a SemVer major without a /vN import-path change. A
        # release that drops a vocabulary constant therefore still arrives as a
        # *minor* bump — semver-major would never catch it, and the compile
        # error would land on main unreviewed. See openccu-loom ADR 0070.
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          !contains(steps.meta.outputs.dependency-names, 'go-ha-catalog')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
