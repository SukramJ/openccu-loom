name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.26.6"
  NODE_VERSION: "24"
  # The lint tools are pinned, unlike govulncheck and go-licenses further
  # down. A new vulnerability database SHOULD turn the build red without a
  # commit — that is what the security job is for. A new lint release should
  # not: its added checks are style decisions, and floating on @latest made
  # this gate report on the calendar rather than on the diff. main went from
  # green to red overnight on an unchanged tree when golangci-lint 2.13.0
  # landed with staticcheck's Go 1.26 deprecation checks.
  #
  # Bump deliberately: raise the version here, run `make lint`, and fix or
  # justify whatever the new release finds in the same change. Note that
  # `make lint` alone is not this job: the gofumpt step below runs the
  # standalone formatter, which is stricter than the one golangci-lint
  # bundles, so check `gofumpt -l .` against GOFUMPT_VERSION too.
  GOFUMPT_VERSION: "v0.10.0"
  GOLANGCI_LINT_VERSION: "v2.13.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
          diff=$(gofumpt -l .)
          if [ -n "$diff" ]; then
            echo "::error::gofumpt found unformatted files:"
            echo "$diff"
            exit 1
          fi
      # Install golangci-lint v2 from source with the Go toolchain set up
      # above (1.26), same pattern as the gofumpt step. The prebuilt
      # binary ships built with an older Go and refuses to run against a
      # module targeting a newer Go; and golangci-lint-action@v6 installs
      # a v1 binary that rejects this repo's v2 config (version/formatters/
      # linters.default keys). A direct `go install` of the /v2/ module
      # avoids both problems.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          golangci-lint config verify
          golangci-lint run --timeout=5m ./...
      # Fail if go.mod/go.sum drift from `go mod tidy` or checksums mismatch.
      - name: go mod tidy + verify
        run: make tidy-check

  # Contract-version guard (ADR 0028): changing a contract asset
  # (openapi.yaml, wsapi.json, schemas/*.json) without bumping
  # APIVersion fails the PR; oasdiff-classified breaking changes
  # require a major bump. PR-only — pushes to main already passed it.
  api-contract-guard:
    name: api contract guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: check APIVersion bump
        run: script/check_api_version_bump.sh "origin/${{ github.base_ref }}"
      # assets/schemas/*.json are what the Python types package is generated
      # from, and nothing forced them to stay in step with pkg/hmenum. Only
      # two of the 73 exported enums are covered by a parity test; for the
      # other 71 a new wire value reached neither the JSON nor any generated
      # client until somebody happened to run `make export-schemas`, and
      # nothing failed in the meantime. The SPA's own generated types carry
      # the same gate for the same reason — they had drifted a whole feature
      # behind before it existed.
      - name: exported schemas are fresh
        run: |
          make export-schemas
          if ! git diff --quiet -- assets/schemas internal/north/rest/handlers/schema_digest_gen.go; then
            echo "::error::assets/schemas is stale — run 'make export-schemas' and commit the result."
            git --no-pager diff --stat -- assets/schemas internal/north/rest/handlers/schema_digest_gen.go
            exit 1
          fi

  security:
    name: security (vuln + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the gitleaks git-mode scan is complete
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # govulncheck does reachability analysis: it fails only when a known
      # vulnerability is on a code path this module actually calls.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make vuln
      # go-licenses fails on copyleft dependency licenses
      # (GPL/AGPL/LGPL = restricted, MPL = reciprocal). The source is MIT;
      # see CLAUDE.md "Dependency licensing".
      - name: go-licenses
        run: |
          go install github.com/google/go-licenses@latest
          make licenses
      # gitleaks scans the tracked history for committed secrets; the
      # allowlist for test fixtures / docs lives in .gitleaks.toml.
      - name: gitleaks
        run: make secrets

  # Linux is the shipped target (.goreleaser.yaml builds linux only), so it
  # is the leg that carries the race detector. -race costs a factor of ~5.5
  # in wall time, which made this the longest job in the pipeline by a wide
  # margin; splitting the module across shards puts each runner on roughly a
  # quarter of the packages. script/test_shard.sh owns the split and
  # tests/contract pins that the shards together cover every package exactly
  # once — a dropped package would otherwise show up as a green run for code
  # nothing executed.
  test-shard:
    name: test shard ${{ matrix.shard }} (linux, race)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test (race)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          mapfile -t pkgs < <(script/test_shard.sh "${{ matrix.shard }}" 4)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::shard ${{ matrix.shard }} resolved to no packages"
            exit 1
          fi
          go test -race -count=1 -covermode=atomic \
            -coverprofile="coverage-shard-${{ matrix.shard }}.out" "${pkgs[@]}"
      - name: upload shard coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}.out
          if-no-files-found: error

  # The packages the race detector has nothing to find in — see RACE_EXEMPT in
  # script/test_shard.sh. tests/contract is static analysis over the module and
  # spawns no goroutine, yet instrumenting it cost ~105 s and set the floor of
  # the whole Linux leg, because a single package cannot be split across
  # shards. It still runs, still reports coverage, just without the tax.
  # A contract test re-checks the "no goroutines" premise on every run, so the
  # exemption cannot quietly start covering concurrent code.
  test-static:
    name: test static (linux, no race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test (no race)
        shell: bash
        run: |
          mapfile -t pkgs < <(script/test_shard.sh --exempt)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::no race-exempt packages resolved"
            exit 1
          fi
          go test -count=1 -covermode=atomic \
            -coverprofile=coverage-shard-static.out "${pkgs[@]}"
      - name: upload static coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-static
          path: coverage-shard-static.out
          if-no-files-found: error

  # Keeps the name `test (ubuntu-latest)` because that is a required status
  # check on main; it is now the aggregate gate over the shards rather than a
  # test run of its own. `if: always()` plus the explicit result check is
  # load-bearing: a job skipped because a dependency failed reports as
  # "skipped", and branch protection counts a skipped required check as
  # satisfied — so without this the whole Linux leg could go red while the
  # PR reported mergeable.
  test:
    name: test (ubuntu-latest)
    needs: [test-shard, test-static]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: shards must all be green
        if: needs.test-shard.result != 'success' || needs.test-static.result != 'success'
        run: |
          echo "::error::linux tests did not pass (shards=${{ needs.test-shard.result }} static=${{ needs.test-static.result }})"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: download shard coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      # The shards test disjoint package sets, so their profiles concatenate
      # into the same profile a single `go test ./... -coverprofile` would
      # have produced — minus the extra `mode:` headers, which `go tool
      # cover` refuses to read.
      - name: merge shard coverage
        run: ./script/merge_coverprofiles.sh coverage.out coverage-shard-*.out
      - name: coverage threshold (total)
        run: ./script/coverage_threshold.sh 65 coverage.out
      # The per-package tier gate runs in the integration workflow, not
      # here: its thresholds are calibrated against the integration-
      # inclusive coverage profile (make coverage). This unit job runs
      # without -tags=integration, so packages exercised mainly by the
      # godevccu integration suite would fall short of their tiers.
      - name: upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # macOS is the development platform, not a shipped target, so this leg
  # exists to catch what only a second OS can catch: path separators, file
  # permissions, timezone and os.Rename semantics. It runs without -race —
  # a data race is a property of the code, not of the operating system, so
  # detecting it once on the shipped platform is enough, and paying the 5.5x
  # race tax twice bought nothing. Same reasoning as the Windows leg below,
  # one step further: Windows is not a shipped target *and* its runner is the
  # slowest, flakiest leg, so its test run lives in nightly.yml as a
  # non-gating canary instead of here.
  #
  # This job also owns the three whole-module compile checks. Each one builds
  # the entire package graph, so running them on every shard would multiply
  # the most expensive part of the job by four; hanging them on the leg that
  # no longer pays the race tax keeps them free. `go vet ./...` in particular
  # overlaps with the govet linter the `lint` job already runs on Linux —
  # here it additionally covers the darwin build constraints, which a
  # Linux-only vet never compiles.
  test-macos:
    name: test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      # Build-tag-gated test packages are invisible to a tag-less
      # `go vet ./...`, and the integration workflow is skipped on
      # unlabeled PRs — without these explicit compile checks a PR
      # can merge an integration-tag build break that only surfaces
      # as a post-merge failure on main. The integration_live suite
      # is never executed in CI at all (it needs a real CCU), so a
      # compile-only `go test -run '^$'` is its sole standing guard.
      - name: go vet (integration tag)
        run: go vet -tags=integration ./tests/integration/
      - name: compile check (integration_live tag)
        shell: bash
        run: go test -tags=integration_live -run '^$' -count=1 ./tests/integration/
      - name: go test
        shell: bash
        run: go test -count=1 ./...

  bench:
    name: bench (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: bench
        run: make bench

  fuzz:
    name: fuzz (smoke 5s/target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: fuzz
        run: make fuzz

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build
        run: make build
      - name: smoke
        run: ./bin/openccu-loom version

  # .goreleaser.yaml ships linux/arm GOARM=7, and the CCU/OpenCCU add-on
  # bundle (script/build_ccu_addon.sh) carries that binary — but every other
  # leg in this pipeline runs on a 64-bit runner, so the shipped 32-bit
  # artefact had no compile guard of any kind. 32-bit is where int-width
  # assumptions, unaligned access and time arithmetic overflow surface, and
  # none of that was exercised anywhere.
  #
  # Compile-only, and blocking on every pull request. Three decisions, each
  # with its reason:
  #
  # 1. Compile, not test. Not primarily a cost argument: the test tree does
  #    not cross-compile for GOARCH=arm at all today. `go vet` with the arm
  #    target reports exactly one error across the module —
  #    internal/payload/params_wrapper_test.go: "constant 4294967296
  #    overflows int" — because that test writes int(1 << 32) to feed
  #    ParamInt32 an out-of-range value, and on a 32-bit target that constant
  #    does not fit in an int in the first place. It is a test about integer
  #    width that is itself width-unsafe. Nothing under cmd/, internal/ or
  #    pkg/ is affected, so the shipped binary was never broken by it. Once
  #    that one constant is written width-safely, extend this job with
  #    `go vet ./...` under the same environment: vet type-checks test files,
  #    so it guards test code too, at roughly build cost. Running the suite
  #    under qemu-user is the step after that, and needs its own timeout —
  #    the emulation multiplier has not been measured here, and the Linux
  #    race leg already had to be split across four shards to stay tolerable,
  #    so assume it is a nightly job rather than a PR gate.
  #
  # 2. Every package, not a width-sensitive subset. A hand-kept list of
  #    "packages where width matters" is a list that drifts, and an int
  #    overflow can appear in any package that does byte-length maths or
  #    packs an ID. `./...` needs no maintenance and costs little: a cold
  #    cross-compile of the whole module measured ~21 s on a developer
  #    machine, and this job pays no test, race or coverage tax.
  #
  # 3. Blocking, not nightly. This is the exact artefact that ships, unlike
  #    the Windows leg in nightly.yml, which guards a target that is not
  #    released. A break here reaches users; catching it a day later on main
  #    is strictly worse than catching it on the pull request that caused it.
  #
  # CGO_ENABLED=0 comes from the workflow env above and is what makes the
  # cross-compile work without a toolchain.
  build-armv7:
    name: build (linux/armv7 cross-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The target lives on the JOB, not on each step. With a copy per step, the
    # negative control below carries its own GOARCH and stays green when the
    # gate step loses one — it would validate itself rather than the step it
    # exists to guard. One definition means a dropped or misspelled variable
    # breaks both, which is what makes the control a control.
    env:
      GOOS: linux
      GOARCH: arm
      GOARM: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: cross-compile every package for linux/armv7
        run: go build ./...
      # go vet type-checks the _test.go files too, which `go build` does not,
      # and that is where the only width defect in this module actually was:
      # a test asserting an oversized int is rejected, written as a constant
      # that cannot be compiled where int is 32 bits. It cost roughly a build
      # to add and covers the half of the tree the step above cannot see.
      - name: vet every package for linux/armv7
        run: go vet ./...
      # Negative control for the job itself. A misspelled or dropped GOARCH
      # would leave `go build` compiling happily for amd64 and this job would
      # report green while guarding nothing, which is the failure mode a
      # cross-compile gate is most prone to. Linking the two shipped binaries
      # and asserting the ELF header says 32-bit ARM makes the check produce a
      # different result when the cause is absent.
      - name: shipped binaries are 32-bit ARM
        run: |
          set -euo pipefail
          go build -o /tmp/armv7/ ./cmd/openccu-loom ./cmd/hmcli
          rc=0
          for bin in /tmp/armv7/openccu-loom /tmp/armv7/hmcli; do
            desc=$(file -b "$bin")
            echo "$bin: $desc"
            case "$desc" in
              *"ELF 32-bit"*ARM*) ;;
              *) echo "::error::$bin is not a 32-bit ARM binary: $desc"; rc=1 ;;
            esac
          done
          exit "$rc"

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The consumed-operations guards compare a removal against the operations
      # openccu-loom-client actually calls, which only this repository's own
      # contract job can do — and only if that manifest is on disk. Pinned to
      # the client's latest RELEASE rather than its main: the question worth
      # failing a build over is "would this removal break a client somebody is
      # running", not one that is not published yet. The client's CI checks this
      # repository out the same way round, at our latest release.
      #
      # CONTRACT_REQUIRE_CLIENT_MANIFEST turns the guards' local skip into a
      # failure here. Without it these two guards were dead: they skipped in
      # every run for want of the checkout below, and a green suite said nothing.
      - name: Resolve the client's latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(gh release view --repo SukramJ/openccu-loom-client --json tagName --jq .tagName)"
          echo "Pinning the consumed-operations manifest to openccu-loom-client ${TAG}"
          echo "CLIENT_TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Check out the client for its consumed-operations manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SukramJ/openccu-loom-client
          ref: ${{ env.CLIENT_TAG }}
          path: openccu-loom-client
          persist-credentials: false
      - name: contract tests
        env:
          OPENCCU_LOOM_CLIENT_REPO: ${{ github.workspace }}/openccu-loom-client
          CONTRACT_REQUIRE_CLIENT_MANIFEST: "1"
        run: make contract
      - name: wire-compare (reference snapshots are committed; no Python venv needed)
        run: make wire-compare
      - name: reachability
        run: make reachability
      # Advisory OpenAPI lint (vacuum). Report-only: surfaces missing
      # operationIds / types / unused components without failing the build.
      - name: openapi-lint (advisory)
        continue-on-error: true
        run: make openapi-lint

  spa:
    name: spa (typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/ui/package-lock.json
      - name: install dependencies
        run: npm ci
      # JS supply-chain gate, mirroring govulncheck on the Go side.
      - name: npm audit
        run: npm audit --audit-level=high
      # The generated API types are derived from assets/openapi.yaml, and
      # nothing forced them to stay in step: they had silently drifted a
      # whole feature behind, so the SPA compiled against types that no
      # longer described the API it called.
      - name: generated API types are fresh
        run: |
          npm run gen:types
          if ! git diff --quiet -- src/lib/api/types.generated.ts; then
            echo "::error::src/lib/api/types.generated.ts is stale — run 'make ui-types' and commit the result."
            git --no-pager diff --stat -- src/lib/api/types.generated.ts
            exit 1
          fi
      - name: typecheck
        run: npm run typecheck
      # svelte-check compiles every component against the workspace
      # TypeScript — tsc alone misses Svelte-template breakage and
      # toolchain incompatibilities (the TypeScript-7 bump crashed
      # svelte-check while tsc kept passing).
      - name: svelte-check
        run: npm run check
      - name: vitest
        run: npm run test
