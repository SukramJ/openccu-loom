name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.26.4"
  NODE_VERSION: "24"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@latest
          diff=$(gofumpt -l .)
          if [ -n "$diff" ]; then
            echo "::error::gofumpt found unformatted files:"
            echo "$diff"
            exit 1
          fi
      # Install golangci-lint v2 from source with the Go toolchain set up
      # above (1.26), same pattern as the gofumpt step. The prebuilt
      # binary ships built with an older Go and refuses to run against a
      # module targeting a newer Go; and golangci-lint-action@v6 installs
      # a v1 binary that rejects this repo's v2 config (version/formatters/
      # linters.default keys). A direct `go install` of the /v2/ module
      # avoids both problems.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint config verify
          golangci-lint run --timeout=5m ./...
      # Fail if go.mod/go.sum drift from `go mod tidy` or checksums mismatch.
      - name: go mod tidy + verify
        run: make tidy-check

  # Contract-version guard (ADR 0028): changing a contract asset
  # (openapi.yaml, wsapi.json, schemas/*.json) without bumping
  # APIVersion fails the PR; oasdiff-classified breaking changes
  # require a major bump. PR-only — pushes to main already passed it.
  api-contract-guard:
    name: api contract guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: check APIVersion bump
        run: script/check_api_version_bump.sh "origin/${{ github.base_ref }}"

  security:
    name: security (vuln + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history so the gitleaks git-mode scan is complete
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # govulncheck does reachability analysis: it fails only when a known
      # vulnerability is on a code path this module actually calls.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make vuln
      # go-licenses fails on copyleft dependency licenses
      # (GPL/AGPL/LGPL = restricted, MPL = reciprocal). The source is MIT;
      # see CLAUDE.md "Dependency licensing".
      - name: go-licenses
        run: |
          go install github.com/google/go-licenses@latest
          make licenses
      # gitleaks scans the tracked history for committed secrets; the
      # allowlist for test fixtures / docs lives in .gitleaks.toml.
      - name: gitleaks
        run: make secrets

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      # Build-tag-gated test packages are invisible to a tag-less
      # `go vet ./...`, and the integration workflow is skipped on
      # unlabeled PRs — without these explicit compile checks a PR
      # can merge an integration-tag build break that only surfaces
      # as a post-merge failure on main. The integration_live suite
      # is never executed in CI at all (it needs a real CCU), so a
      # compile-only `go test -run '^$'` is its sole standing guard.
      - name: go vet (integration tag)
        run: go vet -tags=integration ./tests/integration/
      - name: compile check (integration_live tag)
        shell: bash
        run: go test -tags=integration_live -run '^$' -count=1 ./tests/integration/
      - name: go test
        # Force bash on all OSes (Windows runners default to PowerShell,
        # which mis-parses `-coverprofile=coverage.out ./...` and feeds go
        # a spurious `.out` package → "FAIL .out [setup failed]"). bash
        # parses the command identically to Linux/macOS.
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage threshold (total)
        if: matrix.os == 'ubuntu-latest'
        run: ./script/coverage_threshold.sh 65 coverage.out
      # The per-package tier gate runs in the integration workflow, not
      # here: its thresholds are calibrated against the integration-
      # inclusive coverage profile (make coverage). This unit job runs
      # without -tags=integration, so packages exercised mainly by the
      # godevccu integration suite would fall short of their tiers.
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  bench:
    name: bench (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: bench
        run: make bench

  fuzz:
    name: fuzz (smoke 5s/target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: fuzz
        run: make fuzz

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build
        run: make build
      - name: smoke
        run: ./bin/openccu-loom version

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: contract tests
        run: make contract
      - name: wire-compare (reference snapshots are committed; no Python venv needed)
        run: make wire-compare
      - name: reachability
        run: make reachability
      # Advisory OpenAPI lint (vacuum). Report-only: surfaces missing
      # operationIds / types / unused components without failing the build.
      - name: openapi-lint (advisory)
        continue-on-error: true
        run: make openapi-lint

  spa:
    name: spa (typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/ui
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/ui/package-lock.json
      - name: install dependencies
        run: npm ci
      # JS supply-chain gate, mirroring govulncheck on the Go side.
      - name: npm audit
        run: npm audit --audit-level=high
      - name: typecheck
        run: npm run typecheck
      - name: vitest
        run: npm run test
