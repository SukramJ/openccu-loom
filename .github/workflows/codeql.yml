name: codeql

# CodeQL static analysis (SAST). Complements gosec/govulncheck with
# data-flow and taint analysis (injection, crypto misuse, …). Findings
# surface in the repository's Security → Code scanning tab; the job does
# not fail the build on alerts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1" # weekly Monday 03:23 UTC

permissions:
  contents: read
  security-events: write # required to upload CodeQL results

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"

jobs:
  analyze:
    name: codeql (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: go
          # Go's CodeQL extractor requires a real compile (build-mode: none
          # is rejected for Go). autobuild runs the module's `go build`; the
          # committed spa_dist/.gitkeep satisfies the `go:embed all:spa_dist`
          # directive, so a fresh checkout builds without first building the
          # SPA — the same assumption the `build` CI job already relies on.
          build-mode: autobuild
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:go"
