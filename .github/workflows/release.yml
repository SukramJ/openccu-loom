name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.26.4"
  NODE_VERSION: "24"
  # Toggle the CCU/RaspberryMatic add-on packaging + upload. Set to
  # "false" to skip it for a release (or override per repo via the
  # BUILD_CCU_ADDON repository variable — see the step conditions).
  BUILD_CCU_ADDON: "true"
  # Toggle the Home Assistant add-on image build + push (one tag per arch:
  # ghcr.io/sukramj/openccu-loom-ha-<arch>). Same flag pattern as the CCU
  # add-on — flip here or override via the BUILD_HA_ADDON repository variable.
  # Default off until validated on real Home Assistant hardware.
  BUILD_HA_ADDON: "true"

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Build the Svelte SPA BEFORE goreleaser so the daemon binary it
      # compiles has the Config UI embedded (spa_dist is gitignored, so a
      # fresh checkout would otherwise embed an empty SPA → "SPA not built").
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/ui/package-lock.json
      - name: build SPA bundle (embedded into the daemon binary)
        working-directory: assets/ui
        run: |
          npm ci
          npm run build
      # vite's emptyOutDir wipes spa_dist (including the tracked .gitkeep
      # placeholder) before writing the bundle. Restore .gitkeep so the
      # tree is clean for goreleaser's dirty-state check; the built assets
      # themselves are gitignored.
      - name: restore spa_dist placeholder
        run: git checkout -- internal/north/ui/spa_dist/.gitkeep
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: log in to ghcr
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Use the curated CHANGELOG.md section for this version as the release
      # body instead of goreleaser's commit-derived changelog. The tag is
      # vX.Y.Z; CHANGELOG headers are Keep-a-Changelog "## [X.Y.Z] …", so we
      # strip the leading "v" and slice from that header to the next "## [".
      - name: extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (insec) exit
              if (index($0, "## [" ver "]") == 1) { insec=1; next }
            }
            insec { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No '## [${VERSION}]' section found in CHANGELOG.md" >&2
            exit 1
          fi
          echo "Release notes for ${VERSION}:" >&2
          cat RELEASE_NOTES.md >&2
      - name: run goreleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --release-notes=RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Package the CCU / RaspberryMatic add-on from goreleaser's
      # cross-compiled binaries (the SPA is already embedded in them, since
      # the bundle was built before goreleaser ran) and attach the tarball
      # to the just-published release. goreleaser keeps each build output at
      # dist/openccu-loom_linux_<arch>/openccu-loom.
      - name: build CCU/RaspberryMatic add-on
        if: ${{ vars.BUILD_CCU_ADDON != 'false' && env.BUILD_CCU_ADDON == 'true' }}
        run: |
          set -euo pipefail
          export BIN_AMD64="$(ls dist/openccu-loom_linux_amd64*/openccu-loom | head -1)"
          export BIN_ARM64="$(ls dist/openccu-loom_linux_arm64*/openccu-loom | head -1)"
          export BIN_ARMV7="$(ls dist/openccu-loom_linux_arm_7*/openccu-loom | head -1)"
          script/build_ccu_addon.sh "${GITHUB_REF_NAME#v}"
      - name: attach CCU add-on to the release
        if: ${{ vars.BUILD_CCU_ADDON != 'false' && env.BUILD_CCU_ADDON == 'true' }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/openccu-loom-ccu-*.tar.gz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Home Assistant add-on: build one image per arch from the HA base image,
      # COPYing the daemon binary out of the release image goreleaser just
      # published. The add-on's config.yaml version IS the image tag and must
      # equal the release tag, so guard it before building (a stale version
      # would publish an image that no installed add-on can pull).
      - name: verify HA add-on version matches the tag
        if: ${{ vars.BUILD_HA_ADDON != 'false' && env.BUILD_HA_ADDON == 'true' }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CFG="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/p' \
            packaging/ha-addon/openccu-loom/config.yaml | head -1)"
          if [ "$TAG" != "$CFG" ]; then
            echo "HA add-on config.yaml version ($CFG) != release tag ($TAG)" >&2
            echo "Bump packaging/ha-addon/openccu-loom/config.yaml in the release commit." >&2
            exit 1
          fi
      # The official builder reads config.yaml/build.yaml, builds each arch from
      # the matching HA base image, and pushes ghcr.io/sukramj/openccu-loom-ha-<arch>:<version>.
      # ghcr login above is shared via the docker config the builder mounts.
      - name: build & publish Home Assistant add-on
        if: ${{ vars.BUILD_HA_ADDON != 'false' && env.BUILD_HA_ADDON == 'true' }}
        # NB: must be a version TAG, not a commit SHA — the builder action
        # derives its builder-image tag from the action ref, so a SHA pin makes
        # it pull a non-existent amd64-builder:<sha> ("manifest unknown").
        uses: home-assistant/builder@2026.06.0
        with:
          args: |
            --all
            --target /data/packaging/ha-addon/openccu-loom
            --docker-hub ghcr.io/sukramj
      # CycloneDX SBOM for the daemon module graph, attached to the run.
      - name: generate SBOM
        run: make sbom
      - name: upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn
      # Scan the published image for OS/dependency CVEs that a Go-only
      # govulncheck cannot see. The runtime base is distroless/static, so a
      # fixable-CRITICAL gate stays quiet in practice. goreleaser strips the
      # leading "v", so the image tag is the bare version.
      - name: compute image ref
        run: echo "IMAGE_REF=ghcr.io/sukramj/openccu-loom:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Notify the types repo so it regenerates openccu-loom-types from
  # this release's contract assets (ADR 0028). The receiving workflow
  # checks out this repo at the released tag, regenerates the Pydantic
  # models, and opens a PR there. Requires the TYPES_REPO_DISPATCH_TOKEN
  # secret (fine-grained PAT with contents:write on the types repo);
  # without it the step warns and the release proceeds — the types repo
  # can always regenerate manually from the tag.
  notify-types-repo:
    name: trigger types regeneration
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # Breaking classification rides on the APIVersion major: the
      # api-contract-guard CI job already forces a major bump for
      # oasdiff-classified breaking diffs, so comparing the major
      # against the previous release tag is authoritative — no
      # re-classification needed at release time. The types repo uses
      # the flag to bump its minor (instead of patch) version.
      - name: classify contract change vs previous release
        run: |
          set -euo pipefail
          api_version_at() {
            git show "$1:internal/north/rest/handlers/info.go" \
              | sed -nE 's/^const APIVersion = "([^"]+)"$/\1/p'
          }
          HEAD_VER="$(api_version_at "${GITHUB_REF_NAME}")"
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          BREAKING=false
          if [ -n "$PREV_TAG" ]; then
            PREV_VER="$(api_version_at "$PREV_TAG" || true)"
            if [ -n "$PREV_VER" ] && \
               [ "${HEAD_VER%%.*}" -gt "${PREV_VER%%.*}" ]; then
              BREAKING=true
            fi
          fi
          echo "API_VERSION=${HEAD_VER}" >> "$GITHUB_ENV"
          echo "BREAKING=${BREAKING}" >> "$GITHUB_ENV"
          echo "api_version=${HEAD_VER} prev_tag=${PREV_TAG:-none} breaking=${BREAKING}"
      - name: dispatch daemon-release event
        env:
          GH_TOKEN: ${{ secrets.TYPES_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::TYPES_REPO_DISPATCH_TOKEN not configured — skipping types-repo dispatch"
            exit 0
          fi
          gh api repos/SukramJ/openccu-loom-types/dispatches \
            -f event_type=daemon-release \
            -f "client_payload[tag]=${GITHUB_REF_NAME}" \
            -f "client_payload[api_version]=${API_VERSION}" \
            -f "client_payload[breaking]=${BREAKING}"
