# Cross-stack model-snapshot parity gate.
#
# Runs the four-step cross-stack snapshot pipeline that CLAUDE.md
# documents as the release gate but that `integration.yml` skips (the
# aiohomematic + openccu_data Python stack is not provisioned there). This
# workflow provisions that stack from the public sibling packages and runs
# all three steps.
#
# Scheduled nightly + manual dispatch only — NOT on pull requests — so a
# provisioning hiccup or a reference-version bump never blocks a PR
# merge; a regression surfaces as a failing nightly run instead.
#
# See docs/adr/0038-cross-stack-ci-gate.md.
name: cross-stack-parity

on:
  schedule:
    - cron: "37 3 * * *" # nightly, offset from the other nightly jobs
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.27.1"
  PYTHON_VERSION: "3.14"

jobs:
  snapshot-parity:
    name: cross-stack model snapshot (openccu-loom vs aiohomematic)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: provision Python reference stack (aiohomematic + openccu-data)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/refstack"
          "$RUNNER_TEMP/refstack/bin/python" -m pip install --upgrade pip wheel
          # aiohomematic + openccu-data are both published on PyPI.
          # BOTH are pinned for reproducibility: the cross-stack gate
          # compares the reference stack against the metadata the Go binary
          # embeds (internal/ccudata/embedded, snapshot 2026-06-27), so the
          # reference packages must be pinned to the versions those extracts
          # were generated from. openccu-data was previously installed from
          # `main`, whose HEAD moves independently of any PR — when main ran
          # ahead of the embedded extracts the diff reported version-skew
          # drift (channel_fields / generic_data_points) and failed the gate
          # on unrelated commits. Pinning openccu-data to the matching release
          # makes the gate deterministic. ADR 0038 documents this pin as the
          # sanctioned fix for version-skew drift. The versions themselves
          # live in script/requirements/reference-stack.txt — one place for
          # both parity workflows, watched by Dependabot. Bump them there
          # (and the baselines in model_snapshot_drift_check.py) when the
          # embedded extracts are regenerated. See ADR 0038.
          "$RUNNER_TEMP/refstack/bin/python" -m pip install -r script/requirements/reference-stack.txt
          # Make the venv's python the `python3` the Makefile targets invoke,
          # and expose it explicitly for aiohomematic_snapshot.py's re-exec.
          echo "$RUNNER_TEMP/refstack/bin" >> "$GITHUB_PATH"

      - name: "routing-key parity (aiohomematic == Go-pinned golden fixtures)"
        run: make routing-key-parity

      - name: "step 1/3 — openccu-loom model snapshot (against godevccu, ~80k DPs)"
        run: make snapshot-go

      # The Python side builds the godevccu binary from the module pinned in
      # go.mod (script/godevccu_server.py), so both snapshots run against the
      # same simulator release.
      - name: "step 2/3 — aiohomematic model snapshot (against godevccu, ~8k DPs)"
        env:
          AIOHOMEMATIC_VENV_PYTHON: ${{ runner.temp }}/refstack/bin/python
        run: make snapshot-py

      - name: "step 3/3 — cross-stack drift gate (exit 0 = intersection parity within baseline)"
        run: make snapshot-diff
