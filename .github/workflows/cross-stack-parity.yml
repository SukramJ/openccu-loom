# Cross-stack model-snapshot parity gate.
#
# Runs the four-step cross-stack snapshot pipeline that CLAUDE.md
# documents as the release gate but that `integration.yml` currently
# skips ("the aiohomematic + pydevccu + openccu_data Python stack is not
# provisioned on the runner"). This workflow provisions that stack from
# the public sibling packages and runs all four steps.
#
# Scheduled nightly + manual dispatch only — NOT on pull requests — so a
# provisioning hiccup or a reference-version bump never blocks a PR
# merge; a regression surfaces as a failing nightly run instead.
#
# See docs/adr/0038-cross-stack-ci-gate.md.
name: cross-stack-parity

on:
  schedule:
    - cron: "37 3 * * *" # nightly, offset from the other nightly jobs
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.26.5"
  PYTHON_VERSION: "3.14"

jobs:
  snapshot-parity:
    name: cross-stack model snapshot (openccu-loom vs aiohomematic)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: provision Python reference stack (aiohomematic + pydevccu + openccu-data)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/refstack"
          "$RUNNER_TEMP/refstack/bin/python" -m pip install --upgrade pip wheel
          # aiohomematic + pydevccu + openccu-data are all published on PyPI.
          # ALL THREE are pinned for reproducibility: the cross-stack gate
          # compares the reference stack against the metadata the Go binary
          # embeds (internal/ccudata/embedded, snapshot 2026-06-27), so the
          # reference packages must be pinned to the versions those extracts
          # were generated from. openccu-data was previously installed from
          # `main`, whose HEAD moves independently of any PR — when main ran
          # ahead of the embedded extracts the diff reported version-skew
          # drift (channel_fields / generic_data_points) and failed the gate
          # on unrelated commits. Pinning openccu-data to the matching release
          # makes the gate deterministic. ADR 0038 documents this pin as the
          # sanctioned fix for version-skew drift; bump all three here (and
          # the baselines in model_snapshot_drift_check.py) when the embedded
          # extracts are regenerated. See docs/adr/0038-cross-stack-ci-gate.md.
          "$RUNNER_TEMP/refstack/bin/python" -m pip install "aiohomematic==2026.6.2" "pydevccu==0.2.5"
          "$RUNNER_TEMP/refstack/bin/python" -m pip install "openccu-data==2026.6.1"
          # Make the venv's python the `python3` the Makefile targets invoke,
          # and expose it explicitly for aiohomematic_snapshot.py's re-exec.
          echo "$RUNNER_TEMP/refstack/bin" >> "$GITHUB_PATH"

      - name: "routing-key parity (aiohomematic == Go-pinned golden fixtures)"
        run: make routing-key-parity

      # Point datasource_diff.py at the ALREADY-PROVISIONED reference trees:
      # the pip-installed pydevccu package and the godevccu Go module in the
      # build cache. Without these the script's sibling-checkout defaults do
      # not exist on the runner, glob() finds nothing, and the gate passes
      # vacuously. The min-key floor in datasource_diff.py now fails such a
      # run, so these roots are mandatory, not cosmetic.
      - name: resolve provisioned datasource roots
        run: |
          set -euo pipefail
          # Ensure the godevccu module zip is extracted before reading its
          # local .Dir — `go list -m -f {{.Dir}}` reports an empty dir for a
          # module still in go.mod but not yet unpacked into the build cache.
          go mod download github.com/SukramJ/godevccu
          echo "PYDEVCCU_ROOT=$(python3 -c 'import pydevccu, os; print(os.path.dirname(pydevccu.__file__))')" >> "$GITHUB_ENV"
          echo "GODEVCCU_ROOT=$(go list -m -f '{{.Dir}}' github.com/SukramJ/godevccu)/internal/embed/data" >> "$GITHUB_ENV"

      - name: "step 1/4 — datasource diff (pydevccu vs godevccu wire data)"
        run: make datasource-diff

      - name: "step 2/4 — openccu-loom model snapshot (against godevccu, ~80k DPs)"
        run: make snapshot-go

      - name: "step 3/4 — aiohomematic model snapshot (against pydevccu, ~8k DPs)"
        env:
          AIOHOMEMATIC_VENV_PYTHON: ${{ runner.temp }}/refstack/bin/python
        run: make snapshot-py

      - name: "step 4/4 — cross-stack drift gate (exit 0 = intersection parity within baseline)"
        run: make snapshot-diff
