version: 2
updates:
  # Go modules (root)
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Bundle minor/patch bumps into one PR; majors stay individual so
      # they get a focused review (see the SPA TypeScript 6 / bits-ui 2
      # migration as an example of why).
      go-minor-patch:
        update-types: ["minor", "patch"]

  # SPA npm dependencies
  - package-ecosystem: npm
    directory: "/assets/ui"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (the native-port line) changes the JS API surface;
      # svelte-check crashes against it (ts.sys undefined). Re-allow the
      # major once svelte-check ships TypeScript-7 support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # GitHub Actions (pinned by commit SHA; Dependabot bumps the SHA and
  # keeps the `# vX` version comment in sync).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # The Python reference stack the cross-stack parity gates measure against.
  # Pinned on purpose (ADR 0038), which makes a stale pin its own failure
  # mode: openccu-loom follows upstream model fixes, so a frozen reference
  # reports our corrections as drift. Dependabot keeps the bump on the radar
  # instead of leaving it to whoever next debugs a red nightly run.
  - package-ecosystem: pip
    directory: /script/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      python-reference-stack:
        patterns: ["*"]
