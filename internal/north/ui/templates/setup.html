{{define "body"}}
<section class="card">
  <h1>{{t "setup.title"}}</h1>
  <p>{{t "setup.intro"}}</p>
  <form method="post" action="setup">
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
    <label>{{t "setup.username"}}<input type="text" name="username" required autofocus></label>
    <label>{{t "setup.password"}}<input type="password" name="password" required minlength="8"></label>
    <label>{{t "setup.confirm"}}<input type="password" name="confirm" required minlength="8"></label>
    <button type="submit">{{t "setup.submit"}}</button>
  </form>
</section>
{{end}}
