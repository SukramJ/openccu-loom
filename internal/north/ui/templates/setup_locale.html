{{define "body"}}
<section class="card">
  <p class="step-progress">{{t "setup.step.progress" "current" .Data.Step "total" .Data.Total}}</p>
  <h1>{{t "setup.step2.title"}}</h1>
  {{if .Data.Error}}<p class="error">{{t "setup.error"}}</p>{{end}}
  <form method="post" action="setup/locale">
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
    <label>{{t "setup.locale.label"}}
      <select name="locale">
        <option value="en"{{if eq .Data.State.Locale "en"}} selected{{end}}>English</option>
        <option value="de"{{if eq .Data.State.Locale "de"}} selected{{end}}>Deutsch</option>
      </select>
    </label>
    <label>{{t "setup.theme.label"}}
      <select name="theme">
        <option value="system"{{if eq .Data.State.Theme "system"}} selected{{end}}>{{t "setup.theme.system"}}</option>
        <option value="light"{{if eq .Data.State.Theme "light"}} selected{{end}}>{{t "setup.theme.light"}}</option>
        <option value="dark"{{if eq .Data.State.Theme "dark"}} selected{{end}}>{{t "setup.theme.dark"}}</option>
      </select>
    </label>
    <button type="submit">{{t "setup.submit"}}</button>
  </form>
</section>
{{end}}
