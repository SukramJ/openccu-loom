openapi: 3.1.0
info:
  title: openccu-loom REST API
  version: 7.15.0
  description: |
    North-bound REST + WebSocket surface of the openccu-loom daemon.
    Errors follow RFC 9457 problem+json.
  license:
    name: MIT
    url: https://opensource.org/license/mit/
servers:
  - url: /api/v1
security:
  - basicAuth: []
  - bearerAuth: []
  - openIdConnect: [viewer]
tags:
  - name: core
  - name: devices
  - name: paramsets
  - name: config
    description: Channel configuration export / import (portable snapshots)
  - name: hub
  - name: interfaces
  - name: messages
  - name: events
  - name: auth
  - name: schedules
  - name: links
  - name: backup
  - name: sessions
  - name: audit
  - name: diagnostics
  - name: alarm
    description: Alarm system zones, arming, sensors, outputs, journal, walk-test
  - name: matter
  - name: config-admin
    description: Live config section read / write / delete + schema introspection
  - name: user-admin
    description: Local user management (create, update, delete)
  - name: token-admin
    description: API token management v2 (fingerprint-keyed)
  - name: central-admin
    description: Central (CCU) CRUD — DB-backed multi-CCU registry
  - name: system
    description: Daemon-level system operations (add-on self-update)

paths:
  /info:
    get:
      tags: [core]
      summary: Daemon build + runtime info
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }

  /health:
    get:
      tags: [core]
      summary: Aggregated health snapshot
      security: []
      responses:
        "200":
          description: Healthy / degraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Any component unhealthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /config:
    get:
      tags: [core]
      summary: Sanitized effective configuration
      description: |
        Read-only view of the effective daemon configuration. Carries
        feature flags (`features`), per-central wiring (`centrals`),
        callback ports, and static behaviour policies (`policies`).

        Each central's `host` is admin-only and reads as an empty
        string for a viewer or operator — the same narrowing
        `GET /centrals` and `GET /system/ccu` apply.

        The `policies` object documents daemon-side defaults that
        external clients ask about — currently always-on values:

        - `hub.programs.include_all` — daemon surfaces every CCU
          program; HA-side marker filtering
          (`DEFAULT_PROGRAM_MARKERS`) stays a client-side decision.
        - `hub.sysvars.include_all` — daemon surfaces every system
          variable; HA-side marker filtering
          (`DEFAULT_SYSVAR_MARKERS`) is client-side.
        - `hub.devices.include_hidden` — daemon hides devices the
          CCU flags as invisible; flipping this requires a config
          change in a future revision.

        Schema is forward-compatible: future revisions may add new
        policy keys and feature flags without removing existing
        ones.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigSnapshot" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /ui/event:
    post:
      tags: [core]
      summary: SPA telemetry sink (fire-and-forget)
      description: |
        Anonymous endpoint the SPA uses to log UI events
        (view-selector toggle, etc.). The daemon writes a
        structured slog line and returns 204 — no event is
        persisted server-side. Downstream log aggregation
        handles counting and slicing. See ADR 0016.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UIEventRequest" }
      responses:
        "204": { description: Accepted }
        "400": { $ref: "#/components/responses/BadRequest" }

  /devices:
    get:
      tags: [devices]
      summary: Paginated device list
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: central
          in: query
          required: false
          schema: { type: string }
          description: |
            Scope the list to a single CCU by its canonical central name
            (exact match; `central == SystemCCUEntry.name ==
            payload.central`). Omit to list devices across every central
            the daemon manages.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }

  /devices/{addr}:
    get:
      tags: [devices]
      summary: Single device detail
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDetail" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDevice
      summary: Remove a device from the registry (admin)
      description: |
        Unpairs the device via the CCU `deleteDevice` call. Two optional
        query flags map onto the CCU delete bitmask: `reset=true` also
        factory-resets the device during removal, and `force=true` removes
        an unreachable device even when the CCU cannot complete the
        handshake. Both default to false (plain unpair). A backend without a
        pairing concept (CUxD) answers 422.
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - $ref: "#/components/parameters/Address"
        - name: reset
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >-
            Also reset the device to factory defaults during removal
            (CCU DELETE_FLAG_RESET).
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >-
            Force removal even when the device is unreachable
            (CCU DELETE_FLAG_FORCE).
      responses:
        "202":
          description: Unpair dispatched asynchronously
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: patchDevice
      summary: Update mutable device metadata (name, room assignment)
      description: |
        Renames persist to the CCU (JSON-RPC `Device.setName`). Set
        `include_channels: true` to also rename every channel with the
        `"<name>:<channelNo>"` pattern the CCU WebUI applies. Omitted, it
        defaults to false (device name only). Room / function assignment
        is applied via the Rega hub-writer. A backend without JSON-RPC
        (Homegear, CUxD) answers 422.
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - $ref: "#/components/parameters/Address"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchDeviceRequest"
      responses:
        "202":
          description: Update accepted
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /devices/{addr}/icon:
    get:
      operationId: getDeviceIcon
      tags: [devices]
      summary: Device-type icon image (proxied from the CCU)
      description: >
        Returns the device's model-icon PNG, proxied from the owning
        CCU's web server (`/config/img/devices/250/<file>`).
        Authenticated like every other device route: the artwork itself
        is not sensitive, but the route answers differently for a known
        and an unknown address, so serving it openly made it an
        existence oracle for the device inventory. The SPA renders it
        from an <img> tag, which carries the same-origin session cookie;
        a bearer-only client must fetch the image itself rather than
        hand the URL to the browser. Responds 404 when the device, its
        central, or the upstream image is unavailable; the SPA then
        falls back to a generic glyph.
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Icon image
          content:
            image/png:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"

  /devices/{addr}/channels:
    get:
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelSummary" }
        "404":
          $ref: "#/components/responses/NotFound"

  /devices/{addr}/channels/{no}:
    get:
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelSummary" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchChannel
      summary: Update a single channel (rename, rooms, functions)
      description: |
        Applies partial updates to a single channel: rename (JSON-RPC
        `Channel.setName`), room assignment and function (Gewerk)
        assignment — the channel-level twin of `PATCH /devices/{addr}`.
        Omitted fields stay untouched; an explicit empty array clears
        the assignment set. Naming a channel number the device does not
        have answers 404; a backend without JSON-RPC (Homegear, CUxD)
        answers 422.
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchChannelRequest"
      responses:
        "202":
          description: Update accepted
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /devices/{addr}/channels/{no}/event-groups:
    get:
      tags: [devices]
      summary: List per-Kind event groups for a channel
      description: |
        Returns the channel's keypress / impulse / device-error event
        groups — the bootstrap shape an `event` platform builds its
        entities from. Empty array when the channel has no event sources.
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventGroupSummary" }
        "404":
          $ref: "#/components/responses/NotFound"

  /devices/{addr}/channels/{no}/data-points:
    get:
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DataPointSummary" }
        "404":
          $ref: "#/components/responses/NotFound"

  /devices/{addr}/channels/{no}/data-points/{param}:
    get:
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
        - $ref: "#/components/parameters/Parameter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataPointSummary" }
        "404":
          $ref: "#/components/responses/NotFound"

  /devices/{addr}/channels/{no}/data-points/{param}/value:
    put:
      tags: [devices]
      summary: Set a data point value on the CCU
      description: |
        Headers:
          - `Idempotency-Key` (optional): supply a client-side UUID
            to deduplicate retries. The daemon caches the response
            per `(method, path, key)` for 5 minutes and returns the
            cached response with `Idempotent-Replay: true` on
            retry. Recommended for HA-style flows that retry on
            network glitches and must not double-actuate the
            actuator.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
        - $ref: "#/components/parameters/Parameter"
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: Optional UUID for retry deduplication. See description.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetValueRequest" }
      responses:
        "202":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /devices/{addr}/channels/{no}/flags:
    get:
      tags: [devices]
      summary: Get the operator per-channel overrides (G12)
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelFlags" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [devices]
      summary: Set the operator per-channel overrides (G12)
      description: |
        Hide the channel from the operation surfaces (data-point list, MQTT,
        Matter) and/or lock it against control writes. An absent field keeps
        its current value.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelFlagsRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelFlags" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /devices/{addr}/paramsets/{key}:
    parameters:
      - $ref: "#/components/parameters/Address"
      - name: key
        in: path
        required: true
        schema: { type: string, enum: [VALUES, MASTER, LINK] }
    get:
      operationId: getParamset
      tags: [paramsets]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [paramsets]
      summary: Write a paramset atomically (one wire call)
      description: |
        Writes every key in the request body to the CCU as a single
        `setParamsetValues` XML-RPC call. The CCU applies the values
        together or rejects them together — there is no per-parameter
        partial-success semantics on this path. Use a session
        (`config.session.*` WS commands) when you need transactional
        rollback across multiple writes.

        The CCU does not return per-parameter status on success; the
        202 response carries no body. On failure the daemon surfaces
        the upstream error as 502 problem+json with `code: upstream_unavailable`.

        Headers:
          - `Idempotency-Key` (optional): client-supplied UUID. The
            daemon caches the response per `(method, path, key)` for
            5 minutes; a retry with the same key within that window
            returns the cached response and sets the
            `Idempotent-Replay: true` response header so clients
            can distinguish a deduplicated retry from a fresh write.
            Keys older than 5 minutes (or evicted under memory
            pressure) flow through as fresh requests. The cache key
            does NOT include the request body — a retry MUST use
            the same body as the original; the daemon trusts the
            client's key choice.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: Optional UUID for client-side retry de-duplication. See description.
        - name: X-Edit-Token
          in: header
          required: false
          schema: { type: string }
          description: >-
            Edit-lock token for MASTER and LINK writes. These configuration
            paramsets are gated behind the per-resource edit lock: the caller
            must open an edit session (`POST /sessions/edit` with key
            `channel:{addr}:{key}`) and present the returned token here, else
            the write is rejected 423 Locked. VALUES writes are ungated and
            ignore this header.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Accepted (atomic write dispatched to CCU)
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          $ref: "#/components/responses/Locked"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /groups:
    get:
      operationId: listGroups
      summary: Heating-group listing (read-only)
      description: |
        Returns Homematic heating groups (HmIP / BidCos), grouped by
        central. Read from each CCU's groups.gson via the
        `CCU.getHeatingGroupList` JSON-RPC method.

        Without a `central` query the response aggregates over every
        configured central, one `entries` object each; a central whose
        backend cannot read groups (offline, or a non-CCU backend)
        contributes an empty `groups` array rather than failing the
        request. With `central` set, the listing is scoped to that
        central and returns 404 when it is unknown or cannot serve
        groups.

        This is the read surface only. Creating, editing, and deleting
        groups runs through the CCU jpages proxy (ADR 0055) and is
        exposed separately.
      tags: [core]
      parameters:
        - name: central
          in: query
          required: false
          schema: { type: string }
          description: >
            Scope the listing to one central (matches
            `SystemCCUEntry.name`). Omit to aggregate over all centrals.
      responses:
        "200":
          description: Heating groups grouped by central
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGroupsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createGroup
      summary: Create a heating group (admin)
      description: |
        Creates a heating group through the CCU jpages proxy (ADR 0055):
        a two-step `GET group/create` → `POST group/save` flow, then a
        roster poll to confirm the group committed (the save response is
        slow and unreliable). Admin-gated and audited. `?central=` selects
        the target CCU (optional when only one is configured).
      tags: [core]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - name: central
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "201":
          description: The created group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /groups/types:
    get:
      operationId: listGroupTypes
      summary: Assignable group types for the create form
      description: |
        Returns the group types a new group can be created as (parsed from
        the CCU's create page — there is no separate JSON type endpoint on
        the firmware). `?central=` scopes to one CCU.
      tags: [core]
      parameters:
        - name: central
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The assignable group types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGroupTypesResponse"
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /groups/suitable-members:
    get:
      operationId: listSuitableGroupMembers
      summary: Devices assignable to a group of a given type
      description: |
        Returns the devices/channels that can be assigned to a group of
        the given `type_id`, split into assignable and leftover buckets.
        `?central=` scopes to one CCU.
      tags: [core]
      parameters:
        - name: type_id
          in: query
          required: true
          schema: { type: string }
        - name: central
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Candidate members for the type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuitableMembersResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: The numeric CCU group id.
    put:
      operationId: updateGroup
      summary: Edit a heating group (admin)
      description: |
        Edits an existing heating group (name, members, "operate only via
        group" flag) through the jpages save path. Admin-gated and audited.
      tags: [core]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - name: central
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGroupRequest" }
      responses:
        "204": { description: Group updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteGroup
      summary: Delete a heating group (admin)
      description: |
        Deletes a heating group through the jpages delete path. Admin-gated
        and audited.
      tags: [core]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - name: central
          in: query
          required: false
          schema: { type: string }
      responses:
        "204": { description: Group deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /diagrams:
    get:
      operationId: listDiagrams
      summary: List saved diagram definitions (own + shared)
      tags: [core]
      description: |
        Returns the caller's own named multi-series diagram definitions
        plus every diagram shared by other users (SV03). Diagrams are
        Loom-native metadata; each references measurement-history data
        points that the recorder samples.
      responses:
        "200":
          description: The caller's visible diagrams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDiagramsResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createDiagram
      summary: Create a diagram definition
      tags: [core]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiagramWriteRequest" }
            example:
              name: Living-room climate
              visibility: private
              config:
                series:
                  - central: ccu1
                    interface_id: ccu1-HmIP-RF
                    channel_address: "0001ABCD:1"
                    parameter: ACTUAL_TEMPERATURE
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagramConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /diagrams/{id}:
    get:
      operationId: getDiagram
      summary: Read a diagram definition
      tags: [core]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: The diagram.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagramConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: updateDiagram
      summary: Update a diagram definition (owner or admin)
      tags: [core]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiagramWriteRequest" }
            example:
              name: Living-room climate
              visibility: shared
              config: { series: [{ central: ccu1, parameter: ACTUAL_TEMPERATURE }] }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagramConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteDiagram
      summary: Delete a diagram definition (owner or admin)
      tags: [core]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /schedules:
    get:
      operationId: listSchedules
      summary: Fleet-wide overview of devices carrying a week schedule
      description: |
        Returns every device that carries a week schedule, across all
        configured centrals, with the channel expected to hold it. The
        counterpart to `/links`: the one way to answer "which devices
        have a schedule at all" without opening each device in turn.

        The list is derived from channel **types** — a `*_WEEK_PROFILE`
        channel, or one of the climate channel types that carry the
        profile in their MASTER paramset. It deliberately does not read
        MASTER to confirm: confirming costs one CCU round-trip per
        thermostat, so opening the overview on a fleet of forty would
        pay for a question the detail view answers exactly once, on
        click. `kind` says which of the two paths matched.
      tags: [core]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSchedulesResponse"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /links:
    get:
      operationId: listAllLinks
      summary: Global direct-link overview (read-only)
      description: |
        Returns every direct link (channel-to-channel association)
        across all configured centrals as a single flat list. Each link
        carries its owning `central_name` and `interface_id` so a client
        can render one searchable table over multiple CCUs.

        The daemon reads the interface-wide link roster with one
        empty-address `getLinks` per (central, interface) — the same call
        the CCU WebUI uses — rather than a per-channel scan. A central
        whose interface backend is offline, missing, or cannot list
        links (e.g. CUxD) contributes nothing rather than failing the
        request.

        With `central` set the listing is scoped to that central and
        returns 404 when it is unknown. Creating, editing and deleting
        links runs through the per-device `/devices/{addr}/links`
        endpoints.
      tags: [core]
      parameters:
        - name: central
          in: query
          required: false
          schema: { type: string }
          description: >
            Scope the listing to one central (matches
            `SystemCCUEntry.name`). Omit to aggregate over all centrals.
        - name: locale
          in: query
          required: false
          schema: { type: string }
          description: >
            Locale for channel-type labels (default `en`).
      responses:
        "200":
          description: All direct links across the selected centrals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAllLinksResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /programs:
    get:
      tags: [hub]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: include_internal
          in: query
          required: false
          description: |
            Overrides whether internal (Tmp_*, prgEnergyCounter_*) programs
            are listed. When omitted, each central applies its
            `include_internal_programs` config default (hidden by default,
            mirroring the CCU WebUI's "show system programs" toggle). The
            daemon always knows every program; this only steers delivery.
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              schema: { type: integer }
              description: Total number of programs before pagination.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProgramSummary" }

  /programs/{id}/execute:
    post:
      tags: [hub]
      description: |
        Triggers a CCU program. Programs typically drive actuators or
        scenes, so a double-execution under client retry can produce
        observable side effects. Supply the optional `Idempotency-Key`
        header to suppress that risk.

        The optional body carries `check_conditions`: when `true` the CCU
        evaluates the program's "if" condition and runs the program only
        when the condition is currently satisfied. When `false` (the
        default, and when the body is omitted) the program runs
        unconditionally. The response reports `executed` — always `true`
        for an unconditional run, and `false` for a condition-checked run
        whose condition was not met.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramExecuteRequest" }
      responses:
        "202":
          description: Execution result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramExecuteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /webhook/value:
    post:
      tags: [webhook]
      summary: Inbound webhook — set a datapoint value
      description: |
        Set a datapoint value from an external system. Mounted only when
        `north.webhook.inbound.enabled` is set (off by default → 404).
        Authorization: an operator identity via the normal auth chain OR the
        configured inbound bearer token (`north.webhook.inbound.token`). This
        is a real device write — the same authorization weight as
        `PUT /devices/.../value`.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookValueRequest" }
      responses:
        "202": { description: Accepted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: |
            Inbound webhook disabled (`north.webhook.inbound.enabled` is
            false) — the route is not mounted.
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /webhook/program:
    post:
      tags: [webhook]
      summary: Inbound webhook — run a program
      description: |
        Run a CCU program from an external system. Mounted only when
        `north.webhook.inbound.enabled` is set (off by default → 404).
        Authorization: an operator identity OR the configured inbound bearer
        token. `central` is required when more than one CCU is configured.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookProgramRequest" }
      responses:
        "202": { description: Accepted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /sysvars:
    get:
      tags: [hub]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              schema: { type: integer }
              description: Total number of sysvars before pagination.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SysvarSummary" }
    post:
      operationId: createSysvar
      summary: Create sysvar on the CCU (Rega create_system_variable)
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSysvarRequest"
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /sysvars/fetch:
    post:
      operationId: fetchSysvars
      summary: Force re-pull the CCU system-variable catalogue into the hub model
      description: |
        Re-pulls all system variables from the CCU (SysVar.getAll) and
        refreshes the hub model. Use the optional `central` query
        parameter to scope the refresh to one CCU; absent, every
        registered central is refreshed. Mirrors the reference stack's
        fetch_system_variables.
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - in: query
          name: central
          required: false
          schema: { type: string }
      responses:
        "202": { description: Accepted — sysvar re-pull triggered. }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /sysvars/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [hub]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SysvarSummary" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putSysvar
      summary: Set the sysvar runtime value. Idempotent — body carries {value} only.
      description: |
        Sysvars can fire CCU programs and scenes when their value
        changes. A retry without deduplication can re-trigger those
        cascades. Supply the optional `Idempotency-Key` header to make
        the write safe under client-side retry.
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SysvarSetRequest" }
      responses:
        "202":
          description: Accepted — runtime value written to CCU.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Value type not supported for this sysvar.
        "502": { $ref: "#/components/responses/BadGateway" }
    patch:
      operationId: patchSysvar
      summary: >
        Update the sysvar metadata (name, description, unit, value_list, min, max).
        Triggers the Rega update_system_variable script via JSON-RPC.
        All fields are optional — omitted fields leave CCU metadata unchanged.
        A non-empty name renames the variable in place.
        Type changes are not supported; delete and recreate the sysvar instead.
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSysvarRequest"
      responses:
        "202":
          description: Accepted — Rega script dispatched asynchronously.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteSysvar
      summary: Delete sysvar on the CCU (Rega delete_system_variable)
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "202": { description: Scheduled }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /sysvars/{name}/usage:
    get:
      operationId: getSysvarUsage
      summary: Programs referencing a system variable (read-only)
      tags: [hub]
      description: |
        Lists the CCU programs that reference a system variable, resolved
        from the program rules themselves (trigger conditions and
        activities of each program's root rule). References inside
        else-if sub-rules or inside script-type activities are not
        visible this way. Each program is enriched from the hub's
        program registry (localized name, canonical unique id, internal
        flag, observed active state) when known. Consumed as a warning in
        the SPA's delete-confirmation. 503 when no CCU-side reader is
        wired; 400 when the sysvar name is ambiguous across CCUs.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: System-variable name.
        - name: central
          in: query
          required: false
          schema: { type: string }
          description: Scope to one central (required when the name is ambiguous).
      responses:
        "200":
          description: Programs referencing the variable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SysvarUsage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /alarm-messages:
    get:
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              schema: { type: integer }
              description: Total number of alarm messages before pagination.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmMessage" }

  /service-messages:
    get:
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              schema: { type: integer }
              description: Total number of service messages before pagination.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceMessage" }

  /install-mode/interfaces:
    get:
      tags: [hub]
      description: |
        Per-interface install-mode state. One entry per install-mode data
        point; external clients mirror the reference stack's per-interface
        install-mode sensor and button from it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InstallModeInterfaceEntry" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallModeInterfaceRequest" }
      responses:
        "202":
          description: Accepted
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /install-mode/search:
    post:
      operationId: installModeSearch
      summary: Scan the wired bus for new devices (BidCos-Wired)
      description: |
        Triggers a synchronous wired-bus scan (`searchDevices`) on the
        given BidCos-Wired interface and returns the count of devices
        found. The found devices join the inbox (not yet accepted) for
        the operator to accept. Only BidCos-Wired supports it; other
        interfaces answer 422.
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallModeSearchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallModeSearchResponse"
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /system/addon-update:
    get:
      tags: [system]
      description: |
        Self-update status of the daemon's own CCU add-on package.
        Only meaningful on platforms with the firmware-side installer
        (`/bin/install_addon`, i.e. OpenCCU / RaspberryMatic); elsewhere
        `supported` is false and the check/install verbs answer 404.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddonUpdateStatus" }

  /system/addon-update/check:
    post:
      tags: [system]
      description: Trigger an immediate update check against the release feed.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "202":
          description: Check started; observe via GET or the WS broadcast.
        "404": { $ref: "#/components/responses/NotFound" }

  /system/addon-update/install:
    post:
      tags: [system]
      description: |
        Download, verify (SHA256 against the release checksums), stage
        and install the latest add-on package via the firmware's
        install_addon. The daemon restarts as part of the install.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "202":
          description: Install started; the daemon will restart.
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No update available, or an install is already running.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /system/update:
    get:
      tags: [hub]
      description: |
        CCU system-update info per central — the data behind the reference
        stack's system-update entity.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SystemUpdateEntry" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /system/update/install:
    post:
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - name: central
          in: query
          required: false
          schema: { type: string }
          description: Target central (optional for single-CCU deployments).
      description: >
        Starts the CCU firmware update. With `backup_first` a full CCU
        backup is taken first and the update starts only once it is
        durably stored; a failed backup aborts and the update does not
        run, because the point of asking for one is to have something to
        return to. The call then blocks for as long as the backup takes —
        minutes on a large configuration — since its response is what
        tells the operator whether that safety net exists.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallSystemUpdateRequest"
      responses:
        "202":
          description: Accepted
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /system/metrics:
    get:
      tags: [hub]
      description: |
        Hub metric samples per central as JSON — the machine-readable twin
        of the Prometheus `/metrics` endpoint for the system-health,
        connection-latency and last-event-age hub sensors.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HubMetricsEntry" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /interfaces:
    get:
      tags: [interfaces]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InterfaceState" }

  /interfaces/{id}:
    get:
      tags: [interfaces]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterfaceState" }
        "404":
          $ref: "#/components/responses/NotFound"

  /interfaces/{id}/reconnect:
    post:
      tags: [interfaces]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Accepted
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /i18n/entities:
    get:
      operationId: getEntityNames
      summary: The daemon's entity-name vocabulary
      description: |
        The names the daemon gives its own entities — the hub singletons
        and derived data points under `discovery.*`, the Security &
        Safety surfaces under `security.entity.*` — resolved for one
        locale.

        The daemon is the single naming authority (ADR 0046), but until
        now these names only reached the MQTT discovery plane, where they
        were resolved at publish time and never left. Every other
        consumer therefore kept a second copy of the same words, and the
        copies drift the moment either side is edited alone.

        Values are templates as authored: `Connectivity {iface}` carries
        a placeholder only the caller can fill, because the daemon does
        not know which interface, channel or profile is being named.
      tags: [System]
      parameters:
        - name: locale
          in: query
          required: false
          schema: { type: string }
          description: |
            Language tag (`de`, `en`). Defaults to the daemon's
            configured locale; an unknown tag falls back to it as well.
            The response echoes what actually answered.
      responses:
        '200':
          description: The entity-name catalogue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityNameCatalogue' }

  /system/ccu:
    get:
      operationId: listSystemCCU
      summary: Per-central CCU metadata
      description: |
        Returns one entry per CCU configured on the daemon. Surfaces
        identity (name, host, central-id), software (model, version),
        and the configured-interface list HA's Repair-Flows need to
        validate that the daemon manages the same CCU the user
        expects.

        The CCU's network coordinates — `host`, `hostname`, `serial`,
        `url` and the per-adapter `port` / `address` / `url` — are
        admin-only. A viewer or operator reads them as empty strings /
        zero, the same narrowing `GET /centrals` has always applied;
        everything else on the entry stays visible so a status page
        still renders.

        Centrals that have not yet completed their first connect
        round have empty `model` / `version` / `serial` / `hostname`
        / `url` and `available: false`; the configured-interface
        list is still populated from static config.
      tags: [core]
      responses:
        "200":
          description: List of CCU metadata entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSystemCCUResponse"

  /system/ccu/{central}/reboot:
    post:
      operationId: rebootSystemCCU
      summary: Reboot one CCU (admin-only)
      description: |
        Reboots the named CCU. The daemon runs a ReGa script that
        persists the CCU's state (`system.Save()`) and then triggers
        `/sbin/reboot`. The southbound connection to that central drops
        for the duration of the reboot and recovers automatically once
        the CCU is back (the readiness gate re-runs the bring-up).

        Unrelated to `POST /system/restart`, which restarts the
        OpenCCU-Loom daemon itself — this reboots the CCU hardware.
      tags: [system]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - name: central
          in: path
          required: true
          schema: { type: string }
          description: >
            Target central name (matches `SystemCCUEntry.name`).
      responses:
        "202":
          description: Reboot triggered
        "404":
          $ref: "#/components/responses/NotFound"
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /system/ccu/{central}/position:
    put:
      operationId: setSystemCCUPosition
      summary: Set a CCU's astro reference position
      tags: [system]
      description: >
        Writes the CCU's latitude/longitude (decimal degrees) via ReGa.
        Every sunrise/sunset time the CCU computes for its own programs
        and for the weekly profiles this daemon edits derives from this
        position, so a wrong value skews schedules silently rather than
        failing — which is why it is exposed at all. Admin-gated and
        audited. The CCU reads the values back and the daemon compares
        them, so a 204 means the CCU holds exactly what was sent. The
        time zone is not writable here; it is set on the CCU itself.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: path
          name: central
          required: true
          schema: { type: string }
          description: >
            Target central name (matches `SystemCCUEntry.name`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSystemCCUPositionRequest"
      responses:
        "204":
          description: Position written and confirmed by read-back
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            Coordinate out of range, or the central's backend has no ReGa
            path (CUxD, Homegear).
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /system/ccu/{central}/poweroff:
    post:
      operationId: postSystemCCUPoweroff
      summary: Shut a CCU host down
      tags: [system]
      description: >
        Powers the CCU off via ReGa. Nothing brings it back on: the central stays in the readiness gate's waiting state until it is switched on again, which is the intended outcome rather than a fault.
        Admin-gated and audited. Answers 202 once the CCU accepted the
        request; 422 when the central's backend cannot host the action
        (CUxD, Homegear, or a firmware without the method).
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: path
          name: central
          required: true
          schema: { type: string }
          description: >
            Target central name (matches `SystemCCUEntry.name`).
      responses:
        "202":
          description: Poweroff triggered
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The central's backend cannot host this action.
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /system/ccu/{central}/safe-mode:
    post:
      operationId: postSystemCCUSafeMode
      summary: Restart a CCU into safe mode
      tags: [system]
      description: >
        Restarts the CCU with its ReGa logic layer held down, so a configuration that breaks normal startup can be repaired.
        Admin-gated and audited. Answers 202 once the CCU accepted the
        request; 422 when the central's backend cannot host the action
        (CUxD, Homegear, or a firmware without the method).
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: path
          name: central
          required: true
          schema: { type: string }
          description: >
            Target central name (matches `SystemCCUEntry.name`).
      responses:
        "202":
          description: Safe-mode restart triggered
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The central's backend cannot host this action.
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /system/ccu/{central}/recovery-mode:
    post:
      operationId: postSystemCCURecoveryMode
      summary: Restart a CCU into its recovery system
      tags: [system]
      description: >
        Restarts the CCU into the separate recovery system reachable on the CCU's own address. OpenCCU / RaspberryMatic only - a stock CCU3 has no such method and the error is reported rather than swallowed.
        Admin-gated and audited. Answers 202 once the CCU accepted the
        request; 422 when the central's backend cannot host the action
        (CUxD, Homegear, or a firmware without the method).
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: path
          name: central
          required: true
          schema: { type: string }
          description: >
            Target central name (matches `SystemCCUEntry.name`).
      responses:
        "202":
          description: Recovery-mode restart triggered
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The central's backend cannot host this action.
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /system/restart-pending:
    get:
      operationId: getRestartPending
      summary: Whether a saved config change needs a daemon restart
      description: >
        Reports whether any restart-required config field has a persisted
        value the running daemon has not yet adopted (computed on demand:
        persisted config vs. the running boot config). The SPA shows a
        persistent banner while `pending` is true; it clears once the
        values are reverted or the daemon restarts.
      tags: [core]
      responses:
        "200":
          description: Restart-pending status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRestartPendingResponse"

  /system/config-changes:
    get:
      operationId: getConfigChanges
      summary: Config fields changed since the daemon started
      description: >
        Lists the config field paths whose persisted value differs from
        the running boot config — i.e. what was edited since start, not
        what differs from the built-in default. Empty right after a clean
        start; an entry drops out when its value is reverted. Backs the
        SPA's "Changed settings" overview.
      tags: [core]
      responses:
        "200":
          description: Changed config field paths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetConfigChangesResponse"

  /system/status:
    get:
      operationId: listSystemStatus
      summary: Recent system-status events
      description: |
        Returns a bounded ring buffer of the most recent
        SystemStatusChangedEvents observed on the central event bus.
        Each entry carries the per-component health snapshot at the
        moment the event fired (central state, connection state,
        degraded interfaces, freeform issues). The endpoint returns
        a 200 with an empty array when no events have been buffered
        yet — the buffer is wired only when a SystemStatusBuffer is
        installed in the REST router.
      tags: [core]
      responses:
        "200":
          description: Ring buffer of recent system-status events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSystemStatusResponse"

  /snapshot:
    get:
      tags: [snapshot]
      summary: One-shot dump of structural daemon state
      description: |
        Returns devices, programs, sysvars, rooms, functions and
        interface state in a single JSON envelope. Use this for
        cold-restore tooling, periodic external backups, or
        debugging session replays. Sources that are not wired
        contribute empty arrays rather than failing the request.

        Pass `?include=channels` to nest each device's channels under
        `device_channels`, or `?include=channels,data_points` to also
        expand each channel's data points — collapsing the otherwise
        N×M per-channel bootstrap into one round trip. `data_points`
        implies `channels`. With `Accept: application/x-ndjson` the same
        entities stream as `kind:"channel"` / `kind:"data_point"` lines.
      parameters:
        - name: include
          in: query
          required: false
          schema: { type: string }
          description: |
            Comma-separated set of nested entities to expand:
            `channels` and/or `data_points` (alias `data-points`).
            Unknown tokens are ignored.
        - name: anonymize
          in: query
          required: false
          schema: { type: boolean }
          description: |
            Tokenise operator-assigned names (device / channel /
            sub-device / sysvar / room / function labels and program
            descriptions) with stable non-identifying hashes. Addresses
            and values stay intact. `anonymise` is accepted as an alias.
        - name: central
          in: query
          required: false
          schema: { type: string }
          description: |
            Scope the snapshot to a single CCU by its canonical central
            name (exact match; `central == SystemCCUEntry.name ==
            payload.central`). Scopes the device tree (devices, channels)
            and hub entities (programs, sysvars). Rooms and functions are
            not central-tagged and stay fleet-wide. Omit for all centrals.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
            application/x-ndjson:
              schema:
                type: string
                description: |
                  Line-delimited stream, one `{"kind":...,"data":...}`
                  object per line. Kinds: meta, interface, device,
                  channel, data_point, room, function, program, sysvar.

  /events:
    get:
      tags: [events]
      summary: Upgrade to the WebSocket event stream
      description: |
        Clients must request an RFC 6455 upgrade (Upgrade: websocket,
        Connection: Upgrade, Sec-WebSocket-Version: 13). Once
        connected the client exchanges JSON frames:

        ```
        {"op":"subscribe","topics":["device.*","hub.*"]}
        {"op":"unsubscribe","topics":["hub.*"]}
        {"op":"pong"}
        ```

        Server frames follow the [WsEnvelope](#/components/schemas/WsEnvelope)
        shape. The envelope's `type` field discriminates which payload
        schema applies. The full broadcast catalogue (event name → topic
        pattern → payload schema) lives in `assets/wsapi.json` under
        commands where `kind == "broadcast"`. The topic-hierarchy
        reference at `docs/external-clients/topic-hierarchy.md`
        documents the wildcard semantics.

        Currently emitted broadcasts (and the schema each one carries):

        - `datapoint.value_changed` → [DataPointValueChangedPayload](#/components/schemas/DataPointValueChangedPayload)
        - `custom_data_point.state_changed` → [CustomDataPointStateChangedPayload](#/components/schemas/CustomDataPointStateChangedPayload)
        - `central.state_changed` → [CentralStateChangedPayload](#/components/schemas/CentralStateChangedPayload)
        - `system.status_changed` → [SystemStatusChangedPayload](#/components/schemas/SystemStatusChangedPayload)
        - `hub.sysvar_changed` → [SysvarChangedPayload](#/components/schemas/SysvarChangedPayload)
        - `hub.program_executed` → [ProgramExecutedPayload](#/components/schemas/ProgramExecutedPayload)
        - `hub.install_mode_changed` → [InstallModeChangedPayload](#/components/schemas/InstallModeChangedPayload)
        - `device.created` → [DeviceCreatedPayload](#/components/schemas/DeviceCreatedPayload)
        - `device.removed` → [DeviceRemovedPayload](#/components/schemas/DeviceRemovedPayload)
        - `device.availability_changed` → [DeviceAvailabilityChangedPayload](#/components/schemas/DeviceAvailabilityChangedPayload)
        - `matter.*` broadcasts: see `wsapi.json` (payload schemas TBD).
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: |
            Plain HTTP request without a valid WebSocket upgrade — the
            server rejects the connection rather than serving HTML.

  # ---- Setup ----
  /setup/status:
    get:
      operationId: setupStatus
      summary: First-run onboarding probe
      description: >
        Reports whether first-run onboarding is still required — true only when
        no authentication source exists yet (no local admin, no YAML user, no
        CCU-delegated login, no OIDC). The SPA probes this on boot to decide
        between the onboarding wizard and the login screen. Unauthenticated.
      tags: [setup]
      security: []
      responses:
        "200":
          description: Onboarding requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
  /setup:
    post:
      operationId: setup
      summary: Finalize first-run onboarding
      description: >
        Atomically persists the admin account, locale preference, optional CCU,
        and optional MQTT broker collected by the SPA onboarding wizard.
        Unauthenticated by necessity (no admin exists yet) but hard-gated: once
        any authentication source exists it returns 409, so a second admin can
        never be registered through this endpoint. An operator who closed the
        surface with `bootstrap.allow_first_run_setup: false` gets 403 instead,
        regardless of how many users exist. On success the SPA returns to
        the login screen and the operator signs in with the new admin account.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "204": { description: Onboarding completed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: First-run onboarding disabled by bootstrap.allow_first_run_setup
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ---- Auth ----
  /auth/login:
    post:
      operationId: login
      summary: Issue session cookie
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke current session
      description: >-
        Revokes the session the request presented — whatever scheme minted
        it, including a session an external identity provider vouched for —
        clears the cookie, and closes the caller's open WebSocket
        connections, so the command plane ends with the session rather than
        outliving it.
      tags: [auth]
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: me
      summary: Current identity probe
      tags: [auth]
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me/password:
    patch:
      operationId: changeOwnPassword
      summary: Change the logged-in user's own password
      description: >
        Self-service password change for the authenticated local user.
        Requires the current password; the role is preserved. Accounts
        without a local password (OIDC / bearer-token identities) return
        409.
      tags: [auth]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOwnPasswordRequest"
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/preferences/{key}:
    parameters:
      - { in: path, name: key, required: true, schema: { type: string } }
    get:
      operationId: getPreference
      summary: Read the caller's UI preference for {key}
      description: >
        Per-user UI state (e.g. key `favorites`). The value is opaque
        JSON owned by the SPA. Scoped to the authenticated subject.
        A key that was never stored is not an error: the response is
        200 with `value: null`.
      tags: [auth]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: []
      responses:
        "200":
          description: Preference value, or null when the key is unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPreferenceResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: putPreference
      summary: Store the caller's UI preference for {key}
      description: >
        The request body is stored verbatim and must be valid JSON
        within 256 KiB.
      tags: [auth]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: Preference too large }
    delete:
      operationId: deletePreference
      summary: Delete the caller's UI preference for {key}
      tags: [auth]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: []
      responses:
        "204": { description: Deleted (or already absent) }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/users:
    get:
      operationId: listUsers
      summary: List configured Basic-auth users (admin)
      tags: [auth]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserListEntry" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/tokens:
    get:
      operationId: listTokens
      summary: List API tokens with elided fingerprints (admin)
      description: |
        Deprecated — use `GET /auth/tokens/v2`, which carries the full
        fingerprint plus `created_at`/`expires_at` metadata instead of
        an elided fingerprint. The in-tree Svelte SPA already uses only
        the v2 surface (`AccessControl.svelte`); this v1 read path is
        kept for existing external API consumers.
      deprecated: true
      tags: [auth]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TokenListEntry" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createToken
      summary: Issue a new bearer token (admin)
      description: |
        Deprecated — use `POST /auth/tokens/v2`, which additionally
        accepts `expires_in_days`. Generates a fresh bearer token bound
        to the supplied subject and role. The raw token value is
        returned exactly once in the 201 response — the daemon stores
        only an opaque fingerprint thereafter, so the client MUST
        capture the `token` field on creation. Use the returned `id`
        for subsequent management (`DELETE /auth/tokens/{id}`).
      deprecated: true
      tags: [auth]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token created — raw value visible exactly once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateTokenResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Validation error (missing subject, invalid role)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/tokens/{id}:
    delete:
      operationId: deleteToken
      summary: Revoke an API token (admin)
      description: |
        Removes the token identified by the path segment (the `id`
        field returned from `POST /auth/tokens` or `GET /auth/tokens`).
        The token immediately stops authenticating; in-flight requests
        finish under the previous identity. The WebSocket connections the
        token opened are closed as part of this call, because a socket
        resolves its identity once at the upgrade and would otherwise keep
        the revoked token's role until the client happened to reconnect.
      tags: [auth]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Token removed
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          $ref: "#/components/responses/NotFound"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/oidc/start:
    get:
      operationId: oidcStart
      summary: Initiate OIDC authorization code flow (redirect to IdP)
      tags: [auth]
      security: []
      responses:
        "302":
          description: Redirect to identity provider
        "404":
          description: OIDC not configured (route not registered)
        "503":
          description: OIDC configured but provider unreachable
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC authorization code callback — exchanges code for session
      tags: [auth]
      security: []
      parameters:
        - { in: query, name: code, required: true, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
      responses:
        "302":
          description: Redirect to / on success
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: OIDC not configured (route not registered)
        "503":
          description: OIDC configured but provider unreachable

  # ---- Devices: lifecycle, channels, schedule, links ----
  /devices/values:batch:
    post:
      operationId: valuesBatch
      summary: Batch-read data-point values in one round trip
      description: |
        Returns the requested data-point summaries in a single
        request — avoids the N-roundtrips initial-sync penalty
        external clients (HA, dashboards, monitoring) hit when
        loading 80k DPs over per-DP GETs.

        Per-query errors (missing device, channel, parameter, or
        visibility-hidden parameter) surface inside the response
        body so one bad address does not abort the rest of the
        batch. Envelope-level problems (malformed JSON, empty
        queries, exceeding the per-request cap) yield problem+json.

        The per-request query cap is currently 1000.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValuesBatchRequest" }
      responses:
        "200":
          description: Per-query results (success or error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValuesBatchResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Empty queries / oversized batch
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /devices/refresh:
    post:
      operationId: refreshDevices
      summary: Force CCU re-pull on every backend
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "202":
          description: Refresh dispatched
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/reload:
    post:
      operationId: reloadDevice
      summary: Re-pull a single device's config from its CCU
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      responses:
        "200":
          description: Device config reloaded
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/channels/{no}/reload:
    post:
      operationId: reloadChannel
      summary: Re-pull a single channel's config from its CCU
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: string } }
      responses:
        "200":
          description: Channel config reloaded
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/accept:
    post:
      operationId: acceptInboxDevice
      summary: Promote a pending pairing into the registry
      description: |
        Accepts a device waiting in the inbox. The optional body applies
        first-time configuration right after the accept: `name` renames
        the device (persisted to the CCU), `include_channels` cascades
        that rename to every channel (`"<name>:<channelNo>"`), and
        `rooms` / `functions` assign the device to rooms and functions
        (Gewerke). An empty or omitted body accepts the device with no
        configuration (backward compatible). The follow-up steps run only
        after the accept succeeds; if the accept succeeds but a follow-up
        step fails the response is a 502 whose title states the device
        was accepted so only the configuration needs re-applying. If the
        address is no longer waiting in any central's inbox (it settled or
        was removed on the CCU — e.g. the virtual backing device of a
        heating group), the response is a 404 and the daemon drops the
        stale entry from its inbox view.

        An entry flagged `pending_creation` is additionally held back by
        this daemon (`central.behavior.delay_new_device_creation`);
        accepting it hands the parked descriptions to the same
        materialiser a hot-plugged device runs through, so the device
        arrives with its channels, data points and values.
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInboxDeviceRequest"
      responses:
        "202":
          description: Accept dispatched
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/release:
    post:
      operationId: releaseDevice
      summary: Finish onboarding and publish the device to the ecosystems
      description: |
        Ends the hold an accepted-but-unreleased device is under. Until
        this call the device is fully materialised and configurable — it
        has its CCU ise_id, its channels and its data points, and it is
        visible in this daemon's own REST / WebSocket surfaces — but it is
        withheld from the ecosystems: MQTT (and therefore Home Assistant),
        the Matter bridge, and the outbound webhook.

        The separation from `POST /devices/{addr}/accept` is deliberate.
        Between the two steps the operator names the device and assigns
        its rooms and functions. An ecosystem that sees a device first and
        is corrected afterwards keeps the identity it saw — Home
        Assistant its entity ids, a Matter controller its endpoint number
        — so releasing last is what makes that naming stick.

        Only a device that entered through the deferred-creation wizard
        (`central.behavior.delay_new_device_creation`) is ever withheld.
        A device that never did is released from the start, which is why
        an upgrade publishes exactly what was published before.

        `404` means no central is withholding the address: it was already
        released, or it never went through the wizard.
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      responses:
        "204":
          description: Device released
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/firmware/refresh:
    post:
      operationId: refreshFirmwareData
      summary: Re-read device firmware data from every CCU
      description: |
        Force-refreshes the per-device firmware data (installed /
        available version, update lifecycle state) by re-pulling the
        device descriptions from every configured CCU and applying them
        to the live device models. Complements the periodic firmware
        polling: use it when the firmware overview should reflect an
        update the CCU performed right now instead of at the next poll.
        Synchronous — a 204 means every reachable CCU has been swept.
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "204":
          description: Firmware data refreshed
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/firmware/update:
    post:
      operationId: updateFirmware
      summary: Trigger OTA firmware update for the device
      description: |
        Starts an OTA flash. The CCU does not handle duplicate
        update requests gracefully — a retry mid-flight can leave the
        radio in an undefined state. Supply the optional
        `Idempotency-Key` header so client-side retries collapse into
        a single update attempt.
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: |
            Update scheduled. When the device's radio interface reports a
            high transmit duty cycle the body carries an advisory
            `duty_cycle_warning` (the update is never rejected on that
            basis, mirroring the CCU WebUI's non-blocking warning).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateFirmwareResponse"
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/config/restore:
    post:
      operationId: restoreDeviceConfig
      summary: Re-transmit stored configuration to a device (admin-only)
      description: |
        Asks the CCU to re-send every channel's stored MASTER paramset
        plus the device's direct-link peerings — the recovery path after
        a device factory reset. The transfer runs asynchronously on the
        radio (watch the device's CONFIG_PENDING state for progress), so
        the endpoint returns 202 once the request was accepted. Supported
        on HmIP-RF and BidCos-RF only; other interfaces (BidCos-Wired,
        CUxD, VirtualDevices) answer 422. Consult
        `DeviceSummary.config_restore_supported` before offering the
        action.
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      responses:
        "202":
          description: |
            Restore dispatched; the configuration transfer continues
            asynchronously (watch CONFIG_PENDING).
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/test:
    post:
      operationId: testDeviceCommunication
      summary: Run the per-device communication / function test
      description: |
        Asks the CCU to send a radio test frame to the device and reports
        whether the device answered within the poll window (the same test
        the CCU inbox runs). Blocks until the test completes or the window
        elapses. Supported on the radio interfaces (HmIP-RF, BidCos-RF,
        BidCos-Wired); VirtualDevices and CUxD answer 422. Consult
        `DeviceSummary.communication_test_supported` before offering the
        action.

        A device that does not answer is a **200** carrying
        `timed_out: true`, not an error: the poll runs on the request
        deadline minus a two-second response margin, and when that budget
        elapses first the daemon reports the un-answered test as the result
        it is. 502 is reserved for a genuine upstream failure.
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/channels/{no}/team-candidates:
    get:
      operationId: getDeviceTeamCandidates
      summary: List team channels a channel may be assigned to
      description: |
        Returns the team channels that share the target channel's team tag
        (the candidate list for a team assignment, e.g. a smoke-detector
        team). Read-only. Supported on BidCos-RF / HmIP-RF; other
        interfaces return an empty list.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDeviceTeamCandidatesResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/channels/{no}/team:
    put:
      operationId: setDeviceChannelTeam
      summary: Assign a channel to a team
      description: |
        Assigns the channel to the given team channel (`setTeam`). A null or
        empty `team` resets the channel to its own default team. Supported
        on BidCos-RF / HmIP-RF; other interfaces answer 422.
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDeviceChannelTeamRequest"
      responses:
        "202":
          description: Team assignment accepted
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/replace-candidates:
    get:
      operationId: listDeviceReplaceCandidates
      summary: List devices the new device may replace
      description: |
        Returns the already-paired devices the new (inbox) device at
        `{addr}` may replace — the interface daemon (rfd / hs485d)
        computes type / channel compatibility. `model_matches` flags an
        exact-model swap apart from a compatible cross-type one. A pure
        CCU read. Supported on BidCos-RF and BidCos-Wired only; HmIP
        devices cannot be replaced (the CCU WebUI hides the action for
        them too).
      tags: [devices]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: query, name: central, required: false, schema: { type: string }, description: "Disambiguates the CCU; optional for single-CCU setups." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDeviceReplaceCandidatesResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/replace:
    post:
      operationId: replaceDevice
      summary: Replace a paired device with a new one (admin-only)
      description: |
        Swaps the paired `old_address` for the new device at `{addr}`.
        The interface daemon migrates direct links, teams and link
        paramsets; ReGa re-binds the existing object in place (same
        ise-ID, so programs, names and rooms survive) and the old device
        is unpaired. Returns 202 once the swap is applied — the radio
        config transfer to the new device continues CCU-side afterwards.
        Supported on BidCos-RF and BidCos-Wired only.
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceDeviceRequest"
      responses:
        "202":
          description: |
            Replace applied; the device's radio configuration transfer
            continues asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaceDeviceResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /system/firmware/download:
    post:
      operationId: downloadSystemFirmware
      summary: Download a firmware image onto a CCU (admin-only)
      description: |
        Instructs one CCU to fetch a firmware image from the supplied
        http/https URL onto the central (posting to the CCU's maintenance
        CGI) so it can be staged for a later install. The CCU performs the
        transfer asynchronously; the endpoint returns 202 once the request
        was accepted.
      tags: [system]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadSystemFirmwareRequest"
      responses:
        "202":
          description: Download triggered
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/install-mode:
    post:
      operationId: deviceInstallMode
      summary: Open a targeted pairing window for one device
      description: |
        Opens install mode bound to a single device address (serial),
        mirroring the CCU WebUI's serial-targeted teach-in. The owning
        backend is resolved by address.
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInstallModeRequest"
      responses:
        "202":
          description: Pairing window opened
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/channels/{no}/paramsets/{key}/determine:
    post:
      operationId: determineParameter
      summary: Read one parameter's live value from the device
      description: |
        Reads ("determines") the current value of a single parameter straight
        from the device via the CCU's determineParameter operation — the MASTER
        editor's "Determine" button. This is a read (no edit-lock token
        required), but it triggers a device round-trip, so the parameter is
        named in the request body. The {key} path segment scopes the request to
        the paramset being edited; the CCU auto-selects the paramset on the
        wire. Shares the backend path with the WS `paramset.determine` command.
      tags: [paramsets]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer } }
        - { in: path, name: key, required: true, schema: { type: string, enum: [VALUES, MASTER, LINK] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetermineParameterRequest"
      responses:
        "200":
          description: The value the device reported for the parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetermineParameterResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "502":
          description: CCU read error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/channels/{no}/ui-schema:
    get:
      operationId: getUiSchema
      summary: Renderable form descriptor for a channel paramset
      tags: [devices]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer } }
        - { in: query, name: paramset, schema: { type: string, enum: [VALUES, MASTER, LINK], default: VALUES } }
        - { in: query, name: peer, schema: { type: string } }
        - { in: query, name: locale, schema: { type: string, default: en } }
        - { in: query, name: expert, schema: { type: boolean } }
      responses:
        "200":
          description: UI schema
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/export-definition:
    get:
      operationId: exportDeviceDefinition
      summary: Export a device definition as an aiohomematic-compatible zip
      description: |
        Fetches the device + channel descriptions and their non-LINK paramset
        descriptions directly off the CCU (preserving wire member order),
        anonymises every address behind a single random "VCU" id, and returns a
        zip containing `device_descriptions/{model}.json` and
        `paramset_descriptions/{model}.json`. The JSON members are byte-for-byte
        identical to aiohomematic's `export_device_definition`, so the archive
        drops straight into pydevccu / godevccu as a device fixture.
      tags: [devices]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      responses:
        "200":
          description: Device-definition zip archive
          headers:
            Content-Disposition:
              description: 'attachment; filename="{model}.zip"'
              schema: { type: string }
          content:
            application/zip: { schema: { type: string, format: binary } }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: CCU read error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /devices/{addr}/channels/{no}/config/export:
    get:
      operationId: exportChannelConfig
      summary: Export a channel's paramset as a portable JSON snapshot
      description: |
        Returns an ExportedConfiguration snapshot for the specified channel.
        The `paramset` query parameter selects which paramset to snapshot
        (default: MASTER). The snapshot is suitable for archival, migration,
        and import via POST .../config/import.
      tags: [config]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer, minimum: 0 } }
        - in: query
          name: paramset
          schema: { type: string, enum: [MASTER, VALUES], default: MASTER }
          description: Paramset to export. MASTER is the default (persistent channel settings).
      responses:
        "200":
          description: Exported configuration snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportedConfiguration" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Export failed (CCU read error)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /devices/{addr}/channels/{no}/config/import:
    post:
      operationId: importChannelConfig
      summary: Import a previously-exported channel paramset snapshot
      description: |
        Applies an ExportedConfiguration payload to the CCU. The body must
        have been produced by GET .../config/export (or the Python
        aiohomematic-config exporter). Version mismatch and missing required
        fields are rejected with 400. CCU write errors surface as 500.
      tags: [config]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportedConfiguration" }
      responses:
        "200":
          description: Import applied successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: Apply failed (CCU write error)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /devices/{addr}/cdps:
    get:
      operationId: listCustomDataPoints
      summary: List all custom data points of a device
      tags: [devices]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      responses:
        "200":
          description: Custom DP list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomDPSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
  /devices/{addr}/cdps/{name}:
    get:
      operationId: getCustomDataPoint
      summary: Get a single custom data point by name
      tags: [devices]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: name, required: true, schema: { type: string } }
      responses:
        "200": { description: Custom DP detail }
        "404": { $ref: "#/components/responses/NotFound" }
  /devices/{addr}/cdps/{name}/{operation}:
    post:
      operationId: invokeCustomDataPoint
      summary: "Invoke an operation on a custom data point (turn_on, set_temperature, open, …)"
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: name, required: true, schema: { type: string } }
        - in: path
          name: operation
          required: true
          schema:
            type: string
            description: "Operation name, e.g. turn_on, turn_off, set_temperature, open, close, …"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomDPInvokeRequest" }
      responses:
        "204": { description: Accepted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }
        "423": { $ref: "#/components/responses/Locked" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/channels/{no}/calc-dps:
    get:
      operationId: listCalculatedDataPoints
      summary: List all calculated data points on a channel
      tags: [devices]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Calculated DP list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalculatedDPSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /devices/{addr}/channels/{no}/calc-dps/{name}:
    get:
      operationId: getCalculatedDataPoint
      summary: Get a single calculated data point by name
      tags: [devices]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer } }
        - { in: path, name: name, required: true, schema: { type: string } }
      responses:
        "200":
          description: Calculated DP detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalculatedDPDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /devices/{addr}/channels/{no}/linkable-channels:
    get:
      operationId: linkableChannels
      summary: Eligible link partners for the channel
      tags: [devices]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer } }
        - { in: query, name: role, required: true, schema: { type: string, enum: [sender, receiver] } }
        - { in: query, name: interface, required: true, schema: { type: string } }
        - { in: query, name: locale, schema: { type: string, default: en } }
      responses:
        "200":
          description: Channel list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LinkableChannel" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/channels/{no}/week_profile:
    get:
      operationId: getChannelWeekProfile
      summary: Week-profile metadata for one channel
      description: |
        Returns the week-profile descriptor (schedule type, temperature
        range, available profiles, per-day enabled flags) for the given
        channel. Returns 404 when the channel exists but has no
        attached week profile.
      tags: [schedules]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Week-profile metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeekProfileResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /devices/{addr}/channels/{no}/week_profile/channel-locks/{key}:
    put:
      tags: [devices]
      description: |
        Toggle one target channel's week-program participation — the write
        half of the `schedule_enabled` map in WeekProfileResponse. External
        clients drive their schedule-channel switch entities through it.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { name: addr, in: path, required: true, schema: { type: string } }
        - { name: "no", in: path, required: true, schema: { type: integer } }
        - { name: key, in: path, required: true, schema: { type: string }, description: "Schedule target channel key, e.g. `1_1`." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelLockRequest" }
      responses:
        "202":
          description: Accepted
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /devices/{addr}/channels/{no}/master-profiles:
    get:
      operationId: listMasterProfiles
      summary: List master profiles for one channel
      description: |
        Master profiles available for the channel's (device_type,
        channel_type) pair — resolved from the channel's owning device's
        model and the channel's own type. Shares the domain call
        (`masterprofile.Store.Profiles`) with the WS
        `master_profiles.list` command. An unknown pair (no profiles
        catalogued for this device/channel type) returns an empty array,
        not 404.
      tags: [devices]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: "no", required: true, schema: { type: integer } }
        - in: query
          name: locale
          schema: { type: string }
          description: Locale for the localised name/description. Defaults to "en".
      responses:
        "200":
          description: Master profiles for the channel (may be empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MasterProfileSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
  /devices/{addr}/channels/{no}/master-profiles/{id}:
    get:
      operationId: getMasterProfile
      summary: Full parameter set of a single master profile
      description: |
        Shares the domain call (`masterprofile.Store.Profile`) with the
        WS `master_profiles.get` command.
      tags: [devices]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: "no", required: true, schema: { type: integer } }
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Master profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /devices/{addr}/channels/{no}/master-profiles/match:
    post:
      operationId: matchMasterProfile
      summary: Match observed values against a channel's master-profile constraints
      description: |
        Matches the `current_values` in the request body against the
        master-profile constraint set for the channel's (device_type,
        channel_type) pair and returns the active profile id (0 = Expert
        / no match). Shares the domain call
        (`masterprofile.Store.MatchActiveProfile`) with the WS
        `master_profiles.match` command.
      tags: [devices]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: "no", required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchMasterProfileRequest"
      responses:
        "200":
          description: Active profile id (0 = no match)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchMasterProfileResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/{addr}/channels/{no}/schedule:
    get:
      operationId: getChannelSchedule
      summary: Climate or simple schedule of one channel
      tags: [schedules]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: putChannelSchedule
      summary: Replace channel schedule
      tags: [schedules]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Schedule" }
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/channels/{no}/schedule/active-profile:
    post:
      operationId: setChannelActiveProfile
      summary: Pick the active climate profile (P1..P6)
      tags: [schedules]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetActiveProfileRequest" }
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/schedule:
    get:
      operationId: getDeviceSchedule
      summary: Auto-resolves schedule channel from the device
      tags: [schedules]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: putDeviceSchedule
      summary: Replace device schedule (auto-resolves channel)
      tags: [schedules]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Schedule" }
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/schedule/active-profile:
    post:
      operationId: setDeviceActiveProfile
      summary: Pick the active climate profile (auto-resolves channel)
      tags: [schedules]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetActiveProfileRequest" }
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/schedules/copy:
    post:
      operationId: copyDeviceSchedule
      summary: Copy the whole week schedule to another device
      tags: [schedules]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyScheduleRequest" }
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/channels/{no}/week_profile/copy:
    post:
      operationId: copyClimateProfile
      summary: Copy a single climate profile to another channel/profile
      tags: [schedules]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyProfileRequest" }
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/links:
    get:
      operationId: listLinks
      summary: List direct links of the device
      tags: [links]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: query, name: locale, schema: { type: string, default: en } }
      responses:
        "200":
          description: Links
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Link" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: addLink
      summary: Add a direct link (sender → receiver)
      tags: [links]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddLinkRequest" }
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: updateLink
      summary: Rename a direct link (change name / description)
      tags: [links]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLinkRequest" }
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: removeLink
      summary: Remove a direct link
      tags: [links]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: query, name: sender, required: true, schema: { type: string } }
        - { in: query, name: receiver, required: true, schema: { type: string } }
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/links/test:
    post:
      operationId: testLinkAtDevice
      summary: Test a direct link at the device (activate link paramset)
      tags: [links]
      description: |
        Triggers the receiver's LINK-paramset behaviour for the given
        sender — the CCU config dialog's "test link" / simulate-keypress
        probe. It PHYSICALLY actuates the receiver (a switch clicks, a
        blind moves), so it is operator-gated and fire-and-forget. Maps to
        XML-RPC `activateLinkParamset(receiver, sender, longPress)`. 501
        when the interface does not support link activation (CUxD /
        Homegear).
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestLinkAtDeviceRequest" }
            example:
              receiver_address: "0001ABCD:3"
              sender_address: "0002EFGH:1"
              long_press: false
      responses:
        "202": { description: Triggered (the actuator reacts asynchronously). }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { description: Link activation not supported on this interface. }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/link-ps/{peer}:
    get:
      operationId: getLinkParamset
      summary: LINK paramset between this channel and a peer
      tags: [links]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: peer, required: true, schema: { type: string } }
      responses:
        "200": { description: Paramset }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: putLinkParamset
      summary: Write LINK paramset to a peer
      tags: [links]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: peer, required: true, schema: { type: string } }
        - name: X-Edit-Token
          in: header
          required: false
          schema: { type: string }
          description: >-
            Edit-lock token. A LINK paramset is per-peer configuration gated
            behind the per-resource edit lock: the caller must open an edit
            session (`POST /sessions/edit` with key
            `channel:{addr}:LINK:{peer}`) and present the returned token here,
            else the write is rejected 423 Locked.
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "423": { $ref: "#/components/responses/Locked" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/central-links:
    get:
      operationId: getCentralLinksStatus
      summary: PRESS-event forwarding status for the device
      tags: [links]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CentralLinksStatus" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createCentralLinks
      summary: Enable central click-event forwarding
      description: |
        Enables CCU click-event forwarding. Without `channel` every
        eligible (press-event) channel of the device is switched on;
        with `channel` (a channel address such as ABC0000001:4) only
        that single channel is touched.
      tags: [links]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - in: query
          name: channel
          required: false
          schema: { type: string }
          description: Channel address to scope the switch to a single channel, e.g. ABC0000001:4. Omit for the whole device.
      responses:
        "202": { description: Report }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: removeCentralLinks
      summary: Disable central click-event forwarding
      description: |
        Disables CCU click-event forwarding. Without `channel` the whole
        device is switched off; with `channel` (a channel address such as
        ABC0000001:4) only that single channel is touched.
      tags: [links]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - in: query
          name: channel
          required: false
          schema: { type: string }
          description: Channel address to scope the switch to a single channel, e.g. ABC0000001:4. Omit for the whole device.
      responses:
        "202": { description: Report }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

