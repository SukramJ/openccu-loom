        findings:
          type: array
          items: { $ref: "#/components/schemas/MatterMdnsFinding" }

    MatterSession:
      type: object
      required:
        [session_id, fabric_index, peer_node_id, local_node_id, is_pase,
         subscriptions, last_activity, last_peer_activity,
         idle_seconds, peer_idle_seconds]
      properties:
        session_id: { type: integer, minimum: 0, maximum: 65535 }
        fabric_index:
          type: integer
          minimum: 0
          maximum: 255
          description: "0 for a PASE (commissioning) session"
        peer_node_id: { type: string, description: "64-bit node id, hex" }
        local_node_id: { type: string, description: "64-bit node id, hex" }
        is_pase:
          type: boolean
          description: "Commissioning session rather than an operational (CASE) one"
        subscriptions:
          type: integer
          description: "Active subscriptions riding on this session"
        last_activity:
          type: string
          format: date-time
          description: "Last traffic in either direction"
        last_peer_activity:
          type: string
          format: date-time
          description: "Last message received from the peer"
        idle_seconds:
          type: integer
          description: "Seconds since last_activity"
        peer_idle_seconds:
          type: integer
          description: "Seconds since last_peer_activity — the controller-liveness signal"

    MatterSessionOccupancy:
      type: object
      required: [live, reserved, capacity, free]
      description: |
        Usage of the bridge's 16-bit session-id space.

        `reserved` is the field the session list cannot supply: a CASE
        handshake announces its session id in Sigma2 one round trip before
        the session exists, and an id staked by a handshake that never
        completes holds its slot for twenty minutes without appearing as a
        session. A space filling up with those looks like a quiet bridge
        from every other view, until the next controller is refused.
      properties:
        live:
          type: integer
          description: "Sessions with key material installed"
        reserved:
          type: integer
          description: "Ids staked by a handshake that has not completed"
        capacity:
          type: integer
          description: "Size of the allocator's id space (ids 1..0xFFFE)"
        free:
          type: integer
          description: "Ids held by neither a live session nor a staked handshake"

    MatterSessionList:
      type: object
      required: [sessions, occupancy]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/MatterSession" }
        occupancy: { $ref: "#/components/schemas/MatterSessionOccupancy" }

    MatterSetupPayload:
      type: object
      required: [discriminator, passcode, vendor_id, product_id, qr_code, manual_code]
      properties:
        discriminator: { type: integer, minimum: 0, maximum: 4095 }
        passcode: { type: integer, minimum: 1, maximum: 99999998 }
        vendor_id: { type: integer, minimum: 0, maximum: 65535 }
        product_id: { type: integer, minimum: 0, maximum: 65535 }
        qr_code:
          type: string
          description: "Onboarding payload prefixed with `MT:` per Matter §5.7.4"
        manual_code:
          type: string
          description: "11-digit decimal code with Verhoeff check digit per Matter §5.1.4"

    MatterCommissioningWindowRequest:
      type: object
      properties:
        duration_seconds:
          type: integer
          minimum: 180
          maximum: 900
          description: "Commissioning window duration in seconds. Default 900 (15 minutes)."

    MatterCommissioningWindowResponse:
      type: object
      required: [discriminator, passcode, duration_seconds, qr_code, manual_code]
      properties:
        discriminator: { type: integer, minimum: 0, maximum: 4095 }
        passcode: { type: integer, minimum: 1, maximum: 99999998 }
        duration_seconds: { type: integer, minimum: 180, maximum: 900 }
        qr_code: { type: string }
        manual_code: { type: string }

    MatterStatus:
      type: object
      required: [enabled, listening, endpoint_count, fabric_count, enabled_count, advertising, commissioning_window_open]
      properties:
        enabled: { type: boolean, description: "Bridge feature flag" }
        listening: { type: boolean, description: "UDP listener bound" }
        listen_addr: { type: string, description: "Effective UDP listen address" }
        endpoint_count: { type: integer, description: "Bridged-endpoint count (excludes the root and Aggregator endpoints)" }
        fabric_count: { type: integer, description: "Commissioned fabrics" }
        enabled_count: { type: integer, description: "Allowlist entries with enabled=true" }
        advertising: { type: boolean, description: "mDNS records emitted" }
        commissioning_window_open: { type: boolean }
        commissioning_window_duration_seconds:
          type: integer
          minimum: 0
          maximum: 900

    MatterExposure:
      type: object
      required: [central_name, device_address, channel_no, dp_kind, dp_key, mappable, enabled]
      properties:
        central_name: { type: string }
        device_address: { type: string }
        channel_no: { type: integer }
        dp_kind:
          type: string
          enum: [custom, generic, calculated, combined, measurement]
        dp_key: { type: string }
        parameter_label:
          type: string
          description: |
            Ready-to-display caption for the data point behind
            `dp_key`: locale-aware channel-typed translation when one
            exists, otherwise the title-cased key. Same resolution as
            `DataPointSummary.parameter_label`.
        display_name: { type: string }
        enabled: { type: boolean }
        friendly_name: { type: string }
        mappable:
          type: string
          enum: [mappable, partially_mappable, unmappable]
        device_type: { type: integer, minimum: 0, maximum: 65535 }
        device_type_label:
          type: string
          description: |
            Operator-facing Matter device-type name for `device_type`
            (e.g. "On/Off Light"). Empty when `device_type` is zero
            (measurement rides on a host endpoint).
        clusters:
          type: array
          items: { type: integer }
        reason: { type: string }

    MatterExposureList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MatterExposure" }

    MatterExposureUpdate:
      type: object
      required: [central_name, device_address, channel_no, dp_kind, dp_key, enabled]
      properties:
        central_name: { type: string }
        device_address: { type: string }
        channel_no: { type: integer }
        dp_kind:
          type: string
          enum: [custom, generic, calculated, combined, measurement]
        dp_key: { type: string }
        enabled: { type: boolean }
        friendly_name: { type: string }

    MatterExposureBulkUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MatterExposureUpdate" }

    UnIgnoreEntry:
      type: object
      required: [pattern]
      properties:
        pattern: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }

    UnIgnoreListResponse:
      type: object
      required: [centrals]
      properties:
        centrals:
          type: array
          items:
            type: object
            required: [central_name, patterns]
            properties:
              central_name: { type: string }
              patterns:
                type: array
                items: { $ref: "#/components/schemas/UnIgnoreEntry" }

    UnIgnoreUpdateRequest:
      type: object
      required: [central_name, patterns]
      properties:
        central_name: { type: string }
        patterns:
          type: array
          items:
            {
              type: string,
              description: "PARAMETER (global un-ignore, any model/channel) or PARAMETER:PARAMSET@MODEL:CHANNEL (fully-qualified entry)",
            }

    UnIgnoreUpdateResponse:
      type: object
      required: [applied_count]
      properties:
        applied_count: { type: integer }
        parse_errors:
          type: array
          items: { type: string, description: "human-readable parse error per offending pattern" }
        affected_devices: { type: integer }
        patterns:
          type: array
          items: { $ref: "#/components/schemas/UnIgnoreEntry" }

    UnIgnoreCandidateList:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items: { type: string, description: "parameter name (bare) or MODEL:CHANNEL:PARAMETER full-form" }
        include_master: { type: boolean }
        groups:
          type: array
          description: >-
            One entry per (parameter, paramset), with the models and channels it
            occurs on. The flat `candidates` list is the cross-product of
            parameter x model x channel in three pattern formats — a 399-device
            fleet yields ~2800 strings out of ~45 parameters — so clients that
            render a picker should use this instead. Both paramsets are always
            present here, each group tagged with its own; `include_master`
            governs only `candidates`.
          items: { $ref: "#/components/schemas/UnIgnoreCandidateGroup" }
        reasons:
          type: array
          description: Every suppression category the groups can carry, in display order.
          items: { $ref: "#/components/schemas/UnIgnoreReason" }

    UnIgnoreReason:
      type: string
      description: >-
        The rule that suppressed a parameter from the user-visible surface.
        `unknown` is never part of the published vocabulary — it appears on a
        group only when the classifier has drifted from the suppression passes.
      enum:
        - operation_mode
        - week_profile
        - master_gate
        - device_specific
        - ignore_list
        - wildcard_prefix
        - wildcard_suffix
        - hidden
        - channel_restricted
        - event_suppressed
        - internal_flag
        - read_only
        - unknown

    UnIgnoreCandidateGroup:
      type: object
      required: [parameter, paramset, reason, reasons, models, device_count, channel_count]
      properties:
        parameter: { type: string, description: "bare parameter name, e.g. LOW_BAT" }
        label:
          type: string
          description: Localised parameter name; absent when the catalogue has no entry.
        paramset: { type: string, enum: [VALUES, MASTER] }
        reason: { $ref: "#/components/schemas/UnIgnoreReason" }
        reason_detail:
          type: string
          description: >-
            Concrete rule text behind `reason` — the matched name prefix or
            suffix, e.g. "STATUS_FLAG_" or "_STATUS" — so a badge can name the
            rule rather than its category. Absent for reasons whose rule is a
            membership list rather than a pattern.
        reasons:
          type: array
          description: Every rule that matched anywhere in the fleet, in precedence order.
          items: { $ref: "#/components/schemas/UnIgnoreReason" }
        simple_pattern:
          type: string
          description: >-
            Pattern that re-enables the parameter on every device and channel.
            Absent for MASTER, which has no short pattern form.
        models:
          type: array
          items: { $ref: "#/components/schemas/UnIgnoreCandidateModel" }
        device_count: { type: integer, description: "distinct devices carrying the parameter" }
        channel_count: { type: integer, description: "distinct (model, channel) pairs" }

    UnIgnoreCandidateModel:
      type: object
      required: [model, channels, device_count]
      properties:
        model: { type: string, description: "device model, e.g. HmIP-eTRV-2" }
        wildcard_pattern:
          type: string
          description: >-
            Pattern covering every channel of the model
            ("LOW_BAT:VALUES@HmIP-eTRV-2:all"). Absent for MASTER.
        channels:
          type: array
          items: { $ref: "#/components/schemas/UnIgnoreCandidateChannel" }
        device_count: { type: integer }

    UnIgnoreCandidateChannel:
      type: object
      required: [channel, pattern]
      properties:
        channel: { type: integer }
        pattern:
          type: string
          description: Pattern re-enabling the parameter on exactly this model and channel.

    # ─── WebSocket push surface ───────────────────────────────────────
    # The schemas below describe the WebSocket broadcast envelope and
    # each per-event payload. wsapi.json (the WS command catalogue)
    # references the per-event payload schemas by name via the
    # `payload` field on broadcast entries.

    WsEnvelope:
      type: object
      description: |
        Shape of every WebSocket frame the daemon emits. Broadcast
        frames carry the `topic` field; command-reply frames omit
        `topic`. The `type` field is the discriminator that selects
        which payload schema applies — see wsapi.json `commands[?(@.kind=='broadcast')]`
        for the type → payload mapping.

        `seq` is the monotonic cursor a client passes back as
        `since` on its next subscribe to resume the stream after a
        reconnect (see ADR 0022). `kind` tags the event family:
        `initial` for the first observation of a data point,
        `change` for a delta, `refresh` for a periodic re-emit.
        Producers that do not distinguish these cases emit
        `kind: "change"`; clients MUST treat unknown `kind` values
        as `change` for forward-compatibility.
      required: [seq, kind, type, ts, payload]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: |
            Monotonic, daemon-assigned sequence number. Strictly
            increasing across the daemon's lifetime (resets to 0
            on restart). Clients store the last received `seq` and
            reconnect with `{op:"subscribe", topics:[...], since:N}`
            to resume the stream.
        kind:
          type: string
          enum: [initial, change, refresh]
          description: |
            Event-family discriminator. `change` is the default
            and dominant case; `initial` is set on the first
            observation of a data point (e.g. during cold-start
            replay); `refresh` is reserved for periodic re-emits.
        topic:
          type: string
          description: Routing key the client subscribed to. Absent on command replies.
        type:
          type: string
          description: Event-type discriminator (e.g. `datapoint.value_changed`).
        ts:
          type: string
          format: date-time
          description: RFC3339Nano timestamp (UTC) of when the event was emitted.
        payload:
          description: One of the payload schemas listed below.

    DataPointValueChangedPayload:
      type: object
      description: |
        Payload of a `datapoint.value_changed` broadcast. Topic
        pattern `device.{address}.channels.{channel}.data_points.{parameter}`.
      required: [central, device_address, channel, parameter, paramset_key, unique_id, value, available, modified_at]
      properties:
        central: { type: string }
        interface: { type: string }
        device_address: { type: string }
        channel: { type: integer, minimum: 0 }
        parameter: { type: string }
        paramset_key: { type: string, description: "VALUES, MASTER, or LINK" }
        unique_id:
          type: string
          description: |
            Canonical loom-namespaced routing key (`loom_<routing-key>`)
            for this data point. Always present: the daemon owns the key and a
            central emits no events until its CCU serial (the central-id slot of
            the key) is resolved by the bring-up readiness gate, so the value is
            non-empty in normal operation (an empty string would signal an
            unresolved serial). Clients consume it directly instead of rebuilding
            from raw fields; see docs/external-clients/ha-unique-id-migration.md.
        value:
          description: New value in its native CCU type (bool/int/float/string/list/null).
        display_value:
          type: number
          description: |
            `value` expressed in the unit the data point names, i.e.
            `value * multiplier`. Present only when that projection is
            non-trivial; absent means `value` already is the displayable
            number.

            Carries the same meaning as `display_value` on the REST
            data-point summary and must agree with it: a client seeds a
            reading from REST and updates it from here, so a value scaled on
            one plane and raw on the other makes the reading jump on the
            first push. Render `display_value` when present and `value`
            otherwise; writes always carry `value`, which stays the raw CCU
            wire value.
        previous:
          description: |
            Prior value. Omitted when no prior value was tracked (initial
            push). Future revisions may surface a `kind: "initial"|"change"|"refresh"`
            discriminator on the envelope.
        available:
          type: boolean
          description: |
            Whether the new value is a confirmed reading: observed AND valid
            (refreshed, paired `<param>_STATUS` acceptable, value type as
            declared, within the declared bounds). For a calculated data
            point it additionally folds in the validity of every source it
            derives from.

            Carried on the push because it can flip without the value
            changing — a STATUS fault does not move the reading — and
            because the transition *into* a fault usually arrives as a value
            change, so a consumer reading availability only at
            catalogue-refresh time renders the faulted value as confirmed.
            MASTER-paramset entries are always reported available:
            configuration is not a runtime reading.
        modified_at:
          type: string
          format: date-time
          description: RFC3339Nano timestamp the CCU observed the change at.
        category:
          type: string
          description: |
            Model category of the data point (`switch`, `sensor`, …).
            Only sent to clients that subscribed with `classify: true`;
            omitted otherwise.
        data_point_type:
          type: string
          description: |
            North-bound type the category collapses into. Same
            `classify: true` opt-in as `category`.

    CustomDataPointStateChangedPayload:
      type: object
      description: |
        Payload of a `custom_data_point.state_changed` broadcast. Topic
        pattern `device.{address}.cdps.{name}`. Aggregates a CDP's
        composed state (one event per CDP rather than one per wire-DP).
      required: [central, device_address, channel, name, unique_id, state]
      properties:
        central: { type: string }
        device_address: { type: string }
        channel: { type: integer, minimum: 0 }
        name: { type: string }
        kind:
          type: string
          description: "Widget hint matching CustomDPSummary.kind (e.g. `light`, `cover_blind`)."
        unique_id:
          type: string
          description: |
            Canonical loom-namespaced routing key (`loom_<routing-key>`)
            for this custom data point. Always present and non-empty — see
            DataPointValueChangedPayload.unique_id.
        state:
          type: object
          additionalProperties: true
          description: Composed state snapshot — keys depend on the CDP category.

    CentralStateChangedPayload:
      type: object
      description: |
        Payload of a `central.state_changed` broadcast. Topic pattern
        `central.{name}.state`. Reflects CentralUnit lifecycle.
      required: [central, old_state, new_state]
      properties:
        central: { type: string }
        old_state: { type: string }
        new_state: { type: string }

    CentralReadinessChangedPayload:
      type: object
      description: |
        Payload of a `central.readiness_changed` broadcast. Topic pattern
        `central.{name}.readiness`. Reflects a central's readiness-gated
        southbound bring-up phase (waiting_for_ccu -> loading_hub ->
        loading_devices -> ready).
      required: [central, phase, ready, interfaces_loaded, interfaces_total]
      properties:
        central: { type: string }
        phase:
          type: string
          enum: [unknown, waiting_for_ccu, loading_hub, loading_devices, ready]
        ready:
          type: boolean
          description: "True only once southbound bring-up has latched complete (phase == ready)."
        interfaces_loaded: { type: integer, minimum: 0 }
        interfaces_total: { type: integer, minimum: 0 }

    SystemStatusChangedPayload:
      type: object
      description: |
        Payload of a `system.status_changed` broadcast. Topic pattern
        `system.{central}.status`. Surfaces aggregated component
        health, connectivity, callback state, and degraded interface
        list (for the central-scoped system-status ring buffer).
      required: [central, component, healthy, event_at]
      properties:
        central: { type: string }
        component: { type: string }
        healthy: { type: boolean }
        reason: { type: string }
        interface_id: { type: string }
        error_code: { type: integer }
        central_state: { type: string, description: "hmenum.CentralState string form" }
        connection_state: { type: string }
        client_state: { type: string, description: "hmenum.ClientState string form" }
        callback_state: { type: string }
        degraded_interfaces:
          type: array
          items: { type: string }
        issues:
          type: array
          items: { type: string }
        event_at:
          type: string
          format: date-time

    SysvarChangedPayload:
      type: object
      description: |
        Payload of a `hub.sysvar_changed` broadcast. Topic pattern
        `hub.{central}.sysvars.{name}`.
      required: [central, name, unique_id, value]
      properties:
        central: { type: string }
        name: { type: string }
        value_type:
          type: string
          description: "hmenum.HubValueType (BOOL, FLOAT, INTEGER, STRING, …)."
        unique_id:
          type: string
          description: |
            Canonical loom-namespaced routing key
            (`loom_<serial10>_sysvar_<hub-slug>`) for this sysvar. Always
            present and non-empty — see DataPointValueChangedPayload.unique_id.
        value:
          description: New sysvar value in its native CCU type.
        previous:
          description: Prior sysvar value; omitted when no prior value was tracked.
        channel:
          type: string
          description: |
            Canonical channel address ("ADDR:idx") of the device channel
            this sysvar is associated with (explicit CCU assignment or
            name match — the same value the REST SysvarSummary carries).
            Omitted when the sysvar belongs to no device.
        device_address:
          type: string
          description: |
            Device part of `channel` (before the ":"); omitted together
            with `channel`.

    ProgramExecutedPayload:
      type: object
      description: |
        Payload of a `hub.program_executed` broadcast. Topic pattern
        `hub.{central}.programs.{id}`. Fires every time a CCU
        program completes execution (Zentralenprogramm).
      required: [central, program_id, success]
      properties:
        central: { type: string }
        program_id: { type: string }
        trigger:
          type: string
          description: "hmenum.ProgramTrigger (MANUAL, SCHEDULE, EVENT, …)."
        success: { type: boolean }
        unique_id:
          type: string
          description: |
            Canonical loom-namespaced routing key
            (`loom_<serial10>_program_<hub-slug(name)>`) for this program.
            Optional — omitted when the program name cannot be resolved;
            see DataPointValueChangedPayload.unique_id.
        channel:
          type: string
          description: |
            Canonical channel address ("ADDR:idx") of the device channel
            this program is associated with (name match — the same value
            the REST ProgramSummary carries). Omitted when the program
            belongs to no device or is not yet loaded in the hub model.
        device_address:
          type: string
          description: |
            Device part of `channel` (before the ":"); omitted together
            with `channel`.

    ProgramChangedPayload:
      type: object
      description: |
        Payload of a `hub.program_changed` broadcast. Topic pattern
        `hub.{central}.programs.{id}`. Fires when a CCU program's activity
        flag changes — the operator toggled it in the CCU WebUI, or a client
        wrote it.

        A CCU program is two controls: the activity flag decides whether it
        reacts at all, and the execution runs it once. A deactivated program
        refuses the execution, so a client offering "run now" needs this
        transition to render that control unavailable.
      required: [central, program_id, active, execute_available]
      properties:
        central: { type: string }
        program_id: { type: string }
        active:
          type: boolean
          description: The program's activity flag as the CCU reports it.
        execute_available:
          type: boolean
          description: |
            Whether running the program would do anything — false exactly
            while the program is deactivated. Carried alongside `active` so
            the rule is not re-derived per consumer; the same field the REST
            ProgramSummary and the MQTT availability topic carry.
        unique_id:
          type: string
          description: |
            Canonical loom-namespaced routing key
            (`loom_<serial10>_program_<hub-slug(name)>`) for this program.
            Optional — omitted when the program name cannot be resolved;
            see DataPointValueChangedPayload.unique_id.
        channel:
          type: string
          description: |
            Canonical channel address ("ADDR:idx") of the device channel
            this program is associated with. Omitted when the program
            belongs to no device or is not yet loaded in the hub model.
        device_address:
          type: string
          description: |
            Device part of `channel` (before the ":"); omitted together
            with `channel`.

    InstallModeChangedPayload:
      type: object
      description: |
        Payload of a `hub.install_mode_changed` broadcast. Topic pattern
        `hub.{central}.install_mode`. Fires whenever the CCU install-mode
        (pairing window) is toggled on or off.
      required: [central, enabled, remaining_s]
      properties:
        central: { type: string }
        enabled: { type: boolean }
        remaining_s:
          type: integer
          description: Seconds remaining before the pairing window closes; 0 when disabled.

    HubCountChangedPayload:
      type: object
      description: |
        Payload of the `hub.alarm_message`, `hub.service_message` and
        `hub.inbox_changed` broadcasts. Carries the current entry count so
        clients drop their poll loop; the full list is fetched on demand via
        the corresponding REST endpoint.
      required: [central, count]
      properties:
        central: { type: string }
        count: { type: integer }

    HubMetricChangedPayload:
      type: object
      description: |
        Payload of a `hub.metrics_changed` broadcast. Topic pattern
        `hub.{central}.metrics`. Fires when a hub metric is re-observed.
      required: [central, metric, value]
      properties:
        central: { type: string }
        metric:
          type: string
          description: "Metric kind (system_health, connection_latency_ms, last_event_age_seconds)."
        value: { type: number }
        unit:
          type: string
          description: 'Unit string ("%", "ms", "s"); omitted when unitless.'

    HubConnectivityChangedPayload:
      type: object
      description: |
        Payload of a `connectivity.changed` broadcast. Topic pattern
        `hub.{central}.connectivity.{interface_id}`. Fires when per-interface
        reachability flips.
      required: [central, interface_id, reachable]
      properties:
        central: { type: string }
        interface_id:
          type: string
          description: >-
            The interface's wire id `<central>-<interface>` — the same id GET
            /interfaces reports and the REST connectivity data point carries.
        reachable: { type: boolean }
        latency_ms:
          type: number
          description: Probe round-trip in milliseconds; omitted when not measured.

    HubSystemUpdateChangedPayload:
      type: object
      description: |
        Payload of a `hub.system_update_changed` broadcast. Topic pattern
        `hub.{central}.system_update`. Mirrors the `GET /system/update` entry
        so a client can drop its update-status poll loop and consume the same
        fields off the push.
      required: [central, update_available, in_progress]
      properties:
        central: { type: string }
        current_firmware:
          type: string
          description: Installed firmware version; omitted while unobserved.
        available_firmware:
          type: string
          description: Firmware version offered for install; omitted while unobserved.
        update_available: { type: boolean }
        in_progress: { type: boolean }

    AlarmStateChangedPayload:
      type: object
      description: |
        Payload of an `alarm.state_changed` broadcast. Topic
        `alarm.panel`. Fires on every arm-state-machine transition of
        an alarm zone.
      required: [zone_id, zone_name, old_state, new_state]
      properties:
        zone_id: { type: string }
        zone_name: { type: string }
        old_state:
          type: string
          enum: [disarmed, arming, armed, pending, triggered]
        new_state:
          type: string
          enum: [disarmed, arming, armed, pending, triggered]
        mode:
          type: string
          enum: [disarmed, perimeter, full, night, vacation, custom]
          description: Active (or, while arming, target) protection mode.
        changed_by:
          type: string
          description: >-
            Attribution (operator account, keypad identity, code name,
            or an engine-internal actor such as "engine:restore");
            omitted when unattributed.
        source:
          type: string
          description: Surface the action came from (rest, ws, mqtt, hmcli, keypad, engine).
        incident_id:
          type: integer
          format: int64
          description: References the active incident; omitted when none.

    AlarmCountdownPayload:
      type: object
      description: |
        Payload of an `alarm.countdown` broadcast. Topic `alarm.panel`.
        Ticks once per second while an exit or entry delay runs on an
        alarm zone.
      required: [zone_id, kind, remaining_s, total_s, remaining_ms, total_ms]
      properties:
        zone_id: { type: string }
        kind:
          type: string
          enum: [exit_delay, entry_delay]
        remaining_s: { type: integer }
        total_s: { type: integer }
        remaining_ms:
          type: integer
          description: Remaining time in milliseconds (source fidelity).
        total_ms:
          type: integer
          description: Total countdown length in milliseconds.

    AlarmReadinessChangedPayload:
      type: object
      description: |
        Payload of an `alarm.readiness_changed` broadcast. Topic
        `alarm.panel`. Fires when the ready-to-arm computation of an
        zone changes for at least one mode. Carries the full per-mode map,
        not a delta.
      required: [zone_id, readiness]
      properties:
        zone_id: { type: string }
        readiness:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AlarmModeReadiness" }
          description: Per-mode arming readiness, keyed by mode name.

    AlarmNotificationPayload:
      type: object
      description: |
        Payload of an `alarm.notification` broadcast. Topic
        `alarm.panel`. One enrolled notification output fired for an
        alarm — one-shot at fire time, never cancelled by a later
        silence.
      required: [zone_id, output_id, incident_id]
      properties:
        zone_id: { type: string }
        zone_name: { type: string }
        output_id: { type: string }
        output_name: { type: string }
        incident_id: { type: integer, format: int64 }
        mode: { type: string }

    AlarmTriggeredPayload:
      type: object
      description: |
        Payload of an `alarm.triggered` broadcast. Topic `alarm.panel`.
        Fires when an zone enters `triggered` and an incident is
        opened (or re-adopted after a restart / reconnect).
      required: [zone_id, zone_name, incident_id, cause]
      properties:
        zone_id: { type: string }
        zone_name: { type: string }
        incident_id: { type: integer, format: int64 }
        sensor_id:
          type: string
          description: Triggering sensor id; omitted when the cause is not a sensor.
        sensor_name: { type: string }
        cause:
          type: string
          description: Stable machine-readable cause token (sensor, adopted, central_lost, restored).
        mode:
          type: string
          enum: [disarmed, perimeter, full, night, vacation, custom]
          description: >-
            Protection mode that was active at trigger time. `disarmed`
            for an always-on trigger (hazard detector, panic) that fires
            independently of the arm state.

    AlarmPanelEntity:
      type: object
      description: |
        Alarm-control-panel entity projection (model category
        `alarm_control_panel`), identical across REST, WebSocket, and
        MQTT. `zone_id` is `master` for the aggregate panel.
      required: [unique_id, zone_id, name, category, state, available, code_arm_required, code_disarm_required]
      properties:
        unique_id: { type: string }
        zone_id: { type: string }
        name: { type: string }
        category: { type: string }
        state:
          type: string
          enum: [disarmed, arming, pending, triggered, armed_home, armed_away, armed_night, armed_vacation, armed_custom_bypass]
        supported_modes:
          type: array
          items: { type: string }
        available: { type: boolean }
        master: { type: boolean }
        code_arm_required:
          type: boolean
          description: |
            Effective per-zone code requirement for arming: the zone's
            code policy AND an applicable enabled pin code exists —
            exactly the requirement the daemon enforces, so a client
            prompts for a code precisely when one is needed. The master
            aggregate carries `true` when any member zone requires one.
        code_disarm_required:
          type: boolean
          description: |
            Effective per-zone code requirement for disarming; same
            derivation and master aggregation as `code_arm_required`.

    AlarmPanelChangedPayload:
      type: object
      description: |
        Payload of an `alarm.panel_changed` broadcast. Topic
        `alarm.panel`. Fires whenever a panel entity's projection
        changes; `removed` marks a deleted zone's panel.
        `code_arm_required` / `code_disarm_required` mirror the
        `AlarmPanelEntity` flags so live code-policy edits propagate.
      required: [unique_id, zone_id, name, state, available, code_arm_required, code_disarm_required]
      properties:
        unique_id: { type: string }
        zone_id: { type: string }
        name: { type: string }
        state: { type: string }
        available: { type: boolean }
        code_arm_required: { type: boolean }
        code_disarm_required: { type: boolean }
        removed: { type: boolean }

    AlarmReminderPayload:
      type: object
      description: |
        Payload of an `alarm.reminder` broadcast. Topic `alarm.panel`.
        Fires when an arm schedule elapses with auto-arm off while the
        zone is not in the scheduled mode — the engine notifies rather
        than arming.
      required: [zone_id, mode]
      properties:
        zone_id: { type: string }
        zone_name: { type: string }
        mode:
          type: string
          description: The protection mode the schedule expected the zone to be in.

    AlarmJournalAppendedPayload:
      type: object
      description: |
        Payload of an `alarm.journal_appended` broadcast. Topic
        `alarm.panel`. Fires after an alarm-journal entry has been
        persisted; carries the entry head, not the full detail
        document — consumers needing detail call GET /alarm/journal.
      required: [entry_id, class, event]
      properties:
        entry_id: { type: integer, format: int64 }
        zone_id:
          type: string
          description: Omitted for engine-global entries.
        class:
          type: string
          enum: [arm, disarm, trigger, silence, bypass, fault, test, config, maintenance]
        event:
          type: string
          description: Stable machine-readable event token within the class.
        actor:
          type: string
          description: Attribution; omitted when unattributed.
        incident_id:
          type: integer
          format: int64
          description: References the related incident; omitted when none.

    AlarmWalkTestProgressPayload:
      type: object
      description: |
        Payload of an `alarm.walktest_progress` broadcast. Topic
        `alarm.panel`. Fires when a walk-test session records a
        sensor activation.
      required: [zone_id, sensor_id, seen, total]
      properties:
        zone_id: { type: string }
        sensor_id: { type: string }
        sensor_name: { type: string }
        seen:
          type: integer
          description: Number of enrolled sensors that have reported an activation so far this session.
        total:
          type: integer
          description: Total number of sensors enrolled in the walk-test session.

    AlarmHealthChangedPayload:
      type: object
      description: |
        Payload of an `alarm.health_changed` broadcast. Topic
        `alarm.panel`. Fires on alarm-subsystem health transitions
        (siren stop-verification, service degradations).
      required: [healthy, note]
      properties:
        healthy: { type: boolean }
        note:
          type: string
          description: Stable, English machine string describing the transition.

    EntityNameCatalogue:
      type: object
      description: |
        The daemon's entity-naming vocabulary for one locale.
      required: [locale, entries]
      properties:
        locale:
          type: string
          description: |
            The locale that actually answered — the requested one when a
            catalogue exists for it, the daemon's default otherwise. A
            consumer reads it to tell a translation from a fallback.
        entries:
          type: object
          additionalProperties: { type: string }
          description: |
            Catalogue key to name, as authored. A value may carry a
            `{placeholder}` the caller fills.

    SecurityStateChangedPayload:
      type: object
      description: |
        Payload of a `security.state_changed` broadcast. Topic
        `security.state`. Fires when the folded severity of the
        Security & Safety domain changes. It carries the fold only —
        a consumer needing the detail reads GET /security.
      required: [severity, open_faults]
      properties:
        severity:
          type: string
          enum: [ok, info, warning, alarm, critical]
        previous_severity:
          type: string
          enum: [ok, info, warning, alarm, critical]
          description: |
            The severity the fold left. Omitted on the first report
            after start-up, where there is no previous value.
        active_classes:
          type: array
          items:
            type: string
            enum: [smoke, water, gas, co, tamper, battery, technical, intrusion, panic]
          description: The classes contributing to `severity`.
        open_faults:
          type: integer
          description: Standing faults behind the fold.

    SecurityClassChangedPayload:
      type: object
      description: |
        Payload of a `security.class_changed` broadcast. Topic
        `security.state`. Fires when one hazard or fault class goes
        active or inactive — and also when its source set changes
        while it stays active, because a second smoke detector
        joining an existing fire is worth announcing.
      required: [class, active]
      properties:
        class:
          type: string
          enum: [smoke, water, gas, co, tamper, battery, technical, intrusion, panic]
        active: { type: boolean }
        sources:
          type: array
          items: { $ref: '#/components/schemas/AlarmSource' }
        centrals:
          type: array
          items: { type: string }
          description: The centrals contributing active sources.
        since:
          type: string
          format: date-time
          description: |
            When the class entered its current state. Omitted while the
            class is inactive with no recorded transition.

    SecurityZoneChangedPayload:
      type: object
      description: |
        Payload of a `security.zone_changed` broadcast. Topic
        `security.state`. Fires when one alarm zone's security view
        changes. Absent entirely on an installation without an alarm
        engine, where the domain still reports classes and faults.
      required: [zone_id, zone_slug, state]
      properties:
        zone_id: { type: string }
        zone_slug:
          type: string
          description: |
            Frozen at zone creation, so consumer entity ids survive a
            rename — unlike `zone_name`.
        zone_name: { type: string }
        state: { type: string }
        mode: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/AlarmSource' }
        by_class:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: |
            Active source names grouped per class — the per-zone and
            per-class axis in one object rather than a zone-by-class
            matrix of entities.
        incident_id:
          type: integer
          format: int64

    SecurityFaultChangedPayload:
      type: object
      description: |
        Payload of a `security.fault_changed` broadcast. Topic
        `security.faults`. Fires when a fault opens, clears or is
        acknowledged.
      required: [fault_id, class, reason, severity, source, open, acknowledged, open_count]
      properties:
        fault_id: { type: string }
        class:
          type: string
          enum: [smoke, water, gas, co, tamper, battery, technical, intrusion, panic]
        reason:
          type: string
          enum: [unreachable, blocked, device_error, central_lost, duty_cycle, low_battery, tamper]
        severity:
          type: string
          enum: [ok, info, warning, alarm, critical]
        source: { $ref: '#/components/schemas/AlarmSource' }
        open:
          type: boolean
          description: True when the fault was raised, false when it cleared.
        acknowledged:
          type: boolean
          description: |
            Marks an acknowledgement rather than a state change: the
            condition is unchanged, the operator has merely stopped
            needing to be told.
        since:
          type: string
          format: date-time
          description: When the fault opened. Omitted when the ledger records no such occurrence.
        open_count:
          type: integer
          description: Standing fault count after this change, so a count entity needs no second read.

    SecurityNotificationPayload:
      type: object
      description: |
        Payload of a `security.notification` broadcast. Topic
        `security.notifications`. One rendered report — the only
        payload in the domain carrying prose, so a consumer can show a
        sentence without inventing alarm wording, while `i18n_key` and
        `args` let it re-render in its own locale instead.

        A covert report (duress code, silent panic) reaches this
        broadcast only under `alarm.duress_visibility: full`. The
        WebSocket feeds the SPA and every dashboard a browser has open,
        and a hallway tablet showing "duress code entered" while the
        attacker stands next to you defeats the feature the covert
        trigger exists for.
      required: [class, severity, verb, subject, message, i18n_key, at, fault]
      properties:
        class:
          type: string
          enum: [smoke, water, gas, co, tamper, battery, technical, intrusion, panic]
        severity:
          type: string
          enum: [ok, info, warning, alarm, critical]
        verb:
          type: string
          enum: [triggered, pre_alarm, cleared, silenced, failed_to_arm, raised, test]
        subject:
          type: string
          description: One line, at most 120 characters, suitable as a notification title.
        message:
          type: string
          description: A full sentence naming cause, place and time.
        i18n_key:
          type: string
          description: |
            Catalogue key of the message, so a consumer can re-render in
            its own locale instead of translating prose.
        args:
          type: object
          additionalProperties: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/AlarmSource' }
        zone_id: { type: string }
        zone_slug: { type: string }
        zone_name: { type: string }
        mode: { type: string }
        incident_id:
          type: integer
          format: int64
        link: { type: string }
        at:
          type: string
          format: date-time
        fault:
          type: boolean
          description: |
            Marks a fault report rather than a hazard report, so a
            consumer can route the two without inspecting the class.

    TriggeredEventSummary:
      type: object
      description: The most recent event fired within an event group.
      required: [parameter]
      properties:
        parameter:
          type: string
          description: Lowercased parameter name of the source that fired.
        value:
          description: The value carried by the fire; omitted when none.
        triggered_at:
          type: string
          format: date-time
          description: RFC3339 timestamp of the fire.

    EventGroupSummary:
      type: object
      description: |
        Per-Kind aggregation of a channel's keypress / impulse /
        device-error event sources — the bootstrap shape an `event`
        platform builds its entities from.
      required: [channel_address, unique_id, kind, event_types, parameters, available]
      properties:
        channel_address: { type: string }
        kind:
          type: string
          description: 'Short device-trigger flavour ("keypress", "impulse", "device_error").'
        event_types:
          type: array
          items: { type: string }
          description: Lowercased member parameter names (event-type identifiers).
        parameters:
          type: array
          items: { type: string }
          description: Upper-case CCU parameter names of the member sources.
        available: { type: boolean }
        last_triggered_event:
          $ref: "#/components/schemas/TriggeredEventSummary"
        unique_id:
          type: string
          description: |
            Canonical loom routing key for this event group — the same
            value the WS `hub.program_executed`-family event carries for
            event groups. Lets clients build their entity registry from
            the summary without recomputing the key. Always present and non-empty: a central serves no entity until its CCU serial (the central-id slot of the key) is resolved by the bring-up readiness gate.

    HubCountDataPoint:
      type: object
      description: Count-valued hub singleton (alarm / service messages, inbox).
      required: [legacy_name, value]
      properties:
        legacy_name: { type: string }
        value: { type: integer }

    HubUpdateDataPoint:
      type: object
      description: Firmware-update hub singleton.
      required: [legacy_name, update_available, in_progress]
      properties:
        legacy_name: { type: string }
        update_available: { type: boolean }
        in_progress: { type: boolean }

    HubMetricDataPoint:
      type: object
      description: One hub metric with its unit.
      required: [legacy_name, value]
      properties:
        legacy_name: { type: string }
        value: { type: number }
        unit: { type: string }

    HubConnectivityDataPoint:
      type: object
      description: Per-interface reachability hub singleton.
      required: [interface_id, reachable]
      properties:
        interface_id:
          type: string
          description: >-
            The interface's wire id `<central>-<interface>` (e.g.
            `ccu1-HmIP-RF`) — the same id GET /interfaces reports, so a client
            can build its per-interface entities from /interfaces and key this
            value onto them.
        reachable: { type: boolean }

    HubInstallModeDataPoint:
      type: object
      description: Per-interface install-mode hub singleton.
      required: [interface_id, enabled, remaining_s, observed]
      properties:
        interface_id:
          type: string
          description: >-
            The interface's wire id `<central>-<interface>` (e.g.
            `ccu1-HmIP-RF`) — the same id space as
            `HubConnectivityDataPoint.interface_id` and GET /interfaces, so a
            client can build its per-interface entities from /interfaces and key
            this value onto them. (The dedicated GET/POST /install-mode/interfaces
            surface splits the central into a separate field and uses the bare
            interface name instead.)
        enabled: { type: boolean }
        remaining_s:
          type: integer
          description: Seconds left while enabled; 0 when disabled.
        observed:
          type: boolean
          description: False until the first state has been read from the CCU.

    HubDataPoints:
      type: object
      description: |
        Aggregated hub-singleton snapshot for one central (returned by
        `GET /hub/data-points`). Gathers the hub singletons into the
        coordinator shape a client builds its singleton entities from.
      required: [alarm_messages, service_messages, inbox, update, daemon_connection]
      properties:
        central: { type: string }
        alarm_messages: { $ref: "#/components/schemas/HubCountDataPoint" }
        service_messages: { $ref: "#/components/schemas/HubCountDataPoint" }
        inbox: { $ref: "#/components/schemas/HubCountDataPoint" }
        update: { $ref: "#/components/schemas/HubUpdateDataPoint" }
        daemon_connection: { $ref: "#/components/schemas/HubDaemonConnectionDataPoint" }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/HubMetricDataPoint" }
        connectivity:
          type: array
          items: { $ref: "#/components/schemas/HubConnectivityDataPoint" }
        install_mode:
          type: array
          items: { $ref: "#/components/schemas/HubInstallModeDataPoint" }

    HubDaemonConnectionDataPoint:
      type: object
      required: [legacy_name, connected]
      description: >-
        Declares the daemon-liveness singleton: the entity answering "is the
        daemon reachable at all", the counterpart of the MQTT binary sensor
        fed from the retained bridge status.


        `connected` is true in every response this endpoint produces, and
        that is not an oversight — a REST answer is itself proof the daemon
        is running, so no other value can be observed here. The field carries
        the declaration: the singleton's existence and its stable name, which
        a client cannot invent without hard-coding a name the daemon owns.


        The negative state has two sources, both outside this response: the
        `daemon_status.changed` broadcast the daemon sends over the WebSocket
        while stopping (topic `system.daemon_status`), and the client's own
        connection state when the daemon goes away without warning. Wire the
        entity to whichever of the two arrives first.
      properties:
        legacy_name:
          type: string
          description: Stable singleton name; always `daemon_connection`.
        connected: { type: boolean }

    DaemonStatusPayload:
      type: object
      required: [status, event_at]
      description: >-
        Payload of a `daemon_status.changed` broadcast on the daemon-level
        topic `system.daemon_status`. The daemon emits it while shutting
        down, so a WebSocket client can tell "the daemon is stopping" apart
        from "my connection dropped" — a distinction MQTT clients get from
        the broker's last will and WebSocket clients otherwise cannot draw.


        Only a graceful stop can announce itself. A killed process cannot,
        and detecting that stays the client's own job.
      properties:
        status:
          type: string
          enum: [online, offline]
          description: >-
            The same two words the MQTT bridge retains on
            `<base>/bridge/status`, so a client bridging both planes needs no
            translation.
        reason:
          type: string
          description: >-
            Short machine-readable cause of an offline announcement
            (`shutdown`); absent otherwise.
        event_at: { type: string, format: date-time }

    DeviceCreatedPayload:
      type: object
      description: |
        Payload of a `device.created` broadcast. Topic pattern
        `device.{address}.lifecycle`. Fires when a device the daemon
        did not know before is observed in the registry. It is NOT
        sent for the full-inventory announcement the CCU repeats
        after every reconnect — the daemon answers `listDevices` with
        an empty array, so the CCU re-announces everything it has, and
        only an address the device registry does not already hold is
        news. A subscriber may therefore treat this payload as a
        genuine arrival rather than filtering the fleet out of it.
        The `source` field discriminates which path created the entry.
      required: [central, interface_id, device_address, model]
      properties:
        central: { type: string }
        interface_id: { type: string }
        device_address: { type: string }
        model: { type: string }
        source:
          type: string
          description: >-
            Which kind of arrival this is, from
            `hmenum.SourceOfDeviceCreation`: `NEW` a CCU pairing,
            `REFRESH` a factory-reset re-pair (the device kept its
            address but rebuilt its channels), `MANUAL` an operator
            accepting a device out of the deferred-creation inbox,
            `CACHE` a device restored from the persisted description
            cache at boot. `INIT` is defined by the enum but has no
            producer on this broadcast. Treat the set as
            forward-compatible and ignore values you do not know.

    DeviceRemovedPayload:
      type: object
      description: |
        Payload of a `device.removed` broadcast. Topic pattern
        `device.{address}.lifecycle` — same topic as
        `device.created`; subscribers route by the envelope `type`
        field.
      required: [central, interface_id, device_address]
      properties:
        central: { type: string }
        interface_id: { type: string }
        device_address: { type: string }

    DeviceAvailabilityChangedPayload:
      type: object
      description: |
        Payload of a `device.availability_changed` broadcast. Topic
        pattern `device.{address}.lifecycle` — same topic as
        `device.created`; subscribers route by the envelope `type`
        field. Fires when a device's effective reachability flips,
        either because its interface lost the connection to the CCU or
        because the device itself reported UNREACH / STICKY_UNREACH.
        `available` carries the post-transition state and matches the
        `available` field of the device's REST summary.
      required: [central, interface_id, device_address, available]
      properties:
        central: { type: string }
        interface_id: { type: string }
        device_address: { type: string }
        available: { type: boolean }

    DeviceMetadataChangedPayload:
      type: object
      description: |
        Payload of a `device.metadata_changed` broadcast. Topic pattern
        `device.{address}.lifecycle` — the same topic as `device.created`;
        subscribers route by the envelope `type` field. Fires when a device
        or one of its channels is renamed, or its room / function assignment
        changes.

        `device_address` is always the DEVICE address, even when the change
        was made on a channel: a client materialises a device's name and area
        as one unit, so a channel-level change still means "re-read this
        device". The new values are not inlined — re-read the device summary.
      required: [central, interface_id, device_address]
      properties:
        central: { type: string }
        interface_id: { type: string }
        device_address: { type: string }

    ScheduleChangedPayload:
      type: object
      description: |
        Payload of a `schedules.changed` broadcast. Topic pattern
        `device.{address}.lifecycle`, shared with the other device lifecycle
        events; subscribers route by the envelope `type` field. Fires when a
        channel's week profile changes — written through this daemon, or
        observed on the CCU.

        The profile body is deliberately not inlined: a week profile is large
        and most subscribers only need to invalidate and re-read the channel's
        schedule. `channel` is the channel number the profile belongs to.
      required: [central, interface_id, device_address, channel]
      properties:
        central: { type: string }
        interface_id: { type: string }
        device_address: { type: string }
        channel: { type: integer }

    OptimisticRollbackPayload:
      type: object
      description: |
        Payload of a `datapoint.optimistic_rolled_back` broadcast. Rides
        the same `device.{address}.channels.{channel}.data_points.{parameter}`
        topic as `datapoint.value_changed`; subscribers route by the
        envelope `type` field. Fires when an optimistic write is rolled
        back — the CCU never confirmed it within the TTL, or rejected it.
      required: [central, device_address, channel, parameter, paramset_key, unique_id, reason]
      properties:
        central: { type: string }
        device_address: { type: string }
        channel: { type: integer, minimum: 0 }
        parameter: { type: string }
        paramset_key: { type: string, description: "VALUES, MASTER, or LINK" }
        reason: { type: string, description: "Why the optimistic value was rolled back (TTL expiry or CCU rejection)." }
        unique_id:
          type: string
          description: |
            Canonical loom-namespaced routing key (`loom_<routing-key>`)
            for the rolled-back data point; matches the
            `datapoint.value_changed` entity key. Always present and
            non-empty — see DataPointValueChangedPayload.unique_id.
        sent:
          description: The optimistic value that was rolled back. Omitted when not tracked.
        present:
          description: The value the data point reverted to (last CCU-confirmed value). Omitted when not tracked.

    DeviceTriggerPayload:
      type: object
      description: |
        Payload of a `device.trigger` broadcast. Topic pattern
        `device.{address}.channels.{channel}.trigger` — one topic per
        (device, channel). Fires when the CCU reports a non-state device
        event (keypress, impulse, device error). The `event_type` /
        `parameter` fields disambiguate which trigger fired; distinct
        from `datapoint.value_changed`.
      required: [central, interface_id, device_address, channel, event_type, parameter, unique_id]
      properties:
        central: { type: string }
        interface_id: { type: string }
        device_address: { type: string }
        channel: { type: integer, minimum: 0 }
        event_type: { type: string }
        parameter: { type: string }
        unique_id:
          type: string
          description: |
            Canonical loom-namespaced routing key (`loom_<routing-key>`)
            for the data point this trigger fires on; matches the
            `datapoint.value_changed` entity key (a trigger and a value
            change on the same DP route to the same entity). Always present
            and non-empty — see DataPointValueChangedPayload.unique_id.
        value:
          description: Optional value carried by the trigger event in its native CCU type. Omitted when absent.

    # ─── Matter broadcast payloads ────────────────────────────────────
    # The 6 matter.* broadcasts in wsapi.json reference these schemas
    # via their `payload` field. The bridge publishes them through
    # ws.Hub on the documented topics so SPA + external clients can
    # react to commissioning + topology changes without polling.

    MatterCommissioningProgressPayload:
      type: object
      description: |
        Payload of `matter.commissioning_progress`. Free-form progress
        update during a commissioning session (PASE handshake → CASE
        pickup → AddNOC → completion). Fields are intentionally
        sparse — the bridge emits whatever stage information is
        available at the moment.
      required: [stage]
      properties:
        stage: { type: string, description: "Stage label (e.g. `pase_session_open`, `add_noc`, `case_session_first`)." }
        message: { type: string, description: "Human-readable detail; may be empty." }

    MatterFabricRemovedPayload:
      type: object
      description: |
        Payload of `matter.fabric_removed`. Emitted after a fabric is
        revoked via `DELETE /api/v1/matter/fabrics/{id}` or by the
        commissioner cluster command.
      required: [fabric_index]
      properties:
        fabric_index:
          type: integer
          minimum: 1
          maximum: 254
          description: "Stack-assigned fabric index of the removed fabric."

    MatterEndpointAssembledPayload:
      type: object
      description: |
        Payload of `matter.endpoint_assembled`. Fires after the
        bridge's endpoint topology has been reassembled (e.g. after
        an allowlist update). Carries the new endpoint count so the
        SPA can refresh its bridge view without re-fetching the full
        fabric list.
      required: [endpoint_count]
      properties:
        endpoint_count:
          type: integer
          minimum: 0
          description: "Bridged-endpoint count of the assembled topology (excludes the root and Aggregator endpoints)."

    # ─── Wave-C live-edit schemas ─────────────────────────────────────

    SchemaField:
      type: object
      required: [path, class, go_type, restart_required]
      description: Descriptor for one config field exposed by the schema endpoint.
      properties:
        path:
          type: string
          description: Dot-separated field path, e.g. "north.rest.listen".
        class:
          type: string
          enum: [basic, expert, secret]
          description: |
            Visibility class from the cfg struct tag. `basic` fields are
            shown in the default UI view; `expert` requires the expert
            toggle; `secret` values are always redacted in responses.
        go_type:
          type: string
          description: Go type name for the field (e.g. "string", "bool", "int", "time.Duration").
        restart_required:
          type: boolean
          description: Whether changing this field requires a daemon restart to take effect.
        default:
          # No `type` here on purpose: this field's shape follows `go_type`
          # (string, bool, number, …) and an empty schema already admits
          # every type including null — OpenAPI 3.1 has no `nullable` keyword.
          description: |
            The consumer-facing default value for this field, as emitted by
            the schema handler. Type follows the field's `go_type` (string,
            bool, number, …); absent when the field has no documented default.

    SchemaResponse:
      type: object
      required: [sections, fields]
      properties:
        sections:
          type: array
          items: { type: string }
          description: Top-level config section names (e.g. ["logging", "north", "centrals"]).
        fields:
          type: array
          items: { $ref: "#/components/schemas/SchemaField" }

    SurfaceInfo:
      type: object
      required: [id, group, defaults]
      description: One addressable Config-UI surface.
      properties:
        id:
          type: string
          description: |
            Stable identifier. The prefix names the kind: `nav.` for a
            navigation item, `settings.` for a settings tab, `device.`
            for a device-detail tab.
          example: nav.alarm
        group:
          type: string
          description: Editor bucket, mirroring the navigation clusters.
          enum: [overview, automation, diagnose, bridges, system, settings, device]
        defaults:
          type: object
          additionalProperties: { type: boolean }
          description: Shipped visibility per profile name.
          example: { standalone: true, embedded: false }
        floor:
          type: string
          description: |
            Where the surface can never be hidden. Absent when the
            operator may hide it anywhere.
          enum: [always, standalone]
        gate:
          type: string
          description: Runtime capability the surface additionally needs.
          enum: [matter, history]
        warn:
          type: string
          description: |
            Condition under which hiding asks for confirmation. The
            client evaluates the condition; the daemon only declares it.
          enum: [alarm_armed, security_faults, last_ccu_editor]
        warn_profile:
          type: string
          description: Limits `warn` to a single profile when set.
        parent:
          type: string
          description: |
            Surface this one lives inside. A child is never more visible
            than its parent.
        opens:
          type: string
          description: |
            Editor this read-only overview hands off to. While that
            editor is hidden the overview stays — a fleet-wide catalogue
            answers a question the device detail cannot — but its rows
            stop linking into a tab that is not there.
          example: device.configure.schedule
        role_admin:
          type: boolean
          description: Only ever shown to admins, independent of the profile.
        multi_central_visible:
          type: boolean
          description: |
            The embedded default of this surface flips back to visible
            when the daemon serves more than one CCU. A Home Assistant
            config entry addresses one CCU, so on a multi-CCU daemon HA
            cannot own the config surface of the CCUs it has no entry
            for — hiding these would leave their devices without an
            editor anywhere. The `defaults` above already reflect the
            current fleet; this flag only explains why.
        ha_owns:
          type: boolean
          description: Home Assistant provides this surface itself.

    SurfacesResponse:
      type: object
      required:
        [embedded, embedded_scope, inside_ha, profile, profiles, effective, centrals, surfaces]
      properties:
        embedded:
          type: boolean
          description: The master toggle — whether Home Assistant owns this daemon's config surface.
        embedded_scope:
          type: string
          enum: [inside_ha, always]
          description: |
            Where the master toggle applies. `inside_ha` (the default)
            limits the embedded profile to requests that arrive through
            Home Assistant, so a browser pointed straight at this daemon
            keeps the full UI — the duplicate-editor argument that
            motivates hiding does not apply to it. `always` restores the
            daemon-wide behaviour.
        inside_ha:
          type: boolean
          description: |
            Whether THIS request reached the daemon through Home
            Assistant, decided by the Supervisor's `X-Ingress-Path`
            header (the remote proxy add-on forwards it). With the
            default scope it is what selects `profile`, so the same
            configuration answers differently on the other door.
        profile:
          type: string
          enum: [standalone, embedded]
          description: The profile served to this request.
        profiles:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: string, enum: [visible, hidden] }
          description: Stored, sparse overrides per profile name.
        effective:
          type: object
          additionalProperties: { type: boolean }
          description: |
            Resolved visibility of the live profile, per surface id.
            Capability and role gates are not folded in.
        centrals:
          type: integer
          description: |
            How many CCUs this daemon serves. Above one it moves the
            shipped default of every surface marked
            `multi_central_visible`, so the editor needs it to explain
            why a default reads differently here than in the docs.
        surfaces:
          type: array
          items: { $ref: "#/components/schemas/SurfaceInfo" }

    SurfacesRequest:
      type: object
      description: |
        Every field is optional. Omitting `profiles` leaves the stored
        overrides untouched; omitting `embedded` or `embedded_scope`
        leaves the mode as it is.
      properties:
        embedded:
          type: boolean
          description: Flip the master toggle.
        embedded_scope:
          type: string
          enum: [inside_ha, always]
          description: |
            Move where the master toggle applies. An unrecognised value
            is rejected rather than falling back to the default — a typo
            would otherwise keep hiding views on direct access, which is
            what the operator was switching off.
        profiles:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: string, enum: [visible, hidden] }
          description: |
            Full desired override set per profile. The daemon reduces it
            to the sparse form before persisting.

    ConfigSnapshotResponse:
      type: object
      required: [config, sources]
      description: |
        Effective merged configuration with secret fields redacted and
        per-path source annotations.
      properties:
        config:
          type: object
          additionalProperties: true
          description: |
            Full effective config tree with secret fields replaced by
            "***". Shape mirrors the daemon's Config struct.
        sources:
          type: object
          additionalProperties:
            type: string
            enum: [bootstrap, db, env, default]
          description: |
            Map from dot-separated config path to the layer that supplied
            the value. Known layers: bootstrap (YAML file), db (SQLite),
            env (environment variable), default (hardcoded default).

    UserCreate:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          description: Login name; must be unique.
        password:
          type: string
          description: Plaintext password; the daemon hashes it before storage.
        role:
          type: string
          enum: [viewer, operator, admin]

    UserUpdate:
      type: object
      description: All fields optional; omitted fields leave the user unchanged.
      properties:
        password:
          type: string
          description: New plaintext password. Omit to leave unchanged.
        role:
          type: string
          enum: [viewer, operator, admin]
          description: New role. Omit to leave unchanged.

    UserSummary:
      type: object
      required: [subject, role, created_at]
      properties:
        subject:
          type: string
          description: Login name / stable identity key.
        role:
          type: string
          enum: [viewer, operator, admin]
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: Last successful authentication time. Absent when never authenticated.

    TokenCreate:
      type: object
      required: [subject, role]
      properties:
        subject:
          type: string
          description: Logical owner of the token (e.g. "homeassistant", "ci-runner").
        role:
          type: string
          enum: [viewer, operator, admin]
        expires_in_days:
          type: integer
          minimum: 1
          description: |
            Optional token lifetime in days. When set and positive, the token
            is rejected after this many days. Omitted or non-positive creates a
            token that never expires.

    TokenCreated:
      type: object
      required: [token, fingerprint]
      description: |
        Returned by `POST /auth/tokens/v2`. The `token` field carries the
        raw secret and is exposed exactly once on creation.
      properties:
        token:
          type: string
          description: Raw bearer token. URL-safe base64. Shown EXACTLY ONCE — store it immediately.
        fingerprint:
          type: string
          description: Stable opaque identifier derived from the token (sha256-based).
        expires_at:
          type: string
          format: date-time
          description: Expiry instant. Absent when the token never expires.

    TokenSummary:
      type: object
      required: [fingerprint, subject, role, created_at]
      properties:
        fingerprint:
          type: string
          description: Stable opaque identifier used as the delete key.
        subject:
          type: string
        role:
          type: string
          enum: [viewer, operator, admin]
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: Last successful authentication time. Absent when never used.
        expires_at:
          type: string
          format: date-time
          description: Expiry instant. Absent when the token never expires.

    InterfaceSpec:
      type: object
      required: [name]
      description: One Homematic interface attached to a central.
      properties:
        name:
          type: string
          description: Homematic interface identifier, e.g. "HmIP-RF", "BidCos-RF", "CUxD".
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: Overrides the default XML-RPC/BIN-RPC port. 0 or absent means "use backend default".
        remote_path:
          type: string
          description: >
            URL path override for XML-RPC requests, for a CCU reached through a
            reverse proxy that exposes it elsewhere. Must be an absolute path on
            the configured host: it may not be the bare "/", may not start with
            "//", and may not carry a scheme, a query, a fragment or a ".."
            segment. Empty means "use backend default" ("/RPC2", "/groups" for
            VirtualDevices).
        rpc_type:
          type: string
          enum: ["", xmlrpc, binrpc, jsonrpc]
          description: >
            Restates the transport the interface name already implies (CUxD is
            binrpc, every other interface xmlrpc). The transport is not selectable
            per interface: a value contradicting the derived one is rejected at
            config load. Empty means "derive from interface name". `jsonrpc` is
            accepted by the schema for compatibility but names no transport the
            daemon can drive, so it is rejected at config load like any other
            contradiction.

    VisibilityConfig:
      type: object
      description: Per-central visibility overrides.
      properties:
        un_ignore:
          type: array
          items: { type: string }
          description: |
            MODEL:CHANNEL:PARAMETER patterns (with `*` wildcards) that
            promote parameters from the default-hidden set into the
            visible data-point surface. Bare parameter names are
            treated as *:*:PARAMETER.

    CentralRow:
      type: object
      required: [name, host, interfaces, enabled]
      description: One CCU connection record persisted in the centrals store.
      properties:
        name:
          type: string
          description: |
            Daemon-local identifier; must be unique. This is the
            canonical central-scope discriminator: guaranteed equal to
            `SystemCCUEntry.name` and to the `central` field in
            WS / payload envelopes (`name == SystemCCUEntry.name ==
            payload.central`). Changing it re-scopes every per-central
            request, subscription and payload for this CCU.
        host:
          type: string
          description: >-
            CCU hostname or IP address. Present but empty on the two read
            operations when the caller is below the admin role; the sibling
            connection fields are omitted outright there.
        serial:
          type: string
          description: >-
            CCU hardware serial, set when the central is adopted from SSDP/UPnP
            discovery. Empty for YAML / manually-entered rows. Lets discovery
            mark a CCU "already configured" by serial regardless of its host.
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: Legacy single-port override applied to all interfaces when ports map is absent.
        json_rpc_port:
          type: integer
          minimum: 0
          maximum: 65535
          description: HTTP port for JSON-RPC and web endpoints. 0 defaults to 80 (plain) / 443 (TLS).
        username:
          type: string
        password_env:
          type: string
          description: Environment variable name whose value is the CCU password (preferred).
        password_plain:
          type: string
          description: |
            Plaintext password fallback. Only populated when
            allow_plaintext_secrets is enabled.
        tls:
          type: boolean
        tls_insecure_skip_verify:
          type: boolean
        primary_interface:
          type: string
          description: Pins the primary interface for health aggregation. Empty uses the HmIP-RF heuristic.
        interfaces:
          type: array
          items: { $ref: "#/components/schemas/InterfaceSpec" }
          description: At least one interface must be listed.
        ports:
          type: object
          additionalProperties: { type: integer }
          description: Per-interface port overrides; keys are interface name strings.
        visibility:
          $ref: "#/components/schemas/VisibilityConfig"
        behavior:
          $ref: "#/components/schemas/CentralBehavior"
        enabled:
          type: boolean
          description: Whether the daemon should connect to this CCU at startup.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CentralBehavior:
      type: object
      description: |
        Per-central behaviour toggles. Every field is optional; an
        omitted field means the daemon default shown below. Mirrors the
        reference stack's per-central config knobs.
      properties:
        light_last_brightness:
          type: boolean
          description: "Restore last non-zero brightness on a plain light turn-on (default true); false turns on at full."
        use_group_channel_for_cover_state:
          type: boolean
          description: "Report cover position from the group channel when present (default true)."
        enable_sysvar_scan:
          type: boolean
          description: "Scan system variables into the hub layer (default true)."
        enable_program_scan:
          type: boolean
          description: "Scan programs into the hub layer (default true)."
        include_internal_sysvars:
          type: boolean
          description: "Include CCU-internal system variables (default true)."
        include_internal_programs:
          type: boolean
          description: "Include CCU-internal programs (default false)."
        sysvar_markers:
          type: array
          items: { type: string, enum: [HAHM, HX, INTERNAL, MQTT] }
          description: "Restrict the sysvar scan to entities whose CCU description starts with one of these markers. Empty includes everything that passes the internal filter."
        program_markers:
          type: array
          items: { type: string, enum: [HAHM, HX, INTERNAL, MQTT] }
          description: "Program-scan equivalent of sysvar_markers."
        sysvar_scan_interval:
          type: integer
          format: int64
          description: "Periodic sysvar-refresh cadence as a Go time.Duration (nanoseconds). 0 = compiled-in default (5m)."
        enable_device_firmware_check:
          type: boolean
          description: "Surface per-device firmware-update entities (default true — a deliberate divergence from the reference stack's false default)."
        delay_new_device_creation:
          type: boolean
          description: "Defer ingest of a newly-paired device to the inbox/manual-accept flow (default false)."

    # ---- Schedules / week profiles ----
    ScheduleDeviceSummary:
      type: object
      required: [central, address, name, channel, kind]
      description: One device that carries a week schedule.
      properties:
        central:
          type: string
          description: The CCU this device belongs to.
        address:
          type: string
          description: Device address.
        name:
          type: string
          description: Display name.
        model:
          type: string
          description: Device type, e.g. "HmIP-eTRV-2".
        channel:
          $ref: "#/components/schemas/ScheduleChannelRef"
        kind:
          type: string
          enum: [week_profile, climate]
          description: |
            `week_profile` when a dedicated channel carries the profile,
            `climate` when a thermostat carries it in MASTER.

    ScheduleChannelRef:
      type: object
      required: [address, number, device_address]
      description: Identifies the channel a schedule belongs to.
      properties:
        address: { type: string }
        number: { type: integer }
        device_address: { type: string }
    ClimatePeriod:
      type: object
      required: [start_time, end_time, temperature]
      description: One heating period inside a climate weekday program.
      properties:
        start_time: { type: string, description: "HH:MM start of the period." }
        end_time: { type: string, description: "HH:MM end of the period." }
        temperature: { type: number, description: Setpoint for the period. }
    ClimateWeekday:
      type: object
      required: [base_temperature, periods]
      description: A single weekday of a climate profile.
      properties:
        base_temperature: { type: number }
        periods:
          type: array
          items: { $ref: "#/components/schemas/ClimatePeriod" }
    ClimateProfile:
      type: object
      required: [weekdays]
      description: One climate profile (P1..P6), keyed by weekday name.
      properties:
        weekdays:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ClimateWeekday" }
    SimpleScheduleEntry:
      type: object
      required: [slot_no, weekdays, time, level]
      description: One slot of a non-climate (switch/dimmer/astro) weekly program.
      properties:
        slot_no:
          type: integer
          minimum: 1
          maximum: 75
          description: >
            Slot this entry occupies, preserved so a partial update leaves
            unrelated slots intact. A given channel declares fewer slots
            (69 or 75 in the field) and that is the real bound — a slot the
            channel's MASTER paramset does not contain cannot be written.
        weekdays:
          type: array
          items: { type: string }
        time: { type: string }
        condition: { type: string }
        astro_type: { type: string }
        astro_offset_minutes: { type: integer }
        target_channels:
          type: array
          items: { type: string }
        level: { type: number }
        level_2: { type: number }
        duration:
          type: string
          description: >
            Auto-revert time, as a whole number and a unit — "500ms", "10s",
            "65s", "5min", "1h". The value is exact: the CCU stores a
            (time base, factor) pair, and the string carries the factor
            multiplied out in that base's own unit rather than rounded to a
            larger one, so a 65-second slot reads "65s" and not "1min".
            Empty when the slot carries no duration.
        ramp_time:
          type: string
          description: >
            Dimmer ramp time, same format and exactness rule as `duration`.
        lock_mode: { type: string }
        lock_action: { type: string }
        permission: { type: string }
        color_type:
          type: integer
          description: >
            Universal-light colour discriminator (0 hue/saturation,
            1 colour temperature, 2 effect). Opaque; carried verbatim for
            a lossless round-trip. Absent on non-colour devices.
        color_value:
          type: integer
          description: >
            Packed 20-bit colour/effect value; opaque. 0 is legitimate and
            is always round-tripped.
        output_behaviour:
          type: integer
          description: HmIP-BSL signal-LED behaviour, opaque.
    Schedule:
      type: object
      required: [channel, kind]
      description: |
        Unified schedule DTO. ``kind`` is ``climate`` (thermostat
        week-program, carried in ``profiles``) or ``simple`` (switch /
        dimmer / astro program, carried in ``simple_entries``).
      properties:
        channel:
          $ref: "#/components/schemas/ScheduleChannelRef"
        kind: { type: string, enum: [climate, simple] }
        domain: { type: string }
        active_profile: { type: string }
        active_profile_index: { type: integer }
        profiles:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ClimateProfile" }
        simple_entries:
          type: array
          items: { $ref: "#/components/schemas/SimpleScheduleEntry" }
        color_capable:
          type: boolean
          description: >
            True when the device exposes per-switch-point colour/effect
            fields (universal lights) or an OUTPUT_BEHAVIOUR field
            (HmIP-BSL). The SPA shows a colour summary only when set.
    SetActiveProfileRequest:
      type: object
      required: [profile]
      description: Selects the active climate profile (P1..P6).
      properties:
        profile: { type: string }
    CopyScheduleRequest:
      type: object
      required: [target_device_address]
      description: |
        Copy the whole week schedule from the path device to the named
        target device. Both schedule channels are auto-resolved.
      properties:
        target_device_address: { type: string }
    CopyProfileRequest:
      type: object
      required: [source_profile, target_channel_address, target_profile]
      description: |
        Copy a single climate profile from the path channel/source_profile
        to the named target channel/target_profile.
      properties:
        source_profile: { type: integer, minimum: 1, maximum: 6 }
        target_channel_address: { type: string }
        target_profile: { type: integer, minimum: 1, maximum: 6 }
    WeekProfileResponse:
      type: object
      required: [address, unique_id, schedule_type, min_temp, max_temp, profile_count, has_climate_schedule]
      description: Week-profile descriptor for a thermostat channel.
      properties:
        address: { type: string }
        unique_id:
          type: string
          description: |
            Canonical loom-namespaced routing key for the device-level
            week-profile sensor entity
            (`loom_week_profile_<device-addr>_week_profile`), built over the
            owning device address + parameter "WEEK_PROFILE" + prefix
            "week_profile". Bit-identical to the client-synthesised key so the
            client consumes it instead of recomputing it. Always present and
            non-empty (the serial-readiness gate guarantees the central-id slot).
        schedule_type: { type: string, enum: [default, climate] }
        min_temp: { type: number }
        max_temp: { type: number }
        profile_count: { type: integer }
        current_profile: { type: string }
        available_profiles:
          type: array
          items: { type: string }
        schedule_enabled:
          type: object
          additionalProperties: { type: boolean }
        available_target_channels:
          type: object
          description: >-
            Maps each channel-lock key (e.g. "1_1") to the actuator channel it
            controls, so a per-channel schedule switch can be named after that
            channel without re-deriving the channel-group layout.
          additionalProperties:
            $ref: '#/components/schemas/TargetChannelSummary'
        has_climate_schedule: { type: boolean }

    TargetChannelSummary:
      type: object
      required: [channel_no, channel_address, name, channel_type, unique_id]
      description: Schedule-controllable target channel a channel-lock key maps to.
      properties:
        channel_no: { type: integer }
        channel_address: { type: string }
        name: { type: string }
        channel_type: { type: string, enum: [primary, secondary] }
        unique_id:
          type: string
          description: |
            Canonical loom-namespaced routing key for the schedule-channel-switch
            entity this target maps to
            (`loom_schedule_channel_switch_<device-addr>_schedule_channel_lock_<channel_key>`),
            built over the owning device address + parameter
            "SCHEDULE_CHANNEL_LOCK_<channel_key>" (the map key, e.g. "1_1") +
            prefix "schedule_channel_switch". Bit-identical to the
            client-synthesised key; always present and non-empty.

    # ---- Direct + central links ----
    Link:
      type: object
      required: [sender_address, receiver_address, peer_address, direction]
      description: One direct link (sender → receiver peering) of a device.
      properties:
        sender_address: { type: string }
        receiver_address: { type: string }
        name: { type: string }
        description: { type: string }
        flags: { type: integer }
        sender_device_name: { type: string }
        sender_device_model: { type: string }
        sender_channel_type: { type: string }
        sender_channel_type_label: { type: string }
        sender_channel_name: { type: string }
        receiver_device_name: { type: string }
        receiver_device_model: { type: string }
        receiver_channel_type: { type: string }
        receiver_channel_type_label: { type: string }
        receiver_channel_name: { type: string }
        peer_address: { type: string }
        peer_device_name: { type: string }
        peer_device_model: { type: string }
        direction: { type: string }
        central_name:
          type: string
          description: >
            Owning central. Populated only by the global overview
            (`GET /links`); empty on the per-device listing.
        interface_id:
          type: string
          description: >
            Owning interface (wire interface id). Populated only by the
            global overview (`GET /links`); empty on the per-device
            listing.
    DiagramConfig:
      type: object
      required: [id, name, visibility, owner, config, created_at_ms, updated_at_ms]
      description: A named multi-series diagram definition (SV03).
      properties:
        id: { type: string }
        name: { type: string }
        visibility: { type: string, enum: [private, shared] }
        owner: { type: string, description: Owner subject. }
        config:
          type: object
          description: >
            SPA-owned diagram document (series list + default range). Opaque
            to the daemon except a non-empty central per series.
        created_at_ms: { type: integer, format: int64 }
        updated_at_ms: { type: integer, format: int64 }
    DiagramWriteRequest:
      type: object
      required: [name]
      description: Create or update a diagram definition.
      properties:
        name: { type: string }
        visibility:
          type: string
          enum: [private, shared]
          description: Defaults to private.
        config:
          type: object
          description: SPA-owned diagram document (series list + default range).
    AddLinkRequest:
      type: object
      required: [sender_address, receiver_address]
      description: Create a direct link between a sender and a receiver channel.
      properties:
        sender_address: { type: string }
        receiver_address: { type: string }
        name: { type: string }
        description: { type: string }
    TestLinkAtDeviceRequest:
      type: object
      required: [receiver_address, sender_address]
      description: >
        Trigger the receiver's LINK paramset for the sender (test link /
        simulate keypress). Physically actuates the receiver.
      properties:
        receiver_address: { type: string }
        sender_address: { type: string }
        long_press:
          type: boolean
          description: Select the LONG_* action group instead of SHORT_*. Default false.
    UpdateLinkRequest:
      type: object
      required: [sender_address, receiver_address]
      description: >-
        Change the name and/or description of an existing direct link. The
        two channel addresses identify the link; name and description are
        written verbatim, so an empty string clears that field on the CCU.
      properties:
        sender_address: { type: string }
        receiver_address: { type: string }
        name: { type: string }
        description: { type: string }
    CentralLinksStatus:
      type: object
      required: [supported]
      description: PRESS-event (central click) forwarding status for a device.
      properties:
        supported: { type: boolean }
        reason: { type: string }
        eligible_channels: { type: integer }
        channels:
          type: array
          description: |
            Per-channel suitability for central click-event routing. One
            entry per eligible (press-event) channel, letting clients
            offer a per-channel toggle alongside the device-wide one.
          items: { $ref: "#/components/schemas/CentralLinksChannelStatus" }
        active_state_known:
          type: boolean
          description: |
            True when the daemon could read the CCU-side report-value-usage
            metadata, so each channel's `active` flag reflects the live CCU
            state. False when the backend has no metadata read path (or the
            read failed device-wide); clients then show eligibility only,
            without an active/inactive indicator.
        active_channels:
          type: integer
          description: |
            Count of eligible channels whose central link is currently
            active. Only meaningful when `active_state_known` is true.

    CentralLinksChannelStatus:
      type: object
      required: [address, number, eligible]
      description: One channel's suitability for central click-event routing.
      properties:
        address: { type: string }
        number: { type: integer }
        eligible: { type: boolean }
        active:
          type: boolean
          description: |
            True when the CCU's report-value-usage counter for the channel is
            currently raised (a central link exists). Only meaningful when the
            enclosing status has `active_state_known` set.

    # ---- Calculated data points ----
    CalculatedDPSummary:
      type: object
      required: [name, unique_id, value, observed, available]
      description: A derived/calculated data point on a channel.
      properties:
        name: { type: string }
        category: { type: string }
        value: {}
        observed: { type: boolean }
        available:
          type: boolean
          description: |
            Whether the value is a confirmed reading — observed AND valid,
            the same rule the generic data-point state payload applies.
            For a calculated data point validity folds in the validity of
            every source it derives from: a source the CCU flagged (bad
            paired STATUS, reading outside the declared bounds) makes the
            calculated data point unavailable even though the derived
            number keeps updating. Clients that restore a previous state
            for unavailable entities must read this flag; `observed` stays
            true across a source fault.
        translated_name:
          type: string
          description: |
            Locale-aware per-entity name, resolved through the same
            chain as generic data points (channel-typed translation →
            bare-parameter translation → title-cased parameter). Lets
            clients spawn calculated/combined entities with the same
            names the reference stack generates.
        modified_at: { type: string, format: date-time }
        unique_id:
          type: string
          description: |
            Canonical loom routing key for this calculated data point —
            the same canonical key generic data points carry. Lets
            clients build their entity registry from the summary without
            recomputing the key. Always present and non-empty: a central serves no entity until its CCU serial (the central-id slot of the key) is resolved by the bring-up readiness gate.
    CalculatedDPDetail:
      allOf:
        - $ref: "#/components/schemas/CalculatedDPSummary"
        - type: object
          properties:
            depends_on:
              type: array
              items: { type: string }

    BackupEntry:
      type: object
      required: [id, central, bytes, created_at]
      description: One entry in the backup list.
      properties:
        id: { type: string }
        central: { type: string }
        bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        filename:
          type: string
          description: >-
            The archive's name in the CCU's own convention,
            `<hostname>-<CCU firmware version>-<YYYY-MM-DD-HHMM>.sbk`,
            recorded when the archive was taken. This is what the download
            is served as; show or store this rather than rebuilding a name,
            because the id is a storage key and carries no firmware version.
            Absent for archives taken before this field existed, or when the
            CCU had not reported its system information yet — fall back to
            `<id>.sbk`.

    BackupStorageInfo:
      type: object
      required: [available, count, bytes]
      description: >-
        Where the daemon keeps the CCU archives it downloads, and what is
        currently there. The directory is not derivable by a client: it comes
        from `backup.dir`, which is empty in the common case (the daemon then
        falls back to `<data_dir>/backups`), and on a CCU add-on install the
        service script sets it from the CCU's own backup target, which varies
        per installation.
      properties:
        dir:
          type: string
          description: >-
            Absolute path the archives are read from and written to. Absent
            when no storage is configured, or when the storage backend has no
            location to report.
        available:
          type: boolean
          description: >-
            Whether a storage backend is wired at all. False means the daemon
            could not create its archive directory (read-only mount, missing
            permissions) — the backup list is then empty for a reason that has
            nothing to do with the CCU.
        count: { type: integer }
        bytes: { type: integer, format: int64 }

    EditSessionRequest:
      type: object
      required: [key]
      description: >-
        Identifies a live edit session on the heartbeat and close routes.
        The token is what proves ownership; a request that omits it is
        accepted syntactically but cannot refresh or release the lock.
      properties:
        key: { type: string }
        token: { type: string }

    EditSessionResponse:
      type: object
      required: [token, key, expires]
      description: Lock state returned on open and heartbeat.
      properties:
        token: { type: string }
        key: { type: string }
        subject: { type: string }
        expires: { type: string, format: date-time }

    FunctionEntry:
      type: object
      required: [name, device_count]
      description: One row in GET /api/v1/functions.
      properties:
        name: { type: string }
        device_count: { type: integer }

    Incident:
      type: object
      required: [id, when, component, severity, summary]
      description: One diagnostic entry surfaced at /incidents.
      properties:
        id: { type: string }
        when: { type: string, format: date-time }
        component: { type: string }
        severity: { type: string }
        summary: { type: string }
        detail: { type: string }

    InboxDevice:
      type: object
      required: [address, model]
      description: One pending-pairing candidate in GET /api/v1/inbox.
      properties:
        central: { type: string, description: CCU that reported this pending device. }
        address: { type: string }
        model: { type: string }
        interface:
          type: string
          description: |
            CCU interface the device was detected through. The SPA hides
            the "replace existing device" action for HmIP interfaces,
            which do not support the swap.
        serial: { type: string }
        manufacturer: { type: string }
        first_seen: { type: integer, format: int64 }
        pending_creation:
          type: boolean
          description: |
            True when the daemon itself is holding the device back:
            with `central.behavior.delay_new_device_creation` enabled the
            announced descriptions are parked until an operator accepts
            them, so the device exists on the CCU but has no data points
            here yet. Accepting it (POST /devices/{addr}/accept) also
            materialises it.

    ReplaceCandidate:
      type: object
      required: [address, model_matches]
      description: |
        One already-paired device a new (inbox) device may replace,
        returned by GET /devices/{addr}/replace-candidates.
      properties:
        address: { type: string }
        name: { type: string }
        model: { type: string }
        interface: { type: string }
        central: { type: string }
        model_matches:
          type: boolean
          description: True when the candidate's model equals the new device's (an exact swap rather than a compatible cross-type one).

    TeamCandidate:
      type: object
      required: [address, current]
      description: |
        One team channel a device channel may be assigned to, returned by
        GET /devices/{addr}/channels/{no}/team-candidates.
      properties:
        address: { type: string }
        name: { type: string }
        team_tag: { type: string }
        current:
          type: boolean
          description: True when this channel is the target channel's currently-assigned team.

    CommunicationTestResult:
      type: object
      required: [passed, started_at, duration_ms, timed_out]
      description: |
        Outcome of a per-device communication / function test
        (POST /devices/{addr}/test).
      properties:
        passed:
          type: boolean
          description: True when the device answered the radio test frame within the poll window.
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
        timed_out:
          type: boolean
          description: True when the poll window elapsed before the device answered.

    LinkableChannel:
      type: object
      required: [address, device_address]
      description: One candidate returned by GET /channels/{no}/linkable-channels.
      properties:
        address: { type: string }
        channel_type: { type: string }
        channel_type_label: { type: string }
        channel_name: { type: string }
        device_address: { type: string }
        device_name: { type: string }
        device_model: { type: string }

    LogRecord:
      type: object
      required: [seq, time, level, msg]
      description: One structured log line in the live-log ring.
      properties:
        seq: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        level: { type: string }
        logger: { type: string }
        msg: { type: string }
        attrs: { type: object, additionalProperties: true }

    RPCRecordingStatus:
      type: object
      required: [central, active, entries]
      description: One central's RPC recorder status.
      properties:
        central: { type: string }
        active: { type: boolean }
        entries: { type: integer }
        ends_at: { type: string }
        randomize: { type: boolean }

    RoomEntry:
      type: object
      required: [name, device_count]
      description: One row in GET /api/v1/rooms.
      properties:
        name: { type: string }
        device_count: { type: integer }

    AddonUpdateStatus:
      type: object
      required: [supported, current_version, state]
      description: >-
        Self-update status of the daemon's CCU add-on package. supported
        is false when the platform lacks the firmware installer; every
        other field is then zero-valued.
      properties:
        supported:
          type: boolean
          description: Platform can self-install (add-on build + firmware installer present).
        current_version: { type: string }
        latest_version:
          type: string
          description: Newest published release; empty before the first successful check.
        update_available: { type: boolean }
        release_url:
          type: string
          description: Release-notes page of the latest version.
        last_check:
          type: string
          format: date-time
          description: Time of the last successful check; absent before the first.
        state:
          type: string
          enum: [idle, checking, downloading, installing, failed]
          description: >-
            Lifecycle of the updater. `installing` is terminal from the
            caller's perspective — the daemon restarts on success.
        error:
          type: string
          description: Failure detail while state is `failed`.

    Area:
      type: object
      required: [id, name]
      description: >-
        Operator-defined room grouping above CCU rooms (a floor, a shed,
        a terrace roof). Distinct from alarm zones. Rooms are (central,
        room) pairs; one area per room.
      properties:
        id:
          type: string
          description: Server-generated on create; ignored in the create body.
        name: { type: string }
        position:
          type: integer
          description: Manual sort order (ascending), ties by name.
        rooms:
          type: array
          description: Assigned rooms; read-only here (replace via PUT /areas/{id}/rooms).
          items: { $ref: "#/components/schemas/AreaRoomRef" }

    AreaRoomRef:
      type: object
      required: [central, room]
      description: One CCU room assignment of an area.
      properties:
        central: { type: string, description: Central (CCU) name owning the room. }
        room: { type: string, description: CCU room name on that central. }

    AlarmZoneConfig:
      type: object
      additionalProperties: true
      description: >-
        Free-form, engine-owned document describing an alarm zone's
        arming modes and per-mode policy (entry/exit delays, output
        policy, post-trigger policy, central-loss policy, blocker
        policies). The REST and
        WebSocket layers pass this document through unvalidated; the
        alarm engine is the sole owner of its schema and versioning.

    AlarmZone:
      type: object
      required: [id, name]
      description: >-
        One alarm zone — an independently armable partition with its
        own arm state, sensor set, and output set.
      properties:
        id: { type: string }
        name: { type: string }
        position:
          type: integer
          description: Display ordering hint for the SPA zone list.
        config:
          $ref: "#/components/schemas/AlarmZoneConfig"

    AlarmZoneCreate:
      type: object
      required: [name]
      description: >-
        Request body of POST /alarm/zones. Unlike [AlarmZone], `id` is not
        required: the server always mints its own id
        (uuid.NewString()) and ignores one sent in the body, so a
        REST-conventional client that omits it is not rejected before the
        handler ever runs.
      properties:
        name: { type: string }
        position:
          type: integer
          description: Display ordering hint for the SPA zone list.
        config:
          $ref: "#/components/schemas/AlarmZoneConfig"

    AlarmSensor:
      type: object
      required: [id, central, interface_id, channel_address, parameter, type]
      description: >-
        One CCU data point enrolled into an alarm zone as a sensor
        input (door/window contact, motion, tamper, hazard, panic).
      properties:
        id: { type: string }
        central: { type: string, description: Owning CCU (central name). }
        interface_id: { type: string }
        channel_address: { type: string }
        parameter: { type: string }
        type:
          type: string
          enum: [door, window, motion, tamper, hazard, panic]
          description: Sensor role; presets the mode matrix and behaviour flags.
        name: { type: string }
        config:
          type: object
          additionalProperties: true
          description: >-
            Engine-owned per-sensor configuration document (mode
            matrix, entry-delay flag, bypass eligibility, …).

    AlarmOutput:
      type: object
      required: [id, class, central, channel_address]
      description: >-
        One CCU actuator enrolled into an alarm zone as an alarm
        consequence — siren, switched siren, smoke-detector sounder,
        alarm light, chirp emitter, notification target, or sysvar
        mirror.
      properties:
        id: { type: string }
        class:
          type: string
          enum:
            - acoustic_siren
            - switched_siren
            - smoke_sounder
            - optical_siren
            - alarm_light
            - chirp
            - notification
            - sysvar_mirror
          description: >-
            Output driver class. The class, not the backing device
            type, decides which safety invariants apply.
        central: { type: string, description: Owning CCU (central name). }
        channel_address: { type: string }
        name: { type: string }
        config:
          type: object
          additionalProperties: true
          description: >-
            Engine-owned per-output configuration document (per-mode
            assignment, indoor/outdoor flag, duration/tone, …).

    AlarmOutputCandidate:
      type: object
      required: [central, device_address, model, channel_address, channel_no, classes, kind]
      description: >-
        One channel whose custom data point can back at least one
        device-backed alarm output class. Derived from the live domain
        model, so enrolling a candidate always resolves to an output
        driver.
      properties:
        central: { type: string, description: Owning CCU (central name). }
        device_address: { type: string }
        device_name: { type: string }
        model: { type: string }
        channel_address: { type: string }
        channel_no: { type: integer }
        channel_name: { type: string }
        rooms:
          type: array
          description: The channel's CCU room assignments (picker filter/label).
          items: { type: string }
        functions:
          type: array
          description: The channel's CCU function assignments (picker filter/label).
          items: { type: string }
        classes:
          type: array
          description: >-
            Device-backed output classes this channel can carry, in
            canonical class order. The switched_siren class requires
            device-side auto-off (ON_TIME) and is only listed when the
            channel supports it.
          items:
            type: string
            enum:
              - acoustic_siren
              - optical_siren
              - switched_siren
              - smoke_sounder
              - alarm_light
              - chirp
        kind:
          type: string
          description: Stable custom-DP kind string (widget selection).
        available_tones:
          type: array
          items: { type: string }
          description: Raw acoustic tone wire values the siren offers (sirens only).
        available_tone_labels:
          type: array
          items: { type: string }
          description: >-
            Localised display labels for available_tones, same order.
            Absent when the server has no value translations.
        available_lights:
          type: array
          items: { type: string }
          description: Raw optical pattern wire values the siren offers (sirens only).
        available_light_labels:
          type: array
          items: { type: string }
          description: Localised display labels for available_lights, same order.
        available_soundfiles:
          type: array
          items: { type: string }
          description: >-
            Raw soundfile wire values an MP3 player offers for the
            chirp class (e.g. SOUNDFILE_001).
        available_soundfile_labels:
          type: array
          items: { type: string }
          description: Localised display labels for available_soundfiles, same order.
        dimmable:
          type: boolean
          description: Level support for the alarm_light class.

    AlarmRemoteKeyCandidate:
      type: object
      required: [central, device_address, model, channel_address, channel_no, parameters]
      description: >-
        One channel that emits the key-press events remote-key code
        bindings dispatch on — a physical remote-control or wall-button
        key.
      properties:
        central: { type: string, description: Owning CCU (central name). }
        device_address: { type: string }
        device_name: { type: string }
        model: { type: string }
        channel_address: { type: string }
        channel_no: { type: integer }
        channel_name: { type: string }
        parameters:
          type: array
          description: >-
            Press parameters this key offers, in dispatch order
            (PRESS_SHORT before PRESS_LONG).
          items:
            type: string
            enum: [PRESS_SHORT, PRESS_LONG]

    AlarmModeReadiness:
      type: object
      required: [ready]
      description: Whether an alarm zone is ready to arm into one specific mode.
      properties:
        ready:
          type: boolean
          description: True when the mode can be armed without `force`.
        blockers:
          type: array
          items: { type: string }
          description: Sensor ids currently blocking the arm into this mode.
        warnings:
          type: array
          items: { type: string }
          description: Sensor ids with non-blocking health warnings for this mode.

    AlarmZoneStatus:
      type: object
      required: [id, name, state, walktest_active]
      description: >-
        One alarm zone's live status, as returned by GET /alarm/state
        and GET /alarm/zones/{id}/status views.
      properties:
        id: { type: string }
        name: { type: string }
        state:
          type: string
          enum: [disarmed, arming, armed, pending, triggered]
          description: Arm-state-machine state.
        mode:
          type: string
          enum: [disarmed, perimeter, full, night, vacation, custom]
          description: Currently active (or, while arming, target) protection mode.
        bypassed:
          type: array
          items: { type: string }
          description: Sensor ids currently bypassed for the active/pending arm.
        incident:
          type: object
          description: The zone's open incident, present only while `state` is `triggered`.
          properties:
            id: { type: string }
            silenced: { type: boolean }
        countdown:
          type: object
          description: A running exit/entry delay countdown, present only while one is active.
          properties:
            kind:
              type: string
              enum: [exit_delay, entry_delay]
            remaining_s: { type: integer }
            total_s: { type: integer }
        readiness:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AlarmModeReadiness" }
          description: Per-mode arming readiness, keyed by mode name.
        walktest_active:
          type: boolean
          description: True while a walk-test session is running on this zone.

    AlarmArmRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [perimeter, full, night, vacation, custom]
          description: Target protection mode.
        force:
          type: boolean
          description: Arm despite readiness blockers, where the engine's blocker policy allows overriding.
        skip_delay:
          type: boolean
          description: Skip the configured exit delay and arm immediately.
        bypass:
          type: array
          items: { type: string }
          description: Sensor ids to bypass for this arm attempt.
        code:
          type: string
          description: >
            Alarm code supplied with the arm, when the zone's code policy
            requires one (or to surface a duress code). Never logged or
            persisted in cleartext.

    AlarmVerbRequest:
      type: object
      description: >
        Optional body of the code-carrying verbs (disarm / silence /
        acknowledge). An absent body acts without a code.
      properties:
        code:
          type: string
          description: >
            Alarm code for the verb, when the zone's code policy requires
            one. Never logged or persisted in cleartext.

    AlarmCodePerms:
      type: object
      description: Per-code verb permissions.
      required: [arm, disarm, silence]
      properties:
        arm: { type: boolean }
        disarm: { type: boolean }
        silence: { type: boolean }

    AlarmCode:
      type: object
      description: >
        One alarm code. The argon2id hash and the cleartext PIN are NEVER
        serialized onto this surface.
      required: [id, name, kind, perms, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [pin, keypad_slot, remote_key]
          description: Code class.
        duress:
          type: boolean
          description: >
            A PIN that disarms normally but fires a silent duress alarm.
            Only meaningful for the pin kind.
        perms: { $ref: "#/components/schemas/AlarmCodePerms" }
        zones:
          type: array
          items: { type: string }
          description: Restrict to these zone ids; empty means every zone.
        binding:
          description: >
            Engine-owned hardware-binding document for the keypad_slot /
            remote_key kinds; absent for pin codes.
        valid_from_ms:
          type: integer
          format: int64
          description: Optional validity-window start (Unix ms); 0 leaves it open.
        valid_until_ms:
          type: integer
          format: int64
          description: Optional validity-window end (Unix ms); 0 leaves it open.
        enabled: { type: boolean }
        created_ms: { type: integer, format: int64 }
        updated_ms: { type: integer, format: int64 }

    AlarmCodeRequest:
      type: object
      description: >
        Create/update body for an alarm code. The cleartext PIN is
        write-only — hashed to argon2id before persistence and never
        echoed back. An empty PIN on update keeps the stored hash.
      required: [name, kind, perms, enabled]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [pin, keypad_slot, remote_key]
        pin:
          type: string
          description: >
            Cleartext code, write-only, for the pin kind. Omitted on
            update to keep the existing hash.
        duress: { type: boolean }
        perms: { $ref: "#/components/schemas/AlarmCodePerms" }
        zones:
          type: array
          items: { type: string }
        binding:
          description: Engine-owned hardware-binding document (keypad_slot / remote_key).
        valid_from_ms: { type: integer, format: int64 }
        valid_until_ms: { type: integer, format: int64 }
        enabled: { type: boolean }

    AlarmArmAccepted:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [arming, armed]
          description: Resulting zone state.
        bypassed:
          type: array
          items: { type: string }
          description: Sensor ids actually bypassed for this arm.
        exit_delay_s:
          type: integer
          description: Exit delay in seconds the zone is now counting down; 0 when armed immediately.

    SecuritySnapshot:
      type: object
      description: The whole Security & Safety domain at one instant.
      required: [severity, classes, engine_healthy]
      properties:
        severity:
          type: string
          enum: [ok, info, warning, alarm, critical]
          description: The folded overall state.
        classes:
          type: array
          description: >
            One entry per class the installation has sources for, in escalation
            order. A class without sources is absent, not inactive.
          items: { $ref: "#/components/schemas/SecurityClassState" }
        zones:
          type: array
          description: Empty when the alarm engine is disabled.
          items: { $ref: "#/components/schemas/SecurityZoneState" }
        faults:
          type: array
          items: { $ref: "#/components/schemas/SecurityFault" }
        engine_healthy:
          type: boolean
          description: >
            The alarm engine's verdict about itself, distinct from a transport
            outage.
        index_healthy:
          type: boolean
          description: >
            Whether the classification index still reflects the model behind
            this snapshot. False means the classes and zones were folded from
            an index the daemon knows to be stale — a source may be missing or
            attributed to the wrong class. Render the view as degraded rather
            than trusting a quiet result.
        last_alarm: { $ref: "#/components/schemas/SecurityNotification" }
        last_fault: { $ref: "#/components/schemas/SecurityNotification" }

    SecurityClassState:
      type: object
      required: [class, active, severity, known]
      properties:
        class:
          type: string
          enum: [smoke, water, gas, co, tamper, battery, technical, intrusion, panic]
        active: { type: boolean }
        severity:
          type: string
          enum: [ok, info, warning, alarm, critical]
          description: >
            What this class contributes to the folded severity right now — not
            what its name implies. Colour the class from this, never from
            `active`: a low battery must not look like a fire. `intrusion` is
            arm-aware, so an active source whose zone is disarmed grades `info`
            rather than `alarm`; `warning` means the arm state behind at least
            one active source could not be resolved. `ok` while inactive.
        sources:
          type: array
          items: { $ref: "#/components/schemas/AlarmSource" }
        known:
          type: integer
          description: Sources of this class the index knows, active or not.
        centrals: { type: array, items: { type: string } }
        since: { type: string, format: date-time }

    SecurityZoneState:
      type: object
      required: [id, slug, name, state, mode]
      properties:
        id: { type: string }
        slug:
          type: string
          description: >
            Stable, human-readable zone identifier. Frozen at creation —
            renaming a zone does not change it, so consumer entity ids survive.
        name: { type: string }
        state: { type: string }
        mode: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/AlarmSource" }
        by_class:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: >
            Active source names grouped per class — the "per zone and per type"
            axis in one object rather than a zone-by-class matrix of entities.
        incident_id: { type: integer, format: int64 }
        since: { type: string, format: date-time }

    SecuritySourceView:
      type: object
      required: [ref, central, interface_id, channel_address, device_address, parameter, class, active, relevant]
      properties:
        ref: { type: string }
        central: { type: string }
        interface_id: { type: string }
        channel_address: { type: string }
        device_address: { type: string }
        parameter: { type: string }
        name: { type: string }
        class: { type: string }
        reason: { type: string }
        active: { type: boolean }
        relevant:
          type: boolean
          description: >
            Whether the source contributes to an aggregate. A classifiable
            source on a device with no alarm role is indexed but not
            aggregated; that gate keeps the fault plane from standing
            permanently on across a whole fleet.
        zone_id: { type: string }
        overridden:
          type: boolean
          description: An operator decision, not the classifier, produced this verdict.
        override_included:
          type: boolean
          description: >
            The stored override's raw inclusion bit, present only when
            `overridden` is true. A read surface seeds its include/exclude
            toggle from it so a prior exclusion is not silently undone on the
            next save; absent means no override is stored and the
            default-included behaviour holds.
        since: { type: string, format: date-time }

    SecuritySourceOverride:
      type: object
      properties:
        class:
          type: string
          enum: [smoke, water, gas, co, tamper, battery, technical, intrusion, panic]
          description: Empty keeps the classifier verdict.
        included:
          type: boolean
          description: >
            false removes the source from every aggregate. Omitting the field
            leaves inclusion unchanged — a request that only names a class
            reclassifies and never excludes.
        note: { type: string }

    SecurityFault:
      type: object
      required: [id, class, reason, severity, source, since]
      properties:
        id: { type: string }
        class: { type: string }
        reason:
          type: string
          enum: [unreachable, blocked, device_error, central_lost, duty_cycle, low_battery, tamper]
        severity: { type: string }
        source: { $ref: "#/components/schemas/AlarmSource" }
        since: { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time }
        acknowledged_by: { type: string }

    SecurityNotification:
      type: object
      description: >
        One rendered report. It carries the sentence and the machine facets side
        by side: the text makes a three-line automation possible, the facets
        make a different wording possible without parsing prose.
      required: [class, severity, verb, subject, message, i18n_key, at]
      properties:
        class: { type: string }
        severity: { type: string }
        verb:
          type: string
          enum: [triggered, pre_alarm, cleared, silenced, failed_to_arm, raised, test]
        subject:
          type: string
          description: One line, at most 120 characters, suitable as a notification title.
        message:
          type: string
          description: A full sentence naming cause, place and time.
        i18n_key:
          type: string
          description: >
            Catalogue key of the message, so a consumer can re-render in its own
            locale instead of translating prose.
        args:
          type: object
          additionalProperties: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/AlarmSource" }
        zone_id: { type: string }
        zone_slug: { type: string }
        zone_name: { type: string }
        mode: { type: string }
        incident_id: { type: integer, format: int64 }
        link: { type: string }
        at: { type: string, format: date-time }

    AlarmSensorCandidate:
      type: object
      description: One data point a zone can enrol as an alarm sensor.
      required: [central, interface_id, device_address, channel_address, channel_no, parameter]
      properties:
        central: { type: string }
        interface_id: { type: string }
        device_address: { type: string }
        device_name: { type: string }
        model: { type: string }
        channel_address: { type: string }
        channel_no: { type: integer }
        channel_name: { type: string }
        channel_type: { type: string }
        parameter: { type: string }
        rooms: { type: array, items: { type: string } }
        functions: { type: array, items: { type: string } }
        sensor_type:
          type: string
          enum: [door, window, motion, tamper, hazard, panic]
          description: The suggested alarm role.
        security_class:
          type: string
          enum: [smoke, water, gas, co, tamper, battery, technical, intrusion, panic]
        value_list:
          type: array
          items: { type: string }
          description: The parameter's enumeration vocabulary; absent for a boolean.
        value_labels:
          type: array
          items: { type: string }
          description: Localized renderings of value_list, in the same order.
        active_values:
          type: array
          items: { type: string }
          description: >
            Recommended active-value selection. Present only where the default
            rule would be wrong.
        recommended:
          type: boolean
          description: Prefer this data point when a device offers several.
        deprioritised:
          type: boolean
          description: Workable, but a better sibling exists; see reason.
        reason: { type: string }
        enrolled: { type: boolean }
        zone_id: { type: string }

    AlarmSource:
      type: object
      description: >
        One data point that contributed to an incident or blocked an arm.
        Carries the full identity, so a client can resolve the device behind
        an alarm instead of only its display name.
      required: [ref, at]
      properties:
        ref:
          type: string
          description: >
            Stable routing key `<central>|<interface_id>|<channel_address>|<parameter>`.
            Deduplication key; two centrals with identical channel addresses
            never collide.
        central: { type: string }
        interface_id: { type: string }
        channel_address: { type: string }
        device_address:
          type: string
          description: channel_address without the channel suffix.
        parameter: { type: string }
        sensor_id:
          type: string
          description: Enrolled alarm-sensor row; empty for non-enrolled sources.
        name: { type: string }
        sensor_type:
          type: string
          description: Alarm role (motion, opening, hazard, panic, ...).
        class:
          type: string
          description: Security & Safety hazard/fault class.
          enum: [smoke, water, gas, co, tamper, battery, technical, intrusion, panic]
        cause:
          type: string
          description: Incident cause token the contribution arrived under.
        at: { type: string, format: date-time }

    AlarmIncident:
      type: object
      description: One alarm episode of a zone.
      required: [id, zone_id, mode, started_at, silenced, retrigger_cycles, acoustic_seconds, open]
      properties:
        id: { type: integer, format: int64 }
        zone_id: { type: string }
        mode:
          type: string
          enum: [disarmed, perimeter, full, night, vacation, custom]
        cause:
          type: string
          description: Machine-readable cause token that opened the incident.
        cause_sensor_id: { type: string }
        cause_sensor_name: { type: string }
        sources:
          type: array
          description: Every contributing data point, oldest first.
          items: { $ref: "#/components/schemas/AlarmSource" }
        started_at: { type: string, format: date-time }
        closed_at:
          type: string
          format: date-time
          description: Absent while the incident is still running.
        close_reason:
          type: string
          enum: [disarm, post_trigger, incident_lost]
        silenced: { type: boolean }
        silenced_at: { type: string, format: date-time }
        silenced_by: { type: string }
        retrigger_cycles: { type: integer }
        acoustic_seconds: { type: integer }
        open: { type: boolean }

    AlarmTriggeredMotionSensor:
      type: object
      required: [sensor_id, zone_id, channel_address, parameter]
      properties:
        sensor_id: { type: string }
        zone_id: { type: string }
        name: { type: string }
        channel_address:
          type: string
          description: The sensor's own channel — the reset writes RESET_MOTION there.
        parameter:
          type: string
          description: The sensor's own parameter (e.g. MOTION), not RESET_MOTION.

    AlarmMotionResetResult:
      type: object
      required: [reset, failed, sensors]
      properties:
        reset: { type: integer, description: detectors whose write succeeded }
        failed:
          type: integer
          description: >-
            Detectors whose write failed. Reported here rather than as an
            HTTP error: the verb ran, and a partial result is actionable.
        sensors:
          type: array
          items: { $ref: "#/components/schemas/AlarmTriggeredMotionSensor" }

    AlarmJournalEntry:
      type: object
      required: [id, when, zone_id, class, event]
      description: >-
        One entry in the alarm engine's append-only event journal, as
        returned by GET /alarm/journal.
      properties:
        id:
          type: integer
          format: int64
        when: { type: string, format: date-time }
        zone_id: { type: string }
        class:
          type: string
          enum: [arm, disarm, trigger, silence, bypass, fault, test, config, maintenance]
          description: Journal bucket used by the `class` query filter.
        event:
          type: string
          description: Stable machine-readable event token within the class (e.g. "armed", "force_armed", "silenced").
        actor:
          type: string
          description: Identity that caused the entry (operator account, keypad identity, code name, or an engine-internal actor); empty when unattributed.
        source:
          type: string
          description: Surface the action came from (rest, ws, mqtt, hmcli, keypad, engine).
        incident_id:
          type: integer
          format: int64
          description: Linked incident id, present when the entry belongs to a trigger episode.
        details:
          type: object
          additionalProperties: true
          description: Engine-owned, event-class-specific detail document.

    AlarmWalkTestStatus:
      type: object
      required: [active, sensors]
      description: Live status of a walk-test session on one alarm zone, as returned by GET /alarm/zones/{id}/walktest.
      properties:
        active: { type: boolean }
        started_at: { type: string, format: date-time }
        sensors:
          type: array
          description: One row per sensor enrolled in the zone, tracking walk-test coverage.
          items:
            type: object
            required: [id, tested]
            properties:
              id: { type: string }
              name: { type: string }
              tested:
                type: boolean
                description: True once this sensor reported at least one activation during the current session.
              last_triggered_at: { type: string, format: date-time }

    AlarmOutputTestRequest:
      type: object
      properties:
        optical_only:
          type: boolean
          description: >-
            Fire only the output's optical/visual indication,
            suppressing sound. Ignored for outputs with no audible
            element.

    # Response and request bodies promoted out of the path items they were
    # written into. A schema that lives inline in a path reaches no generated
    # client: the Python types package is produced from components/schemas
    # alone, so an inline body is invisible to every consumer however
    # faithfully the daemon sends it.
    AcceptInboxDeviceRequest:
      type: object
      properties:
        name: { type: string }
        include_channels:
          type: boolean
          description: >-
            Also rename each channel to "<name>:<channelNo>".
            Only consulted together with name. Defaults to false.
        rooms:
          type: array
          items: { type: string }
        functions:
          type: array
          items: { type: string }
    BulkUpdateMatterExposableResponse:
      type: object
      required: [applied]
      properties:
        applied: { type: integer }
    ChangeOwnPasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string }
    CreateFunctionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        central: { type: string }
    CreateRoomRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        central: { type: string, description: "Target CCU (required when more than one is configured)." }
    CreateSysvarRequest:
      type: object
      required: [name, value_type]
      properties:
        name:
          type: string
          description: Name of the new system variable.
        value_type:
          type: string
          enum: [BOOL, INTEGER, FLOAT, STRING, ENUM, ALARM]
          description: >
            Value kind of the new variable. ALARM provisions a
            binary, acknowledgeable alarm line (backed by an
            OT_ALARMDP on the CCU) and always routes through the
            Rega create script.
        unit:
          type: string
          description: Physical unit string (e.g. "°C", "%").
        min:
          type: string
          description: Minimum value (as string, CCU convention).
        max:
          type: string
          description: Maximum value (as string, CCU convention).
        description:
          type: string
          description: >
            Human-readable label shown in the CCU UI. When set,
            creation routes through the Rega script (the native
            JSON-RPC create methods carry no description parameter).
        value_list:
          type: array
          items: { type: string }
          description: Ordered list of enum labels for ENUM-type sysvars.
        value_name_0:
          type: string
          description: >
            False-state label for a binary (BOOL/ALARM) variable.
            Empty adopts the CCU's own "false" default. Setting a
            custom label routes creation through the Rega script.
        value_name_1:
          type: string
          description: >
            True-state label for a binary (BOOL/ALARM) variable.
            Empty adopts the CCU's own "true" default.
        channel_address:
          type: string
          description: >
            Bind the new variable to a device channel ("ADDR:idx",
            the CCU "Kanalzuordnung"). Empty leaves it unassigned.
            The address is resolved to the channel's ReGa ise id;
            an address the CCU cannot resolve is rejected with 422.
    CreateTokenRequest:
      type: object
      required: [subject, role]
      properties:
        subject:
          type: string
          description: Logical owner of the token (e.g. "homeassistant", "ci-runner").
        role:
          type: string
          enum: [viewer, operator, admin]
    DetermineParameterRequest:
      type: object
      required: [parameter]
      properties:
        parameter:
          type: string
          description: Name of the parameter to determine (e.g. "TEMPERATURE").
    DetermineParameterResponse:
      type: object
      required: [value]
      properties:
        value:
          description: |
            The determined value. Type follows the parameter's
            declared TYPE (bool / number / string); null when the
            backend does not support the operation (e.g. CUxD).
    DeviceInstallModeRequest:
      type: object
      properties:
        seconds: { type: integer, minimum: 0, default: 60 }
    DiscoveredCentral:
      type: object
      required: [serial, name, host, suggested_host, last_seen, already_configured]
      properties:
        serial: { type: string }
        name: { type: string }
        host: { type: string }
        suggested_host:
          type: string
          description: >-
            Address the SPA pre-fills on adoption. Differs from host
            when a stabler value applies — "localhost" for a CCU on
            the daemon's own host, or a reverse-resolved docker
            hostname for a co-located HA add-on. Equals host
            otherwise.
        manufacturer: { type: string }
        model: { type: string }
        last_seen: { type: string, format: date-time }
        already_configured: { type: boolean }
    DownloadSystemFirmwareRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: http/https firmware image the CCU should fetch.
        central:
          type: string
          description: Target central (optional for single-CCU deployments).
    ForceCloseEditSessionRequest:
      type: object
      required: [key]
      properties:
        key: { type: string }
    GetAlarmStateResponse:
      type: object
      required: [zones]
      properties:
        zones:
          type: array
          items: { $ref: "#/components/schemas/AlarmZoneStatus" }
    GetConfigChangesResponse:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items: { type: string }
    GetDeviceTeamCandidatesResponse:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items: { $ref: "#/components/schemas/TeamCandidate" }
    GetDiagnosticsRSSIResponse:
      type: object
      properties:
        devices:
          type: array
          items:
            type: object
            properties:
              address: { type: string }
              name: { type: string }
              interface_id: { type: string }
              central: { type: string }
              rssi_device:
                type: [integer, "null"]
                description: RSSI_DEVICE in dBm (device's view); null when absent.
              rssi_peer:
                type: [integer, "null"]
                description: RSSI_PEER in dBm (partner's view); null when absent.
              battery_level:
                type: [integer, "null"]
                description: Battery level 0-100 (%); null for mains-powered devices.
              low_battery:
                type: [boolean, "null"]
                description: LOW_BAT flag; null when the device has no battery indicator.
              reachable:
                type: boolean
                description: Whether the device is currently reachable.
    GetPreferenceResponse:
      type: object
      properties:
        key: { type: string }
        # Opaque SPA-owned JSON; null when the key is unset.
        # An empty schema already admits every type including
        # null — OpenAPI 3.1 has no `nullable` keyword.
        value: {}
    GetRestartPendingResponse:
      type: object
      required: [pending, fields]
      properties:
        pending: { type: boolean }
        fields:
          type: array
          items: { type: string }
    IgnoredCentral:
      type: object
      required: [serial, ignored_at]
      properties:
        serial: { type: string }
        name: { type: string }
        host: { type: string }
        ignored_at: { type: string, format: date-time }
        ignored_by: { type: string }
    InstallModeSearchRequest:
      type: object
      required: [interface]
      properties:
        interface: { type: string, description: The BidCos-Wired interface to scan. }
        central: { type: string, description: Disambiguates the CCU; optional for single-CCU setups. }
    InstallModeSearchResponse:
      type: object
      required: [interface, found]
      properties:
        central: { type: string }
        interface: { type: string }
        found: { type: integer, description: Number of devices the bus scan found. }
    InstallSystemUpdateRequest:
      type: object
      properties:
        backup_first:
          type: boolean
          default: false
          description: >
            Take a full backup of the target central before
            starting the update.
    ListAllLinksResponse:
      type: object
      required: [links]
      properties:
        links:
          type: array
          items: { $ref: "#/components/schemas/Link" }
    ListDeviceReplaceCandidatesResponse:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items: { $ref: "#/components/schemas/ReplaceCandidate" }
    ListDiagramsResponse:
      type: object
      required: [diagrams]
      properties:
        diagrams:
          type: array
          items: { $ref: "#/components/schemas/DiagramConfig" }
    ListGroupTypesResponse:
      type: object
      required: [types]
      properties:
        types:
          type: array
          items: { $ref: "#/components/schemas/GroupTypeEntry" }
    ListGroupsResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/GroupCentralEntry" }
    ListLogsResponse:
      type: object
      required: [last_seq, records]
      properties:
        last_seq: { type: integer, format: int64 }
        records:
          type: array
          items: { $ref: "#/components/schemas/LogRecord" }
    ListSchedulesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ScheduleDeviceSummary" }
    ListSystemCCUResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/SystemCCUEntry" }
    ListSystemStatusResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            type: object
            required: [central, component, healthy, event_at]
            properties:
              central: { type: string }
              component: { type: string }
              healthy: { type: boolean }
              reason: { type: string }
              interface_id: { type: string }
              error_code: { type: integer }
              central_state: { type: string }
              connection_state: { type: string }
              degraded_interfaces:
                type: array
                items: { type: string }
              issues:
                type: array
                items: { type: string }
              event_at: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    MatchMasterProfileRequest:
      type: object
      properties:
        current_values:
          type: object
          additionalProperties: true
    MatchMasterProfileResponse:
      type: object
      required: [active_id]
      properties:
        active_id: { type: integer }
    MatterFactoryResetRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          enum: ["remove-all-fabrics"]
    OpenEditSessionRequest:
      type: object
      required: [key]
      properties:
        key: { type: string }
        subject: { type: string }
    PatchChannelRequest:
      type: object
      properties:
        name: { type: string }
        rooms:
          type: array
          items: { type: string }
          description: |
            Replaces the channel's room assignments. Room names
            unknown to the CCU are silently skipped.
        functions:
          type: array
          items: { type: string }
          description: |
            Replaces the channel's function (Gewerk)
            assignments. Unknown names are silently skipped.
    PatchDeviceRequest:
      type: object
      properties:
        name: { type: string }
        include_channels:
          type: boolean
          description: >-
            Also rename each channel to "<name>:<channelNo>".
            Only consulted together with name. Defaults to false.
        rooms:
          type: array
          items: { type: string }
        functions:
          type: array
          items: { type: string }
    PatchSysvarRequest:
      type: object
      properties:
        name:
          type: string
          description: >
            New name for the variable. When present and non-empty
            the sysvar is renamed in place (the path {name} stays
            the current name). Omit or leave empty to keep the name.
        description:
          type: string
          description: Human-readable label shown in the CCU UI.
        unit:
          type: string
          description: Physical unit string (e.g. "°C", "%").
        min:
          type: string
          description: Minimum value (as string, CCU convention).
        max:
          type: string
          description: Maximum value (as string, CCU convention).
        value_list:
          type: array
          items: { type: string }
          description: Ordered list of enum labels for LIST/ENUM-type sysvars.
        value_name_0:
          type: string
          description: >
            New false-state label for a binary (LOGIC/ALARM)
            variable. An empty string leaves the label untouched.
        value_name_1:
          type: string
          description: >
            New true-state label for a binary (LOGIC/ALARM)
            variable. An empty string leaves the label untouched.
        is_visible:
          type: boolean
          description: >
            Toggle the CCU WebUI-visibility flag. Omit to leave it
            unchanged.
        is_logged:
          type: boolean
          description: >
            Toggle the archive flag (CCU DPArchive) that records
            value changes to the measurement history. Omit to leave
            it unchanged.
        channel_address:
          type: string
          description: >
            Reassign the CCU "Kanalzuordnung". Tri-state: omit to
            leave the assignment untouched, send an empty string to
            clear it, or a channel address ("ADDR:idx") to assign it.
            The address is resolved to the channel's ReGa ise id; an
            address the CCU cannot resolve is rejected with 422.
    PutConfigSectionResponse:
      type: object
      required: [section, version, updated_at, restart_required, applied]
      properties:
        section: { type: string }
        version: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
        restart_required: { type: boolean }
        applied:
          type: boolean
          description: >
            Whether the running daemon took the change without a
            restart. False is not an error on its own: most sections
            have no subsystem that can rebuild itself, and the value
            simply takes effect at the next restart. It is false with
            an `apply_error` when a subsystem that could have taken it
            refused.
        apply_error:
          type: string
          description: >
            Present only when a live apply was attempted and failed.
            The section is persisted regardless and takes effect at the
            next restart.
    ReliabilityState:
      type: object
      properties:
        central: { type: string }
        interface: { type: string }
        circuit_state:
          type: integer
          description: >
            Circuit-breaker state code: 0 = closed, 1 = open,
            2 = half-open.
        state:
          type: object
          description: >
            Live InterfaceClient state. Omitted when the client
            exposes none.
          properties:
            state:
              type: string
              description: State-machine bucket (e.g. connected, degraded, disconnected).
            closed:
              type: boolean
              description: True once the client has been shut down.
            total_requests: { type: integer, format: int64 }
            executed_requests: { type: integer, format: int64 }
            pending_requests: { type: integer, format: int64 }
            last_failure_at:
              type: string
              format: date-time
              description: RFC3339 timestamp of the last request failure.
            last_callback_at:
              type: string
              format: date-time
              description: RFC3339 timestamp of the last received callback.
    RenameFunctionRequest:
      type: object
      required: [new_name]
      properties:
        new_name: { type: string }
        central: { type: string }
    RenameRoomRequest:
      type: object
      required: [new_name]
      properties:
        new_name: { type: string }
        central: { type: string }
    ReplaceDeviceRequest:
      type: object
      required: [old_address]
      properties:
        old_address:
          type: string
          description: The paired device the new device replaces.
        central:
          type: string
          description: Disambiguates the CCU; optional for single-CCU setups.
    ReplaceDeviceResponse:
      type: object
      required: [status, old_address, new_address]
      properties:
        status: { type: string, example: replacing }
        old_address: { type: string }
        new_address: { type: string }
        central: { type: string }
    SetDeviceChannelTeamRequest:
      type: object
      properties:
        team:
          type: ["string", "null"]
          description: The team channel address to join; null/empty resets to the default team.
    SetProgramEnabledRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    SetSystemCCUPositionRequest:
      type: object
      required: [longitude, latitude]
      properties:
        longitude:
          type: number
          minimum: -180
          maximum: 180
        latitude:
          type: number
          minimum: -90
          maximum: 90
    SetupRequest:
      type: object
      required: [admin, locale]
      properties:
        admin:
          type: object
          required: [username, password]
          properties:
            username: { type: string, minLength: 1 }
            password: { type: string, minLength: 8 }
        locale:
          type: object
          required: [locale, theme]
          properties:
            locale: { type: string, enum: [de, en] }
            theme: { type: string, enum: [light, dark, system] }
        ccu:
          type: object
          description: Optional first CCU. Omit to skip.
          required: [name, host, interfaces]
          properties:
            name: { type: string, minLength: 1 }
            host: { type: string, minLength: 1 }
            username: { type: string }
            password: { type: string }
            interfaces:
              type: array
              minItems: 1
              items: { type: string }
        mqtt:
          type: object
          description: Optional MQTT broker. Omit to skip.
          required: [broker_url]
          properties:
            broker_url: { type: string, minLength: 1 }
            username: { type: string }
            password: { type: string }
    SetupStatusResponse:
      type: object
      required: [required]
      properties:
        required: { type: boolean }
    SystemRestartResponse:
      type: object
      properties:
        status:
          type: string
          enum: [shutdown_signalled, shutdown_in_progress]
          description: >-
            `shutdown_signalled` — this request sent the shutdown
            signal. `shutdown_in_progress` — a shutdown signalled
            less than 30 s ago is still running, so no second signal
            was sent; retry later if it did not complete.
        at: { type: string, format: date-time }
    TriggerBackupRequest:
      type: object
      properties:
        central_name:
          type: string
          description: >
            Name of the central to back up. Omit to back up the
            first registered central.
    UnsuppressServiceMessageRequest:
      type: object
      required: [channel]
      properties:
        interface:
          type: string
          description: >
            CCU interface the channel lives on (e.g. "HmIP-RF").
            Optional — resolved from the stored suppression when
            omitted.
        channel:
          type: string
          description: Channel address ("ADDR:chn").
        parameter:
          type: string
          description: >
            Service parameter to unsuppress (e.g. "LOWBAT"). Omit
            or empty to clear every service parameter of the
            channel.
    UpdateFirmwareResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: scheduled
        duty_cycle_warning:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            Transmit duty cycle in percent of the device's radio
            interface, present only when it is at or above the
            warning threshold (80%). Absent when unknown or below.
    UploadBackupRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The `.sbk` archive.
    UploadTLSCertificateRequest:
      type: object
      required: [cert, key]
      properties:
        cert: { type: string, format: binary }
        key: { type: string, format: binary }
    WiringSeam:
      type: object
      required: [name, collaborator, phase, why]
      properties:
        name:
          type: string
          description: Stable identifier, `<subsystem>.<what>`.
          example: history.recorder
        collaborator:
          type: string
          description: The thing that was attached.
          example: "*history.Recorder"
        phase:
          type: string
          description: >
            `per-central` for an observer replayed over every
            central, `ordered` for a once-only attachment whose
            position in the boot sequence matters.
          enum: [per-central, ordered]
        before:
          type: array
          description: >
            Boot marks this seam must be attached before. Only an
            `ordered` seam carries them.
          items: { type: string }
        after:
          type: array
          description: Boot marks this seam must be attached after.
          items: { type: string }
        why:
          type: string
          description: What stops working when the seam is absent.
        violations:
          type: array
          description: >
            Ordering constraints that were already broken when the
            seam was attached. Empty is the normal case; a
            non-empty list is a wiring defect the daemon reports
            about itself — the collaborator IS wired, so nothing
            else about the daemon looks wrong.
          items: { type: string }
