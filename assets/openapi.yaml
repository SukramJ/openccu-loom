        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /functions/{name}:
    parameters:
      - { in: path, name: name, required: true, schema: { type: string } }
    patch:
      operationId: renameFunction
      summary: Rename a function/Gewerk (operator)
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameFunctionRequest"
      responses:
        "204": { description: Renamed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
    delete:
      operationId: deleteFunction
      summary: Delete a function/Gewerk (operator)
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: query, name: central, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /areas:
    get:
      operationId: listAreas
      summary: Operator-defined room groupings (areas) with their assigned rooms
      tags: [hub]
      responses:
        "200":
          description: Area list, ordered by position then name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Area" }
    post:
      operationId: createArea
      summary: Create an area (operator)
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Area" }
      responses:
        "201":
          description: Created (server-generated id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Area" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /areas/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    put:
      operationId: putArea
      summary: Rename/reorder an area (operator)
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Area" }
      responses:
        "204": { description: Updated }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      operationId: deleteArea
      summary: Delete an area and clear its room assignments (operator)
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /areas/{id}/rooms:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    put:
      operationId: putAreaRooms
      summary: Replace the full room set of an area (operator)
      description: >-
        Full-set replace: rooms omitted from the body are unassigned from
        the area. A room already assigned to ANOTHER area moves to this
        one (one area per room).
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/AreaRoomRef" }
      responses:
        "204": { description: Replaced }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /programs/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: getProgram
      summary: Fetch a single program by id
      tags: [hub]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: setProgramEnabled
      summary: Toggle program active flag
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProgramEnabledRequest"
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteProgram
      summary: Delete a program from the CCU (admin)
      description: >-
        Removes the program from the CCU (dom.DeleteObject) and drops the
        local mirror once the call lands. Irreversible, therefore admin-gated
        like DELETE /devices/{addr}. The optional `central` query parameter
        scopes the target to one CCU when several are configured.
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - { in: query, name: central, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /alarm-messages/{id}/ack:
    post:
      operationId: ackAlarm
      summary: Acknowledge alarm message
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "202": { description: Scheduled }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /service-messages/{id}/ack:
    post:
      operationId: ackService
      summary: Acknowledge service message
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "202": { description: Scheduled }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /alarm-messages/ack-all:
    post:
      operationId: ackAllAlarmMessages
      summary: Acknowledge all alarm messages
      description: |
        Acknowledges every active alarm message in a single CCU pass.
        An optional `central` query parameter scopes the operation to
        one CCU; when omitted the acknowledge runs across every
        registered central. The response carries the total number of
        messages acknowledged.
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: query, name: central, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AckAllResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /service-messages/ack-all:
    post:
      operationId: ackAllServiceMessages
      summary: Acknowledge all quittable service messages
      description: |
        Acknowledges every quittable service message in a single CCU
        pass (non-quittable messages are left untouched, mirroring the
        single-message writability gate). An optional `central` query
        parameter scopes the operation to one CCU; when omitted the
        acknowledge runs across every registered central. The response
        carries the total number of messages acknowledged.
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: query, name: central, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AckAllResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /service-messages/{id}/disable:
    post:
      operationId: disableServiceMessage
      summary: Disable (permanently suppress) a service message
      description: |
        Durably suppresses the service message's channel parameter on the
        CCU via `Interface.suppressServiceMessages`. Unlike `POST .../ack`
        (a one-shot dismiss that returns as soon as the condition
        re-triggers), the CCU stops raising service messages for the
        resolved channel + service parameter until it is unsuppressed via
        `POST /service-messages/unsuppress`. The channel and parameter are
        resolved from the stored message; the suppression is recorded and
        surfaced by `GET /service-messages/suppressed`. Shares the domain
        call with the WS `service_messages.disable` command.
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "202": { description: Scheduled }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /service-messages/suppressed:
    get:
      operationId: listSuppressedServiceMessages
      summary: List permanently suppressed service messages
      description: |
        Returns the service-message channel parameters that have been
        durably suppressed via `POST /service-messages/{id}/disable`,
        aggregated across every central. The list is reconciled against
        each CCU's live `Interface.getSuppressedServiceMessages`, so an
        entry cleared elsewhere (e.g. the CCU WebUI) drops out. Each entry
        can be cleared via `POST /service-messages/unsuppress`.
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "200":
          description: Suppressed service messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuppressedServiceMessage"

  /service-messages/unsuppress:
    post:
      operationId: unsuppressServiceMessage
      summary: Clear a permanent service-message suppression
      description: |
        Clears a durable suppression for a channel parameter via
        `Interface.suppressServiceMessages` (suppress=false). The optional
        `central` query parameter selects the target central (required
        when more than one CCU is registered). The request body names the
        channel (required) and the service parameter (omit or empty to
        clear every service parameter of the channel); the interface is
        optional and resolved from the stored suppression when omitted.
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: query, name: central, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsuppressServiceMessageRequest"
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ---- Backups ----
  /backups:
    post:
      operationId: triggerBackup
      summary: Trigger CCU backup (Rega create_backup_start)
      description: |
        Starts the create-and-download backup flow. An optional
        `central_name` in the request body selects the target central
        explicitly (multi-CCU-correct); omitting it — or an empty
        request body — backs up the first registered central for
        backward compatibility.
      tags: [backup]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerBackupRequest"
      responses:
        "202": { description: Job id returned }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      operationId: listBackups
      summary: Locally stored CCU backups
      tags: [backup]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Backup list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupEntry" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /backups/storage:
    get:
      operationId: backupStorageInfo
      summary: Where locally-stored CCU backups are kept
      description: |
        Reports the directory the daemon writes downloaded `.sbk` archives
        to, together with how many are there and how much space they take.
        Admin-gated with the rest of the backup surface: it names a
        filesystem path on the host.
      tags: [backup]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Backup storage location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupStorageInfo" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /backups/upload:
    post:
      operationId: uploadBackup
      summary: Import an externally-supplied CCU backup
      tags: [system]
      description: >
        Takes in a `.sbk` archive produced elsewhere — another CCU, an
        older daemon, the CCU WebUI — and stores it so it can be restored
        through `POST /backups/{id}/restore` like any locally-taken
        backup.


        The archive is inspected before it is stored, so picking the wrong
        file fails here rather than at restore time when the CCU is
        already being wiped. The check is structural: a readable tar
        carrying `usr_local.tar.gz` and its `signature`. The signature
        itself cannot be verified without the CCU's key material, so it is
        not claimed to be. The firmware version the archive came from is
        read from its `firmware_version` member and returned, so the
        operator can compare it against the target CCU — the same fact the
        CCU's own restore consults.


        Admin-gated and audited. The request body is streamed, not
        schema-validated, because a real archive is far larger than the
        validator's buffer.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadBackupRequest"
      responses:
        "201":
          description: Archive accepted and stored.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BackupEntry"
                  - type: object
                    properties:
                      firmware_version:
                        type: string
                        description: >
                          Firmware the archive was taken from, from its
                          `firmware_version` member. Absent for CCU2-era
                          archives, which predate it.
                      product:
                        type: string
                        description: Product label from the same member.
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: The archive exceeds the accepted size.
        "422":
          description: >
            Not a CCU system backup — unreadable as a tar, or missing the
            configuration archive or its signature.
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /backups/{id}:
    delete:
      operationId: deleteBackup
      summary: Delete one stored CCU backup
      description: |
        Removes the archive from the daemon's storage. Unrecoverable: the
        archive may be the only copy of that CCU's configuration the daemon
        holds. Deleting an archive that is not there succeeds — the caller
        asked for it to be gone, and it is.
      tags: [backup]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /backups/{id}/download:
    get:
      operationId: downloadBackup
      summary: Stream a backup .sbk
      tags: [backup]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: SBK bytes
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /backups/{id}/restore:
    post:
      operationId: restoreBackup
      summary: Restore a CCU backup from a previously stored snapshot
      tags: [backup]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "202": { description: Restore dispatched asynchronously }
        "422":
          description: >
            The restore was refused before anything was sent to any CCU. Either
            the backup names no owning CCU and several are configured, so the
            restore target cannot be derived (restore it from that CCU's own
            backup list instead) — or the stored archive did not survive the
            structural inspection that every restore runs first: it is not a
            readable tar, or it is missing `usr_local.tar.gz` or its
            `signature`. The problem detail names which. A damaged archive
            cannot be repaired; upload an intact one.
        "501":
          description: >
            No restore path is configured, so nothing was sent to the CCU.
            Distinct from 502, which means a CCU was asked and refused.
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ---- Edit-session locks ----
  /sessions/edit:
    post:
      operationId: openEditSession
      summary: Acquire a 5-min edit lock on a resource key
      tags: [sessions]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenEditSessionRequest"
      responses:
        "200":
          description: Lock acquired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditSessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "423": { description: Locked by another session }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: closeEditSession
      summary: Release an edit lock
      description: >-
        Names the session to release. A body without `key` — or no body at
        all — is rejected 422 rather than answered 204, because a 204 would
        claim a lock was released while it stays held until its TTL expires.
        A `token` that does not hold the lock leaves it in place and still
        answers 204.
      tags: [sessions]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditSessionRequest" }
      responses:
        "204": { description: Released }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /sessions/edit/heartbeat:
    post:
      operationId: heartbeatEditSession
      summary: Refresh an edit lock's TTL
      description: >-
        Names the session to refresh. A body without `key` — or no body at
        all — is rejected 422. A `key`/`token` pair that no longer holds a
        live lock answers 410.
      tags: [sessions]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditSessionRequest" }
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditSessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "410": { description: Session expired }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /sessions/edit/take-over:
    post:
      operationId: forceCloseEditSession
      summary: Force-close another user's edit lock (operator)
      tags: [sessions]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForceCloseEditSessionRequest"
      responses:
        "204": { description: Lock released }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ---- Audit + diagnostics ----
  /audit:
    get:
      operationId: listAudit
      summary: Recent change history (FIFO buffer)
      tags: [audit]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: query
          name: device
          schema: { type: string }
          description: >
            Filter by device address prefix (case-insensitive).
            E.g. ?device=0001 returns entries whose DeviceAddress starts with "0001".
        - in: query
          name: op
          schema: { type: string }
          description: >
            Filter by action/source tag substring (case-insensitive).
            E.g. ?op=paramset matches paramset_write, link_paramset_write, etc.
        - in: query
          name: since
          schema: { type: string, format: date-time }
          description: >
            Only return entries with timestamp >= this value (inclusive, RFC3339).
            Returns 400 if the value cannot be parsed.
        - in: query
          name: until
          schema: { type: string, format: date-time }
          description: >
            Only return entries with timestamp < this value (exclusive, RFC3339).
            Returns 400 if the value cannot be parsed.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
          description: >
            Maximum entries to return. 0 or absent uses the default (1000).
            Values above 10000 are capped to 10000.
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: >
            Pagination offset over the durable history (SQLite path).
            Ignored on the in-memory fallback.
        - in: query
          name: format
          schema: { type: string, enum: [csv] }
          description: >
            When `csv`, returns the entries as a downloadable
            `text/csv` attachment instead of JSON.
      responses:
        "200":
          description: Filtered list of audit entries (newest first).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /history:
    get:
      operationId: getHistory
      summary: Bucketed measurement history for one data point
      tags: [history]
      description: >
        Server-side-bucketed view of one numeric data point's recorded
        measurement history, sized for charting. Requires the opt-in
        history feature (persistence.history.enabled); the route is absent
        and returns 404 when disabled. The half-open range [from,to) is
        aggregated into at most `buckets` evenly spaced buckets, each
        carrying avg/min/max/count; empty buckets are omitted.


        The source resolution is chosen from the resulting bucket width:
        buckets at least a day wide are served from the daily rollup, at
        least an hour wide from the hourly rollup, anything finer from raw
        samples — each completed by the not-yet-rolled-up tail so the
        running hour and day are never missing. A range that reaches
        further back than the (short) raw retention is therefore answered
        from the rollups instead of coming back empty. The chosen tier is
        reported in the `X-History-Tier` response header.
      parameters:
        - in: query
          name: central
          required: true
          schema: { type: string }
          description: Central (CCU) name that owns the data point.
        - in: query
          name: interface_id
          required: true
          schema: { type: string }
          description: Canonical interface id (&lt;central&gt;-&lt;interface&gt;).
        - in: query
          name: channel
          required: true
          schema: { type: string }
          description: Channel address, e.g. ABC0000001:4.
        - in: query
          name: parameter
          required: true
          schema: { type: string }
          description: Parameter name, e.g. ACTUAL_TEMPERATURE.
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
          description: Inclusive lower bound (RFC3339).
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
          description: Exclusive upper bound (RFC3339). Must be after from.
        - in: query
          name: buckets
          schema: { type: integer, minimum: 1, maximum: 2000, default: 200 }
          description: >
            Target bucket count. Capped to 2000; values &lt;= 0 or absent
            use the default (200).
      responses:
        "200":
          description: Chronological list of non-empty buckets.
          headers:
            X-History-Tier:
              description: >
                Source resolution the answer was assembled from: `raw`
                (raw samples), `hour` (hourly rollup + un-rolled tail) or
                `day` (daily rollup + hourly and raw tails).
              schema: { type: string, enum: [raw, hour, day] }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HistoryBucket" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /history/recording:
    get:
      operationId: getRecordingOverride
      summary: Effective per-datapoint recording state (read-only)
      tags: [history]
      description: |
        Reports whether one data point's live values are currently
        persisted to measurement history, and whether that decision comes
        from an explicit override or the parameter-name glob policy. Part
        of the opt-in history feature; 503 when history is disabled.
      parameters:
        - { in: query, name: central, required: true, schema: { type: string } }
        - { in: query, name: interface_id, required: true, schema: { type: string } }
        - { in: query, name: channel, required: true, schema: { type: string } }
        - { in: query, name: parameter, required: true, schema: { type: string } }
      responses:
        "200":
          description: Effective recording state for the data point.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: putRecordingOverride
      summary: Set or clear a per-datapoint recording override
      tags: [history]
      description: |
        Forces recording on/off for one data point, or (record: null)
        clears the override so it falls back to the glob policy. Toggling
        affects only future samples; existing rows are untouched. Part of
        the opt-in history feature; 503 when disabled.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordingWriteRequest" }
            example:
              central: ccu1
              interface_id: ccu1-HmIP-RF
              channel: "0001ABCD:1"
              parameter: ACTUAL_TEMPERATURE
              record: true
      responses:
        "200":
          description: Resulting effective recording state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /energy:
    get:
      operationId: getEnergy
      summary: Per-device power/energy breakdown over time
      tags: [history]
      description: >
        Per-device power/energy breakdown for the energy view, read from
        the hourly/daily measurement-history rollup tiers (month
        re-aggregates the daily tier). Requires the opt-in history
        feature (persistence.history.enabled); the route is absent and
        returns 404 when disabled. POWER is averaged/peaked per bucket;
        ENERGY_COUNTER and ENERGY_COUNTER_FEED_IN are reported as the
        bucket's cumulative-counter delta (last-first) in Wh. A counter
        that went backwards within a bucket (meter reset on re-pair /
        firmware event) reports the delta as `last` (never negative) and
        sets `reset` on that bucket.
      parameters:
        - in: query
          name: central
          required: true
          schema: { type: string }
          description: Central (CCU) name that owns the energy devices.
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
          description: Inclusive lower bound (RFC3339).
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
          description: Exclusive upper bound (RFC3339). Must be after from.
        - in: query
          name: group
          schema: { type: string, enum: [hour, day, month], default: day }
          description: >
            Bucket granularity. Absent uses the default (day). `day` and
            `month` buckets are local calendar buckets in the daemon's own
            timezone, so a bucket's `ts` is a local midnight respectively a
            local first-of-month and covers 23, 24 or 25 hours across a
            daylight-saving transition. `hour` buckets are aligned to the
            hour on the UTC axis.
        - in: query
          name: device
          schema: { type: string }
          description: >
            Bare device address to scope the breakdown to one device.
            Omitted returns every energy device on the central.
      responses:
        "200":
          description: Per-device power/energy breakdown for the requested range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnergyResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /incidents:
    get:
      operationId: listIncidents
      summary: Diagnostic incidents
      tags: [diagnostics]
      parameters:
        - in: query
          name: central
          schema: { type: string }
          description: >
            Only return incidents belonging to the named CCU. Matches
            both central-level entries (`component == central`) and
            interface-scoped entries (`component == "<central>/<interface>"`).
        - in: query
          name: since
          schema: { type: string, format: date-time }
          description: >
            Only return incidents at-or-after this value (inclusive, RFC3339).
            Returns 400 if the value cannot be parsed.
        - in: query
          name: until
          schema: { type: string, format: date-time }
          description: >
            Only return incidents strictly before this value (exclusive, RFC3339).
            Returns 400 if the value cannot be parsed.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
          description: >
            Maximum entries to return. 0 or absent uses the default (500).
            Values above 5000 are capped to 5000.
      responses:
        "200":
          description: Filtered list of diagnostic incidents (newest first).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Incident" }
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      operationId: clearIncidents
      summary: Clear every stored incident across every registered central (admin)
      description: |
        Removes all rows from the incident store for every registered
        central. Mirrors the WS `incidents.clear` command — both share
        the same domain call (`adapter.IncidentsStoreReader.ClearIncidents`).
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "204":
          description: Incidents cleared
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics (also at /metrics)
      tags: [diagnostics]
      responses: { "200": { description: Prometheus text } }

  /diagnostics:
    get:
      operationId: diagnosticsDump
      summary: Composite diagnostics dump (health + interfaces + incidents + metrics + log-levels)
      description: |
        Single ship-the-state artefact for support / agent escalation
        (ADR 0017). One JSON envelope carrying build info, health
        components + score, per-client detail, configured-interface
        list, recent incidents, system-status ring buffer, per-central
        metrics counters, and log-level overrides.

        **Two consumer planes — disjoint:**

        - `GET /diagnostics` returns a momentary structured JSON
          snapshot. Right for support escalations, HA Repair-Flows,
          and any client that needs a coherent point-in-time view
          with one call.
        - `GET /metrics` returns Prometheus exposition format,
          right for time-series scraping (Grafana, Alertmanager).
          Continuous monitoring uses this; diagnostics-on-demand
          uses the JSON endpoint above.

        The two surfaces are not interchangeable: the JSON envelope
        carries fields (recent incidents, log-overrides, system-status
        ring) that have no useful Prometheus representation; the
        Prometheus surface emits time-series that the JSON envelope
        does not aggregate.

        The `metrics` block holds one typed snapshot per central, keyed
        by central name — RPC, callback-server, event-bus, cache,
        health, recovery, model and service counters as the daemon's
        per-CCU aggregator sees them. It carries counters only, names
        no device, and is therefore unaffected by `anonymize`.

        Hashes device-address-shaped fields with a 12-hex sha256
        prefix by default; pass `?anonymize=0` explicitly when
        absolute fidelity is required.
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: query
          name: anonymize
          schema: { type: string, enum: ["0", "1"], default: "1" }
      responses:
        "200":
          description: Diagnostics envelope
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /diagnostics/log-levels:
    get:
      operationId: listLogLevels
      summary: Active per-subsystem log-level overrides
      tags: [diagnostics]
      responses:
        "200":
          description: Override list
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /diagnostics/log-levels/{path}:
    put:
      operationId: putLogLevel
      summary: Install a per-subsystem log-level override (admin-only)
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: path
          name: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "204":
          description: Override applied
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteLogLevel
      summary: Remove a per-subsystem log-level override (admin-only)
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: path
          name: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /diagnostics/log-level:
    get:
      operationId: getDefaultLogLevel
      summary: Current global default log level
      tags: [diagnostics]
      responses:
        "200":
          description: Default level
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: putDefaultLogLevel
      summary: Change the global default log level (admin-only)
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Default level updated
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /diagnostics/logs:
    get:
      operationId: listLogs
      summary: Backfill / download recent log records (admin-only)
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: query
          name: limit
          schema: { type: integer }
          description: Max records (default 500, capped at the ring size).
        - in: query
          name: min_level
          schema: { type: string, enum: [debug, info, warn, error] }
        - in: query
          name: format
          schema: { type: string, enum: [json, ndjson] }
        - in: query
          name: download
          schema: { type: string, enum: ["1"] }
          description: When "1", sets a Content-Disposition attachment header.
      responses:
        "200":
          description: Recent log records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLogsResponse"
            application/x-ndjson:
              schema: { type: string }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /diagnostics/logs/stream:
    get:
      operationId: streamLogs
      summary: Server-Sent-Events live log tail (admin-only)
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: query
          name: since
          schema: { type: integer }
          description: Resume after this record sequence number.
        - in: query
          name: min_level
          schema: { type: string, enum: [debug, info, warn, error] }
      responses:
        "200":
          description: "SSE stream of log records (event: log, id: <seq>)."
          content:
            text/event-stream:
              schema: { type: string }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /diagnostics/wiring:
    get:
      operationId: getDiagnosticsWiring
      summary: Seams the running daemon declared as it wired them (admin-only)
      description: >
        The composition root's own account of what it attached (ADR 0065).
        Each entry names the seam, the collaborator, the ordering constraint
        relative to south-bound bring-up, and what stops working when the seam
        is absent.


        Absence is the informative case: a seam that is not listed was not
        wired by this process — whether the call was removed, skipped by a nil
        guard, or never reached. An empty list is a valid answer and means the
        daemon wired none of them, which is why this endpoint never reports
        "unavailable" instead.
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Declared wiring seams, in name order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WiringSeam"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /diagnostics/rssi:
    get:
      operationId: getDiagnosticsRSSI
      summary: Per-device signal quality and battery (admin-only)
      description: >
        Read-only snapshot of per-device RF reception strength (RSSI_DEVICE /
        RSSI_PEER), battery state, and reachability, read from the device
        model's maintenance channel (so it works for HmIP and BidCos alike),
        across every central. Only devices that report an RSSI reading are
        listed. Exposes the same data as the `ccu.get_rssi_info` WebSocket
        command.
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Per-device RF reception strength
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDiagnosticsRSSIResponse"
  /diagnostics/reliability:
    get:
      operationId: getDiagnosticsReliability
      summary: Per-interface reliability snapshot (admin-only)
      description: >
        Read-only snapshot of circuit-breaker and connection state per
        (central, interface). Optionally filtered to one central.
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: query
          name: central
          schema: { type: string }
          description: Filter to one central (default all).
      responses:
        "200":
          description: Reliability rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReliabilityState"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /diagnostics/eventbus/tap:
    get:
      operationId: tapDiagnosticsEventBus
      summary: Live event-bus tap (NDJSON, admin-only)
      description: >
        Bounded NDJSON stream of internal event-bus traffic for one central.
        The stream ends at the window deadline or when the client disconnects.
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: query
          name: central
          schema: { type: string }
          description: Central to tap (required when more than one exists).
        - in: query
          name: type
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
          description: >
            Filter to these event type names (repeatable; default = all
            curated types).
        - in: query
          name: seconds
          schema: { type: integer }
          description: Window length in seconds (default 30, capped at 300).
      responses:
        "200":
          description: NDJSON stream of tapped events
          content:
            application/x-ndjson:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /diagnostics/capture:
    post:
      operationId: startCapture
      summary: Start a RAM-buffered log capture (admin-only)
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Capture accepted — poll GET .../capture/{id} for progress
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      operationId: listCaptures
      summary: List active + archived captures (admin-only)
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Capture list
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
  /diagnostics/capture/{id}:
    get:
      operationId: getCapture
      summary: Capture metadata (admin-only)
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Capture metadata
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /diagnostics/capture/{id}/stop:
    post:
      operationId: stopCapture
      summary: Stop a running capture (admin-only)
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Capture stopped
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/values-cache/stats:
    get:
      operationId: getValuesCacheStats
      summary: Persistent VALUES-cache statistics (admin-only)
      description: |
        Snapshot of the wire-DP VALUES cache: row count, JSON byte
        size, and the cumulative restore/cast/gc/flush counters since
        process start. See ADR 0018.
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Current cache statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValuesCacheStats" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: cache feature disabled or store unwired.

  /admin/tls/certificate:
    post:
      operationId: uploadTLSCertificate
      summary: Replace the TLS server certificate at runtime (admin-only)
      description: |
        Uploads a PEM certificate + key as multipart/form-data (`cert`
        and `key` parts). The pair is validated, persisted to the
        configured paths, and hot-reloaded — the REST API and the SPA
        (same port) are re-secured without a daemon restart. Available
        only when TLS is enabled (north.rest.tls_cert_file/tls_key_file).
      tags: [admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadTLSCertificateRequest"
      responses:
        "204": { description: Certificate replaced and reloaded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/mqtt/reload:
    post:
      operationId: reloadMQTT
      summary: Tear down + rebuild the MQTT stack (admin-only)
      description: |
        Triggers an atomic MQTT-stack reload using the current
        configuration. The new broker connection is established
        before the previous one is torn down; on failure the
        previous stack continues unchanged and a 503 is returned.

        Operators use this after editing MQTT settings in the UI
        when they do not want to wait for the file-watcher poll
        cycle (≤ 5 s) or when an external state — broker DNS,
        TLS certificate, authentication — changed without a
        config edit.
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: MQTT stack reloaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MQTTReloadResponse" }
        "503":
          description: Reload failed; previous stack still active.

  /admin/values-cache/reset:
    post:
      operationId: resetValuesCacheGlobal
      summary: Drop every row from the persistent VALUES cache (admin-only)
      description: |
        Removes ALL cached wire-DP values. The next cold boot starts
        with `source=unobserved` on every data point until live
        events repopulate them.
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "204":
          description: cache cleared.
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: cache feature disabled or store unwired.

  /devices/{addr}/values-cache/reset:
    post:
      operationId: resetValuesCacheDevice
      summary: Drop the VALUES-cache rows for one device (admin-only)
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: path
          name: addr
          required: true
          schema: { type: string }
      responses:
        "204":
          description: device rows cleared.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: device address unknown.
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: cache feature disabled or store unwired.

  /admin/cache/clear:
    post:
      operationId: clearCache
      summary: Clear CCU-derivable caches and re-pull them fresh (admin-only)
      description: |
        Clears only CCU-derivable persisted state for the requested
        scope — device descriptions, paramset descriptions, the
        persistent VALUES cache and persisted MASTER values, plus the
        in-memory value cache — then re-initializes the owning
        central(s) through the boot path so the data is re-pulled fresh
        from the CCU (ADR 0042).

        It never touches operator-authored or system state (visibility
        rules, config, auth, Matter pairing, audit/incident history).
        The clear is idempotent and recorded into the audit log.
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CacheClearRequest" }
      responses:
        "200":
          description: clear completed; report describes what was removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheClearReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502":
          description: |
            clear ran but one or more stores reported an error; the
            partial report (with the `errors` array populated) is still
            returned in the body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheClearReport" }
        "503":
          description: cache reset unavailable (south-bound never came up).

  /diagnostics/capture/{id}/download:
    get:
      operationId: downloadCapture
      summary: Download capture archive (admin-only)
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: tar.gz archive
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /diagnostics/rpc-recording:
    post:
      operationId: startRpcRecording
      summary: Start the XML/JSON-RPC session recorder (replay capture, admin-only)
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Recording started — per-central status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RPCRecordingStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      operationId: listRpcRecordings
      summary: Current RPC-recorder status per central
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Per-central recorder status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RPCRecordingStatus" }
  /diagnostics/rpc-recording/stop:
    post:
      operationId: stopRpcRecording
      summary: Stop the RPC session recorder (admin-only)
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Per-central recorder status after stop
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RPCRecordingStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /diagnostics/rpc-recording/{central}/download:
    get:
      operationId: downloadRpcRecording
      summary: Download a central's recorded RPC trace as JSON (admin-only)
      tags: [diagnostics]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - in: path
          name: central
          required: true
          schema: { type: string }
        - in: query
          name: format
          schema: { type: string, enum: [map, golden] }
          description: "map (default) = keyed slot map; golden = ordered replay slice."
      responses:
        "200":
          description: Recorded trace (replay map or golden slice)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /system/startup-capture:
    get:
      operationId: getStartupCapture
      summary: Read the persisted startup-capture toggle (admin-only)
      tags: [system]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Current toggle state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartupCaptureConfig" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: putStartupCapture
      summary: Persist the startup-capture toggle (admin-only)
      description: >-
        Takes effect on the next daemon boot — pair it with
        `POST /system/restart` for an end-to-end "capture the bootstrap"
        workflow. Unknown properties are rejected: a body the daemon cannot
        fully interpret must not silently configure what it records about
        itself.
      tags: [system]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartupCaptureConfigWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartupCaptureConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /system/restart:
    post:
      operationId: systemRestart
      summary: Trigger a graceful daemon shutdown (admin-only)
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      description: |
        Sends SIGTERM to the daemon's own process. In supervised
        deployments (systemd, Docker restart-policy) the process
        comes back automatically; in development the operator
        starts it manually after observing the shutdown.
      tags: [system]
      responses:
        "202":
          description: Shutdown signalled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRestartResponse"

  /matter/status:
    get:
      operationId: matterStatus
      summary: Bridge runtime state (endpoint count, fabric count, advertise on/off)
      tags: [matter]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatterStatus" }

  /matter/compatibility:
    get:
      operationId: matterCompatibility
      summary: How each commissioned ecosystem will treat what the bridge exposes
      description: |
        Classifies every commissioned fabric by ecosystem and reports what
        that ecosystem does with the exposed device types.

        These problems are invisible from the bridge: the endpoint is
        assembled, its clusters answer reads, commissioning succeeds — and
        the device is missing from the app, or the whole bridge stops
        responding there. Naming the combination is what connects the two.
      tags: [matter]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatterCompatibility" }
        "503":
          description: Matter bridge not enabled
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /matter/endpoints:
    get:
      operationId: matterEndpointInspector
      summary: The assembled Matter topology as a controller sees it
      description: |
        Reports every endpoint the bridge exposes with its device type,
        its clusters and where it came from — the view a controller gets,
        without needing chip-tool to obtain it.

        Endpoint numbers are assigned from persisted identity, not from
        position, so they are stable across restarts but not derivable
        from the device list. Reading them here is the way to find the
        endpoint belonging to a given device; guessing by ordinal is not.
      tags: [matter]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatterEndpointList" }
        "503":
          description: Matter bridge not enabled
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /matter/mdns:
    get:
      operationId: matterMdnsDiagnostics
      summary: What the bridge advertises over mDNS, and what is wrong with it
      description: |
        Reports the mDNS records the bridge currently announces, together
        with findings that explain why a controller might not discover it.

        Every finding corresponds to a failure that presents identically
        from inside the daemon: advertising succeeds, the log says so, and
        the controller simply never offers the bridge. Missing subtype
        PTRs (Apple and Google browse through them), container-internal
        addresses a LAN controller cannot route to, a commissioning port
        other than 5540 (Alexa uses no other), an IPv4-only announcement.
      tags: [matter]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatterMdnsDiagnostics" }
        "503":
          description: Matter bridge not enabled
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /matter/sessions:
    get:
      operationId: listMatterSessions
      summary: Open Matter sessions with per-session liveness (operator diagnostics)
      description: |
        Lists every secure session the bridge currently holds, with when it
        last carried traffic and how many subscriptions ride on it.

        The two timestamps answer different questions. `last_activity` moves
        on traffic in either direction; `last_peer_activity` only when the
        controller sent something. A session whose peer has been quiet while
        the bridge kept reporting is a controller that went away without
        closing — the shape that otherwise shows up only as entities going
        stale in the ecosystem.

        The `occupancy` block answers the other half: how much of the
        session-id space the listed sessions leave free, including the ids
        held by handshakes that never became sessions.

        No key material is exposed.
      tags: [matter]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatterSessionList" }
        "503":
          description: Matter bridge not enabled
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /matter/events:
    get:
      operationId: getMatterDiagnosticEvents
      summary: Recent Matter pairing, session and discovery events
      description: >-
        A bounded, in-memory trace of the moments that explain a failed
        pairing — a commissioner refused while another was mid-handshake,
        pairing locked after repeated failed attempts, a session
        closed. The existing Matter diagnostics report state and
        therefore cannot answer "what happened thirty seconds ago", which
        is the question left after a controller gives up and goes quiet.


        The trace is lossy by design: oldest entries are dropped to make
        room, and it does not survive a restart. It is a diagnostic, not
        an audit trail.
      tags: [matter]
      responses:
        "200":
          description: Recorded events, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatterDiagnosticEventList" }
        "503":
          description: Matter bridge not enabled
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /matter/force-sync:
    post:
      operationId: matterForceSync
      summary: Re-assemble the exposed Matter topology (admin)
      description: >-
        Re-runs endpoint assembly against the current device model. Use
        when the bridge and the CCU disagree about what exists — a change
        that arrived while the bridge was down, an exposure edited
        outside the usual path. Not destructive: controllers keep their
        sessions and fabrics.
      tags: [matter]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "204": { description: Topology re-assembled }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Matter bridge not enabled
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /matter/factory-reset:
    post:
      operationId: matterFactoryReset
      summary: Remove every Matter fabric (admin, destructive)
      description: >-
        Returns the bridge to its uncommissioned state. Every paired
        controller loses it and has to commission it again; there is no
        undo.


        The request body must name the action —
        `{"confirm": "remove-all-fabrics"}` — so a replayed or
        mis-scripted POST cannot unpair an installation.
      tags: [matter]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatterFactoryResetRequest"
      responses:
        "204": { description: Every fabric removed }
        "400":
          description: Confirmation missing or wrong
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500":
          description: >-
            The reset did not complete. It may be partial: the fabrics
            already revoked stay revoked, and the problem detail names how
            many of how many were removed. Re-run to finish.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: Matter bridge not enabled
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /matter/fabrics:
    get:
      operationId: listMatterFabrics
      summary: List Matter fabrics commissioned to the bridge
      tags: [matter]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatterFabricList" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Matter bridge not enabled
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /matter/fabrics/{id}:
    delete:
      operationId: revokeMatterFabric
      summary: Unpair a Matter fabric (admin)
      tags: [matter]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 254 }
      responses:
        "204":
          description: Fabric revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Matter bridge not enabled
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /visibility/unignore:
    get:
      operationId: listVisibilityUnIgnore
      summary: List currently-active un-ignore patterns per central
      tags: [visibility]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnIgnoreListResponse" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: updateVisibilityUnIgnore
      summary: Replace the un-ignore pattern list for a central (admin)
      tags: [visibility]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnIgnoreUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnIgnoreUpdateResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /visibility/unignore/candidates:
    get:
      operationId: listVisibilityUnIgnoreCandidates
      summary: List parameter names that are currently hidden but could be un-ignored
      description: |-
        Returns the candidate set for the UI's multi-select picker. The
        `include_master` query flag controls whether MASTER paramset
        parameters are included — MASTER candidates are off by default
        because the search space is wider and the typical use case is
        promoting VALUES parameters (LOW_BAT, RSSI_PEER, …).
      tags: [visibility]
      parameters:
        - name: include_master
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnIgnoreCandidateList" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /matter/exposable:
    get:
      operationId: listMatterExposable
      summary: List every candidate source with current allowlist state + mappable verdict
      tags: [matter]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatterExposureList" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Matter bridge not enabled
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    put:
      operationId: updateMatterExposable
      summary: Update one allowlist row (admin)
      tags: [matter]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatterExposureUpdate" }
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Matter bridge not enabled
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /matter/exposable/bulk:
    post:
      operationId: bulkUpdateMatterExposable
      summary: Apply multiple allowlist updates at once (admin)
      tags: [matter]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatterExposureBulkUpdate" }
      responses:
        "200":
          description: Bulk applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateMatterExposableResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "204":
          description: No content — all updates failed or zero applied
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /matter/commissioning/window/close:
    post:
      operationId: closeMatterCommissioningWindow
      summary: Close an open Matter commissioning window early (admin)
      tags: [matter]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "204":
          description: Window closed
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Matter bridge not enabled
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /matter/share:
    post:
      operationId: shareMatterBridge
      summary: Open a commissioning window for a second Matter controller (admin)
      tags: [matter]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatterCommissioningWindowRequest" }
      responses:
        "200":
          description: Sharing window opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatterCommissioningWindowResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Commissioning window already open
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: >-
            Matter bridge not enabled, or its endpoint topology has not
            finished assembling yet — the latter carries a `Retry-After`
            header and clears on its own.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when the topology is still assembling.
              required: false
              schema: { type: integer }

  /matter/setup-payload:
    get:
      operationId: matterSetupPayload
      summary: Bridge's QR + manual pairing code
      description: >-
        Admin only. The response carries the commissioning passcode and the QR
        and manual codes derived from it, so anyone holding it can commission
        the bridge into their own fabric while a window is open.
      tags: [matter]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatterSetupPayload" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Matter commissioning not configured (passcode = 0)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /matter/commissioning/window:
    post:
      operationId: openMatterCommissioningWindow
      summary: Open a Matter commissioning window
      tags: [matter]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatterCommissioningWindowRequest" }
      responses:
        "200":
          description: Window opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatterCommissioningWindowResponse" }
        "400":
          description: duration_seconds out of range (180..900)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Commissioning window already open
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: >-
            Matter bridge not enabled, or its endpoint topology has not
            finished assembling yet — the latter carries a `Retry-After`
            header and clears on its own.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when the topology is still assembling.
              required: false
              schema: { type: integer }

  # ---- Config live-edit (Wave-C) ----
  /config/schema:
    get:
      operationId: getConfigSchema
      summary: Config field schema — section list + typed field descriptors
      description: |
        Returns the static descriptor of every config field the daemon
        exposes: which sections exist, the Go type of each field, and
        whether changing a field requires a daemon restart. The schema
        carries no secret values, but the route still sits behind the
        standard authenticated-session gate like every other /config/*
        route — any authenticated role may read it.
      tags: [config-admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaResponse" }

  /config/effective:
    get:
      operationId: getConfigEffective
      summary: Effective merged configuration with source annotations (admin)
      description: |
        Returns the current effective daemon configuration with every
        secret field redacted as "***". The `sources` map shows which
        layer supplied each path (bootstrap, db, env, or default).
      tags: [config-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigSnapshotResponse" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /config/sections/{section}:
    parameters:
      - name: section
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getConfigSection
      summary: Read one config section (admin)
      tags: [config-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Section value as JSON object
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: putConfigSection
      summary: Replace one config section (admin)
      tags: [config-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Section updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutConfigSectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteConfigSection
      summary: Delete one config section (admin)
      tags: [config-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "204":
          description: Deleted (idempotent — 204 even if section was absent)
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /config/fields/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema: { type: string }
        description: Dotted config field path, e.g. "north.rest.rate_limit.enabled".
    delete:
      operationId: resetConfigField
      summary: Reset one config field to its default (admin)
      description: >
        Removes the override for a single field from its owning section
        (pruning empty parent objects, dropping the section row when
        nothing is left), so the field falls back to the built-in
        default. Idempotent.
      tags: [config-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "204":
          description: Reset (idempotent — 204 even if already at default)
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /ui/surfaces:
    get:
      operationId: getUISurfaces
      summary: Config-UI surface registry and the live profile
      description: |
        Returns every addressable Config-UI surface (navigation items,
        settings tabs, device-detail tabs) with its shipped default per
        profile, plus the resolved visibility of the profile that is
        currently live.

        The navigation reads `effective`; the profile editor additionally
        needs the per-surface metadata (`defaults`, `floor`, `gate`,
        `opens`). Both come from this one payload so the two views
        cannot drift apart.

        Capability gates (Matter, measurement history) and role gates are
        NOT folded into `effective` — the client applies those, and they
        answer a different question than the operator's configuration.
      tags: [config-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurfacesResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: putUISurfaces
      summary: Update the surface profiles or the embedded master toggle (admin)
      description: |
        Both fields are optional: the row editor saves `profiles` without
        touching the mode, and the master toggle flips `embedded` without
        resending every row.

        `profiles` is stored sparsely. Entries equal to the shipped
        default, and ids this daemon does not know, are dropped rather
        than persisted — a stored entry that merely repeats today's
        default would pin it across upgrades.

        Purely navigational: hiding a surface removes it from this
        daemon's Config UI for every user and changes no permission. The
        REST, WebSocket and MQTT surfaces are unaffected — restrict those
        through roles and tokens. Audited like every other config write.

        Surfaces that can never be hidden (the device list, Settings, the
        profile editor, About, and — in the standalone profile — user and
        token administration) are rejected with 422 rather than silently
        ignored.
      tags: [config-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SurfacesRequest" }
      responses:
        "200":
          description: Saved — the new state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurfacesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: A surface that can never be hidden, or an invalid profile/state
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ---- User management (Wave-C) ----
  /users:
    get:
      operationId: listUsersV2
      summary: List all users (admin)
      tags: [user-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserSummary" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createUser
      summary: Create a new user (admin)
      description: |
        Create-only. Returns 409 Conflict when the username already
        exists (compared case-insensitively — usernames are stored
        lower-cased); change an existing account through
        PATCH /users/{subject}, which also revokes its live sessions.
      tags: [user-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSummary" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A user with this name already exists
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }

  /users/{subject}:
    parameters:
      - name: subject
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: patchUser
      summary: Update user password or role (admin)
      description: |
        Returns 409 Conflict when the change would demote the last admin
        account. The daemon enforces at least one admin at all times.
        Every live session of the subject is revoked on success.
      tags: [user-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot demote the last admin account
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteUser
      summary: Delete a user (admin)
      description: |
        Returns 409 Conflict when the deletion would remove the last
        admin account. The daemon enforces at least one admin at all
        times.
      tags: [user-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "204":
          description: Deleted
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot remove the last admin account
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---- Token management v2 (Wave-C) ----
  /auth/tokens/v2:
    get:
      operationId: listTokensV2
      summary: List API tokens with fingerprint + metadata (admin)
      tags: [token-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TokenSummary" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createTokenV2
      summary: Issue a new bearer token (admin) — plaintext shown exactly once
      description: |
        Generates a fresh bearer token bound to the supplied subject
        and role. The raw token value is returned exactly once in the
        201 response — the daemon stores only an opaque fingerprint
        thereafter. Clients MUST capture the `token` field on creation.
      tags: [token-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: Token created — raw value visible exactly once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/tokens/v2/{fingerprint}:
    delete:
      operationId: deleteTokenV2
      summary: Revoke an API token by fingerprint (admin)
      description: >-
        The revocation reaches both planes. REST stops immediately because
        every request re-resolves the credential; the WebSocket connections
        the token opened are closed as part of this call, because a socket
        resolves its identity once at the upgrade and would otherwise keep
        the revoked token's role until the client happened to reconnect.
      tags: [token-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Token revoked
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500": { $ref: "#/components/responses/InternalError" }

  # ---- Centrals CRUD (Wave-C) ----
  /centrals:
    get:
      operationId: listCentrals
      summary: List all configured centrals
      description: >-
        Open to any authenticated identity, because the energy, backup and
        rooms/functions views need the central list — but the row is
        narrowed below the admin role. A non-admin caller receives `name`,
        `enabled` and `interfaces`; `host` comes back empty and `serial`,
        `port`, `json_rpc_port`, `ports`, `username`, `password_env` and both
        TLS flags are omitted. Those fields say where the CCU lives and how
        it is reached, which none of the lower-privileged views use.
      tags: [central-admin]
      responses:
        "200":
          description: Central list (narrowed below the admin role — see description)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CentralRow" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createCentral
      summary: Create a new central (admin)
      tags: [central-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CentralRow" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CentralRow" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500": { $ref: "#/components/responses/InternalError" }

  /centrals/discovered:
    get:
      operationId: listDiscoveredCentrals
      summary: List CCUs found via SSDP/UPnP discovery
      description: >
        Central units discovered on the LAN via active SSDP/UPnP, excluding the
        ones the operator ignored. Each entry is flagged whether it is already
        configured (matched by host). Empty when discovery is disabled.
      tags: [central-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Discovered CCUs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoveredCentral"
  /centrals/discovered/ignored:
    get:
      operationId: listIgnoredCentrals
      summary: List the discovered CCUs the operator has ignored
      tags: [central-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Ignored CCUs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IgnoredCentral"
  /centrals/discovered/{serial}/ignore:
    parameters:
      - { in: path, name: serial, required: true, schema: { type: string } }
    post:
      operationId: ignoreDiscoveredCentral
      summary: Ignore a discovered CCU (admin)
      description: Hide a discovered CCU so it stops appearing in the discovery list.
      tags: [central-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "204": { description: Ignored }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: unignoreDiscoveredCentral
      summary: Un-ignore a discovered CCU (admin)
      tags: [central-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "204": { description: Un-ignored }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /centrals/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getCentral
      summary: Get a single central by name
      description: >-
        Open to any authenticated identity, and narrowed below the admin
        role exactly as `GET /centrals` is — see that operation for which
        fields a non-admin caller does and does not receive.
      tags: [central-admin]
      responses:
        "200":
          description: OK (narrowed below the admin role — see description)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CentralRow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: putCentral
      summary: Replace a central (admin)
      tags: [central-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CentralRow" }
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteCentral
      summary: Delete a central (admin)
      tags: [central-admin]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "204":
          description: Deleted
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500": { $ref: "#/components/responses/InternalError" }

  /alarm/state:
    get:
      operationId: getAlarmState
      summary: Current live status of every alarm zone
      tags: [alarm]
      responses:
        "200":
          description: Per-zone alarm status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAlarmStateResponse"

  /alarm/zones:
    get:
      operationId: listAlarmZones
      summary: List all configured alarm zones
      tags: [alarm]
      responses:
        "200":
          description: Alarm zone list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmZone" }
    post:
      operationId: createAlarmZone
      summary: Create a new alarm zone (operator)
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmZoneCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlarmZone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /alarm/zones/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAlarmZone
      summary: Get a single alarm zone by id
      tags: [alarm]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlarmZone" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putAlarmZone
      summary: Replace an alarm zone (operator)
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmZone" }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      operationId: deleteAlarmZone
      summary: Delete an alarm zone (operator)
      description: Refused with 409 unless the zone is currently disarmed.
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /alarm/zones/{id}/sensors:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listAlarmZoneSensors
      summary: List the sensors enrolled in an alarm zone
      tags: [alarm]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmSensor" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putAlarmZoneSensors
      summary: Replace the full sensor set of an alarm zone (operator)
      description: >
        Bulk replace — the request body is the complete desired sensor
        list for the zone; sensors omitted from the body are removed.
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/AlarmSensor" }
      responses:
        "204": { description: Replaced }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /alarm/zones/{id}/outputs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listAlarmZoneOutputs
      summary: List the outputs enrolled in an alarm zone
      tags: [alarm]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmOutput" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putAlarmZoneOutputs
      summary: Replace the full output set of an alarm zone (operator)
      description: >
        Bulk replace — the request body is the complete desired output
        list for the zone; outputs omitted from the body are removed.
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/AlarmOutput" }
      responses:
        "204": { description: Replaced }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /alarm/zones/{id}/arm:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: armAlarmZone
      summary: Arm an alarm zone (operator)
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmArmRequest" }
      responses:
        "200":
          description: >
            Arming accepted. The zone may now be counting down an exit
            delay (state `arming`) or already armed (`exit_delay_s: 0`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlarmArmAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: >
            The zone's code policy requires an arm code and the supplied
            `code` is missing or wrong. The detail stays opaque
            (`invalid_code`) so a prober learns nothing about which codes
            exist.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Arming refused — readiness blockers are present for the
            requested mode. The problem detail's `errors` array carries
            the blocker list (mirrors AlarmModeReadiness.blockers).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /alarm/zones/{id}/disarm:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: disarmAlarmZone
      summary: Disarm an alarm zone (operator)
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: false
        description: >
          Optional disarm code. An absent body disarms code-free; an
          operator-session surface is permitted to do so even when a
          code policy is set (break-glass).
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmVerbRequest" }
      responses:
        "204": { description: Disarmed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/AlarmInvalidCode" }
        "404": { $ref: "#/components/responses/NotFound" }

  /alarm/zones/{id}/silence:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: silenceAlarmZone
      summary: Silence the active incident on an alarm zone without disarming (operator)
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: false
        description: >
          Optional silence code, for surfaces whose per-surface policy
          requires one (silence is code-free by default, S3).
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmVerbRequest" }
      responses:
        "204": { description: Silenced }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/AlarmInvalidCode" }
        "404": { $ref: "#/components/responses/NotFound" }

  /alarm/zones/{id}/acknowledge:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: acknowledgeAlarmZone
      summary: Acknowledge (clear) a finished incident on an alarm zone (operator)
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: false
        description: >
          Accepts the shared optional code body for surface symmetry, but
          acknowledge is journal-only with no code gate — a supplied code
          is inert here.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmVerbRequest" }
      responses:
        "204": { description: Acknowledged }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /alarm/silence-all:
    post:
      operationId: silenceAllAlarmZones
      summary: Silence the active incident on every alarm zone at once (operator)
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "204": { description: Silenced }

  /alarm/reset-motion:
    post:
      operationId: resetAllAlarmMotion
      summary: Clear every latched motion detector across all zones (operator)
      description: >-
        Writes RESET_MOTION on the enrolled detectors that are currently
        latched and whose channel exposes the parameter. Detectors that are
        not triggered are left alone, so a routine call adds no radio
        traffic. A device that fails to answer is counted in `failed` and
        does not fail the request — the verb ran.
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "200":
          description: Reset pass completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlarmMotionResetResult" }

  /alarm/triggered-motion:
    get:
      operationId: listAlarmTriggeredMotion
      summary: List the latched motion detectors that a reset would clear
      description: >-
        The list is derived from the same predicate the reset verb uses, so
        it never names a detector the reset would skip.
      tags: [alarm]
      parameters:
        - name: zone_id
          in: query
          required: false
          schema: { type: string }
          description: Restrict to one zone; omit for every zone.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmTriggeredMotionSensor" }

  /alarm/zones/{id}/reset-motion:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: resetAlarmZoneMotion
      summary: Clear the latched motion detectors of one zone (operator)
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "200":
          description: Reset pass completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlarmMotionResetResult" }

  /alarm/zones/{id}/readiness:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAlarmZoneReadiness
      summary: Per-mode arm-readiness of an alarm zone
      tags: [alarm]
      responses:
        "200":
          description: Readiness verdict for every mode configured on the zone, keyed by mode name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: "#/components/schemas/AlarmModeReadiness" }
        "404": { $ref: "#/components/responses/NotFound" }

  /alarm/panels:
    get:
      operationId: listAlarmPanels
      summary: List the alarm-control-panel entity projections
      description: |
        The HA-facing entity view of every alarm zone (plus the
        aggregate master panel when two or more zones exist) — the
        same projection the MQTT discovery entities and the
        `alarm.panel_changed` WebSocket broadcast carry.
      tags: [alarm]
      responses:
        "200":
          description: Panel entities.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmPanelEntity" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /alarm/journal:
    get:
      operationId: listAlarmJournal
      summary: Query the alarm engine's event journal
      tags: [alarm]
      parameters:
        - in: query
          name: zone
          schema: { type: string }
          description: Only return entries for this alarm zone id.
        - in: query
          name: class
          schema:
            type: string
            enum: [arm, disarm, trigger, silence, bypass, fault, test, config, maintenance]
          description: Only return entries in this journal class.
        - in: query
          name: from
          schema: { type: string, format: date-time }
          description: >
            Only return entries at-or-after this value (inclusive, RFC3339).
            Returns 400 if the value cannot be parsed.
        - in: query
          name: to
          schema: { type: string, format: date-time }
          description: >
            Only return entries strictly before this value (exclusive, RFC3339).
            Returns 400 if the value cannot be parsed.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
          description: >
            Maximum entries to return. 0 or absent uses the default (500).
            Values above 5000 are capped to 5000.
        - in: query
          name: include_hidden
          schema: { type: boolean, default: false }
          description: >
            Admin-only. Hidden rows (duress events) are kept off the default
            feed for every role so an intruder next to a coerced operator sees
            a clean journal. Setting `include_hidden=true` on a request made
            with an admin identity is the sanctioned audit-read path that
            recovers them; the flag is ignored for any non-admin request or an
            admin request that omits it.
      responses:
        "200":
          description: Filtered journal entries (newest first).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmJournalEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /security:
    get:
      operationId: getSecuritySnapshot
      summary: The Security & Safety domain state
      description: >
        What is active per hazard class and per zone, what is broken and since
        when, and what was last reported. The domain runs independently of the
        alarm engine: an installation with smoke and water detectors but no
        burglar alarm still gets the hazard classes, the fault plane and the
        notifications — only `zones` stays empty.


        A class the installation has no source for is omitted rather than
        reported inactive, so a home without gas detectors does not advertise a
        permanently-off gas alarm.
      tags: [security]
      responses:
        "200":
          description: The domain snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySnapshot" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /security/classes/{class}:
    parameters:
      - name: class
        in: path
        required: true
        schema:
          type: string
          enum: [smoke, water, gas, co, tamper, battery, technical, intrusion, panic]
    get:
      operationId: getSecurityClass
      summary: One hazard or fault class with its full source list
      tags: [security]
      responses:
        "200":
          description: The class state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityClassState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: The class is defined but this installation has no source for it.
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /security/sources:
    get:
      operationId: listSecuritySources
      summary: The classified data-point inventory
      description: >
        What the domain believes about every data point it knows: the class it
        was given, whether an operator overrode that, whether an alarm zone
        holds it, and whether it currently contributes to an aggregate.


        The unfiltered list is deliberately available. A source the classifier
        got wrong is invisible in every aggregate, so listing everything is the
        only way to find it.
      tags: [security]
      parameters:
        - in: query
          name: class
          schema:
            type: string
            enum: [smoke, water, gas, co, tamper, battery, technical, intrusion, panic]
        - in: query
          name: central
          schema: { type: string }
        - in: query
          name: zone_id
          schema: { type: string }
        - in: query
          name: relevant
          schema: { type: string, enum: ["true"] }
          description: Only sources that contribute to an aggregate.
        - in: query
          name: active
          schema: { type: string, enum: ["true"] }
      responses:
        "200":
          description: The inventory.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecuritySourceView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /security/sources/{ref}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string }
        description: >
          The routing key `<central>|<interface_id>|<channel_address>|<parameter>`,
          URL-encoded.
    put:
      operationId: putSecuritySourceOverride
      summary: Override the classification of one data point (operator)
      description: >
        An empty class with `included: true` and no note removes the override,
        returning the data point to the classifier's verdict — the undo a wrong
        override needs.
      tags: [security]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecuritySourceOverride" }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /security/faults:
    get:
      operationId: listSecurityFaults
      summary: The standing fault ledger
      description: >
        Faults are persistent because `since` is the interesting part —
        "unreachable for three days" is a different fact from "unreachable", and
        a restart must not reset that clock.
      tags: [security]
      responses:
        "200":
          description: Standing faults, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecurityFault" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /security/faults/{id}/acknowledge:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: acknowledgeSecurityFault
      summary: Mark a standing fault as seen (operator)
      description: >
        Acknowledgement never clears the fault: the condition is still there,
        the operator has merely stopped needing to be told.
      tags: [security]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "204": { description: Acknowledged }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /alarm/sensor-candidates:
    get:
      operationId: listAlarmSensorCandidates
      summary: List the data points a zone can enrol as alarm sensors
      description: >
        Sensor enrollment was the one alarm surface without a candidate list —
        outputs and remote keys had one, sensors were unvalidated free text over
        (central, interface, channel address, parameter), so a typo produced a
        sensor that silently never fired.


        Each candidate carries the pre-fill an enrollment needs: the suggested
        alarm role, the hazard class, the parameter's value list, and
        `active_values` wherever the default "anything but index 0 is active"
        rule would be wrong. The clearest case is
        `SMOKE_DETECTOR_ALARM_STATUS`, whose value list contains
        `INTRUSION_ALARM` — the alarm system driving that detector as a siren,
        not a smoke detection.
      tags: [alarm]
      parameters:
        - in: query
          name: enrolled
          schema: { type: string, enum: ["false"] }
          description: Pass `false` to hide data points a zone already holds.
      responses:
        "200":
          description: Enrollable sensor data points.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmSensorCandidate" }

  /alarm/incidents:
    get:
      operationId: listAlarmIncidents
      summary: List the incident history of one alarm zone
      description: >
        Returns the zone's alarm episodes, newest first. Unlike the journal —
        which records individual events — an incident is the whole episode, and
        it carries the full source ledger: every data point that contributed,
        not only the one that opened it. A second detector firing while the
        siren already sounds appears in `sources` and nowhere else.
      tags: [alarm]
      parameters:
        - in: query
          name: zone_id
          required: true
          schema: { type: string }
          description: The alarm zone whose incidents to return.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
          description: Maximum incidents to return.
      responses:
        "200":
          description: Incidents of the zone (newest first).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmIncident" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /alarm/incidents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getAlarmIncident
      summary: Get one alarm incident with its full source ledger
      tags: [alarm]
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlarmIncident" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /alarm/zones/{id}/walktest/start:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: startAlarmWalkTest
      summary: Start a walk-test session on an alarm zone (operator)
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "204": { description: Started }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /alarm/zones/{id}/walktest/stop:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: stopAlarmWalkTest
      summary: Stop the running walk-test session on an alarm zone (operator)
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "204": { description: Stopped }
        "404": { $ref: "#/components/responses/NotFound" }

  /alarm/zones/{id}/walktest:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAlarmWalkTestStatus
      summary: Live status of an alarm zone's walk-test session
      tags: [alarm]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlarmWalkTestStatus" }
        "404": { $ref: "#/components/responses/NotFound" }

  /alarm/output-candidates:
    get:
      operationId: listAlarmOutputCandidates
      summary: Channels that can back a device-backed alarm output class
      description: >
        Enumerates every channel across all centrals whose custom data
        point can carry at least one device-backed output class
        (acoustic_siren, optical_siren, switched_siren, smoke_sounder,
        alarm_light, chirp). Derived from the live domain model — a
        candidate always resolves to an output driver at runtime.
        Notification and sysvar_mirror outputs are not device-backed
        and never appear; passing them as `class` is rejected.
      tags: [alarm]
      parameters:
        - name: class
          in: query
          required: false
          description: Restrict to channels that can carry this class.
          schema:
            type: string
            enum:
              - acoustic_siren
              - optical_siren
              - switched_siren
              - smoke_sounder
              - alarm_light
              - chirp
      responses:
        "200":
          description: Candidate channel list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmOutputCandidate" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /alarm/remote-key-candidates:
    get:
      operationId: listAlarmRemoteKeyCandidates
      summary: Remote/wall-button key channels usable for remote-key code bindings
      description: >
        Enumerates every channel across all centrals that emits a
        key-press parameter the alarm intent router dispatches
        remote-key code bindings on (PRESS_SHORT / PRESS_LONG) — e.g.
        the HmIP-KRCA keyfob buttons. Virtual remote channels are
        excluded; they can still be bound via a raw binding document.
      tags: [alarm]
      responses:
        "200":
          description: Remote key candidate list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmRemoteKeyCandidate" }

  /alarm/outputs/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: testAlarmOutput
      summary: Fire an alarm output briefly for a walk test (operator)
      description: >
        Refused with 409 for outputs of class `smoke_sounder` —
        smoke-detector sounders are excluded from live output tests.
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmOutputTestRequest" }
      responses:
        "204": { description: Test fired }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Refused — smoke-detector sounders cannot be live-tested via this endpoint.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /alarm/codes:
    get:
      operationId: listAlarmCodes
      summary: List alarm codes (operator)
      description: >
        Codes are security material, so even the list is operator-gated,
        never viewer-open. The argon2id
        hash and cleartext PIN are never returned. 503 when the alarm-code
        subsystem is not wired.
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "200":
          description: Every configured alarm code (hash-free).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmCode" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createAlarmCode
      summary: Create an alarm code (operator)
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmCodeRequest" }
      responses:
        "201":
          description: The created code (hash-free).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlarmCode" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /alarm/codes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAlarmCode
      summary: Get one alarm code (operator)
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "200":
          description: The alarm code (hash-free).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlarmCode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: putAlarmCode
      summary: Replace an alarm code (operator)
      description: An empty `pin` keeps the stored hash.
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlarmCodeRequest" }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteAlarmCode
      summary: Delete an alarm code (operator)
      tags: [alarm]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Username + password (operator-grade or above for mutations).
        The role hierarchy (viewer ⊂ operator ⊂ admin) is enforced
        server-side regardless of authentication scheme.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API token issued via the auth tokens surface (admin-only
        provisioning). Token's stored role determines authorisation.
    openIdConnect:
      type: openIdConnect
      description: |
        OpenID Connect authentication. The operator configures the
        OIDC discovery URL; the placeholder below is the standard
        well-known path. Per-operation `security:` blocks express
        the **minimum role** the daemon enforces via OIDC-style
        scopes — the same enforcement applies when the client
        authenticates via basicAuth or bearerAuth, but those schemes
        cannot natively express scopes in OpenAPI 3.x.

        Scope vocabulary mirrors `Identity.role`:
          - `viewer` — read-only operations
          - `operator` — mutations (write data points, manage links,
            edit schedules, run config-import, trigger refresh)
          - `admin` — dangerous operations (delete device, edit log
            levels, list users/tokens, trigger backup, manage
            interfaces, edit Matter fabrics)
      openIdConnectUrl: /.well-known/openid-configuration
  parameters:
    Address:
      name: addr
      in: path
      required: true
      schema: { type: string }
    ChannelNo:
      name: no
      in: path
      required: true
      schema: { type: integer, minimum: 0 }
    Parameter:
      name: param
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: |
        Optional client-supplied UUID for retry deduplication on
        mutating requests. The daemon caches the response per
        `(method, path, key)` for 5 minutes; a retry with the same key
        within that window replays the cached response and sets the
        `Idempotent-Replay: true` response header. Keys older than 5
        minutes (or evicted under memory pressure) flow through as
        fresh requests. The cache key does NOT include the request
        body — a retry MUST use the same body as the original; the
        daemon trusts the client's key choice.
  responses:
    BadRequest:
      description: Validation or parsing failure
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated but forbidden for the current role
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AlarmInvalidCode:
      description: >
        The zone's code policy requires a code and the supplied `code` is
        missing or wrong. The detail stays opaque (`invalid_code`) so a
        prober learns nothing about which codes exist.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadGateway:
      description: Upstream error (CCU unavailable, write failed)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: Backend not wired
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Request conflicts with current server state
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Locked:
      description: >-
        The write was refused by a lock, not by the CCU — nothing reached
        the wire and a retry cannot help until the lock is lifted. Either
        the resource is held by an edit session and the request did not
        present a valid X-Edit-Token for it, or the operator has locked the
        channel against control writes (see
        `PUT /devices/{addr}/channels/{no}/flags`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: Semantic validation failure
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    StartupCaptureConfig:
      type: object
      required: [enabled, duration_seconds, anonymise]
      additionalProperties: false
      description: >-
        The stored startup-capture toggle as the daemon reports it. Every
        field is always present in responses; the write shape with its
        omitted-key semantics is `StartupCaptureConfigWrite`.
      properties:
        enabled:
          type: boolean
          description: When true, the daemon opens a diagnostics capture at boot.
        duration_seconds:
          type: integer
          minimum: 0
          maximum: 1800
          description: Duration of the boot-time capture. Zero falls back to the default (300 s).
        anonymise:
          type: boolean
          description: >-
            Whether device-address-shaped values in the recorded archive are
            hashed. Responses always carry the effective value.
    StartupCaptureConfigWrite:
      type: object
      required: [enabled, duration_seconds]
      additionalProperties: false
      description: >-
        Write shape of the startup-capture toggle. `anonymise` may be
        omitted and then means true — the boot capture has no later chance
        to ask, so an unstated preference must not end up archiving raw
        device addresses.
      properties:
        enabled:
          type: boolean
          description: When true, the daemon opens a diagnostics capture at boot.
        duration_seconds:
          type: integer
          minimum: 0
          maximum: 1800
          description: Duration of the boot-time capture. Zero falls back to the default (300 s).
        anonymise:
          type: boolean
          default: true
          description: >-
            Whether to hash device-address-shaped values in the recorded
            archive. Omitting the key means true; send `false` explicitly
            to switch anonymisation off.

    ExportedConfiguration:
      type: object
      required:
        - version
        - exported_at
        - device_address
        - model
        - channel_address
        - channel_type
        - paramset_key
        - values
      description: |
        Portable snapshot of one channel's paramset. Compatible with the
        Python aiohomematic-config exporter (identical JSON tag names).
      properties:
        version:
          type: string
          description: Serialisation format version. Always "1.0".
          example: "1.0"
        exported_at:
          type: string
          format: date-time
          description: UTC instant at which the snapshot was taken.
        central_name:
          type: string
          description: >
            CCU name that owns this channel (multi-CCU safe). Empty
            for single-CCU setups.
        device_address:
          type: string
          description: Serial / address of the parent device, e.g. "0001ABCD".
        model:
          type: string
          description: Device model string, e.g. "HmIP-eTRV-2".
        channel_address:
          type: string
          description: Full channel address including channel index, e.g. "0001ABCD:1".
        channel_type:
          type: string
          description: Functional type of the channel, e.g. "CLIMATE_TRANSCEIVER".
        paramset_key:
          type: string
          description: Name of the exported paramset, typically "MASTER" or "VALUES".
        values:
          type: object
          additionalProperties: true
          description: Parameter name → value mapping captured at export time.
    CustomDPInvokeRequest:
      type: object
      description: "Body for POST /cdps/{name}/{operation}. The operation is in the URL path."
      properties:
        params:
          type: object
          additionalProperties: true
          description: "Operation-specific parameters (category-dependent)."
        priority:
          type: string
          enum: [critical, high, default, low]
    CustomDPSummary:
      type: object
      required: [name, unique_id, category, channel_no, supported_operations]
      properties:
        name:
          type: string
          description: |
            Wire identity of the Custom-DP. The bare parameter name
            (`LEVEL`, `BUTTON_LOCK`) when it is unique on the device;
            `PARAM@<channel>` (e.g. `LEVEL@5`) when a profile channel
            group materialises the same parameter on multiple channels.
            Round-trip this value verbatim into `GET/POST …/cdps/{name}`.
        category: { type: string }
        channel_no: { type: integer }
        supported_operations:
          type: array
          items: { type: string }
        kind:
          type: string
          description: |
            Stable widget hint derived from the concrete Custom-DP
            type — e.g. `light`, `light_color`, `light_color_temp`,
            `light_fixed_color`, `light_rgbw`, `cover_blind`,
            `cover_garage`, `climate_hmip`, `climate_rf`,
            `climate_simple`, `lock`, `siren`, `switch`,
            `text_display`. Drives the SPA's CDP-aware widget
            selection (ADR 0016). Empty when the kind classifier
            does not recognise the Custom-DP type.
        channels:
          type: array
          items: { type: integer }
          description: |
            CCU channels this Custom-DP is materialised on. The
            current implementation always contains exactly the
            primary channel (matching `channel_no`); future
            iterations may expand to include sibling channels
            pulled in via the `RebasedChannelGroupConfig`
            mechanism.
        capabilities:
          type: object
          additionalProperties: { type: boolean }
          description: |
            Flat string→bool map of optional features the device
            supports — e.g. `dimmable`, `color`, `color_temp`,
            `effects`, `tilt`, `boost`, `away`. Mirrors the
            per-category Capability struct from
            `internal/model/custom/mixins.go`.
        config:
          type: object
          additionalProperties: true
          description: |
            Static configuration block from the Custom-DP — temperature
            bounds (`min_temp`, `max_temp`, `temp_step`), available
            `hvac_modes`, available `preset_modes`, capability hints.
            Populated from the DP's `Config()` ([payload.Source]).
            Lets clients render kind-specific choice lists and seed
            HA entity capabilities without a second round-trip.
        state:
          type: object
          additionalProperties: true
          description: |
            Live state snapshot from the Custom-DP — the same semantic
            keys the WS `custom_data_point.state_changed` event carries
            (`is_locked`, `hvac_mode`, `brightness`, …). Lets clients
            seed entity state at bootstrap without one extra
            round-trip per CDP.
        unique_id:
          type: string
          description: |
            Canonical loom routing key for this Custom-DP — the same
            value the WS `custom_data_point.state_changed` payload
            carries. Lets a client build its entity registry from the
            summary without recomputing the key. Always present and non-empty: a central serves no entity until its CCU serial (the central-id slot of the key) is resolved by the bring-up readiness gate.
        translated_name:
          type: string
          description: |
            Channel-level entity display name, fully composed by the
            daemon: a custom channel name verbatim, the `ch<no>` /
            `vch<no>` channel-group marker for derived names, or the
            locale-aware postfix label (button locks). Device-name
            prefix stripped; empty when the name collapses to the
            device name alone. Consumers render it verbatim — the
            daemon is the single naming authority.
        parameter_name:
          type: string
          description: |
            Untranslated marker / postfix portion of the entity name
            (`ch6`, `vch5`, `Button Lock`); empty when the entity is
            named after the channel or device alone. Mirrors the
            reference schema's `DataPointNameData.parameter_name`.
    Problem:
      type: object
      description: |
        RFC 9457 problem detail. The `type` URI selects one of the
        canonical problem kinds the daemon emits; the `code` member
        carries the short tag (also surfaced as the `X-Problem-Code`
        response header). Clients should switch on `code` for typed
        error handling — the `type` URI is the human-readable form.

        **Rate-limiting:** when the daemon emits `code: rate_limited`
        (HTTP 429) it sets the `Retry-After` response header per
        RFC 9110 §10.2.3 with the integer number of seconds the
        client should wait before retrying. Clients that respect
        the header are immune to the throttle; clients that don't
        will see repeated 429s with the same `Retry-After` value
        until the throttle window expires.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            Stable URI for one of the canonical problem kinds. All
            URIs share the base `https://openccu-loom.dev/errors/`
            and the trailing segment matches the `code` enum below.
            The base URI is a stable identifier, not a fetchable
            resource — it is not guaranteed to resolve to a document.
          enum:
            - https://openccu-loom.dev/errors/validation
            - https://openccu-loom.dev/errors/not_found
            - https://openccu-loom.dev/errors/conflict
            - https://openccu-loom.dev/errors/unauthorized
            - https://openccu-loom.dev/errors/forbidden
            - https://openccu-loom.dev/errors/unsupported
            - https://openccu-loom.dev/errors/rate_limited
            - https://openccu-loom.dev/errors/internal
            - https://openccu-loom.dev/errors/bad_request
            - https://openccu-loom.dev/errors/service_unready
            - https://openccu-loom.dev/errors/upstream_unavailable
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Short tag (also surfaced as the `X-Problem-Code` response header).
          enum:
            - validation
            - not_found
            - conflict
            - unauthorized
            - forbidden
            - unsupported
            - rate_limited
            - internal
            - bad_request
            - service_unready
            - upstream_unavailable
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }
              min: {}
              max: {}
    Info:
      type: object
      required:
        [version, commit, build_date, addon_build, uptime, started_at, config_ui_url,
         api_version, schema_digest, capabilities]
      description: |
        Daemon build + runtime info plus a wire-contract version and a
        capability list. External clients should switch on
        `capabilities` for feature gating rather than parsing
        `version` (the daemon build version) — capabilities can be
        added or removed independently of build version.
      properties:
        version: { type: string, description: "Daemon build version (semver)." }
        commit: { type: string }
        build_date: { type: string }
        addon_build:
          type: boolean
          description: |
            True when this binary was built as the CCU/RaspberryMatic
            add-on (it then runs on the CCU itself). False for the
            standalone binary, Docker image, and HA add-on builds.
        uptime: { type: string }
        started_at: { type: string, format: date-time }
        config_ui_url:
          type: string
          description: |
            Externally-reachable address of this daemon's Config UI,
            derived from `north.rest.public_url` with the SPA mount
            appended. Empty when no public URL is configured.

            It answers a question a client cannot answer for itself: the
            address a client uses to TALK to the daemon (a container
            network, a LAN address behind a reverse proxy) is not
            necessarily one a browser can follow. Only the operator knows
            that, and `public_url` is where they record it. A client that
            wants to link a person at the Config UI reads this and falls
            back to guessing from its own connection address when empty.

            The mount path is appended by the daemon on purpose — a
            client that had to know where the SPA is mounted would break
            on the next mount change.
          example: https://loom.example.de/app/
        api_version:
          type: string
          description: |
            North-bound contract version (semver). Bumps independently
            of `version`. Minor bumps add backwards-compatible
            capabilities; major bumps remove or rename existing
            payload fields, scopes, or capabilities.
        schema_digest:
          type: string
          description: |
            Canonical digest of the contract assets (openapi.yaml,
            wsapi.json, schemas/enums.json, schemas/types.json) this
            binary was built from, e.g. `sha256:ab12…`. Generated
            client type packages carry the same value; a client
            compares the two at connect time to verify its types
            match the daemon build exactly. Equality means exact
            contract identity; inequality means the types were
            generated from a different build (not necessarily an
            incompatible one — use `api_version` for compatibility
            reasoning).
          examples:
            - "sha256:0c63c1e3a9f0b14d2e5b7a86c14d9b21f0aa3340be71f5c6d8e92041ab57cd10"
        capabilities:
          type: array
          description: |
            Runtime feature set. Always-on entries:
            `rest.v1`, `ws.broadcasts.v1`, `errors.problem_details.v1`.
            Conditional entries surface only when configured:
            `mqtt.discovery.v1`, `mqtt.raw.v1`, `matter.bridge.v1`,
            `auth.oidc.v1`, `auth.ccu.v1`, `webhook.inbound.v1`,
            `diagrams.v1`, `admin.persistence.v1`, `history.v1`,
            `mcp.v1`, `mcp.write.v1`, `system.restart.supervised.v1`,
            `addon_self_update`, `alarm.v1` (the `/alarm` surface is
            mounted — absent, the alarm subsystem is off and every
            `/alarm` route answers 404).

            `mcp.write.v1` implies `mcp.v1`; `addon_self_update` predates
            the `<area>.<feature>.v<n>` convention and keeps its spelling
            because renaming a token a client already matches on is a
            breaking change.

            A token means the daemon is CONFIGURED for that capability,
            not that the subsystem is working at this instant. It answers
            "may I use this path at all", which is what a client needs to
            build its feature set; a broker that is briefly unreachable is
            not a missing capability, and a token that came and went with
            connectivity would force every client to re-derive its
            surface on each poll. For what is running right now, read
            `/health`, whose components report liveness.

            Open-ended on purpose: the daemon may advertise additional
            capabilities (e.g. `system.restart.supervised.v1`, `mcp.v1`)
            as features are added. Clients MUST treat this as a forward-
            compatible string set and ignore values they do not recognise
            — never reject an `Info` payload because of an unknown entry.
          items:
            type: string
            examples:
              - rest.v1
              - ws.broadcasts.v1
              - errors.problem_details.v1
              - mqtt.discovery.v1
              - mqtt.raw.v1
              - matter.bridge.v1
              - auth.oidc.v1
              - webhook.inbound.v1
              - diagrams.v1
              - admin.persistence.v1
    GroupCentralEntry:
      type: object
      required: [central, groups]
      description: One central's heating-group roster.
      properties:
        central:
          type: string
          description: Daemon-local central name the groups belong to.
        groups:
          type: array
          items: { $ref: "#/components/schemas/GroupEntry" }
    GroupEntry:
      type: object
      required: [id, name, forbid_single_operation, type_id, members]
      description: |
        One Homematic heating group (HmIP / BidCos), as read from the
        CCU's groups.gson via `CCU.getHeatingGroupList`. Read-only — the
        create / edit / delete surface runs through the CCU jpages proxy
        (see ADR 0055) and is exposed separately.
      properties:
        id:
          type: integer
          description: Numeric CCU group id.
        name:
          type: string
          description: Operator-facing group name.
        group_device_name:
          type: string
          description: Label of the backing virtual device; often empty.
        forbid_single_operation:
          type: boolean
          description: The "operate only via group" flag.
        type_id:
          type: string
          description: Group-type key.
        type_label:
          type: string
          description: CCU-provided type label (may be a translation key).
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMemberEntry" }
    GroupMemberEntry:
      type: object
      required: [address]
      description: One device or channel wired into a heating group.
      properties:
        address:
          type: string
          description: Member device or channel address.
        type_id:
          type: string
          description: Member-type key.
        device_name:
          type: string
          description: >-
            CCU-assigned name of the member's parent device, resolved from the
            live device model. Omitted when the member is not in the model; the
            client then falls back to the address.
        device_model:
          type: string
          description: Parent device model (e.g. "HmIP-STHD").
        channel_name:
          type: string
          description: CCU-assigned channel name, when the member is a channel.
        rooms:
          type: array
          items: { type: string }
          description: Member's assigned rooms (channel's, falling back to the device's).
    CreateGroupRequest:
      type: object
      required: [type_id, name]
      description: Body of POST /groups.
      properties:
        type_id:
          type: string
          description: Group-type key (e.g. the HmIP heating-group type).
        name:
          type: string
          description: Operator-facing group name.
        forbid_single_operation:
          type: boolean
          description: The "operate only via group" flag.
        members:
          type: array
          items: { type: string }
          description: Member channel/device addresses to assign.
    UpdateGroupRequest:
      type: object
      required: [name]
      description: Body of PUT /groups/{id}.
      properties:
        name:
          type: string
        forbid_single_operation:
          type: boolean
        members:
          type: array
          items: { type: string }
    GroupTypeEntry:
      type: object
      required: [id]
      description: One assignable group type for the create form.
      properties:
        id:
          type: string
        label_key:
          type: string
          description: CCU translation key for the type label.
    SuitableMemberEntry:
      type: object
      required: [address]
      description: >
        One device/channel assignable to a group of a given type. The fields
        after `type` are best-effort enrichment resolved from the live device
        model so a client can identify, group and filter candidates instead of
        showing a flat address list; they are omitted when the member is not
        (yet) present in the model.
      properties:
        address:
          type: string
        serial:
          type: string
        type:
          type: string
          description: Member kind (e.g. SENSOR_WINDOW, SWITCH_ACTUATOR).
        device_address:
          type: string
          description: Parent device address (address without the channel suffix); group channels by it.
        device_name:
          type: string
          description: CCU-assigned device name.
        device_model:
          type: string
          description: Device model (e.g. HmIP-eTRV-2).
        channel_name:
          type: string
          description: CCU-assigned channel name.
        channel_no:
          type: integer
          description: Channel number within the device.
        rooms:
          type: array
          items: { type: string }
          description: Rooms the channel (or its device) is assigned to.
        functions:
          type: array
          items: { type: string }
          description: Functions the channel (or its device) is assigned to.
        config_pending:
          type: boolean
          description: >
            True when the device still has a pending configuration
            (CONFIG_PENDING) and cannot be assigned to a group yet; a client
            shows it as a non-selectable candidate with a hint.
    SuitableMembersResponse:
      type: object
      required: [assignable, leftover]
      description: Candidate members for a group type.
      properties:
        assignable:
          type: array
          items: { $ref: "#/components/schemas/SuitableMemberEntry" }
        leftover:
          type: array
          items: { $ref: "#/components/schemas/SuitableMemberEntry" }
    SystemCCUEntry:
      type: object
      required: [name, host, available, is_ha_app, configured_interfaces, readiness]
      description: |
        One CCU as known to the daemon. `name` is the daemon-local
        identifier (config-driven, multi-CCU-safe). The other fields
        either come from the static config (`host`, `configured_interfaces`)
        or from the CCU itself — its reported SystemInformation block
        (`model`, `version`, `hostname`, `serial`, `url`, `is_ha_app`),
        its security posture (`auth_enabled`,
        `https_redirect_enabled`) and the interface list it reports for
        itself (`ccu_interfaces`). The CCU-sourced set may be empty
        before the first successful connect.

        NORMATIVE — central-scope identity. `name` is the single
        scoping discriminator for a CCU across the whole API and is
        guaranteed equal to both `CentralRow.name` (the persisted
        config record) and the `central` field carried in every
        WebSocket / payload envelope:

            SystemCCUEntry.name == CentralRow.name == payload.central

        External clients resolve a CCU by its real-world `serial` and
        then scope all per-central requests / subscriptions by this
        `name`. The daemon never uses `name` as a Home Assistant
        entity-identity key — that is owned by the client (see
        docs/external-clients/ha-drop-in-identity-and-scoping.md).
      properties:
        name:
          type: string
          description: |
            Daemon-local scoping identifier. Equal to `CentralRow.name`
            and to the `central` field in WS / payload envelopes; unique
            per daemon.
        host: { type: string }
        available: { type: boolean }
        model: { type: string }
        version: { type: string }
        hostname: { type: string }
        serial: { type: string }
        url: { type: string, format: uri }
        is_ha_app: { type: boolean }
        configured_interfaces:
          type: array
          items: { type: string }
        auth_enabled:
          type: boolean
          description: |
            Whether the CCU requires authentication on its own
            interfaces. False both when the CCU runs unauthenticated and
            when its firmware does not answer the query — a status-page
            hint, not a security guarantee.
        https_redirect_enabled:
          type: boolean
          description: |
            Whether the CCU redirects plain HTTP to HTTPS. Same caveat as
            `auth_enabled`.
        longitude:
          type: number
          description: |
            The CCU's astro reference longitude in decimal degrees. Every
            sunrise/sunset time the CCU computes derives from it, so a
            wrong value skews astro schedules silently. Absent while the
            position is unresolved — never reported as 0, which is a real
            coordinate.
        latitude:
          type: number
          description: |
            The CCU's astro reference latitude in decimal degrees. Same
            absence rule as `longitude`.
        timezone:
          type: string
          description: |
            The CCU's configured IANA time zone (e.g. `Europe/Berlin`),
            read from its time configuration. Read-only here: it is set on
            the CCU itself.
        recovery_mode_supported:
          type: boolean
          description: |
            Whether this CCU offers a recovery system
            (`POST .../recovery-mode`). True for OpenCCU / RaspberryMatic
            firmware, false for a stock CCU3 and while the product is not
            yet known — so a client hides the action rather than offering
            one that cannot work.
        ccu_interfaces:
          type: array
          description: |
            The interface adapters the CCU reports for itself — the
            CCU-side counterpart to `configured_interfaces`. Absent until
            the first successful connect round; a difference between the
            two lists is the interesting signal.
          items:
            type: object
            required: [type, address, port]
            properties:
              type:
                type: string
                description: CCU interface type string (e.g. `HmIP-RF`).
              address:
                type: string
                description: Interface identifier the CCU uses in callbacks.
              port:
                type: integer
                description: XML-RPC port the interface listens on.
              url:
                type: string
                description: Full XML-RPC endpoint URL the CCU reports.
        readiness:
          type: object
          required: [phase, ready, interfaces_loaded, interfaces_total]
          description: |
            Where the central is in its readiness-gated southbound
            bring-up, so the SPA can distinguish "still initializing"
            from "offline".
          properties:
            phase:
              type: string
              enum: [unknown, waiting_for_ccu, loading_hub, loading_devices, ready]
              description: Current bring-up phase of the central.
            ready:
              type: boolean
              description: True once the southbound bring-up has latched complete.
            interfaces_loaded:
              type: integer
              description: Number of interfaces wired so far during device loading.
            interfaces_total:
              type: integer
              description: Total number of configured interfaces to wire.

    Health:
      type: object
      required: [status, components]
      properties:
        status: { type: string, enum: [healthy, degraded, unhealthy, unknown] }
        components:
          type: array
          items:
            type: object
            required: [name, status, recorded_at]
            properties:
              name: { type: string }
              status: { type: string }
              note: { type: string }
              note_key: { type: string, description: "i18n catalogue key for the localized display of a static note; absent for interpolated notes (render note verbatim)." }
              recorded_at: { type: string, format: date-time }
    ConfigSnapshot:
      type: object
      properties:
        locale: { type: string }
        centrals:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              host: { type: string }
              interfaces:
                type: array
                items: { type: string }
        callback_ports:
          type: object
          properties:
            xmlrpc: { type: integer }
            binrpc: { type: integer }
        features:
          type: object
          additionalProperties: { type: boolean }
        extras:
          type: object
          additionalProperties: { type: string }
        policies:
          type: object
          description: |
            Static daemon-side behaviour switches. Keys are stable;
            values reflect the current effective policy. See the
            `/config` path-level description for the canonical key
            catalogue.
          additionalProperties: { type: boolean }
    DeviceSummary:
      type: object
      required:
        [
          address,
          interface,
          interface_id,
          model,
          name,
          available,
          channels_count,
          updatable,
          update_available,
          master_pushes_config_pending,
          has_sub_devices,
        ]
      properties:
        address: { type: string }
        central:
          type: string
          description: |
            CCU this device belongs to (multi-central grouping). Omitted
            for backends that report no owning central.
        interface: { type: string }
        interface_id: { type: string }
        ise_id:
          type: integer
          description: |
            CCU-internal numeric device id. Lets clients that address
            devices by ISE_ID (e.g. the HA rename-by-ise_id path) map back
            to the device address. Absent when the backend reports none.
        model: { type: string }
        model_label:
          type: string
          description: |
            Localised, human-readable device-type label. Empty when no
            translation exists; consumers fall back to the raw `model`.
        model_icon:
          type: string
          description: Icon identifier for the device model. Empty when none.
        sub_model: { type: string }
        name: { type: string }
        manufacturer: { type: string }
        product_group: { type: string }
        available: { type: boolean }
        channels_count: { type: integer }
        updatable:
          type: boolean
          description: |
            Device *supports* firmware updates (CCU UPDATABLE capability) —
            NOT whether one is pending. Use update_available for the
            "update available" indicator.
        update_available:
          type: boolean
          description: |
            An installable firmware update is actually pending: the gated
            latest version differs from the installed one (image already
            delivered for HmIP-RF / available for BidCos). A newer firmware
            the CCU merely knows about but has not delivered does NOT set this.
        update_status:
          type: string
          enum: [up_to_date, update_available, installing]
          description: |
            Daemon-derived firmware-update verdict collapsing the raw CCU
            firmware phase and update_available signal, so a client renders
            the update entity without carrying the phase-classification sets.
            Omitted when the device reports no firmware information.
        rooms:
          type: array
          items: { type: string }
        functions:
          type: array
          items: { type: string }
          description: Resolved "Gewerke" (function) labels for the device.
        master_pushes_config_pending:
          type: boolean
          description: |
            True when the device's interface delivers reliable CONFIG_PENDING
            events on MASTER writes (HmIP-RF, HmIP-Wired). The SPA then waits
            for the true→false transition before refreshing MASTER. False for
            BidCos-*, VirtualDevices, CUxD — those rely on the save-path
            reload because CONFIG_PENDING never fires (or fires unreliably).
        config_restore_supported:
          type: boolean
          description: |
            True when the device's interface exposes `restoreConfigToDevice`
            (HmIP-RF, BidCos-RF). The SPA gates the "restore config" action on
            it. False for BidCos-Wired, CUxD and VirtualDevices.
        communication_test_supported:
          type: boolean
          description: |
            True when the device's interface can run the CCU's per-device
            communication test (radio interfaces). The SPA gates the "test"
            action on it. False for VirtualDevices and CUxD.
        team_supported:
          type: boolean
          description: |
            True when the device's interface exposes channel team assignment
            (setTeam / listTeams — BidCos-RF, HmIP-RF). The SPA gates the
            team picker on it.
        has_sub_devices:
          type: boolean
          description: |
            True when the device should be split into multiple logical
            sub-devices for northbound presentation. The SPA's CdpTilesPanel
            uses this flag to switch from a flat tile grid to per-group
            sections.
        rx_mode:
          $ref: "#/components/schemas/RxMode"
    RxMode:
      type: object
      description: |
        Named flags decoded from the device's CCU RX_MODE bitmask. The
        `wakeup` / `lazy_config` bits mark a battery-powered device that only
        applies pending configuration when it next wakes up — the SPA shows a
        "pending wakeup" hint after a link/config write to such a device. Only
        set bits are present; the whole object is omitted when the CCU reports
        no rx mode (RX_MODE == 0).
      properties:
        always:
          type: boolean
          description: Mains-powered, permanently reachable (RX_ALWAYS); applies configuration immediately.
        burst:
          type: boolean
          description: Reachable via burst wakeup (RX_BURST).
        config:
          type: boolean
          description: Reachable in its configuration window (RX_CONFIG).
        wakeup:
          type: boolean
          description: Battery device that only accepts pending configuration on its next wakeup (RX_WAKEUP).
        lazy_config:
          type: boolean
          description: Battery device whose configuration transfer is deferred until its next wakeup (RX_LAZY_CONFIG).
    DeviceList:
      type: object
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeviceSummary" }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    DeviceDetail:
      allOf:
        - $ref: "#/components/schemas/DeviceSummary"
        - type: object
          required: [firmware, availability, channels]
          properties:
            firmware:
              type: object
              properties:
                Current: { type: string }
                Available: { type: string }
                Updatable: { type: boolean }
                UpdateState: { type: string }
            availability:
              type: object
              properties:
                IsReachable: { type: boolean }
                LastUpdated: { type: string, format: date-time }
                BatteryLevel: { type: ["integer", "null"] }
                LowBattery: { type: ["boolean", "null"] }
                SignalStrength: { type: ["integer", "null"] }
            channels:
              type: array
              items: { $ref: "#/components/schemas/ChannelSummary" }
    ChannelFlags:
      type: object
      description: Operator per-channel overrides (G12).
      required: [hidden, locked]
      properties:
        hidden:
          type: boolean
          description: Channel hidden from the operation surfaces.
        locked:
          type: boolean
          description: Channel locked against control writes.
    ChannelFlagsRequest:
      type: object
      description: |
        Partial update of the operator per-channel overrides (G12). An absent
        field keeps its current value.
      properties:
        hidden:
          type: boolean
        locked:
          type: boolean
    ChannelSummary:
      type: object
      required: [address, number, paramset_key, data_points_count]
      properties:
        address: { type: string }
        number: { type: integer }
        name:
          type: string
          description: User-defined channel name. Empty when none is set.
        category:
          type: string
          description: |
            OCCU channel-type string (same value as `type`), exposed under
            its own key so consumers can route on channel purpose without
            parsing the `type` string.
        type:
          type: string
          description: OCCU channel-type string (e.g. ENERGIE_METER_TRANSMITTER).
        type_label:
          type: string
          description: |
            Localised, human-readable channel-type label resolved through
            the OCCU channel_types table. Empty when no translation exists;
            consumers fall back to the raw `type`.
        paramset_key: { type: string }
        paramset_keys:
          type: array
          items: { type: string }
          description: |
            Paramsets this channel actually exposes — "VALUES" when it has
            value data points and "MASTER" when it has master (config) data
            points. The config-panel / HA drop-in uses this to offer the
            right paramset tabs.
        data_points_count: { type: integer }
        custom_dp_name:
          type: string
          description: |
            Stable name of the Custom-DP this channel is attached to.
            Empty when the channel is not owned by any CDP. Lets the
            SPA's CDP-first Übersicht view (ADR 0016) filter channels
            that are already represented by a CDP tile.
        group_no:
          type: integer
          description: |
            Channel-group number this channel belongs to (the group
            master's channel number). Omitted when the channel is not
            part of any channel group.
        is_group_master:
          type: boolean
          description: |
            True when this channel is the master of its channel group
            (`group_no == number`). Only present alongside `group_no`.
        is_in_multi_group:
          type: boolean
          description: |
            True when the channel's group has more than one member —
            i.e. the channel participates in the parent device's
            sub-device split. Singleton groups omit the flag.
        sub_device_name:
          type: string
          description: |
            Resolved sub-device label for the channel's group (the
            group master's name with device-name/number fallbacks).
            Only present for multi-member groups.
        room:
          type: string
          description: |
            The channel's single resolved room with the group-master
            fallback applied. Empty when no unique room can be
            resolved. External clients use it as the suggested zone of
            the channel group's sub-device.
        rooms:
          type: array
          items: { type: string }
          description: |
            The channel's full room-assignment set. Unlike `room` it is
            not collapsed to the unique case, so assignment editors can
            round-trip it. Omitted when the channel carries no room
            assignment.
        functions:
          type: array
          items: { type: string }
          description: |
            The channel's resolved "Gewerke" (function) labels — the
            channel-level twin of `DeviceSummary.functions`. Lets clients
            map functions at channel granularity instead of folding them
            up to the device. Omitted when the channel carries no function
            assignment.
        is_custom_dp_primary:
          type: boolean
          description: |
            True when the channel owns a Custom-DP AND is the primary
            (group-master) channel of its group — the daemon-derived
            "device primary channel" marker. Omitted when neither
            condition holds.
        hidden:
          type: boolean
          description: |
            Operator per-channel override (G12): when true the channel is
            hidden from the operation surfaces (data-point list, MQTT, Matter).
            The channel stays in the device detail so it remains manageable.
            Omitted when false.
        locked:
          type: boolean
          description: |
            Operator per-channel override (G12): when true control writes to
            the channel's VALUES paramset are rejected (423). Reads and
            MASTER/config edits are unaffected. Omitted when false.
    MQTTReloadResponse:
      type: object
      required: [reloaded, took_ms]
      properties:
        reloaded: { type: boolean, description: "Always true on success; the 503 path returns a problem+json document instead." }
        took_ms: { type: integer, format: int64, description: "Wall-clock duration of the swap in milliseconds." }

    CacheClearRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [global, central, interface, device]
          description: |
            Breadth of the clear. `central`/`interface`/`device` require
            the matching identifier fields at or below their level.
        central: { type: string, description: "Central name. Required for kind central/interface/device." }
        interface: { type: string, description: "Interface id. Required for kind interface/device." }
        device: { type: string, description: "Device address. Required for kind device." }

    CacheClearReport:
      type: object
      required: [scope, devices, paramsets, values, master, centrals_reinit]
      properties:
        scope:
          type: object
          description: "The resolved scope the clear ran against."
          properties:
            Kind: { type: string }
            Central: { type: string }
            Interface: { type: string }
            Device: { type: string }
        devices: { type: integer, format: int64, description: "Device-description rows removed (-1 when the store does not report a count)." }
        paramsets: { type: integer, format: int64, description: "Paramset-description rows removed." }
        values: { type: integer, format: int64, description: "Persistent VALUES-cache rows removed (-1 for device-scoped deletes)." }
        master: { type: integer, format: int64, description: "Persisted MASTER-value rows removed (-1 for device-scoped deletes)." }
        centrals_reinit:
          type: array
          items: { type: string }
          description: "Centrals that were re-initialized through the boot path."
        errors:
          type: array
          items: { type: string }
          description: "Per-store errors collected during the clear; present only when the clear partially failed."

    ValuesCacheStats:
      type: object
      required: [rows, value_json_bytes, restored_rows, cast_failures, gc_rows_deleted, flush_batches, flushed_entries]
      properties:
        rows: { type: integer, format: int64, description: "Current row count in the cache." }
        value_json_bytes: { type: integer, format: int64, description: "Sum of value_json byte sizes across all rows." }
        restored_rows: { type: integer, format: int64, description: "Cumulative rows successfully restored since process start." }
        cast_failures: { type: integer, format: int64, description: "Cumulative entries whose cached value could not be coerced into the data point's static type." }
        gc_rows_deleted: { type: integer, format: int64, description: "Cumulative rows removed by the dead-row GC since process start." }
        flush_batches: { type: integer, format: int64, description: "Cumulative SaveBatch transactions committed since process start." }
        flushed_entries: { type: integer, format: int64, description: "Cumulative entries written across all SaveBatch transactions." }

    DataPointSummary:
      type: object
      required: [parameter, unique_id, observed, operations]
      properties:
        parameter: { type: string }
        parameter_label:
          type: string
          description: |
            Ready-to-display caption for the parameter row: the
            locale-aware channel-typed translation when one exists,
            otherwise the title-cased parameter (`RSSI_DEVICE` →
            `Rssi Device`). Always non-empty; clients render it
            verbatim instead of deriving their own fallback. Unlike
            `translated_name` it carries text even when
            `label_omitted` is true — the "primary parameter"
            collapse is an entity-naming concern, row captions keep
            their label.
        value: {}
        display_value:
          type: number
          description: >-
            `value` expressed in the unit `unit` names, i.e.
            `value * multiplier`. Present only when that projection is
            non-trivial; absent means `value` already is the displayable
            number.

            It exists because `value` is the raw CCU wire value and has to
            stay that: the write path sends it back unchanged. A LEVEL data
            point reads 0.42 with unit `%`, so rendering the pair without
            multiplying shows a dimmer at 0.42 %. Render `display_value`
            when present and `value` otherwise — that is always correct and
            needs no arithmetic on the client. Writes always carry `value`.
        observed: { type: boolean }
        modified_at:
          type: string
          format: date-time
          description: |
            When the value last changed on the CCU. RFC3339Nano,
            UTC. Equivalent to `last_changed_at` (kept for
            cache-friendly naming alongside `last_seen_at`).
        source:
          type: string
          enum: [unobserved, cache, live, stale]
          description: |
            Wire-side lifecycle token. See ADR 0018.
            - unobserved: never seen any value
            - cache: restored from persistent cache at boot, awaiting live event
            - live: last value confirmed by CCU push / fetch_all, connection healthy
            - stale: connection lost; value is the last known good
        last_seen_at:
          type: string
          format: date-time
          description: |
            When the data point was last observed via any push or
            fetch_all event (cyclic info telegrams included). Advances
            even when the value did not change.
        last_changed_at:
          type: string
          format: date-time
          description: |
            When the value actually changed last. Alias of modified_at
            kept under the cache-friendly name.
        value_age_seconds:
          type: integer
          format: int64
          description: |
            Pre-computed seconds between last_seen_at and the response
            time, so the browser does not need to parse the timestamp
            on every render.
        operations:
          type: object
          required: [read, write, event]
          properties:
            read: { type: boolean }
            write: { type: boolean }
            event: { type: boolean }
        category:
          type: string
          description: |
            Fine-grained DataPointCategory the daemon derives internally
            ("light", "cover", "climate", "sensor", "binary_sensor",
            "switch", …). External clients spawn entities off this instead
            of re-deriving categories from raw paramsets. A change to a
            category value is a breaking wire change — see the enum
            catalogue in assets/schemas/enums.json and ADR 0020. Empty
            only when the DP does not implement the categorised surface.
        data_point_type:
          type: string
          description: |
            Consumer-facing functional type mapped from category via
            hmenum.CategoryToType ("light", "number", "select", "sensor",
            …). Distinct from `type` (the CCU descriptor primitive); the
            two must not be conflated.
        usage:
          type: string
          description: |
            Visibility verdict from the daemon's pipeline ("data_point",
            "no_create", "ignored", "ce_primary", "ce_secondary",
            "ce_visible", "event"). Clients skip entity creation for
            "no_create"/"ignored" — the same gate the MQTT discovery
            plane applies; mirrors aiohomematic's DataPointUsage.
        translated_name:
          type: string
          description: |
            Locale-aware per-entity name a north-bound consumer (HA via
            MQTT discovery or the REST drop-in) assigns to this data
            point, resolved through the same naming primitives as the
            MQTT discovery `name` field. The parameter portion only; HA
            prepends the device name. When `label_omitted` is true it
            instead carries the channel-level collapsed name (channel
            name plus multi-channel `chN` marker, device prefix
            stripped) — possibly empty when the collapse reduces to the
            device name alone. Consumers therefore never need to
            compose entity names themselves; the daemon is the single
            naming authority.
        label_omitted:
          type: boolean
          description: |
            True when the parameter is flagged "primary" in the embedded
            translation_custom catalogue (translation key present, value
            empty). The entity is then named after the channel:
            `translated_name` holds the collapsed channel-level name,
            falling back to the device name when empty (MQTT discovery
            instead emits `name: null`).
        control:
          type: string
          description: |
            CCU paramset descriptor's CONTROL attribute of the form
            WIDGET_FAMILY.SLOT (e.g. "HEATING_CONTROL_HMIP.SETPOINT").
            Drives the SPA's CONTROL-aware widget resolver. Empty when the
            descriptor carries no CONTROL.
        type:
          type: string
          description: |
            CCU descriptor TYPE (BOOL, INTEGER, FLOAT, ENUM, STRING, ACTION).
            Surfaced so the SPA can pick the right widget primitive
            without re-reading the paramset descriptor.
        value_list:
          type: array
          items: { type: string }
          description: |
            Ordered enum labels for ENUM-typed parameters
            (e.g. ["BLACK","BLUE","GREEN","TURQUOISE","RED","PURPLE",
            "YELLOW","WHITE"] on HmIP-BSL COLOR). Empty for non-ENUM.
        value_translations:
          type: object
          additionalProperties: { type: string }
          description: |
            Maps each raw `value_list` entry to its localised display
            string, resolved through the OCCU `parameter_values_<locale>`
            table in the request locale. Only entries with an actual
            translation are included (an untranslated value is omitted so
            the client falls back to the raw `value_list` token); absent
            entirely for non-ENUM parameters or when no value translates.
        unit:
          type: string
          description: |
            Descriptor UNIT string ("°C", "% rF", "lx", "Wh", ...)
            as the CCU declares it. Empty when none.
        multiplier:
          type: number
          description: |
            Converts `value` (the raw wire value) into the unit `unit`
            names — e.g. a LEVEL data point reports `value` in 0.0-1.0
            with `unit` "%", so a client must multiply by `multiplier`
            (100) to render "42 %" instead of "0.42 %". Only present
            for a non-trivial multiplier; absent means 1.
        min: {}
        max: {}
        default: {}
        ui_hint:
          type: object
          description: |
            Daemon-computed UI classification envelope. The SPA's
            AutoTile composer reads the fields verbatim — no JS-side
            classification runs.
            Resolution order in the backend: parameter substring →
            ENUM-shape rules → unit table → type fallback. Never
            empty.
          required: [icon, semantic]
          properties:
            icon:
              type: string
              description: Material Design Icons token, e.g. "mdi:thermometer".
            semantic:
              type: string
              description: |
                Stable token used by the composer to group readouts
                of the same physical quantity into one bucket
                (e.g. "temperature", "particulate", "motion").
            state_color_rule:
              type: string
              description: |
                Named threshold rule the SPA looks up in its rule
                registry to colour the readout (e.g. "temp_heat",
                "alarm_active", "signal_weak"). Empty when no rule.
        unique_id:
          type: string
          description: |
            Canonical loom-namespaced routing key for this data point —
            the same value the WS `datapoint.value_changed` payload
            carries. Lets a client build its entity registry from the
            summary or snapshot without recomputing the key. Always present and non-empty: a central serves no entity until its CCU serial (the central-id slot of the key) is resolved by the bring-up readiness gate.
        additional_information:
          type: object
          additionalProperties: true
          description: |
            Optional enriched model metadata for data points that provide
            it (e.g. the calculated operating-voltage sensor's battery
            type / quantity / low-voltage limits). Absent for plain scalar
            data points. Mirrors the optional `additional_information`
            object on the per-DP MQTT state topic. Additive — existing
            responses are unchanged.
    UIEventRequest:
      type: object
      description: |
        Body of `POST /ui/event` — anonymous fire-and-forget
        telemetry sink. The daemon writes a structured slog line
        under the `ui.event` channel; downstream log aggregation
        does any counting. See ADR 0016 follow-ups.
      required: [event]
      properties:
        event:
          type: string
          description: Event name (e.g. `device_detail.view_selector`).
        properties:
          type: object
          additionalProperties: true
          description: Optional event-specific key/value attributes.
    SetValueRequest:
      type: object
      required: [value]
      properties:
        value: {}
        priority:
          type: string
          enum: [critical, high, default, low]
    WebhookValueRequest:
      type: object
      required: [address, parameter, value]
      description: Body of POST /webhook/value (inbound webhook value write).
      properties:
        central:
          type: string
          description: |
            Optional CCU name. Device addresses are globally unique, so the
            writer resolves the owning CCU from `address`; `central` is
            informational.
        address:
          type: string
          description: Channel address, e.g. "0001D3C99C1234:1".
        parameter:
          type: string
          description: Wire parameter name, e.g. "STATE" or "LEVEL".
        value: {}
        priority:
          type: string
          enum: [critical, high, default, low]
    WebhookProgramRequest:
      type: object
      required: [program]
      description: Body of POST /webhook/program (inbound webhook program run).
      properties:
        central:
          type: string
          description: |
            CCU name. Required when more than one CCU is configured, since
            program IDs are not unique across CCUs.
        program:
          type: string
          description: Program ID to run.
    ProgramSummary:
      type: object
      required: [id, unique_id, name]
      properties:
        central:
          type: string
          description: CCU this program belongs to (multi-central grouping).
        id: { type: string }
        name: { type: string }
        description: { type: string }
        active:
          type: boolean
          description: |
            Program enabled state. Omitted when the CCU has not reported it
            (the Go DTO marshals the pointer with omitempty: absent, not null).
        execute_available:
          type: boolean
          description: |
            Whether running the program would do anything. A program the CCU
            has deactivated ignores its triggers and refuses a manual run, so
            a consumer that offers "run now" as its own control should render
            it unavailable. The daemon answers this rather than leaving each
            consumer to derive it from `active` — it is CCU semantics, not
            presentation. True while the flag has not been observed, so a
            control is never greyed out on missing information.
        last_executed:
          type: string
          description: RFC3339 timestamp of the most recent execution.
        condition_summary:
          type: string
          description: |
            Compact, language-neutral rendering of the program's root-rule
            trigger conditions — object names from the ReGa DOM joined by
            symbolic operators (==, >=, <=, >, <, &&, ||). Capped at ~200
            characters with an ellipsis. Absent when the program has no rule
            or the CCU-side scan produced nothing.
        activity_summary:
          type: string
          description: |
            Compact, language-neutral rendering of the program's root-rule
            activities (object name := value, joined by "; "). Capped at
            ~200 characters with an ellipsis. Absent when the program has no
            rule.
        is_internal:
          type: boolean
          description: |
            True for CCU-internal helper programs (prgEnergyCounter_…,
            Tmp_…). Clients skip these for HA entities, mirroring
            aiohomematic's DEFAULT_INCLUDE_INTERNAL_PROGRAMS=false.
        enabled_default:
          type: boolean
          description: |
            True when the program matched a configured description marker, so
            clients enable its entity by default. Absent/false when no markers
            are configured: the entry is included but disabled by default.
        unique_id:
          type: string
          description: |
            Canonical loom routing key for this program — the same value
            the WS `hub.program_executed` event carries. Lets clients
            build their entity registry from the summary without
            recomputing the key. Always present and non-empty: a central serves no entity until its CCU serial (the central-id slot of the key) is resolved by the bring-up readiness gate.
        channel:
          type: string
          description: |
            Canonical channel address ("ADDR:idx") of the device channel
            this program is associated with (resolved from a device
            identifier in the program name). Absent when the program
            belongs to no device — clients then attach the entity to the
            central hub device instead of a physical device.
        device_address:
          type: string
          description: |
            Device part of `channel` (before the ":"). Clients use it to
            group the entity under the owning physical device; absent
            together with `channel` (entity belongs on the hub card).
    ProgramExecuteRequest:
      type: object
      description: Optional body for POST /programs/{id}/execute.
      properties:
        check_conditions:
          type: boolean
          default: false
          description: |
            When true, the CCU evaluates the program's "if" condition and
            runs the program only when the condition is currently
            satisfied. When false (the default) the program runs
            unconditionally.
    ProgramExecuteResponse:
      type: object
      required: [executed]
      properties:
        executed:
          type: boolean
          description: |
            Whether the program actually ran. Always true for an
            unconditional execution (check_conditions=false); false for a
            condition-checked execution whose condition was not met.
    SysvarUsageProgram:
      type: object
      required: [id, name]
      description: One CCU program that references a system variable.
      properties:
        id: { type: string }
        name: { type: string }
        unique_id:
          type: string
          description: Canonical loom routing key when the program is known to the hub.
        active:
          type: boolean
          description: Observed enabled state; omitted when unknown.
        is_internal:
          type: boolean
          description: True for Tmp_*-programs created internally by the CCU.
    SysvarUsage:
      type: object
      required: [sysvar, programs]
      description: The programs that reference a system variable.
      properties:
        central: { type: string }
        sysvar: { type: string }
        programs:
          type: array
          items: { $ref: "#/components/schemas/SysvarUsageProgram" }
    SysvarSummary:
      type: object
      required: [name, unique_id, value_type, observed]
      properties:
        central:
          type: string
          description: CCU this system variable belongs to.
        name: { type: string }
        description: { type: string }
        unit: { type: string }
        value_type: { type: string }
        value: {}
        observed: { type: boolean }
        value_list:
          type: array
          items: { type: string }
        min:
          type: number
          description: Declared lower bound from the CCU Rega response.
        max:
          type: number
          description: Declared upper bound from the CCU Rega response.
        is_internal:
          type: boolean
          description: |
            Mirrors the CCU's isInternal flag. Internal variables back
            CCU bookkeeping; clients skip them for HA entities unless
            opted in (aiohomematic's INTERNAL description marker).
        is_visible:
          type: boolean
          description: |
            Mirrors the CCU's isVisible flag — whether the variable is
            shown in the CCU WebUI. Always present (a real CCU reports it
            for every variable).
        is_logged:
          type: boolean
          description: |
            Mirrors the CCU's isLogged flag (backed by the CCU-side
            DPArchive setting) — whether value changes are recorded to the
            measurement archive. Always present.
        value_name_0:
          type: string
          description: |
            False-state value label for a binary (LOGIC/ALARM) variable —
            the operator-visible text for value 0. Absent for non-binary
            variables.
        value_name_1:
          type: string
          description: |
            True-state value label for a binary (LOGIC/ALARM) variable —
            the operator-visible text for value 1. Absent for non-binary
            variables.
        is_extended:
          type: boolean
          description: |
            True when the variable's description carried the extended
            marker — clients expose the writable entity flavour
            (switch/number/select/text) instead of the read-only default.
        vid:
          type: integer
          description: |
            CCU-internal numeric variable ID (ise_id). Stable across
            renames; clients use it to apply fixed-ID exclusions
            (40 = alarm messages, 41 = service messages — both are
            surfaced through dedicated hub singletons instead).
        enabled_default:
          type: boolean
          description: |
            True when the variable matched a configured description marker, so
            clients enable its entity by default. Absent/false when no markers
            are configured: the entry is included but disabled by default.
        unique_id:
          type: string
          description: |
            Canonical loom routing key for this system variable — the
            same value the WS `hub.sysvar_changed` event carries. Lets
            clients build their entity registry from the summary without
            recomputing the key. Always present and non-empty: a central serves no entity until its CCU serial (the central-id slot of the key) is resolved by the bring-up readiness gate.
        channel:
          type: string
          description: |
            Canonical channel address ("ADDR:idx") of the device channel
            this system variable is associated with — either the explicit
            CCU WebUI channel assignment ("Kanalzuordnung") or, failing
            that, a device identifier resolved from the variable name.
            Absent when the variable belongs to no device — clients then
            attach the entity to the central hub device instead of a
            physical device.
        device_address:
          type: string
          description: |
            Device part of `channel` (before the ":"). Clients use it to
            group the entity under the owning physical device; absent
            together with `channel` (entity belongs on the hub card).
    SysvarSetRequest:
      type: object
      required: [value]
      properties:
        value: {}
    HistoryBucket:
      type: object
      required: [ts, avg, min, max, count]
      description: >
        One aggregated bucket of measurement history: the average,
        minimum, maximum and sample count over the bucket's time span.


        `avg` is time-weighted, not a plain mean of the samples. CCU
        parameters arrive push-driven, so sample spacing is irregular by
        construction and an unweighted mean reports a mostly-idle series as
        several times its true average. `covered_ms` is the span that
        weighting divides by; combine two buckets by weighting each `avg`
        with its own `covered_ms`, never with `count`, because two samples an
        hour apart and two a second apart are both `count: 2`.
      properties:
        ts:
          type: string
          format: date-time
          description: Start of the bucket's time span (UTC).
        avg:
          type: number
          description: Mean of the raw samples in this bucket.
        min:
          type: number
          description: Minimum raw sample in this bucket.
        max:
          type: number
          description: Maximum raw sample in this bucket.
        count:
          type: integer
          format: int64
          description: Number of raw samples aggregated into this bucket.
        covered_ms:
          type: integer
          format: int64
          description: >
            The millisecond span `avg` is weighted over. Omitted (or zero)
            when the span is unknown — a bucket built entirely from rows the
            daemon recorded before it stored the span — in which case `avg`
            is the plain mean over `count`.
    RecordingState:
      type: object
      required: [record, source]
      description: >
        Effective measurement-recording state of one data point.
      properties:
        record:
          type: boolean
          description: >
            Whether this data point's live values are currently persisted
            to measurement history.
        source:
          type: string
          enum: [override, policy]
          description: >
            "override" when an explicit per-datapoint toggle decides,
            "policy" when the parameter-name glob policy decides.
    RecordingWriteRequest:
      type: object
      required: [central, interface_id, channel, parameter]
      description: >
        Set or clear a per-datapoint recording override. A null `record`
        clears the override (revert to the glob policy).
      properties:
        central: { type: string }
        interface_id: { type: string }
        channel: { type: string }
        parameter: { type: string }
        record:
          type: ["boolean", "null"]
          description: true/false forces recording on/off; null clears the override.
    EnergyBucket:
      type: object
      required: [ts, consumed_wh, feed_in_wh, avg_power_w, peak_power_w, reset]
      description: >
        One bucketed point of a device's energy breakdown: the
        cumulative-counter delta over the bucket (Wh) plus the
        instantaneous POWER summary (W).
      properties:
        ts:
          type: string
          format: date-time
          description: >
            Start of the bucket's time span, serialised as an RFC3339
            instant. For `group=day` / `group=month` this instant is the
            local midnight respectively local first-of-month of the
            daemon's timezone, so rendering it with a local date format
            names the calendar day or month the bucket covers.
        consumed_wh:
          type: number
          description: >
            ENERGY_COUNTER delta over the bucket, in Wh. Never negative —
            see `reset`.
        feed_in_wh:
          type: number
          description: >
            ENERGY_COUNTER_FEED_IN delta over the bucket, in Wh. Never
            negative — see `reset`.
        avg_power_w:
          type: number
          description: Mean POWER sample over the bucket, in W.
        peak_power_w:
          type: number
          description: Maximum POWER sample over the bucket, in W.
        reset:
          type: boolean
          description: >
            True when a cumulative counter went backwards within this
            bucket (meter reset on re-pair / firmware event); the
            reported delta is the counter's value at the end of the
            bucket (energy accumulated since the reset), not a negative
            delta.
    EnergyDevice:
      type: object
      required: [address, name, buckets, total_consumed_wh, total_feed_in_wh]
      description: One device's bucketed energy breakdown plus its range totals.
      properties:
        address:
          type: string
          description: Bare device address.
        name:
          type: string
          description: Device display name (falls back to the address when unknown).
        buckets:
          type: array
          items: { $ref: "#/components/schemas/EnergyBucket" }
        total_consumed_wh:
          type: number
          description: Sum of `consumed_wh` across every bucket, in Wh.
        total_feed_in_wh:
          type: number
          description: Sum of `feed_in_wh` across every bucket, in Wh.
    EnergyResponse:
      type: object
      required: [group, from, to, devices, total_consumed_wh, total_feed_in_wh]
      description: >
        `GET /api/v1/energy` response body: one bucketed breakdown per
        device plus central totals, in Wh (the SPA divides by 1000 to
        render kWh).
      properties:
        group:
          type: string
          enum: [hour, day, month]
          description: Bucket granularity actually used.
        from:
          type: string
          format: date-time
          description: Inclusive lower bound of the requested range (UTC).
        to:
          type: string
          format: date-time
          description: Exclusive upper bound of the requested range (UTC).
        devices:
          type: array
          items: { $ref: "#/components/schemas/EnergyDevice" }
        total_consumed_wh:
          type: number
          description: Sum of every device's `total_consumed_wh`, in Wh.
        total_feed_in_wh:
          type: number
          description: Sum of every device's `total_feed_in_wh`, in Wh.
        price_per_kwh:
          type: number
          description: >
            Configured electricity tariff
            (`persistence.history.energy_price_per_kwh`), echoed so the
            client can derive costs. Absent or zero means no tariff is
            configured — a client must then show no cost at all rather
            than a misleading 0. The daemon does not compute the amounts:
            rounding and money formatting are locale decisions the client
            owns.
        currency:
          type: string
          description: >
            Free-text label for amounts derived from `price_per_kwh`
            (symbol or ISO code; defaults to the euro sign). Never used
            for conversion. Only present together with a non-zero tariff.
    AuditEntry:
      type: object
      required: [id, timestamp, action]
      description: One recorded user-initiated configuration change.
      properties:
        id:
          type: integer
          format: int64
          description: >
            Stable identity of this entry within the responding list. A single
            operator action can emit several entries that agree on every other
            field, including the second-resolution timestamp, so this is the
            only safe key for per-row client state. Values are assigned by the
            durable store and are not comparable across daemon restarts when no
            durable store is configured.
        central:
          type: string
          description: |
            CCU this entry belongs to, derived best-effort from the device
            address. Omitted for daemon-wide entries (e.g. CCU management).
        timestamp:
          type: string
          format: date-time
          description: UTC time at which the change was recorded.
        user:
          type: string
          description: Authenticated user who triggered the change (empty if unauthenticated).
        action:
          type: string
          description: >
            Stable action tag, e.g. paramset_write, link_add, data_point_write.
            New values may be added in future releases.
        device_address:
          type: string
          description: Primary device or channel address, if applicable.
        channel_no:
          type: integer
          description: Channel number within the device, if applicable.
        paramset:
          type: string
          description: Paramset type (MASTER, VALUES, LINK), if applicable.
        peer:
          type: string
          description: Peer address for link operations.
        parameter:
          type: string
          description: Parameter name for single-parameter writes.
        note:
          type: string
          description: Free-form context (e.g. profile ID for active_profile changes).
        changes:
          type: array
          description: Per-parameter before/after pairs for paramset writes.
          items:
            type: object
            required: [parameter]
            properties:
              parameter: { type: string }
              before: {}
              after: {}
    AlarmMessage:
      type: object
      description: |
        An alarm entry has no device, channel or room: it is backed by an
        alarm system variable that a program raises, so the CCU reports its
        trigger data point as the 65535 "unknown" sentinel. Device-bound
        alerts arrive as ServiceMessage instead, which does carry them.
      required: [id, name, counter]
      properties:
        central:
          type: string
          description: CCU this alarm message belongs to (multi-central grouping).
        id: { type: string }
        name: { type: string }
        description: { type: string }
        timestamp:
          type: string
          format: date-time
          description: |
            When the alarm was raised. Omitted on the rare CCU report that
            carries no occurrence at all.
        last_timestamp:
          type: string
          format: date-time
          description: |
            When the backing alarm variable last changed. Omitted when the
            CCU reports no such occurrence.
        counter: { type: integer }
        display_name:
          type: string
          description: Human-readable translation of the message code.
    ServiceMessage:
      type: object
      required: [id, name, counter, quittable]
      properties:
        central:
          type: string
          description: CCU this service message belongs to (multi-central grouping).
        id: { type: string }
        name: { type: string }
        address: { type: string }
        device_name: { type: string }
        type: { type: string }
        timestamp:
          type: string
          format: date-time
          description: |
            When the message first appeared. Omitted on the rare CCU report
            that carries no occurrence at all.
        last_timestamp:
          type: string
          format: date-time
          description: |
            When the message last recurred. Omitted when the CCU reports no
            such occurrence.
        counter: { type: integer }
        rooms:
          type: array
          items: { type: string }
          description: Rooms assigned to the triggering channel.
        functions:
          type: array
          items: { type: string }
          description: Functions (Gewerke) assigned to the triggering channel.
        quittable: { type: boolean }
        display_name:
          type: string
          description: Human-readable translation of the message code.
    SuppressedServiceMessage:
      type: object
      required: [channel]
      properties:
        central:
          type: string
          description: CCU this suppression belongs to (multi-central grouping).
        interface:
          type: string
          description: CCU interface the channel lives on (e.g. "HmIP-RF").
        channel:
          type: string
          description: Suppressed channel address ("ADDR:chn").
        parameter:
          type: string
          description: >
            Suppressed service parameter (e.g. "LOWBAT"). Empty means every
            service parameter of the channel is suppressed.
        device_name:
          type: string
          description: Human-readable channel/device name, when known.
        name:
          type: string
          description: Raw CCU message name that was suppressed, when known.
    AckAllResult:
      type: object
      required: [acknowledged]
      properties:
        acknowledged:
          type: integer
          description: |
            Number of messages acknowledged across the scoped centrals.
    InstallModeInterfaceEntry:
      type: object
      required: [interface, active, seconds, observed]
      properties:
        central:
          type: string
          description: CCU the interface belongs to.
        interface:
          type: string
          description: Interface ID the install-mode data point controls.
        active:
          type: boolean
        seconds:
          type: integer
          description: Remaining install-mode time (0 when inactive).
        observed:
          type: boolean
          description: False until the first state fetch succeeded.
    InstallModeInterfaceRequest:
      type: object
      required: [interface, active]
      properties:
        interface: { type: string }
        active: { type: boolean }
        seconds:
          type: integer
          minimum: 0
          description: Install-mode duration; defaults to 60 when omitted.
        central:
          type: string
          description: |
            Disambiguates the CCU when several centrals expose the same
            interface name. Omitted matches the first interface entry
            across all centrals.
        device_address:
          type: string
          description: |
            Restricts pairing to one already-known device address
            (targeted teach-in / re-pairing by serial). Only meaningful
            with active=true; ignored on stop. Note that HmIP radios
            have no address-targeted pairing on the CCU side — use
            sgtin + key there instead.
        sgtin:
          type: string
          description: |
            HmIP SGTIN for the keyserver-less LOCAL teach-in. Formatted
            label input (dashes, spaces, lowercase) is accepted and
            normalised server-side to 24 hex characters. Requires key,
            active=true, and is mutually exclusive with device_address.
        key:
          type: string
          format: password
          description: |
            HmIP device key from the label: 32 hex characters, or the
            shorter Base32 label form (converted automatically). Never
            logged or audited.
    SystemUpdateEntry:
      type: object
      required: [update_available, in_progress, observed]
      properties:
        central:
          type: string
          description: CCU this update info belongs to.
        current_firmware:
          type: string
          description: Installed CCU firmware version.
        available_firmware:
          type: string
          description: Installable CCU firmware version.
        update_available:
          type: boolean
        in_progress:
          type: boolean
          description: True while a system update is installing.
        observed:
          type: boolean
          description: False until the first update-info fetch succeeded.
    HubMetricsEntry:
      type: object
      properties:
        central:
          type: string
          description: CCU these metrics belong to.
        system_health:
          type: number
          description: Aggregate health score in percent (0-100); omitted until observed.
        connection_latency_ms:
          type: number
          description: >-
            Round-trip latency in milliseconds of the most recently confirmed
            PING/PONG pair with the CCU, measured over the interface's own
            transport (XML-RPC or BIN-RPC) including the callback reply leg.
            One value per CCU, not per interface. Omitted until observed.
        last_event_age_seconds:
          type: number
          description: Age of the newest backend event; omitted until observed.
    ChannelLockRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Include (true) / exclude (false) the channel from the week-program schedule.
    MasterProfileSummary:
      type: object
      required: [id, name, description, param_count]
      description: One entry in `GET .../master-profiles` — the list shape (no full parameter map).
      properties:
        id: { type: integer }
        name: { type: string, description: Localised profile name. }
        description: { type: string, description: Localised profile description. }
        param_count: { type: integer, description: Number of MASTER parameters this profile sets. }
    MasterProfile:
      type: object
      required: [id, name, description, params]
      description: Full master-profile shape returned by `GET .../master-profiles/{id}`.
      properties:
        id: { type: integer }
        name:
          type: object
          additionalProperties: { type: string }
          description: 'Locale-keyed profile name (e.g. `{"en": "Eco", "de": "Eco"}`).'
        description:
          type: object
          additionalProperties: { type: string }
          description: Locale-keyed profile description.
        params:
          type: object
          description: MASTER parameter name to constraint.
          additionalProperties:
            type: object
            properties:
              constraint_type: { type: string, description: 'Usually "fixed"; other kinds appear sporadically.' }
              value: {}
    InterfaceState:
      type: object
      required: [id, name, connected, interface]
      properties:
        id: { type: string }
        name: { type: string }
        connected: { type: boolean }
        interface: { type: string }
        central_id: { type: string }
        host: { type: string }
        note: { type: string }
        duty_cycle:
          type: integer
          description: |
            Transmit duty cycle in percent (0..100) for BidCos radio
            interfaces, sourced from the CCU's listBidcosInterfaces poll.
            Absent when unknown or when the interface carries no BidCos
            gateway (e.g. HmIP-RF, covered by device-level DUTY_CYCLE
            data points).
        carrier_sense:
          type: integer
          description: |
            Receive carrier-sense load in percent (0..100). Absent when
            the CCU does not report it (the common case over JSON-RPC).
    Snapshot:
      type: object
      required: [generated_at, devices]
      properties:
        generated_at: { type: string, format: date-time }
        devices:
          type: array
          items: { $ref: "#/components/schemas/DeviceSummary" }
        programs:
          type: array
          items: { $ref: "#/components/schemas/ProgramSummary" }
        sysvars:
          type: array
          items: { $ref: "#/components/schemas/SysvarSummary" }
        rooms:
          type: array
          items:
            type: object
            required: [name, device_count]
            properties:
              name: { type: string }
              device_count: { type: integer }
        functions:
          type: array
          items:
            type: object
            required: [name, device_count]
            properties:
              name: { type: string }
              device_count: { type: integer }
        interfaces:
          type: array
          items: { $ref: "#/components/schemas/InterfaceState" }
        device_channels:
          type: array
          description: |
            Present only when the request set `?include=channels` (or
            `data_points`). Nests each device's channels — and, with
            `data_points`, their data points — keyed by device address.
            Parallel to `devices`, which stays unchanged.
          items:
            type: object
            required: [device_address, channels]
            properties:
              device_address: { type: string }
              channels:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/ChannelSummary"
                    - type: object
                      properties:
                        data_points:
                          type: array
                          description: |
                            Present only with `?include=data_points`.
                          items: { $ref: "#/components/schemas/DataPointSummary" }
    Identity:
      type: object
      required: [subject, role]
      properties:
        subject: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }
        scheme:
          type: string
          enum: [basic, bearer, session, oidc, ingress]
          description: >-
            How the request authenticated. `ingress` is the Home
            Assistant Ingress passthrough the add-on deployment uses.
        expires_at:
          type: string
          format: date-time
          description: >-
            The instant the credential behind this identity stops being
            accepted, in UTC. Absent means the credential has no
            server-side expiry — a `basic`, `ingress` or unbounded
            `bearer` identity. It is the deadline a long-lived consumer
            needs: a WebSocket captures its identity at the upgrade and
            is closed when this instant passes, so a client that reads
            it can refill its credential through the in-band
            `{op:"reauth"}` frame instead of discovering the rotation
            through a 401.
    UserListEntry:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }
    TokenListEntry:
      type: object
      required: [id, fingerprint, subject, role]
      properties:
        id: { type: string, description: "Stable management identifier (16 hex chars from sha256 of the token)." }
        fingerprint: { type: string, description: "Last six characters of the token; full value is never exposed" }
        subject: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }

    ValuesBatchRequest:
      type: object
      required: [queries]
      properties:
        queries:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [address, channel, parameter]
            properties:
              address: { type: string }
              channel: { type: integer, minimum: 0 }
              parameter: { type: string }

    ValuesBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [address, channel, parameter]
            properties:
              address: { type: string }
              channel: { type: integer, minimum: 0 }
              parameter: { type: string }
              summary: { $ref: "#/components/schemas/DataPointSummary" }
              error:
                type: string
                description: |
                  Per-query failure. Set when `summary` is absent.
                  Stable values: `device not found`,
                  `channel not found`, `parameter not found`,
                  `parameter hidden`.

    CreateTokenResponse:
      type: object
      description: |
        Returned by `POST /auth/tokens`. The `token` field carries the
        raw secret and is exposed exactly once on creation — neither
        `GET /auth/tokens` nor any other endpoint will surface it
        again. Clients MUST capture it at this point.
      required: [id, token, fingerprint, subject, role]
      properties:
        id: { type: string, description: "Stable management identifier." }
        token: { type: string, description: "Raw bearer token. URL-safe base64 (~43 chars)." }
        fingerprint: { type: string }
        subject: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }

    MatterDiagnosticEvent:
      type: object
      required: [at, kind, severity, message]
      properties:
        at: { type: string, format: date-time }
        kind:
          type: string
          enum: [pairing, session, discovery]
        severity:
          type: string
          enum: [info, warning, error]
        message:
          type: string
          description: One sentence an operator can act on.
        detail:
          type: object
          additionalProperties: { type: string }
          description: Identifiers that make the message specific.

    MatterDiagnosticEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/MatterDiagnosticEvent" }

    MatterFabric:
      type: object
      required: [fabric_index, fabric_id, fabric_id_hex, node_id, node_id_hex, vendor_id, compressed_id, root_public_key]
      properties:
        fabric_index:
          type: integer
          minimum: 1
          maximum: 254
          description: "Stack-assigned fabric index per Matter Core Spec §11.18.5"
        fabric_id: { type: integer, format: int64 }
        fabric_id_hex:
          type: string
          description: >-
            The exact 64-bit fabric id as 16 uppercase hex digits. A JSON
            number carries only 53 bits of integer precision, so a client
            that renders `fabric_id` shows rounded low digits for any id
            above 2^53. Render this field.
        node_id: { type: integer, format: int64 }
        node_id_hex:
          type: string
          description: >-
            The exact 64-bit operational node id as 16 uppercase hex
            digits, in the form controllers and chip-tool print it.
            Render this field rather than `node_id`, which loses
            precision in transport.
        vendor_id: { type: integer, minimum: 0, maximum: 65535 }
        vendor_name:
          type: string
          description: >-
            Human-readable name of the controller vendor behind vendor_id
            (e.g. "Apple", "Google"). A vendor the daemon has no name for
            renders as its id in `0xNNNN` form rather than an empty
            string, so the row still identifies the controller.
        label: { type: string }
        compressed_id:
          type: string
          description: "8-byte compressed fabric identifier, hex-encoded"
        root_public_key:
          type: string
          description: "Issuing root CA public key (uncompressed P-256, 65 bytes), hex-encoded"

    MatterFabricList:
      type: object
