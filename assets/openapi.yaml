openapi: 3.1.0
info:
  title: openccu-loom REST API
  version: 1.0.0
  description: |
    North-bound REST + WebSocket surface of the openccu-loom daemon.
    Errors follow RFC 9457 problem+json.
  license:
    name: MIT
    url: https://opensource.org/license/mit/
servers:
  - url: /api/v1
security:
  - basicAuth: []
  - bearerAuth: []
  - openIdConnect: [viewer]
tags:
  - name: core
  - name: devices
  - name: paramsets
  - name: config
    description: Channel configuration export / import (portable snapshots)
  - name: hub
  - name: interfaces
  - name: messages
  - name: events
  - name: auth
  - name: schedules
  - name: links
  - name: backup
  - name: sessions
  - name: audit
  - name: diagnostics
  - name: matter
  - name: config-admin
    description: Live config section read / write / delete + schema introspection
  - name: user-admin
    description: Local user management (create, update, delete)
  - name: token-admin
    description: API token management v2 (fingerprint-keyed)
  - name: central-admin
    description: Central (CCU) CRUD — DB-backed multi-CCU registry

paths:
  /info:
    get:
      tags: [core]
      summary: Daemon build + runtime info
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }

  /health:
    get:
      tags: [core]
      summary: Aggregated health snapshot
      security: []
      responses:
        "200":
          description: Healthy / degraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Any component unhealthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /config:
    get:
      tags: [core]
      summary: Sanitized effective configuration
      description: |
        Read-only view of the effective daemon configuration. Carries
        feature flags (`features`), per-central wiring (`centrals`),
        callback ports, and static behaviour policies (`policies`).

        The `policies` object documents daemon-side defaults that
        external clients ask about — currently always-on values:

        - `hub.programs.include_all` — daemon surfaces every CCU
          program; HA-side marker filtering
          (`DEFAULT_PROGRAM_MARKERS`) stays a client-side decision.
        - `hub.sysvars.include_all` — daemon surfaces every system
          variable; HA-side marker filtering
          (`DEFAULT_SYSVAR_MARKERS`) is client-side.
        - `hub.devices.include_hidden` — daemon hides devices the
          CCU flags as invisible; flipping this requires a config
          change in a future revision.

        Schema is forward-compatible: future revisions may add new
        policy keys and feature flags without removing existing
        ones.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigSnapshot" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /ui/event:
    post:
      tags: [core]
      summary: SPA telemetry sink (fire-and-forget)
      description: |
        Anonymous endpoint the SPA uses to log UI events
        (view-selector toggle, etc.). The daemon writes a
        structured slog line and returns 204 — no event is
        persisted server-side. Downstream log aggregation
        handles counting and slicing. See ADR 0016.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UIEventRequest" }
      responses:
        "204": { description: Accepted }
        "400": { $ref: "#/components/responses/BadRequest" }

  /devices:
    get:
      tags: [devices]
      summary: Paginated device list
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }

  /devices/{addr}:
    get:
      tags: [devices]
      summary: Single device detail
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDetail" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDevice
      summary: Remove a device from the registry (admin)
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "202":
          description: Unpair dispatched asynchronously
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: patchDevice
      summary: Update mutable device metadata (name, room assignment)
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - $ref: "#/components/parameters/Address"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "202":
          description: Update accepted
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /devices/{addr}/channels:
    get:
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelSummary" }
        "404":
          $ref: "#/components/responses/NotFound"

  /devices/{addr}/channels/{no}:
    get:
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelSummary" }
        "404":
          $ref: "#/components/responses/NotFound"

  /devices/{addr}/channels/{no}/data-points:
    get:
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DataPointSummary" }
        "404":
          $ref: "#/components/responses/NotFound"

  /devices/{addr}/channels/{no}/data-points/{param}:
    get:
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
        - $ref: "#/components/parameters/Parameter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataPointSummary" }
        "404":
          $ref: "#/components/responses/NotFound"

  /devices/{addr}/channels/{no}/data-points/{param}/value:
    put:
      tags: [devices]
      summary: Set a data point value on the CCU
      description: |
        Headers:
          - `Idempotency-Key` (optional): supply a client-side UUID
            to deduplicate retries. The daemon caches the response
            per `(method, path, key)` for 5 minutes and returns the
            cached response with `Idempotent-Replay: true` on
            retry. Recommended for HA-style flows that retry on
            network glitches and must not double-actuate the
            actuator.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/ChannelNo"
        - $ref: "#/components/parameters/Parameter"
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: Optional UUID for retry deduplication. See description.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetValueRequest" }
      responses:
        "202":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /devices/{addr}/paramsets/{key}:
    parameters:
      - $ref: "#/components/parameters/Address"
      - name: key
        in: path
        required: true
        schema: { type: string, enum: [VALUES, MASTER, LINK] }
    get:
      operationId: getParamset
      tags: [paramsets]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [paramsets]
      summary: Write a paramset atomically (one wire call)
      description: |
        Writes every key in the request body to the CCU as a single
        `setParamsetValues` XML-RPC call. The CCU applies the values
        together or rejects them together — there is no per-parameter
        partial-success semantics on this path. Use a session
        (`config.session.*` WS commands) when you need transactional
        rollback across multiple writes.

        The CCU does not return per-parameter status on success; the
        202 response carries no body. On failure the daemon surfaces
        the upstream error as 502 problem+json with `code: upstream_unavailable`.

        Headers:
          - `Idempotency-Key` (optional): client-supplied UUID. The
            daemon caches the response per `(method, path, key)` for
            5 minutes; a retry with the same key within that window
            returns the cached response and sets the
            `Idempotent-Replay: true` response header so clients
            can distinguish a deduplicated retry from a fresh write.
            Keys older than 5 minutes (or evicted under memory
            pressure) flow through as fresh requests. The cache key
            does NOT include the request body — a retry MUST use
            the same body as the original; the daemon trusts the
            client's key choice.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: Optional UUID for client-side retry de-duplication. See description.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Accepted (atomic write dispatched to CCU)
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /programs:
    get:
      tags: [hub]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProgramSummary" }

  /programs/{id}/execute:
    post:
      tags: [hub]
      description: |
        Triggers a CCU program. Programs typically drive actuators or
        scenes, so a double-execution under client retry can produce
        observable side effects. Supply the optional `Idempotency-Key`
        header to suppress that risk.
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Accepted
        "404":
          $ref: "#/components/responses/NotFound"
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /sysvars:
    get:
      tags: [hub]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SysvarSummary" }
    post:
      operationId: createSysvar
      summary: Create sysvar on the CCU (Rega create_system_variable)
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "202": { description: Scheduled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /sysvars/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [hub]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SysvarSummary" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putSysvar
      summary: Set the sysvar runtime value. Idempotent — body carries {value} only.
      description: |
        Sysvars can fire CCU programs and scenes when their value
        changes. A retry without deduplication can re-trigger those
        cascades. Supply the optional `Idempotency-Key` header to make
        the write safe under client-side retry.
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SysvarSetRequest" }
      responses:
        "202":
          description: Accepted — runtime value written to CCU.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Value type not supported for this sysvar.
        "502": { $ref: "#/components/responses/BadGateway" }
    patch:
      operationId: patchSysvar
      summary: >
        Update the sysvar metadata (description, unit, value_list, min, max).
        Triggers the Rega update_system_variable script via JSON-RPC.
        All fields are optional — omitted fields leave CCU metadata unchanged.
        Type changes are not supported; delete and recreate the sysvar instead.
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: Human-readable label shown in the CCU UI.
                unit:
                  type: string
                  description: Physical unit string (e.g. "°C", "%").
                min:
                  type: string
                  description: Minimum value (as string, CCU convention).
                max:
                  type: string
                  description: Maximum value (as string, CCU convention).
                value_list:
                  type: array
                  items: { type: string }
                  description: Ordered list of enum labels for ENUM-type sysvars.
      responses:
        "202":
          description: Accepted — Rega script dispatched asynchronously.
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteSysvar
      summary: Delete sysvar on the CCU (Rega delete_system_variable)
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "202": { description: Scheduled }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /alarm-messages:
    get:
      tags: [messages]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlarmMessage" }

  /service-messages:
    get:
      tags: [messages]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceMessage" }

  /install-mode:
    get:
      tags: [hub]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallModeState" }
    post:
      tags: [hub]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallModeState" }
      responses:
        "202":
          description: Accepted
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /interfaces:
    get:
      tags: [interfaces]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InterfaceState" }

  /interfaces/{id}:
    get:
      tags: [interfaces]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterfaceState" }
        "404":
          $ref: "#/components/responses/NotFound"

  /interfaces/{id}/reconnect:
    post:
      tags: [interfaces]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Accepted
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /system/ccu:
    get:
      operationId: listSystemCCU
      summary: Per-central CCU metadata
      description: |
        Returns one entry per CCU configured on the daemon. Surfaces
        identity (name, host, central-id), software (model, version),
        and the configured-interface list HA's Repair-Flows need to
        validate that the daemon manages the same CCU the user
        expects.

        Centrals that have not yet completed their first connect
        round have empty `model` / `version` / `serial` / `hostname`
        / `url` and `available: false`; the configured-interface
        list is still populated from static config.
      tags: [core]
      responses:
        "200":
          description: List of CCU metadata entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/SystemCCUEntry" }

  /system/status:
    get:
      operationId: listSystemStatus
      summary: Recent system-status events
      description: |
        Returns a bounded ring buffer of the most recent
        SystemStatusChangedEvents observed on the central event bus.
        Each entry carries the per-component health snapshot at the
        moment the event fired (central state, connection state,
        degraded interfaces, freeform issues). The endpoint returns
        a 200 with an empty array when no events have been buffered
        yet — the buffer is wired only when a SystemStatusBuffer is
        installed in the REST router.
      tags: [core]
      responses:
        "200":
          description: Ring buffer of recent system-status events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [central, component, healthy, event_at]
                      properties:
                        central: { type: string }
                        component: { type: string }
                        healthy: { type: boolean }
                        reason: { type: string }
                        interface_id: { type: string }
                        error_code: { type: integer }
                        central_state: { type: string }
                        connection_state: { type: string }
                        degraded_interfaces:
                          type: array
                          items: { type: string }
                        issues:
                          type: array
                          items: { type: string }
                        event_at: { type: string, format: date-time }

  /snapshot:
    get:
      tags: [snapshot]
      summary: One-shot dump of structural daemon state
      description: |
        Returns devices, programs, sysvars, rooms, functions and
        interface state in a single JSON envelope. Use this for
        cold-restore tooling, periodic external backups, or
        debugging session replays. Sources that are not wired
        contribute empty arrays rather than failing the request.

        Pass `?include=channels` to nest each device's channels under
        `device_channels`, or `?include=channels,data_points` to also
        expand each channel's data points — collapsing the otherwise
        N×M per-channel bootstrap into one round trip. `data_points`
        implies `channels`. With `Accept: application/x-ndjson` the same
        entities stream as `kind:"channel"` / `kind:"data_point"` lines.
      parameters:
        - name: include
          in: query
          required: false
          schema: { type: string }
          description: |
            Comma-separated set of nested entities to expand:
            `channels` and/or `data_points` (alias `data-points`).
            Unknown tokens are ignored.
        - name: anonymize
          in: query
          required: false
          schema: { type: boolean }
          description: |
            Tokenise operator-assigned names (device / channel /
            sub-device / sysvar / room / function labels and program
            descriptions) with stable non-identifying hashes. Addresses
            and values stay intact. `anonymise` is accepted as an alias.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
            application/x-ndjson:
              schema:
                type: string
                description: |
                  Line-delimited stream, one `{"kind":...,"data":...}`
                  object per line. Kinds: meta, interface, device,
                  channel, data_point, room, function, program, sysvar.

  /events:
    get:
      tags: [events]
      summary: Upgrade to the WebSocket event stream
      description: |
        Clients must request an RFC 6455 upgrade (Upgrade: websocket,
        Connection: Upgrade, Sec-WebSocket-Version: 13). Once
        connected the client exchanges JSON frames:

        ```
        {"op":"subscribe","topics":["device.*","hub.*"]}
        {"op":"unsubscribe","topics":["hub.*"]}
        {"op":"pong"}
        ```

        Server frames follow the [WsEnvelope](#/components/schemas/WsEnvelope)
        shape. The envelope's `type` field discriminates which payload
        schema applies. The full broadcast catalogue (event name → topic
        pattern → payload schema) lives in `assets/wsapi.json` under
        commands where `kind == "broadcast"`. The topic-hierarchy
        reference at `docs/external-clients/topic-hierarchy.md`
        documents the wildcard semantics.

        Currently emitted broadcasts (and the schema each one carries):

        - `datapoint.value_changed` → [DataPointValueChangedPayload](#/components/schemas/DataPointValueChangedPayload)
        - `custom_data_point.state_changed` → [CustomDataPointStateChangedPayload](#/components/schemas/CustomDataPointStateChangedPayload)
        - `central.state_changed` → [CentralStateChangedPayload](#/components/schemas/CentralStateChangedPayload)
        - `system.status_changed` → [SystemStatusChangedPayload](#/components/schemas/SystemStatusChangedPayload)
        - `hub.sysvar_changed` → [SysvarChangedPayload](#/components/schemas/SysvarChangedPayload)
        - `hub.program_executed` → [ProgramExecutedPayload](#/components/schemas/ProgramExecutedPayload)
        - `hub.install_mode_changed` → [InstallModeChangedPayload](#/components/schemas/InstallModeChangedPayload)
        - `device.created` → [DeviceCreatedPayload](#/components/schemas/DeviceCreatedPayload)
        - `device.removed` → [DeviceRemovedPayload](#/components/schemas/DeviceRemovedPayload)
        - `matter.*` broadcasts: see `wsapi.json` (payload schemas TBD).
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: |
            Plain HTTP request without a valid WebSocket upgrade — the
            server rejects the connection rather than serving HTML.

  # ---- Auth ----
  /auth/login:
    post:
      operationId: login
      summary: Issue session cookie
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke current session
      tags: [auth]
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: me
      summary: Current identity probe
      tags: [auth]
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/users:
    get:
      operationId: listUsers
      summary: List configured Basic-auth users (admin)
      tags: [auth]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserListEntry" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/tokens:
    get:
      operationId: listTokens
      summary: List API tokens with elided fingerprints (admin)
      tags: [auth]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TokenListEntry" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createToken
      summary: Issue a new bearer token (admin)
      description: |
        Generates a fresh bearer token bound to the supplied subject
        and role. The raw token value is returned exactly once in
        the 201 response — the daemon stores only an opaque
        fingerprint thereafter, so the client MUST capture the
        `token` field on creation. Use the returned `id` for
        subsequent management (`DELETE /auth/tokens/{id}`).
      tags: [auth]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, role]
              properties:
                subject:
                  type: string
                  description: Logical owner of the token (e.g. "homeassistant", "ci-runner").
                role:
                  type: string
                  enum: [viewer, operator, admin]
      responses:
        "201":
          description: Token created — raw value visible exactly once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateTokenResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Validation error (missing subject, invalid role)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/tokens/{id}:
    delete:
      operationId: deleteToken
      summary: Revoke an API token (admin)
      description: |
        Removes the token identified by the path segment (the `id`
        field returned from `POST /auth/tokens` or `GET /auth/tokens`).
        The token immediately stops authenticating; in-flight requests
        finish under the previous identity.
      tags: [auth]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Token removed
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          $ref: "#/components/responses/NotFound"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/oidc/start:
    get:
      operationId: oidcStart
      summary: Initiate OIDC authorization code flow (redirect to IdP)
      tags: [auth]
      security: []
      responses:
        "302":
          description: Redirect to identity provider
        "404":
          description: OIDC not configured (route not registered)
        "503":
          description: OIDC configured but provider unreachable
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC authorization code callback — exchanges code for session
      tags: [auth]
      security: []
      parameters:
        - { in: query, name: code, required: true, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
      responses:
        "302":
          description: Redirect to / on success
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: OIDC not configured (route not registered)
        "503":
          description: OIDC configured but provider unreachable

  # ---- Devices: lifecycle, channels, schedule, links ----
  /devices/values:batch:
    post:
      operationId: valuesBatch
      summary: Batch-read data-point values in one round trip
      description: |
        Returns the requested data-point summaries in a single
        request — avoids the N-roundtrips initial-sync penalty
        external clients (HA, dashboards, monitoring) hit when
        loading 80k DPs over per-DP GETs.

        Per-query errors (missing device, channel, parameter, or
        visibility-hidden parameter) surface inside the response
        body so one bad address does not abort the rest of the
        batch. Envelope-level problems (malformed JSON, empty
        queries, exceeding the per-request cap) yield problem+json.

        The per-request query cap is currently 1000.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValuesBatchRequest" }
      responses:
        "200":
          description: Per-query results (success or error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValuesBatchResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Empty queries / oversized batch
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /devices/refresh:
    post:
      operationId: refreshDevices
      summary: Force CCU re-pull on every backend
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      responses:
        "202":
          description: Refresh dispatched
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/accept:
    post:
      operationId: acceptInboxDevice
      summary: Promote a pending pairing into the registry
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
      responses:
        "202":
          description: Accept dispatched
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/firmware/update:
    post:
      operationId: updateFirmware
      summary: Trigger OTA firmware update for the device
      description: |
        Starts an OTA flash. The CCU does not handle duplicate
        update requests gracefully — a retry mid-flight can leave the
        radio in an undefined state. Supply the optional
        `Idempotency-Key` header so client-side retries collapse into
        a single update attempt.
      tags: [devices]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Update scheduled
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/channels/{no}/ui-schema:
    get:
      operationId: getUiSchema
      summary: Renderable form descriptor for a channel paramset
      tags: [devices]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer } }
        - { in: query, name: paramset, schema: { type: string, enum: [VALUES, MASTER, LINK], default: VALUES } }
        - { in: query, name: peer, schema: { type: string } }
        - { in: query, name: locale, schema: { type: string, default: en } }
        - { in: query, name: expert, schema: { type: boolean } }
      responses:
        "200":
          description: UI schema
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /devices/{addr}/channels/{no}/config/export:
    get:
      operationId: exportChannelConfig
      summary: Export a channel's paramset as a portable JSON snapshot
      description: |
        Returns an ExportedConfiguration snapshot for the specified channel.
        The `paramset` query parameter selects which paramset to snapshot
        (default: MASTER). The snapshot is suitable for archival, migration,
        and import via POST .../config/import.
      tags: [config]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer, minimum: 0 } }
        - in: query
          name: paramset
          schema: { type: string, enum: [MASTER, VALUES], default: MASTER }
          description: Paramset to export. MASTER is the default (persistent channel settings).
      responses:
        "200":
          description: Exported configuration snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportedConfiguration" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Export failed (CCU read error)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /devices/{addr}/channels/{no}/config/import:
    post:
      operationId: importChannelConfig
      summary: Import a previously-exported channel paramset snapshot
      description: |
        Applies an ExportedConfiguration payload to the CCU. The body must
        have been produced by GET .../config/export (or the Python
        aiohomematic-config exporter). Version mismatch and missing required
        fields are rejected with 400. CCU write errors surface as 500.
      tags: [config]
      security:
        - basicAuth: []
        - bearerAuth: []
        - openIdConnect: [operator]
      parameters:
        - { in: path, name: addr, required: true, schema: { type: string } }
        - { in: path, name: no, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportedConfiguration" }
      responses:
        "200":
          description: Import applied successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: Apply failed (CCU write error)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

