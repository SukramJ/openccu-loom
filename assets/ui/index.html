<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>openccu-loom</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Apply the persisted / system theme BEFORE the first paint so the
      // app shell never flashes light on a cold load in dark mode. The
      // `.dark` class is what both the Tailwind `dark:` variant and the
      // --ha-* token overrides key off; without this it was only added
      // in App.svelte's onMount (after first paint), which is the root
      // cause of the reported white top-bar on boot. Mirrors
      // applyTheme() in src/lib/stores/preferences.svelte.ts; the store
      // re-applies (idempotently) on mount and tracks OS changes.
      (function () {
        try {
          var theme = "system";
          var raw = localStorage.getItem("openccu-loom.prefs.v1");
          var p = null;
          if (raw) {
            p = JSON.parse(raw);
            if (p && (p.theme === "light" || p.theme === "dark" || p.theme === "system")) {
              theme = p.theme;
            }
          }
          // The host. Mirrors src/lib/theme/lite-shell.svelte.ts and
          // isEmbedded() in src/lib/theme/ha-bridge.ts:
          // - the openccu-lite shell (same-origin parent that put theme= /
          //   lang= on our URL or set the ol-theme / ol-lang cookies): its
          //   theme wins, the skin stays the operator's;
          // - Home Assistant (Ingress path, or a same-origin parent that is
          //   HA's frontend): skin "ha", the HA bridge owns .dark later;
          // - anything else, framed or not: the operator's own preference.
          var framed = window.parent !== window;
          var lite = false;
          var shellTheme = null;
          if (framed) {
            try {
              if (window.parent.location.origin === location.origin) {
                var q = new URLSearchParams(location.search);
                var qt = q.get("theme");
                var ql = (q.get("lang") || "").toLowerCase();
                if (qt === "system" || qt === "light" || qt === "dark") shellTheme = qt;
                var hasLang = /^(de|en)(-|$)/.test(ql);
                var ck = document.cookie || "";
                var ct = /(?:^|;\s*)ol-theme=(light|dark)(?:;|$)/.exec(ck);
                if (!shellTheme && ct) shellTheme = ct[1];
                if (!hasLang) hasLang = /(?:^|;\s*)ol-lang=(de|en)/.test(ck);
                lite = shellTheme !== null || hasLang;
              }
            } catch (e) {
              /* cross-origin parent — not the shell */
            }
          }
          if (shellTheme) theme = shellTheme;
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          // Set data-skin before first paint too, so the app shell never
          // flashes Loom-teal before the store/bridge run.
          var ha = false;
          if (framed && !lite) {
            if (location.pathname.indexOf("/api/hassio_ingress/") >= 0) {
              ha = true;
            } else {
              try {
                ha = window.parent.document.querySelector("home-assistant") !== null;
              } catch (e) {
                /* cross-origin parent — not provably HA */
              }
            }
          }
          var skin = ha ? "ha" : p && p.skin === "ha" ? "ha" : "loom";
          root.setAttribute("data-skin", skin);
        } catch (e) {
          /* localStorage / JSON / cross-origin — fall back to Loom light. */
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
