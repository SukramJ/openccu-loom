# SPDX-License-Identifier: MIT
# openccu-loom — minimal reference configuration
#
# Everything you actually need to start the daemon. Almost every
# other setting (MQTT, Matter, mDNS, REST CORS / auth / rate-limit,
# OIDC, reliability tunables, persistence tunables, CCU rooms /
# functions, users, tokens, additional centrals) is configured
# through the SPA's Settings tab and persisted to the SQLite
# database at <data_dir>/openccu-loom.db.
#
# Why this file is short:
#
#   * The fields below are the "bootstrap tier" — values the
#     daemon needs before the database is open (data_dir, bind
#     addresses, log handler, env-file path).
#   * On a fresh install, anything you DO list here is copied
#     into the database on first start as the initial seed —
#     including the full config sections (MQTT, Matter, REST, …),
#     not just the bootstrap tier. After that the database wins;
#     further edits in this file are ignored unless the matching
#     DB row is deleted.
#   * If you do not want the SPA to manage anything, you can keep
#     setting every field via this YAML — the daemon will still
#     read it. But the cleaner workflow is: bootstrap here, live-
#     edit in the SPA.
#
# Full reference + environment variables:
#
#   * example.config.full.yaml — annotated reference of EVERY option.
#   * example.env — every environment variable the daemon reads
#     (referenced via `env_file:` below). Prefer env for secrets.
#
# Secrets at rest (see docs/adr/0027-encrypt-config-secrets-at-rest.md):
#
#   * Secret-classed fields (passwords, OIDC client_secret, …) are
#     encrypted in the database. The master key comes from
#     OPENCCU_LOOM_SECRET_KEY (base64, 32 bytes) or an auto-generated
#     <data_dir>/secret.key (mode 0600). Back up secret.key together
#     with the database — without it, restored secrets cannot be
#     decrypted.
#
# This whole file is OPTIONAL — the daemon ships with built-in defaults
# and is fully configurable through the SPA. Provide it only to pin the
# bootstrap tier below.
#
# Run with an explicit path:  openccu-loom run --config config.yaml
# …or just `openccu-loom run` — it auto-discovers a config from
# (first existing wins):
#   1. $OPENCCU_LOOM_CONFIG
#   2. ./config.yaml                       (container: /app/config.yaml)
#   3. ~/.config/openccu-loom/config.yaml  ($XDG_CONFIG_HOME honoured)
#   4. /etc/openccu-loom/config.yaml
# Validate syntax with:       hmcli config validate config.yaml

# ---------------------------------------------------------------------
# Bootstrap tier — read before the database opens (all have defaults)
# ---------------------------------------------------------------------
#
# The strict bootstrap tier is: data_dir, logging, north.rest.listen,
# bootstrap.allow_first_run_setup, and env_file. `locale` below is NOT
# a bootstrap-tier value — it is a first-run seed for the DB-tier
# `locale` section (see the "Initial seed" note further down).

# Default UI language for the very first SPA load (operators can
# flip per-user via the Settings tab). Seeded into the database on
# first start; edit it in the SPA afterwards. [default: en]
locale: en

# On-disk root for SQLite, sessions, backups, logs. Must be
# writable by the daemon user; created on first start.  [default: ./var]
data_dir: ./var

logging:
  # debug | info | warn | error                          [default: info]
  level: info
  # json | text | text-color                             [default: json]
  format: json

# REST bind address. This cannot be edited from the SPA itself —
# the SPA needs to reach it BEFORE it can render its Settings tab.
# The Svelte SPA — including login, OIDC, and the first-run onboarding
# wizard (ADR 0045) — is served on this same listener; there is no
# separate UI bind address. The only server-rendered pages are the
# no-JS /health and /about diagnostic anchors. Everything else under
# `north:` is managed in the SPA (MQTT, Matter, mDNS, CORS, OIDC,
# rate-limit).
#
# REST (and the no-JS diagnostic surface under `north.ui`) default to
# enabled — omit the `enabled:` key and the daemon turns them on. Set
# `enabled: false` only to intentionally run a daemon without the
# matching surface.
north:
  rest:
    listen: ":8119"
    # public_url: "https://loom.example.de"
    #                       # Externally-reachable base URL of this REST + Config-UI
    #                       # surface. Set it when behind a reverse proxy (Traefik,
    #                       # nginx, …) that terminates TLS and routes a hostname to
    #                       # the REST listener: the CCU add-on's "Open Config UI"
    #                       # button then links at <public_url>/app/ instead of the
    #                       # direct host:8119 heuristic (unreachable from the public
    #                       # side). No path suffix; omit for a LAN-direct install.
    # csrf_enabled: true    # double-submit cookie/header guard for mutating
    #                       # endpoints. Default: true. Set to false only for
    #                       # pure API-token deployments without browser sessions.
    # csrf_secure: true     # set Secure flag on CSRF cookie (requires HTTPS)
    # tls_cert_file: "/etc/openccu-loom/tls/cert.pem"
    # tls_key_file:  "/etc/openccu-loom/tls/key.pem"
    #                       # Set BOTH to serve the REST API + SPA over HTTPS on the
    #                       # listen port. PEM-encoded; the certificate hot-reloads on
    #                       # change or after POST /admin/tls/certificate — no restart.
    #                       # Leave unset behind a TLS-terminating reverse proxy.
    # tracing:
    #   otlp_endpoint: ""   # OTLP/HTTP collector base URL, e.g. http://collector:4318.
    #                       # When non-empty, finished spans are batched and POSTed to
    #                       # <otlp_endpoint>/v1/traces. Empty (default) disables export.
    auth:
      # Header-scheme gates (tri-state): omit -> enabled. Set to false
      # to reject the scheme even when credentials below are configured.
      # Session-cookie login (the SPA flow) is always on and has no gate.
      # basic_enabled: true    # HTTP Basic on protected routes (curl / CI)
      # bearer_enabled: true   # Bearer tokens via Authorization header
      # First admin — seed only. Once any user exists in the
      # SQLite users table, this block is ignored. After
      # bootstrap, manage users via the SPA's Users tab.
      users:
        admin: "change-me"
      # Delegate login to the CCU's own user database (ADR 0043).
      # Operators sign in with their existing CCU accounts instead of a
      # separate Loom user list. Local users above remain a break-glass
      # fallback in every order, because a CCU failure (wrong password OR
      # CCU down) falls through to the local store.
      # ccu:
      #   enabled: true        # tri-state: omit to use the build default
      #                        # (ON in the CCU add-on build, OFF otherwise)
      #   primary: true        # tri-state: omit -> true (CCU tried first,
      #                        # local as fallback). false -> local first.
      #   central: ""          # CentralConfig name to authenticate against
      #                        # (empty = the first configured CCU)
      #   min_user_level: 1    # reject users below this CCU UserLevel
      #                        # (0=none always denied, 1=guest, 2=user, 8=admin)
      #   role_mapping:        # optional override of the CCU-level -> role map
      #     "8": admin         # defaults: 8->admin, 2->operator, 1->viewer
      #     "2": operator
      #     "1": viewer
      # HA Ingress auth passthrough — supervised HA add-on only (ADR 0044).
      # When enabled, a request proxied by the HA Supervisor (identified by
      # its TCP peer address in trusted_proxy_cidr AND the X-Ingress-Path
      # header) is accepted as the configured role WITHOUT a local credential.
      # Safe only because the add-on's config.yaml keeps panel_admin: true,
      # which restricts Ingress to HA admins. A real Bearer token / session
      # always wins over passthrough.
      # enabled is tri-state: unset = ON in the HA add-on (supervised), OFF in a
      # plain build / Docker image. Set true/false to override (false opts out).
      # ha_ingress:
      #   enabled: false                  # unset → on in the HA add-on; false opts out
      #   trusted_proxy_cidr: "172.30.32.0/23"  # HA Supervisor subnet
      #   role: admin                     # granted role: admin | operator | viewer
  # MCP server (Model Context Protocol) — exposes the daemon to LLM
  # agents as tools over Streamable HTTP, mounted on the REST listener
  # behind the same auth chain. Disabled by default. Read-only even when
  # enabled: `allow_writes` must ALSO be set before an agent can change
  # device state (set_datapoint). See ADR 0025.
  # mcp:
  #   enabled: false
  #   allow_writes: false   # gate the write tools; keep false for read-only
  #   path: /mcp            # Streamable-HTTP mount path on the REST listener

  # Outbound webhook bridge. When enabled the daemon POSTs a signed JSON
  # payload to `url` on datapoint, system-status and incident events.
  # Disabled by default; a single endpoint is supported. Changes are
  # restart-required (the bridge is wired once at boot).
  # webhook:
  #   enabled: false
  #   url: https://example.invalid/hook
  #   secret: change-me      # HMAC-SHA256 body signature (X-OpenCCU-Signature)
  #   events: []             # event-type allowlist; empty = all
  #   centrals: []           # CCU-name allowlist; empty = all
  #   parameter_glob: ""     # e.g. "*TEMPERATURE*"; empty = no filter
  #   timeout_ms: 10000      # per-delivery HTTP timeout
  #   # Inbound direction: external systems POST to set a value / run a
  #   # program. Off by default; routes mounted only when enabled
  #   # (restart-required). Requires an operator identity OR the token below.
  #   inbound:
  #     enabled: false
  #     token: change-me     # optional Bearer token for header-only callers

# First-run setup safety. The /setup wizard always refuses once
# there is at least one admin user; setting this to false keeps the
# route dormant even with a manually-emptied users table (the status
# probe then reports "not required" and the finalize call answers 403).
# With no other authentication source that locks you out until you
# set it back to true and restart — which is the point of the flag.
bootstrap:
  allow_first_run_setup: true

# Automatic, scheduled CCU backups. Off by default (a backup touches the
# CCU and produces files, so it is opt-in). Each configured central is
# backed up independently; the archives appear in the same Backups view as
# manual backups. The first automatic backup runs one interval after start.
# backup:
#   schedule: 24h     # how often each CCU is backed up; empty/0 = disabled
#   keep_last: 7      # retain the newest N per CCU (0 = keep all)

# KEY=VALUE file the daemon loads at startup. Use it to keep CCU /
# MQTT / OIDC passwords out of YAML and out of the database. The
# file is optional (the daemon does not fail when it is missing).
# Set to "-" to disable env-file loading.  [default: .env]
env_file: .env

# ---------------------------------------------------------------------
# Initial seed (optional)
# ---------------------------------------------------------------------
#
# Everything below is copied into the database on first start. Once
# the corresponding tables / sections exist, this YAML block is
# ignored on subsequent starts — manage the values via the SPA's
# Settings tab.
#
# Leave the lists empty if you want to bootstrap a fresh install
# entirely through the /setup wizard at http://<host>:8119/setup.

centrals: []
#  - name: Home
#    host: 192.168.1.10
#    interfaces:
#      - HmIP-RF
#      - BidCos-RF
#    # Per-CCU password — preferred path is to set it via the SPA's
#    # CCU dialog (stored in the SQLite `centrals` table, redacted
#    # on backup unless --include-secrets is passed). For declarative
#    # YAML seeding the only supported field is the inline `password:`
#    # below (initial seed only; encrypted into the DB on first start).
#    # NOTE: there is no per-central `password_env:` YAML key — that
#    # env-reference field exists only on SPA/DB-created central rows,
#    # not on YAML seeds. A `password_env:` line here is silently ignored.
#    password: ""
#    tls: false

# ---------------------------------------------------------------------
# Where to learn more
# ---------------------------------------------------------------------
#
# * Live configuration (current effective values + source attribution):
#   curl --user admin:change-me http://localhost:8119/api/v1/config/effective
#
# * Field schema (every available knob + classification basic /
#   expert / secret):
#   curl http://localhost:8119/api/v1/config/schema
#
# * Export a snapshot of the live configuration as JSON:
#   openccu-loom config export --out my-config.json
#
# * Re-import a snapshot:
#   openccu-loom config import my-config.json
#
# * Full reference (every YAML-side field you can still set
#   declaratively if you prefer YAML over the SPA):
#   see example.config.full.yaml and docs/admin/configuration.md
