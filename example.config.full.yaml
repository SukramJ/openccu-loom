# SPDX-License-Identifier: MIT
#
# openccu-loom — COMPLETE annotated reference configuration
#
# This file documents EVERY available YAML key of the daemon.
# For a quick start, example.config.yaml (Bootstrap-Tier) is sufficient.
#
# ─── Bootstrap-Tier vs. DB-Tier ──────────────────────────────────────────────
#
#   The configuration model has two layers:
#
#   1. Bootstrap-Tier (read BEFORE opening the SQLite database):
#      data_dir, logging, listen (north.rest.listen),
#      bootstrap, env_file.
#      These values are stored in config.yaml and re-evaluated on EVERY start;
#      changes take effect immediately (daemon restart required).
#
#   2. DB-Tier (all remaining sections):
#      On the FIRST start, every section that does not yet exist is seeded
#      from this YAML file into the SQLite database
#      (table `config_sections`, primary key = section name).
#      After that the DB / the SPA wins; further changes to these
#      fields in the YAML file are ignored until the corresponding
#      DB row is deleted.
#      Known section names: locale, north.mqtt, north.matter,
#      north.mcp, north.discovery, north.webhook, north.rest,
#      north.rest.auth.oidc, north.rest.auth.ccu,
#      north.rest.auth.ha_ingress, north.ui, callback, ccu_data,
#      reliability, persistence, security.
#      (`backup` is a root-level YAML field, not a DB config_section —
#       it is read from this file on every start, not seeded once.)
#
# ─── Secrets ─────────────────────────────────────────────────────────────────
#
#   Fields marked as "secret" (passwords, client secrets,
#   API tokens, Matter passcode / salt) are stored ENCRYPTED at rest
#   in the SQLite DB (AES-GCM, 256-bit master key).
#
#   The master key is loaded from (priority descending):
#     1. Environment variable OPENCCU_LOOM_SECRET_KEY (base64, 32 bytes)
#     2. File <data_dir>/secret.key (0600, auto-generated on first start;
#        contains 32 random bytes, base64-encoded)
#
#   IMPORTANT: secret.key must be included in every backup that also
#   contains the DB; otherwise secrets cannot be decrypted after a restore.
#
#   In this YAML, secret fields may be set as plaintext
#   (they are automatically encrypted during seeding). Recommendation:
#   leave fields here empty and supply secrets via env var
#   (syntax: KEY=VALUE in the env_file). Examples: example.env.
#
# ─── Binary invocation ───────────────────────────────────────────────────────
#
#   openccu-loom run --config config.full.yaml
#   hmcli config validate config.full.yaml
#
# Retrieve effective configuration (after DB overlay):
#   curl --user admin http://localhost:8119/api/v1/config/effective   # curl prompts for the password
# Schema of all fields:
#   curl http://localhost:8119/api/v1/config/schema
# ─────────────────────────────────────────────────────────────────────────────


# =============================================================================
# BOOTSTRAP-TIER
# Read before opening the DB; re-evaluated on every start.
# =============================================================================

# Default UI language for the first SPA request (BCP-47).
# NOTE: `locale` is NOT bootstrap-tier — it is a DB-tier section
# (`locale`) that is SEEDED from this value on first start. Users can
# change the language individually via the SPA settings tab; after the
# first start the DB wins. This value acts as the daemon-wide fallback.
# [default: en]
locale: en

# Writable directory for the SQLite DB, sessions, backups, and logs.
# Created on first start if it does not exist.  [default: ./var]
data_dir: /var/lib/openccu-loom

# KEY=VALUE file loaded by the daemon at startup; any env vars not yet
# set are populated from it. Prevents passwords from ending up in YAML
# or in the DB. The file is optional (no error if it is missing).
# "-" or "/dev/null" disables loading.
# [default: .env]
env_file: /etc/openccu-loom/secrets.env

# Structured logging.
logging:
  # debug | info | warn | error   [default: info]
  level: info
  # json | text | text-color      [default: json]
  format: json
  # Per-subsystem overrides (dot-separated logger path → level).
  # Useful for temporarily switching a known noisy subsystem to debug.
  # Runtime overrides (with TTL) are available via REST /api/v1/diagnostics/log-level
  # without modifying the YAML file.
  overrides: {}
  #   openccu-loom.client.transport.xmlrpc: debug
  #   openccu-loom.central.callback: warn

# Security toggles for the first-run setup wizard.
bootstrap:
  # Controls whether the unprotected /setup route is reachable.
  # true = required for a fresh installation (first admin user must be
  # created here). Once an admin exists this toggle changes nothing —
  # /setup is blocked as soon as any authentication source is present.
  # false = /setup stays closed even with an empty users table:
  # GET /api/v1/setup/status reports required:false and POST /api/v1/setup
  # answers 403. With no authentication source configured that is a
  # deliberate lockout — the only way back in is this file plus a restart.
  # [default: true]
  allow_first_run_setup: true


# =============================================================================
# NORTH — REST + WebSocket
# DB section: north.rest
# Bind address is Bootstrap-Tier (re-evaluated on every start).
# =============================================================================

north:
  rest:
    # Bind address of the REST+WebSocket server.  [default: :8119]
    listen: ":8119"

    # Master switch. false = no REST server (no operator surface).
    # Pointer-bool: nil → true.  [default: true]
    # enabled: true

    # CORS — list of allowed origins for cross-origin requests.
    # Empty = no CORS header. Wildcard "*" allows all origins;
    # recommended only for pure-API deployments without browser sessions.
    cors:
      - "http://localhost:5173"   # Vite dev server
      # - "https://home.example.com"

    # Double-submit cookie/header guard for mutating endpoints.
    # true (default) protects browser session flows.
    # false only for pure API-token deployments without browser sessions.
    # Pointer-bool: nil → true.  [default: true]
    csrf_enabled: true

    # Sets the Secure flag on the CSRF cookie. Enable when the daemon
    # runs behind an HTTPS terminator.  [default: false]
    csrf_secure: false

    # Path to the openapi.yaml file. Empty = assets/openapi.yaml next to
    # the binary. Missing file → validator is not installed.
    # openapi_spec_path: ""

    # Request validation against the OpenAPI spec. Pointer-bool: nil → true.
    # false = explicit opt-out (e.g. during a spec migration).
    # openapi_validate: true

    # ─── WebSocket ──────────────────────────────────────────────────────
    ws:
      # Size of the in-memory ring buffer for subscribe-with-since replays.
      # 0 = replay disabled. Approx. 200 B RAM per event.  [default: 1024]
      replay_capacity: 1024

    # ─── Rate limiting ──────────────────────────────────────────────────
    rate_limit:
      # Master switch. false = no enforcement.  [default: false]
      enabled: false
      # Token refill rate per identity (requests/s).  [default: 10]
      requests_per_second: 10.0
      # Bucket size (max concurrent requests before gate).  [default: 30]
      burst: 30

    # ─── Authentication ─────────────────────────────────────────────────
    auth:
      # Header-scheme gates are tri-state pointer-bools: omit the key →
      # enabled. Set to false to reject that scheme even when credentials
      # below are configured.
      # Enable HTTP Basic Auth (curl / CI).  [default: true]
      basic_enabled: true
      # Enable Bearer token auth (Authorization header).  [default: true]
      # NOTE: the literal `false` below is an explicit OVERRIDE that
      # disables bearer auth; omit the key to keep the default (enabled).
      bearer_enabled: false
      # Session-cookie login (the SPA flow) is ALWAYS on and has no config
      # gate — SessionMiddleware is the SPA's core login and cannot be
      # disabled here. (There is no `session_enabled` key; it would be
      # silently ignored.)

      # User map: username → bcrypt hash (or plaintext on initial seed).
      # secret — encrypted at rest; prefer providing it via an env var (see example.env)
      users:
        admin: "change-me"
        # operator: "$2a$12$..."  # bcrypt hash

      # API token map: token → role.
      # secret — encrypted at rest; prefer providing it via an env var (see example.env)
      tokens: {}
      #   supersecrettoken: admin
      #   readonlytoken: viewer

      # ─── OIDC (DB section: north.rest.auth.oidc) ──────────────────────
      oidc:
        # Master switch.  [default: false]
        enabled: false
        # Issuer URL of the OIDC provider (e.g. https://accounts.google.com).
        # Empty = OIDC flow disabled.
        issuer: ""
        # Client ID of the application registered with the provider.
        client_id: ""
        # secret — encrypted at rest; prefer providing it via an env var (see example.env)
        client_secret: ""
        # Redirect URL after a successful OIDC login. Must match the
        # callback route the daemon serves and the URL registered with
        # the provider: /api/v1/auth/oidc/callback.
        redirect_url: "http://localhost:8119/api/v1/auth/oidc/callback"
        # Name of the claim in the ID token that carries the user's role.
        # Empty defaults to the "role" claim (it does NOT disable mapping).
        role_claim: "groups"

      # ─── CCU-delegated login (DB section: north.rest.auth.ccu, ADR 0043) ─
      # Delegate login to the CCU's own user database: operators sign in
      # with their existing CCU accounts instead of a separate Loom user
      # list. Local users above remain a break-glass fallback in every
      # order (a CCU failure — wrong password OR CCU down — falls through
      # to the local store).
      ccu:
        # Tri-state: omit to use the build default (ON in the CCU add-on
        # build, OFF otherwise). Resolved by the composition root.
        enabled: false
        # Tri-state: omit → true (CCU tried first, local as fallback).
        # false → local first, CCU last.
        primary: true
        # CentralConfig name to authenticate against (empty = first CCU).
        central: ""
        # Reject users below this CCU UserLevel (0 = UPL_NONE always denied,
        # 1 = guest, 2 = user, 8 = admin).  [default: 1]
        min_user_level: 1
        # Optional override of the CCU-level → Loom-role map. Keys are the
        # CCU UserLevel as a string. Empty = ADR 0043 defaults
        # (8→admin, 2→operator, 1→viewer).
        role_mapping: {}
        #   "8": admin
        #   "2": operator
        #   "1": viewer

      # ─── HA Ingress passthrough (DB section: north.rest.auth.ha_ingress, ADR 0044) ─
      # Supervised HA add-on only. When enabled, a request proxied by the
      # HA Supervisor (real TCP peer inside trusted_proxy_cidr AND carrying
      # the X-Ingress-Path header) is accepted as the configured role
      # WITHOUT a local credential. Safe only because the add-on keeps
      # panel_admin: true (Ingress is HA-admin-only). A real Bearer token /
      # session always wins over the passthrough.
      ha_ingress:
        # Tri-state: omit → ON in the HA add-on (supervised), OFF in a plain
        # build / Docker image. Set true/false to override (false opts out).
        enabled: false
        # Network the Ingress request must originate from (real RemoteAddr).
        # Empty = HA Supervisor default (172.30.32.0/23).
        trusted_proxy_cidr: "172.30.32.0/23"
        # Loom role granted to a trusted Ingress request: admin | operator | viewer.
        # [default: admin]
        role: admin


  # =============================================================================
  # NORTH — no-JS diagnostic surface (/health, /about)
  # DB section: north.ui
  # Served on the REST listener (:8119) — no separate bind address.
  # Login, logout, OIDC, and the first-run onboarding wizard all live in
  # the Svelte SPA (ADR 0045), NOT here. This section gates only the two
  # server-rendered no-JS pages that remain as an SPA-down diagnostic
  # anchor: /health and /about.
  # =============================================================================

  ui:
    # Master switch. false = no server-rendered /health + /about pages
    # (the SPA and REST API are unaffected).
    # Pointer-bool: nil → true.  [default: true]
    # enabled: true

    # Set this to true when Home Assistant owns this daemon's config
    # surface — i.e. the Homematic(IP) Local integration is configured
    # against THIS daemon. The Config UI then hides what HA already owns
    # (login, CCU credentials, paramset/link/schedule editors) and the
    # Ingress passthrough identity is refused writes on those surfaces.
    #
    # It is NOT derived from HA Ingress: running behind Ingress does not
    # mean HA owns the config surface. The add-on is often used without
    # the integration, and the remote-proxy add-on deliberately serves
    # the full UI. Env override: OPENCCU_LOOM_UI_EMBEDDED.
    # Pointer-bool: nil → false.  [default: false]
    # embedded: false

    # Per-profile navigation overrides, edited in the Config UI under
    # Settings → Navigation & views. Stored SPARSE: list only the
    # surfaces that deviate from the shipped default, so views added by
    # a later release arrive with the default their own code assigns.
    #
    # Keys are surface ids (nav.<view>, settings.<tab>, device.<tab>),
    # values are "visible" or "hidden". A handful of surfaces can never
    # be hidden (the device list, Settings, this editor, About, and —
    # in the standalone profile — user and token administration); such
    # an entry is ignored rather than honoured.
    # profiles:
    #   standalone:
    #     nav.alarm: hidden
    #   embedded:
    #     nav.matter: visible


  # =============================================================================
  # NORTH — MQTT bridge
  # DB section: north.mqtt
  # =============================================================================

  mqtt:
    # Master switch.  [default: false]
    enabled: false

    # Broker URL. Schemes: tcp | mqtt | tls | ssl | mqtts.
    # Required when enabled: true.
    broker_url: "tcp://localhost:1883"

    # MQTT client ID (must be unique per broker).
    client_id: "openccu-loom"

    # Broker credentials.
    # secret — encrypted at rest; prefer providing it via an env var (see example.env)
    username: ""
    # secret — encrypted at rest; prefer providing it via an env var (see example.env)
    password: ""

    # Prefix for all MQTT topics.  [default: openccu-loom]
    topic_base: "openccu-loom"

    # Enable the raw topic plane (alongside HA discovery).  [default: false]
    raw_enabled: false

    # Enable HA auto-discovery.  [default: false]
    discovery_enabled: false

    # Payload format for state topics — CURRENTLY A NO-OP / RESERVED.
    # The value is accepted and validated (only "" | "bare" | "json"),
    # but the bridge never reads it: state topics ALWAYS carry the JSON
    # envelope {"value":..,"available":..}. There is no primitive-scalar
    # ("bare") mode today. Left in place for a future format switch.
    # payload_format: ""

    # Sub-devices: splits devices with multiple channel groups into one
    # HA device per group. Parent device is linked via via_device.
    # [default: false]
    sub_devices_enabled: false

    # Broker snapshot window for retain cleanup and discovery-orphan cleanup.
    # The daemon subscribes to the relevant topic prefix and waits this many
    # milliseconds for the broker to deliver all retained messages before
    # processing the eviction list. Useful on high-latency brokers or when the
    # retained-message store is very large.
    # Valid range: 500–30000. Zero falls back to the default.  [default: 2000]
    retain_cleanup_window_ms: 2000


  # =============================================================================
  # NORTH — Matter bridge
  # DB section: north.matter
  # =============================================================================

  matter:
    # Master switch. false = no UDP listener, no mDNS advertisement.
    # [default: false]
    enabled: false

    # UDP bind address.  [default: :5540 (MatterPort)]
    listen: ":5540"

    # IPv4-only socket. false = IPv6 dual-stack (also accepts IPv4).
    # [default: false]
    prefer_ipv4: false

    # Expose a multi-channel device's secondary actor channels as separate
    # Matter endpoints too. Default false = one endpoint per device (primary
    # channel only). Matter-only.
    expose_secondary_channels: false

    # IANA vendor ID. 0xFFF1 = developer / test block.
    # NEVER use 0xFFF1 in production.  [default: 0xFFF1]
    vendor_id: 0xFFF1

    # Vendor-assigned product ID.  [default: 0x8000]
    product_id: 0x8000

    # User-visible label of the bridge.  [default: openccu-loom]
    node_label: "openccu-loom"

    # 12-bit commissioning discriminator.  [default: 0xF00]
    discriminator: 0xF00

    # mDNS advertiser implementation.
    # "zeroconf" = _matter._tcp + _matterc._udp records via multicast —
    #   REQUIRED for a commissioner (Apple Home / Google Home) to discover
    #   and pair the bridge. This is the default and the value you want.
    # "noop" = no multicast (hermetic unit tests / out-of-band discovery
    #   only); pairing then fails because no commissionable record is
    #   published. Use it deliberately, not as a copy-paste default.
    # [default: zeroconf]
    mdns_advertise: zeroconf

    # Intentional UniqueID rotation on every boot (for T11 chip-tool test).
    # false = stable UniqueID across restarts (production: Apple Home / Google Home).
    # true = breaks accessory recognition after daemon restart (dev/test only).
    # [default: false]
    dev_rotate_unique_ids: false

    # Mount the TimeSynchronization cluster (0x0038) on the Root endpoint.
    # WARNING: matter.js lists TimeSynchronization as optional-only on the
    # RootNode, and Apple Home's HAP service mapper may REJECT an
    # unexpected RootNode cluster at pairing. Leave unset/false unless a
    # controller genuinely needs a time-sync surface (re-pair afterwards).
    # Pointer-bool: nil → false.  [default: false]
    # enable_time_sync: false

    # ─── PASE / Commissioning ───────────────────────────────────────────
    commissioning:
      # Matter setup code (27-bit, 00000001–99999998). 0 = PASE disabled.
      # secret — encrypted at rest; prefer providing it via an env var (see example.env)
      passcode: 0

      # PBKDF2 salt (16–32 bytes). Empty = fixed development salt.
      # NEVER leave empty in production.
      # secret — encrypted at rest; prefer providing it via an env var (see example.env)
      salt: ""

      # PBKDF2 iterations (1000–100000).  [default: 1000]
      iterations: 1000

      # Parallel pairing sessions (multi-admin hub scenario).  [default: false]
      concurrent_pairings: false

      # Ephemeral window: each REST-triggered OCW generates a fresh
      # discriminator + passcode. Recommended for production.  [default: false]
      ephemeral_window: false

    # ─── CASE / Operational session ─────────────────────────────────────
    case:
      # 64-bit operational node ID in the fabric. 0 = CASE disabled.
      node_id: 0
      # 64-bit fabric ID. Required when node_id != 0.
      fabric_id: 0

    # ─── Device attestation ──────────────────────────────────────────────
    # Production attestation material (PEM or DER; format detected via
    # magic bytes). Empty = dev DAC (only with --bypass-attestation-verifier).
    attestation:
      # Path to the Device Attestation Certificate file.
      dac_path: ""
      # Path to the DAC P-256 private key.
      # secret — encrypted at rest; prefer providing it via an env var (see example.env)
      dac_key_path: ""
      # Path to the Product Attestation Intermediate certificate file.
      pai_path: ""
      # Path to the CSA-signed Certification Declaration (CMS message).
      cd_path: ""


  # =============================================================================
  # NORTH — mDNS / Zeroconf discovery
  # DB section: north.discovery
  # =============================================================================

  discovery:
    mdns:
      # Advertise the daemon as _openccu-loom._tcp.local.
      # true = Home Assistant and other Zeroconf clients discover the daemon automatically.
      # Pointer-bool: nil → true.  [default: true]
      enabled: true

      # Instance name (left-hand label of the SRV/TXT record).
      # Empty = OS hostname (without the .local suffix).
      # Also used as the leading component of the wire interface_id (ADR-0024).
      instance_name: ""

    # Active SSDP / UPnP discovery of Homematic / OpenCCU central units on
    # the LAN (ADR 0046). When enabled the daemon periodically multicasts
    # an M-SEARCH, follows each responder's basic_dev.cgi, and surfaces
    # matching CCUs in the UI so the operator can adopt or ignore them.
    # This is a read-only LAN scan — a multicast probe; no data about the
    # daemon leaves the LAN, and it simply finds nothing where multicast
    # is unavailable (some container networks).
    ssdp:
      # Toggle the discovery scan. Pointer-bool: nil → true.  [default: true]
      enabled: true
      # How often the M-SEARCH scan re-runs. 0 = default (60s).  [default: 60s]
      interval: 60s


  # =============================================================================
  # NORTH — MCP (Model Context Protocol) server
  # DB section: north.mcp
  # =============================================================================

  mcp:
    # Master switch. false = no MCP route.  [default: false]
    enabled: false

    # Enable write tools (set_datapoint, …). false = read-only.
    # [default: false]
    allow_writes: false

    # HTTP mount path on the REST listener.  [default: /mcp]
    path: /mcp


  # =============================================================================
  # NORTH — Webhook bridge (outbound + inbound)
  # DB section: north.webhook
  # =============================================================================

  webhook:
    # Outbound bridge master switch. false = the daemon subscribes to no
    # event bus and POSTs nothing. Changing it is restart-required (the
    # bridge is wired once at boot).  [default: false]
    enabled: false

    # Absolute http(s) endpoint each event is POSTed to. Empty disables
    # delivery even when enabled: true.
    url: ""

    # Shared key for the HMAC-SHA256 body signature sent in the
    # X-OpenCCU-Signature header. Empty = no signature header (the
    # receiver cannot verify authenticity).
    # secret — encrypted at rest; prefer providing it via an env var (see example.env)
    secret: ""

    # Event-type allowlist (e.g. "datapoint.value_changed"). Empty = all.
    events: []

    # CCU-name allowlist. Empty = all centrals.
    centrals: []

    # Datapoint-event parameter-name glob (e.g. "*TEMPERATURE*"). Empty =
    # no parameter filter. Non-datapoint events are unaffected.
    parameter_glob: ""

    # Per-delivery HTTP timeout (ms). 0 / negative = default (10000).
    # [default: 10000]
    timeout_ms: 10000

    # Inbound direction: a REST surface external systems POST to in order
    # to set a datapoint value (POST /api/v1/webhook/value) or trigger a
    # program (POST /api/v1/webhook/program). These are real device writes
    # / program runs and carry the same authorization weight as the
    # equivalent REST calls. Disabled by default; the routes are mounted
    # only when enabled, so toggling it is restart-required.
    inbound:
      # Master switch. false = no inbound route (404).  [default: false]
      enabled: false
      # Optional inbound-specific bearer token accepted in addition to the
      # normal REST auth chain, so a header-only caller (e.g. a doorbell)
      # can POST without a session/user token. Empty = normal auth only.
      # Sent as `Authorization: Bearer <token>`.
      # secret — encrypted at rest; prefer providing it via an env var (see example.env)
      token: ""


# =============================================================================
# CALLBACK SERVER (XML-RPC + BIN-RPC)
# DB section: callback
# =============================================================================

callback:
  # IP address on which the callback servers listen.  [default: 0.0.0.0]
  host: "0.0.0.0"

  # XML-RPC callback port (HTTP). 0 = dynamic (OS-assigned).
  # The CCU learns the effective port on every init() call.  [default: 8120]
  port: 8120

  # BIN-RPC callback port (raw TCP, CUxD). 0 = dynamic.  [default: 8129]
  bin_port: 8129

  # Port range for dynamic mode, e.g. "30000-30099".
  # Empty = OS picks a free port (typically from the ephemeral range).
  port_range: ""

  # Public IP/hostname for NAT scenarios, e.g. when the daemon runs
  # behind NAT and the CCU must reach a different address than the
  # local bind address. Empty = host value is used.
  public_host: ""

  # Per-listener concurrent-connection cap (each of XML-RPC / BIN-RPC).
  # Guards against a runaway or hostile peer exhausting file descriptors.
  # 0 = default (64).  [default: 64]
  max_connections: 64

  # Source-IP allowlist. false accepts callbacks from any address.
  # true accepts them only from the configured CCU hosts (plus loopback) —
  # a hardening measure on shared/untrusted networks.  [default: false]
  restrict_source_ips: false


# =============================================================================
# CCU-DATA
# DB section: ccu_data
# Paths to the openccu-data extracts (translations, easymodes).
# Empty = fall back to raw parameter / model names in the UI.
# =============================================================================

ccu_data:
  # Path to the translations.json file (parameter labels, device descriptions).
  translations_path: ""

  # Path to the easymode.json file (simplified paramset views).
  easymode_path: ""


# =============================================================================
# RELIABILITY — reliability stack tuning
# DB section: reliability
# =============================================================================

reliability:
  # Initial backoff delay for Retry-Config.Initial.
  # 0 = openccu-loom default (250 ms).  [default: 0]
  command_retry_initial_delay: 0s

  # Minimum spacing between consecutive throttled commands.
  # 0 = no inter-command pacing.  [default: 0]
  # Example for heavily loaded BidCos-RF interfaces: 50ms or 500ms.
  command_throttle_inter_command_delay: 0s


# =============================================================================
# PERSISTENCE — SQLite cache tuning
# DB section: persistence
# =============================================================================

persistence:
  values_cache:
    # Master switch for the values cache (ADR 0019).
    # Pointer-bool: nil → true (opt-out, not opt-in).  [default: true]
    # enabled: true

    # Flush interval (periodic write to SQLite).
    # 0 = default (60s).  [default: 60s]
    flush_interval: 0s

    # Central names whose data points should NOT be cached.
    # Useful for test rigs in multi-CCU deployments.
    # Empty = all centrals are cached.
    disabled_centrals: []

  # Measurement history (ADR 0040). Opt-in time-series of numeric sensor
  # values for charting in the SPA without an external stack (InfluxDB,
  # Grafana, …). Stored in a dedicated history.db. Only genuine live wire
  # observations are recorded — boot-time pseudo-values and cache replays
  # are filtered out by provenance, and a real 0 is kept.
  history:
    # Master switch. Pointer-bool: nil → false (OPT-IN, unlike the
    # values cache).  [default: false]
    enabled: false

    # How long raw samples are kept. 0 = default (720h / 30 days).
    # retention: 720h

    # How long the hourly rollup tier (measurements_hourly) is kept.
    # 0 = default (~13 months). Purged only after the rows have been
    # folded into the daily tier.  [default: ~9360h (13 months)]
    # retention_hourly: 9360h

    # How long the daily rollup tier (measurements_daily) is kept.
    # 0 = keep forever (daily rows are tiny: one per data point per day),
    # which is the default — there is no built-in expiry.  [default: 0 (forever)]
    # retention_daily: 0s

    # Batch-flush cadence. 0 = default (5s).
    # flush_interval: 5s

    # Electricity tariff per kWh. The energy view shows costs next to
    # consumption when this is set. 0 (the default) shows no costs at
    # all — a tariff of 0 would render every amount as 0.00.
    # energy_price_per_kwh: 0.32

    # Label for the amounts derived from the tariff (symbol or code).
    # Purely a label; nothing is converted.  [default: €]
    # energy_currency: "€"

    # Parameter-name globs to record. Empty = every numeric VALUES
    # parameter. Non-empty = only matching parameters.
    # include: ["TEMPERATURE", "HUMIDITY", "*POWER*", "ACTUAL_*"]
    include: []

    # Parameter-name globs to drop. Exclude always wins over include.
    exclude: []

    # Central names whose data points should NOT be recorded.
    # Empty = all enabled centrals are recorded.
    disabled_centrals: []

    # Opt-in push exporter (ADR 0040). Forwards each recorded sample to an
    # external time-series store in addition to the embedded history.db —
    # for users who already run Grafana/InfluxDB. The embedded store stays
    # the default; this is additive.
    export:
      # Master switch. Defaults to false.
      enabled: false
      # Backend. "" or "influxdb" = InfluxDB v2 line protocol.
      kind: influxdb
      # Base URL of the target.
      endpoint: ""        # e.g. http://influx:8086
      org: ""
      bucket: ""
      # Name of the environment variable holding the write token. The
      # token is a secret and is NEVER stored inline (read from env_file).
      token_env: ""       # e.g. OPENCCU_INFLUX_TOKEN


# =============================================================================
# SECURITY — cross-cutting safety toggles
# DB section: security
# NOTE: this section has NO YAML seed path — it is DB-tier / SPA-managed
# only (it is deliberately excluded from the YAML→DB seeder). The block
# below documents the field for reference; set it in the SPA, not here.
# =============================================================================
#
# security:
#   # When true, a central row may store a CCU password that cannot be
#   # encrypted at rest — i.e. when no master key was resolved. Default
#   # false: the daemon then rejects the save instead of writing the
#   # credential to the database in the clear. With a master key present
#   # the flag changes nothing (the password is sealed either way); this
#   # knob exists for test rigs and one-off dev installs.
#   # [default: false]
#   allow_plaintext_secrets: false


# =============================================================================
# BACKUP — automatic scheduled CCU backups
# Root-level YAML field (read on every start; hot-reloaded).
# =============================================================================
#
# Off by default (a backup touches the CCU and produces files, so it is
# opt-in). Each configured central is backed up independently; the archives
# appear in the same Backups view as manual backups. The first automatic
# backup runs one interval after start.
# backup:
#   # How often each central is backed up. 0 = disabled.  [default: 0]
#   schedule: 24h
#   # Retain the newest N scheduled backups per central; older ones are
#   # pruned after a successful backup. 0 = keep all.  [default: 0]
#   keep_last: 7


# =============================================================================
# CENTRALS — Homematic CCUs
# At least one central with name, host, and interfaces is required
# when the daemon is not configured exclusively via the SPA.
# DB section: stored per central in `config_centrals`.
# =============================================================================

centrals:
  - # Unique name of this central (scoping dimension, multi-CCU-safe).
    # Required.
    name: Home

    # Hostname or IP address of the CCU.  Required.
    host: "192.168.1.10"

    # Legacy single-port override (all interfaces). 0 = backend default.
    # Overridden by `ports` (per-interface).  [default: 0]
    port: 0

    # Per-interface port overrides (key = hmenum.Interface string).
    # Overrides `port` for the named interfaces.
    ports: {}
    #   HmIP-RF: 2010
    #   BidCos-RF: 2001

    # HTTP port for JSON-RPC / top-level CCU web endpoints.
    # 0 = backend default (80 plain / 443 TLS).  [default: 0]
    json_rpc_port: 0

    # CCU credentials.
    # secret — encrypted at rest; prefer providing it via an env var (see example.env)
    username: "Admin"
    # secret — encrypted at rest; prefer providing it via an env var (see example.env)
    password: ""

    # Enable TLS for XML-RPC connections to the CCU.  [default: false]
    tls: false

    # Disable certificate verification (self-signed CCUs on
    # trusted networks). Set only when truly necessary.
    # [default: false]
    tls_insecure_skip_verify: false

    # Primary interface for health aggregation.
    # Empty = HmIP-RF substring heuristic.  [default: ""]
    primary_interface: ""

    # Cadence of the background check_connection job.
    # 0 = compiled-in default (30s). Negative = job disabled.  [default: 0]
    check_connection_interval: 0s

    # Per-central behaviour toggles. All optional; omit the block to keep
    # the defaults shown. Each mirrors an aiohomematic config knob.
    behavior:
      # Light turn-on: true restores the last non-zero brightness;
      # false turns on at full (100%).  [default: true]
      light_last_brightness: true
      # Cover position source: true reports from the group channel when
      # present; false from the cover's own channel.  [default: true]
      use_group_channel_for_cover_state: true
      # Hub scan gates: false suppresses the system-variable / program
      # scan for this central entirely.  [default: true / true]
      enable_sysvar_scan: true
      enable_program_scan: true
      # Internal hub entities: include CCU-internal sysvars / programs.
      # [default: true / false]
      include_internal_sysvars: true
      include_internal_programs: false
      # Restrict the hub scan to entities whose CCU description starts
      # with one of these markers. Allowed: HAHM, HX, INTERNAL, MQTT.
      # Empty = include everything that passes the internal filter.
      sysvar_markers: []
      program_markers: []
      # Override the periodic sysvar-refresh cadence.
      # 0 = compiled-in default (30s); minimum 3s.  [default: 0]
      sysvar_scan_interval: 0s
      # Per-device firmware-update entities. true surfaces them (the
      # openccu-loom default; the reference stack defaults this off).
      # [default: true]
      enable_device_firmware_check: true
      # Defer creation of a newly-paired device until it is accepted from
      # the inbox, instead of ingesting immediately.  [default: false]
      delay_new_device_creation: false

    # Interfaces: short form (list of strings) or long form (list of maps).
    # HmIP-Wired is NOT a separate interface name — devices are
    # classified automatically via HmIP-RF (model prefix "hmipw-").
    interfaces:
      # Short form: interface name only
      - HmIP-RF
      - BidCos-RF
      # Long form: per-interface port and URL path. remote_path is for a
      # CCU behind a reverse proxy that exposes XML-RPC somewhere other
      # than /RPC2 (/groups for VirtualDevices); it must be an absolute
      # path on the same host — the bare /, a leading //, a scheme, a
      # query, a fragment and a .. segment are all rejected at startup.
      # rpc_type only restates the transport the interface name already
      # implies — CUxD is BIN-RPC, everything else XML-RPC — and a value
      # that contradicts it is rejected at startup.
      # - name: VirtualDevices
      #   port: 9292
      #   remote_path: /groups
      #   rpc_type: xmlrpc
      # - name: CUxD
      #   rpc_type: binrpc

    # Visibility overrides: promote parameters from the default hidden set
    # into the visible data points.
    # Format: "MODEL:CHANNEL:PARAMETER" (wildcards * for MODEL/CHANNEL).
    # Bare parameter names (without colons) → "*:*:PARAMETER".
    visibility:
      un_ignore: []
      # - "*:*:RSSI_DEVICE"
      # - "HM-CC-RT-DN:4:VALVE_STATE"

  # Second CCU (multi-CCU example)
  # - name: Office
  #   host: "192.168.2.10"
  #   interfaces:
  #     - HmIP-RF
  #   username: "Admin"
  #   password: ""
